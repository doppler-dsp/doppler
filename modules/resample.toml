[module.resample]
doc = """
Sample-rate conversion: polyphase resampling (Resampler, RateConverter), halfband decimation (HalfbandDecimator), CIC decimation, and Farrow fractional resampling.

Examples
--------
>>> import numpy as np
>>> from doppler.resample import Resampler
>>> Resampler(rate=2.0).execute(np.ones(100, np.complex64)).size
200

"""
objects = ["Resampler", "HalfbandDecimator", "HalfbandDecimatorR2C", "cic", "RateConverter", "farrow", "hbdecim_q15"]
# Composed cores reach the resample .so via per-object depends_on link=true
# (gh-225): RateConverter → resamp/fir, HalfbandDecimator → hbdecim,
# HalfbandDecimatorR2C → hbdecim_r2c. cic is in-module and
# resample_core is the module's own core (both auto-linked).
# libm is not declared: jm resolves it by path on every generated link line
# (gh-1305), and a bare `m` here is `m.lib` on Windows, which does not exist.

[[module.resample.functions]]
name = "ciccompmf"
out_type = "float64[M]"

[[module.resample.functions.params]]
name = "N"
type = "uint32_t"

[[module.resample.functions.params]]
name = "R"
type = "uint32_t"

[[module.resample.functions.params]]
name = "M"
type = "uint32_t"

[[module.resample.functions]]
name = "kaiser_beta"
return_type = "double"

[[module.resample.functions.params]]
name = "atten"
type = "double"

[[module.resample.functions]]
name = "kaiser_num_taps"
return_type = "int"

[[module.resample.functions.params]]
name = "num_phases"
type = "int"

[[module.resample.functions.params]]
name = "atten"
type = "double"

[[module.resample.functions.params]]
name = "pb"
type = "double"

[[module.resample.functions.params]]
name = "sb"
type = "double"

# The CIC design helpers are pure Python (_cic_design.py; the underscore
# keeps the module from shadowing its own cic_design function) and public: a
# submodule's __all__ is re-exported by its package (#3004 review).
[module.resample.reexports]
_cic_design = ["cic_design", "cic_min_order", "cic_alias_rejection", "cic_passband_droop", "cic_precision_bits"]
