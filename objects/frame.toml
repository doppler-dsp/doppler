# frame — a frame's bit layout, describable from Python.
#
# The RECEIVE half of the frame story. A description (`wfm_frame_desc_t`,
# native/inc/doppler/wfm/wfm_frame.h) is what the generator builds a frame from
# and what `dp_wfm_frame_desc_crc_ok()` scores one against; until now only C
# could hold one, so `doppler.ber.FrameMeter` --
# which exists precisely to turn CRC outcomes into an exact FER interval -- had
# no way to be fed from Python. This object closes that: describe the frame,
# `bits()` it to compare against, `crc_ok(rx)` a capture, feed the result to
# FrameMeter.
#
# It is lifecycle and delegation ONLY. Every layout decision -- where the CRC
# sits, that it covers the payload alone, that a preamble repeats verbatim --
# stays in wfm_frame.c, which is the single implementation both ends already
# share. Re-deriving any of it here would recreate exactly the TX/RX drift the
# descriptor was introduced to stop.
#
# ## It takes BITS
#
# Each field is an unpacked bit array and nothing else -- no kind, no
# generator parameters, no repetition count. Every other form reaches it
# through a helper that returns bits: `field_bits()` for the Field text form,
# `cvt.hex_to_bin` / `cvt.bytes_to_bin` for hex and packed octets. One
# constructor shape, no dispatch (docs/design/frame-description.md §F.3). The
# 38 flattened arguments this replaces existed because a field had no value of
# its own to pass; bits are that value. Each field is omittable (`default =
# "[]"`, which reaches C as NULL, 0).

[frame]
arg_type = "void"
return_type = "void"
mutable = "false"
no_state = "true"
no_step = "true"
no_reset = "true"
class_name = "Frame"
create_error = "ValueError"
create_error_message = "frame geometry is empty, or a field holds an element that is not a bit (0 or 1)"
# wfm_frame_core holds dp_wfm_frame_fixed/_assemble/_desc_crc_ok; pn/gold/cvt are its
# own dependencies (the generated kinds, and the Field text form's hex), named
# here because an OBJECT library does not carry its dependencies' objects.
# ccsds_tm: `build()` runs the coded stages a description may name, and
# ccsds_tm has no binding of its own -- so this object is where a Python
# caller meets the outer code, the randomiser and the inner code. The
# dependency runs frame -> ccsds_tm -> wfm_frame, which is the direction
# ccsds_tm's own CMakeLists anticipated ("BOTH ends want it: wfmgen encodes,
# and frame/ber_meter will decode"). conv/rs come with it: an OBJECT library
# propagates usage requirements but not its objects, so every consumer must
# name them.
depends_on = [
    { name = "wfm_frame", link = true },
    { name = "ccsds_tm", link = true },
    { name = "conv", link = true },
    { name = "rs", link = true },
    { name = "pn", link = true },
    { name = "gold", link = true },
    { name = "cvt", link = true },
]

# ── the fields: bits, each omittable ────────────────────────────────────────
[[frame.init_params]]
name = "preamble"
type = "uint8_t[]"
default = "[]"
str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()"
doc = "Preamble bits, one per element, each 0 or 1. Omitted, there is no preamble. A repeated preamble is repeated in its bits: `field_bits(\"pn:31:5*4\")`."

[[frame.init_params]]
name = "sync"
type = "uint8_t[]"
default = "[]"
str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()"
doc = "Sync-word bits, one per element, each 0 or 1. Omitted, the frame is unsynced."

[[frame.init_params]]
name = "payload"
type = "uint8_t[]"
default = "[]"
str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()"
doc = "Payload bits, one per element, each 0 or 1. Omitted, the frame carries none."

# ── the frame itself ────────────────────────────────────────────────────────
[[frame.init_params]]
name = "crc"
type = "enum:crc"
default = "none"

# ── methods ─────────────────────────────────────────────────────────────────
[[frame.methods]]
name = "bits"
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true

# ── the OTHER constructor: the same frame, DEFERRED ────────────────────────
#
# `Frame(...)` materialises at construction. `FrameDesc(...)` takes the SAME
# arguments and stops before materialising, so the four fields are a starting
# point a caller extends with `add_field` / `add_stage` before `build()`.
# Empty arrays for all three begin from nothing.
#
# A view rather than a second object, by the rule this repo already uses (see
# the `ddc` section of CLAUDE.md): a difference in CONSTRUCTOR is a flavor, a
# difference in METHOD SIGNATURE is a separate type. Every method is shared
# verbatim, so it is a flavor -- and the init_params are the parent's, which
# is what a view inheriting them is FOR.
#
# It is what makes CCSDS reachable from Python at all. `ccsds_tm` has no
# binding and is not getting one, so a caller meets the outer code, the
# randomiser and the inner code by DESCRIBING a CADU -- three fields and three
# covers -- rather than by a CCSDS entry point being added to this object.
[[frame.views]]
class_name = "FrameDesc"
create_fn = "dp_frame_create_desc"

[[frame.methods]]
name = "crc_ok"
arg_type = "void"
return_type = "int"
params = [
    { name = "rx_bits", type = "uint8_t[]", str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()" },
]
nogil = true

[[frame.methods]]
name = "add_field"
doc = "Append one named field to a description (see `FrameDesc`): bits and nothing else, one per element, each 0 or 1. Text reaches it through `field_bits()`, hex and packed octets through `cvt`. A field a STAGE fills is `add_derived` instead, because the caller has no bits for it. `name` may be empty for an anonymous field; a name another field carries is refused. Returns the new field's index. Refuses once the frame is built."
arg_type = "void"
return_type = "int"
error_negative = true
error = "ValueError"
error_message = "cannot append a field: the description is full or already built, the name is taken, the bits are empty, or an element is not a bit"
params = [
    { name = "name", type = "const char *" },
    { name = "bits", type = "uint8_t[]", str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()" },
]

[[frame.methods]]
name = "add_stage"
doc = "Append one transform and -- the load-bearing part -- the span of fields it covers. `kind` is a stage kind: `STAGE_CRC16`, `STAGE_RS`, `STAGE_RANDOMISE`, `STAGE_CONV`, `STAGE_INTERLEAVE` from `doppler.wfm`, or a caller's own from `STAGE_USER` up. It stays an INT rather than a name because the kind is an open `uint32_t` a caller extends -- the constants are generated from the C enum, so there is nothing to transcribe. `n_fields = 0` means the stage does not run. A stage that inherited whatever ran before it is the representation that cannot express a CCSDS CADU, where the marker is covered by the inner code and by neither the outer code nor the randomiser. `unit_bits` applies to `interleave` alone and is the bits per permuted unit (0 reads as 1); its ROW count is `depth` and its column count is derived from the span the stage covers."
arg_type = "void"
return_type = "int"
error_negative = true
error = "ValueError"
error_message = "cannot append a stage: the description is full or already built"
params = [
    { name = "kind", type = "int", default = "0" },
    { name = "first_field", type = "uint32_t", default = "0" },
    { name = "n_fields", type = "uint32_t", default = "0" },
    { name = "depth", type = "uint32_t", default = "0" },
    { name = "emit_num", type = "uint32_t", default = "0" },
    { name = "emit_den", type = "uint32_t", default = "0" },
    { name = "unit_bits", type = "uint32_t", default = "0" },
]

[[frame.methods]]
name = "field_index"
doc = "Index of the field called `name`, or -1 -- the one verb whose sentinel survives into Python, because a name that matches nothing is an ANSWER rather than a refusal. The one lookup that resolves a name, so every index-taking method keeps working and a rename can only be wrong once. An unnamed field is ANONYMOUS rather than named \"\", so the empty name matches nothing."
arg_type = "void"
return_type = "int"
params = [
    { name = "name", type = "const char *" },
]

[[frame.methods]]
name = "name_field"
doc = "Give an already-appended field a name, or clear it with \"\". Refuses a name another field already carries, because `field_index` would then answer with whichever it reached first. Refuses once the frame is built."
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "cannot name a field: the index is out of range, another field already carries the name, or the frame is already built"
params = [
    { name = "index", type = "uint32_t" },
    { name = "name", type = "const char *" },
]

[[frame.methods]]
name = "add_derived"
doc = "Append a named field a STAGE will fill -- a CRC trailer, a block of check symbols. Its producer is not named here because no stage exists yet when the field it derives is appended; `add_stage_over` wires it. Returns the new field's index; a refusal raises `ValueError`."
arg_type = "void"
return_type = "int"
error_negative = true
error = "ValueError"
error_message = "cannot append a derived field: the description is full or already built"
params = [
    { name = "name", type = "const char *" },
    { name = "bits", type = "size_t" },
]

[[frame.methods]]
name = "add_stage_over"
doc = "Append a stage covering `[first .. last]` BY NAME -- `add_stage_over(STAGE_CRC16, \"payload\", \"crc\")` says what three integers used to. It wires a derived field's producer for you, which applies the invariant the layout already enforces: a field with a declared length and no source sitting at the end of a cover has exactly one possible producer. `kind` is a stage kind, as for `add_stage`. Returns the new stage's index; a refusal raises `ValueError`."
arg_type = "void"
return_type = "int"
error_negative = true
error = "ValueError"
error_message = "cannot append a stage: the description is full, already built, or names a field the description does not carry (and `last` must not precede `first`)"
params = [
    { name = "kind", type = "int" },
    { name = "first", type = "const char *" },
    { name = "last", type = "const char *" },
    { name = "depth", type = "uint32_t", default = "0" },
    { name = "unit_bits", type = "uint32_t", default = "0" },
]

[[frame.methods]]
name = "build"
doc = "Lay out and materialise a description. Where a description is checked: one that cannot produce its own bits is not a frame. Separate from the constructor only because the description arrives over several calls and there is no earlier moment at which it is complete. Raises if it is empty, unbuildable, names a stage no kernel here covers, or was already built."
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "cannot build: the description is empty, unbuildable, names a stage no kernel here covers, or was already built"

[[frame.methods]]
name = "deframe"
doc = "Undo the description's stages over a received frame and hand back the CORRECTED bits — the layer a receiver stops short of (doppler#1022)."
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
params = [
    { name = "rx_bits", type = "uint8_t[]", str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()" },
]

[[frame.properties]]
name = "rx_ok"
type = "int"
field = true
doc = "Checks that came out good in the last deframe() -- one per CRC, one per outer-code codeword. `rx_ok == rx_units` is the verdict."

[[frame.properties]]
name = "rx_units"
type = "int"
field = true
doc = "Checks the last deframe() performed across every stage it reversed."

[[frame.properties]]
name = "rx_checked"
type = "int"
field = true
doc = "Stages the last deframe() actually reversed. 0 means the description carries no reversible stage at all -- which is why `rx_ok` is 0 too, and is a different fact from a check that failed. An FER conflating them scores every unprotected frame as an error."

[[frame.properties]]
name = "rx_symbols"
type = "int"
field = true
doc = "Symbol errors the last deframe() repaired. Margin being spent, visible before it is lost -- what an outer code reports and a CRC cannot."

[[frame.methods]]
name = "check"
doc = "Undo the description's stages over a received frame and report what was found -- the receive mirror of `bits()`, reading the same description, so a transmitter and a receiver holding the same `Frame` cannot disagree about which stage covered what. This is the truth-free frame error rate on a CODED link: it needs no payload truth, so it works on a real capture, and an outer code is a strictly better detector than a CRC because it reports how much repair it took rather than one bit of right-or-wrong. `checked` is smaller than `stages` when the description names a stage the receiver does not reverse here -- the inner code is the case, being undone before frame synchronisation -- and such a stage is reported as not checked, never as passed."
arg_type = "void"
return_type = "frame_check_t"
single = true
record_name = "FrameCheck"
record_doc = "What checking one received frame found. `ok == units` is the verdict; `symbols` is what it cost, which is margin being spent and is visible before it is lost."
record_module = "doppler.wfm"
params = [
    { name = "rx_bits", type = "uint8_t[]", str_hint = "a bit field takes bits (a uint8 array); build them from text with field_bits()" },
]
result_fields = [
    { name = "passed", type = "int", doc = "Every check good: 1 yes, 0 no. Also 0 when nothing was checked -- see `checked`. Named `passed` rather than `pass` because the obvious name is a Python keyword and `r.pass` will not parse." },
    { name = "stages", type = "uint32_t", doc = "Stages in the description." },
    { name = "checked", type = "uint32_t", doc = "How many were reversed here. 0 means the description carries no reversible stage, which is why `pass` is 0: carrying no check is not the same answer as passing one." },
    { name = "units", type = "uint32_t", doc = "Checks performed: one for a CRC, one per codeword for an interleaved outer code." },
    { name = "ok", type = "uint32_t", doc = "How many came out good -- clean or repaired." },
    { name = "corrected", type = "uint32_t", doc = "How many needed and received repair." },
    { name = "symbols", type = "uint32_t", doc = "Symbol errors repaired across the frame." },
]
nogil = true

[[frame.methods]]
name = "n_fields"
doc = "Fields in the description. A `Frame` counts only the fields it was given -- `Frame(sync=..., payload=..., crc=\"crc16\")` is 3 -- so read a field by name with `field_index`, not by position."
arg_type = "void"
return_type = "size_t"

[[frame.methods]]
name = "n_stages"
doc = "Stages in the description."
arg_type = "void"
return_type = "size_t"

[[frame.methods]]
name = "field_off"
doc = "Bit offset of field `i`, or 0 if there is no such field."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "field_bits"
doc = "Bits in field `i`, or 0 if there is no such field."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "stage_first"
doc = "First frame bit stage `i` covers; 0 for a stage that did not run."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "stage_bits"
doc = "Bits stage `i` covers; 0 for a stage that did not run -- which is how an optional stage is spelled, and why `first` is 0 there too."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.properties]]
name = "nbits"
type = "size_t"
field = true

# just-makeit#1711: the description as a capsule, so a composer source's
# `frame=` (an owned-pointer field) can take a Frame or a FrameDesc across
# the module boundary without reading this object's layout.
[[frame.properties]]
name = "_capsule"
type = "capsule"
capsule = "doppler.wfm.frame_desc"
expr = "&self->handle->d"
capsule_type = "wfm_frame_desc_t *"
doc = "The description as a `doppler.wfm.frame_desc` capsule (a borrowed `wfm_frame_desc_t *`), the handle a composer source's `frame=` copies from. Valid while this object lives."
