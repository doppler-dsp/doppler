[[frame.init_params]]
name = "crc"
type = "enum:crc"
default = "none"

# ── methods ─────────────────────────────────────────────────────────────────
[[frame.methods]]
name = "bits"
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true

[[frame.methods]]
name = "layout"
arg_type = "void"
return_type = "wfm_frame_layout_t"
single = true
record_name = "FrameLayout"
record_doc = "Where each field lands, in bits from the start of the frame. The offsets a receiver needs to slice a capture -- computed once, by the same code the generator laid the frame out with."
record_module = "doppler.wfm"
result_fields = [
    { name = "preamble_off", type = "size_t" },
    { name = "preamble_bits", type = "size_t" },
    { name = "sync_off", type = "size_t" },
    { name = "sync_bits", type = "size_t" },
    { name = "payload_off", type = "size_t" },
    { name = "payload_bits", type = "size_t" },
    { name = "crc_off", type = "size_t" },
    { name = "crc_bits", type = "size_t" },
    { name = "total_bits", type = "size_t" },
]

[[frame.methods]]
name = "crc_ok"
arg_type = "void"
return_type = "int"
params = [{ name = "rx_bits", type = "uint8_t[]" }]
nogil = true

[[frame.properties]]
name = "nbits"
type = "size_t"
field = true
