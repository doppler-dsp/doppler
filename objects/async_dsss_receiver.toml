# async_dsss_receiver — AsyncDsssReceiver: production C port of the
# validated Python prototype's search -> refine -> track pipeline
# (validated in the coupled-despreader, freq-refine, and end-to-end
# acquisition prototypes), closing task #99's 4-5dB Es/N0 pull-in
# cliff. See ~/.claude/plans/crystalline-knitting-hopper.md for the full
# design.
#
# Three states, routed by steps():
#   searching -> acq hit -> refining -> CarrierAcquisition ready
#             (or its own give-up cap) -> tracking
#
# Composes acq (Acquisition) + carrier_acq (CarrierAcquisition, the
# refine stage's frequency estimator) + dll (code tracking, both stages)
# + costas (carrier loop, both stages) + RateConverter (both stages) +
# mpsk_receiver (demod, track stage only) -- the same cross-module
# composition shape dsss_receiver.toml already uses, extended with the
# refine stage's own children.

[async_dsss_receiver]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "AsyncDsssReceiver"
create_error = "ValueError"
create_error_message = "AsyncDsssReceiver: invalid parameter (need a code of at least 2 chips, a finite chip_rate > 0, a finite symbol_rate > 0 and <= chip_rate, spc >= 1, m in {2,4,8}, segments >= 1, sps >= 2, carrier_freq_hz 0 or finite and above chip_rate * spc / 2, lost_confirm_s >= 0 (and at least one input sample with reacquire), refine_samples_per_symbol >= 1, refine_n_fft >= 1, refine_zero_pad >= 1, a symbol of at most 2^20 Dll partials, segments * chip_rate / (code_len * symbol_rate) <= 1048576; and for the searcher a finite cn0_dbhz, 0 < pfa < 1, 0 < pd < 1, a finite doppler_uncertainty >= 0)"
serializable = "true"
depends_on = [
    { name = "ber" }, # dp_sym_test.h delegates here
    { name = "acq", link = true },
    { name = "carrier_acq", link = true },
    { name = "dll", link = true },
    { name = "costas", link = true },
    { name = "RateConverter", link = true },
    { name = "mpsk_receiver", link = true },
    # RateConverter's own cascade components -- jm's depends_on linking is
    # not recursively transitive (dsss_receiver.toml's own comment on this
    # applies verbatim here).
    { name = "resamp", link = true },
    { name = "hbdecim", link = true },
    { name = "cic", link = true },
    { name = "resample", link = true },
    # carrier_acq's own transitive deps -- carrier_acq.toml's link=true
    # entries don't propagate through its OWN link=true boundary either.
    { name = "psd", link = true },
    { name = "detector", link = true },
    { name = "detection", link = true },
    { name = "spectral", link = true },
    # the hand-over test's stimulus (dp_dsss_dilated_capture), the test's
    # link only, as `ber` above; resamp is its own dependency, already here.
    { name = "doppler_channel" },
    { name = "corr", link = true },
    { name = "fft", link = true },
    { name = "acc_trace", link = true },
]
# wfm_dsp_core: the wfmgen C API used by test_async_dsss_receiver_core.c's
# AWGN Es/N0-floor characterization (dp_wfm_cont_dsss_chips continuous DSSS
# builder). gold_core: the SPEC Gold-1023 code for that same test. snr_core:
# the canonical blind M2M4 SNR validator (snr_m2m4_db) that same test uses to
# validate lock independently of BER.
extra_link_libs = ["wfm_dsp_core", "gold_core", "snr_core"]
fragment = "generated"

# ── Construction: only the signal itself is required ─────────────────────────

[[async_dsss_receiver.init_params]]
name = "code"
type = "uint8_t[]"

[[async_dsss_receiver.init_params]]
name = "chip_rate"
type = "double"
default = "1000000.0"

[[async_dsss_receiver.init_params]]
name = "symbol_rate"
type = "double"
default = "1000.0"

[[async_dsss_receiver.init_params]]
name = "spc"
type = "size_t"
default = "2"

[[async_dsss_receiver.init_params]]
name = "m"
type = "int"
default = "2"

[[async_dsss_receiver.init_params]]
name = "cn0_dbhz"
type = "double"
default = "55.0"

[[async_dsss_receiver.init_params]]
name = "pfa"
type = "double"
default = "1e-3"

[[async_dsss_receiver.init_params]]
name = "pd"
type = "double"
default = "0.9"

[[async_dsss_receiver.init_params]]
name = "doppler_uncertainty"
type = "double"
default = "100.0"

# The LIVE-TRACKING Dll's own segments -- distinct from the refine
# stage's OWN collection-Dll segments (refine_max_error_db below),
# deliberately, per Python's WINDOWS vs TRACK_WINDOWS split (see the
# plan doc's dp_dll_lookback_segments() section).
[[async_dsss_receiver.init_params]]
name = "segments"
type = "size_t"
default = "4"

[[async_dsss_receiver.init_params]]
name = "sps"
type = "size_t"
default = "8"

[[async_dsss_receiver.init_params]]
name = "differential"
type = "int"
default = "0"

# ── Refine-stage tuning (all mirror freq_refine.refine_seed_carrier_acq's
# own already-validated defaults verbatim) ───────────────────────────────

# Max tolerable async-lookback correlation-power loss driving the
# refine-stage collection Dll's window/segment count via
# dp_dll_lookback_segments(). Default 0.5 -- freq_refine.refine_seed_
# carrier_acq()/async_lookback_windows()'s own validated value, which
# yields segments=11 at this waveform's tsamps=2046.
#
# Oversampling the epoch is REQUIRED, not optional, because the data is
# asynchronous: the residual carrier the PSDMF has to locate rides a
# ~symbol_rate-wide data-modulated spectrum, so the despread stream must
# be sampled above that spectrum's Nyquist. dp_dll_lookback_segments()
# splits each epoch into that many COHERENT integrate-and-dump windows --
# each window phase-coherent internally (what CarrierAcquisition's
# per-block FFT consumes), the several windows per epoch raising the
# despread rate to segments*epoch_rate (11*3000 = 33kHz here), well above
# the data bandwidth, before refine_rc resamples to the estimator's rate.
#
# The degenerate segments=1 (one dump per epoch = epoch_rate ~= 1
# sample/symbol) UNDERSAMPLES that spectrum: any nonzero coarse-handoff
# residual aliases and CarrierAcquisition returns a near-DC estimate,
# leaving the ~1kHz coarse residual uncorrected and the tracker seeded
# off enough to lose lock. A prior 100.0 default forced this path; the
# "segments=1 within ~18Hz, segments=11 70-90Hz off" measurement that
# justified it was taken at ~zero residual -- the one regime where the
# undersampling doesn't bite -- and did not exercise the aliasing.
[[async_dsss_receiver.init_params]]
name = "refine_max_error_db"
type = "double"
default = "0.5"

# CarrierAcquisition's own operating rate = refine_samples_per_symbol *
# symbol_rate -- decoupled from the code loop's own lookback granularity
# (see freq_refine.py's own rationale).
[[async_dsss_receiver.init_params]]
name = "refine_samples_per_symbol"
type = "size_t"
default = "4"

# Empirical derating already proven sufficient to close SPEC's own
# 4-5dB/500Hz-s combined gating scenario in Python -- ported as-is, not
# re-derived (see the plan doc's own scope note on this).
[[async_dsss_receiver.init_params]]
name = "refine_design_margin_db"
type = "double"
default = "14.0"

[[async_dsss_receiver.init_params]]
name = "refine_n_fft"
type = "size_t"
default = "64"

[[async_dsss_receiver.init_params]]
name = "refine_zero_pad"
type = "size_t"
default = "8"

# false (NOT carrier_acq.toml's own standalone default of true): matches
# freq_refine.refine_seed_carrier_acq()'s own default, the one actually
# validated at SPEC's operating point. Sequential mode's per-block early
# test fires the moment ANY block crosses threshold -- confirmed via a
# direct isolated CarrierAcquisition probe to fire on as few as 4 blocks
# at this SNR/geometry, ~150-200Hz+ off; non-sequential mode waits the
# full dwell_target (design_snr-derived) before testing once, giving a
# far more accurate (if still imperfect -- see refine_design_margin_db's
# own doc comment) estimate.
[[async_dsss_receiver.init_params]]
name = "refine_sequential"
type = "bool"
default = "false"

[[async_dsss_receiver.init_params]]
name = "refine_max_n_blocks"
type = "size_t"
default = "100000"

# Nominal RF carrier frequency (Hz) enabling carrier->code aiding. 0.0 (the
# default) leaves aiding OFF -- fully backward-compatible; every prior caller
# and the pure-carrier-offset case are unchanged. When > 0, the coupled
# code-rate Doppler (physically code_rate_dev = carrier_offset/carrier_freq,
# the same v/c) is fed into the tracking Dll's own rate NCO via
# dp_dll_set_rate_aid(): the code discriminator alone cannot pull in that
# constant rate offset at low SNR (e.g. 24.6 chips/s at a 20 kHz offset /
# 2.5 GHz carrier), so unaided the code loop walks off and lock collapses
# even though the carrier estimate is correct. Set this to the receiver's own
# nominal downlink RF frequency to decode a physically-coupled Doppler
# capture (a dilated clock, e.g. from the impairment.DopplerChannel object);
# leave 0.0 for a pure baseband carrier offset with no clock dilation.
[[async_dsss_receiver.init_params]]
name = "carrier_freq_hz"
type = "double"
default = "0.0"

# The release rule (docs/design/async-dsss-parallel.md §3, and
# docs/design/async-dsss-receiver.md §10): with `reacquire`, symbol lock
# down, continuously, for longer than this many seconds while tracking
# resets the receiver to searching. Without it, both lock flags down that
# long puts the receiver in the lost state (`lost` == 1, loops stopped,
# samples discarded until reset()), and one flag down is a degrade, not a
# release. 0.0, the default, never releases.
[[async_dsss_receiver.init_params]]
name = "lost_confirm_s"
type = "double"
default = "0.0"

[[async_dsss_receiver.init_params]]
name = "reacquire"
type = "bool"
default = "false"

# The searcher's slow-time depth from physical inputs (docs/design/
# async-dsss-parallel.md §4): code_only_epochs = floor(code_only_s *
# chip_rate / sf) - 1, and the engine rounds D to a 7-smooth length. The
# defaults are D = 1, the epoch-by-epoch search.
[[async_dsss_receiver.init_params]]
name = "code_only_s"
type = "double"
default = "0.0"

[[async_dsss_receiver.init_params]]
name = "doppler_rate"
type = "double"
default = "0.0"

[[async_dsss_receiver.methods]]
name = "steps"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[async_dsss_receiver.methods]]
name = "seed"
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "seed refused: the receiver already holds an assignment (refining, tracking or lost -- reset() releases it), or chip_phase is outside [0, code_len), or doppler_hz_est is not finite and below chip_rate * spc / 2 in magnitude"
params = [
    { name = "chip_phase", type = "double" },
    { name = "doppler_hz_est", type = "double" },
    { name = "cn0_dbhz_est", type = "double" },
]

[[async_dsss_receiver.methods]]
name = "status"
arg_type = "void"
return_type = "async_dsss_receiver_status_t"
result_fields = [
    { name = "state", type = "int" },
    { name = "doppler_hz", type = "double" },
    { name = "chip_phase", type = "double" },
    { name = "code_rate", type = "double" },
    { name = "cn0_dbhz_est", type = "double" },
    { name = "code_locked", type = "int" },
    { name = "locked", type = "int" },
    { name = "lock_metric", type = "double" },
    { name = "lock_threshold", type = "double" },
    { name = "car_last_error", type = "double" },
    { name = "mpsk_last_error", type = "double" },
    { name = "state_samples", type = "uint64_t" },
    { name = "both_down_samples", type = "uint64_t" },
    { name = "refused_hits", type = "uint64_t" },
]
single = true
record_name = "ReceiverStatus"
record_doc = "AsyncDsssReceiver's status record: state (0 searching, 1 refining, 2 tracking, 4 lost), the live estimates, both lock flags, and the two clocks in input samples."
record_module = "doppler.dsss"

[[async_dsss_receiver.methods]]
name = "configure_search_raw"
arg_type = "void"
return_type = "int"
status_return = true
params = [
    { name = "doppler_bins", type = "size_t" },
    { name = "n_noncoh", type = "size_t" },
]

[[async_dsss_receiver.methods]]
name = "set_refine_min_blocks"
arg_type = "void"
return_type = "int"
status_return = true
params = [
    { name = "n_blocks", type = "size_t" },
]

[[async_dsss_receiver.methods]]
name = "configure_lock_raw"
arg_type = "void"
return_type = "void"
params = [
    { name = "up_thresh", type = "double" },
    { name = "down_thresh", type = "double" },
    { name = "n_looks", type = "size_t" },
    { name = "alpha", type = "double" },
    { name = "n_up", type = "uint32_t" },
    { name = "n_down", type = "uint32_t" },
]

[[async_dsss_receiver.methods]]
name = "configure_chain_raw"
arg_type = "void"
return_type = "int"
status_return = true
params = [
    { name = "segments", type = "size_t" },
    { name = "sps", type = "size_t" },
    { name = "n", type = "int" },
]

[[async_dsss_receiver.methods]]
name = "reset"
arg_type = "void"
return_type = "void"

# Telemetry across the receiver's loops: the docstring is the header's.
[[async_dsss_receiver.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", retain = true, header = "doppler/dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[async_dsss_receiver.properties]]
name = "refine_min_blocks"
type = "size_t"
field = true

[[async_dsss_receiver.methods]]
name = "set_threads"
arg_type = "void"
return_type = "int"
status_return = true
params = [{ name = "n", type = "int" }]

[[async_dsss_receiver.properties]]
name = "threads"
type = "int"

# The controller's two levers (docs/design/async-dsss-parallel.md §3): which
# surviving peak of a dwell this receiver takes, and the code phases other
# receivers already hold.
[[async_dsss_receiver.methods]]
name = "set_rank"
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "rank refused: it must be below ASYNC_DSSS_RX_MAX_PEAKS (16), the peaks a dwell reports"
params = [{ name = "rank", type = "size_t" }]

[[async_dsss_receiver.properties]]
name = "rank"
type = "size_t"

[[async_dsss_receiver.methods]]
name = "set_exclusions"
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "exclusions refused: every phase must be finite, and at most ASYNC_DSSS_RX_MAX_EXCLUSIONS (64) of them"
params = [{ name = "phases", type = "double[]" }]

[[async_dsss_receiver.properties]]
name = "n_exclusions"
type = "size_t"

[[async_dsss_receiver.properties]]
name = "coherent_bins"
type = "size_t"

[[async_dsss_receiver.properties]]
name = "lifecycle"
type = "int"
enum = "async_dsss_rx_state"
expr = "self->handle->state"
doc = """Where the receiver is in its lifecycle, by name: `"searching"`, `"refining"`, `"tracking"` or `"lost"` (released, waiting for `reset()`). The same state as `status().state`, which carries it as the C integer. With `reacquire` a release goes back to `"searching"` and never reads `"lost"`."""

[[async_dsss_receiver.properties]]
name = "tracking"
type = "int"

[[async_dsss_receiver.properties]]
name = "refining"
type = "int"

[[async_dsss_receiver.properties]]
name = "lost"
type = "int"

[[async_dsss_receiver.properties]]
name = "doppler_hz"
type = "double"

[[async_dsss_receiver.properties]]
name = "cn0_dbhz_est"
type = "double"

[[async_dsss_receiver.properties]]
name = "segments"
type = "size_t"

[[async_dsss_receiver.properties]]
name = "sps"
type = "size_t"

[[async_dsss_receiver.properties]]
name = "n"
type = "int"

[[async_dsss_receiver.properties]]
name = "chip_phase"
type = "double"

[[async_dsss_receiver.properties]]
name = "code_rate"
type = "double"

[[async_dsss_receiver.properties]]
name = "lock"
type = "double"

[[async_dsss_receiver.properties]]
name = "norm_freq"
type = "double"

[[async_dsss_receiver.properties]]
name = "nco_freq"
type = "double"

[[async_dsss_receiver.properties]]
name = "locked"
type = "int"

[[async_dsss_receiver.properties]]
name = "lock_metric"
type = "double"

[[async_dsss_receiver.properties]]
name = "lock_threshold"
type = "double"

[[async_dsss_receiver.properties]]
name = "car_last_error"
type = "double"

[[async_dsss_receiver.properties]]
name = "car_nco_freq"
type = "double"

[[async_dsss_receiver.properties]]
name = "mpsk_last_error"
type = "double"

[[async_dsss_receiver.properties]]
