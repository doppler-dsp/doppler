name = "sync_nbits"
type = "size_t"
default = "0"

[[frame.init_params]]
name = "sync_poly"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_seed"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_reg_bits"
