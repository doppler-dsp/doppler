[delay]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "DelayCf64"
serializable = "true"

[[delay.init_params]]
name = "num_taps"
type = "size_t"
default = "1"

[[delay.methods]]
name = "push"
arg_type = "void"
return_type = "void"
params = [{name = "x", type = "double _Complex"}]

[[delay.methods]]
name = "ptr"
arg_type = "void"
return_type = "double _Complex"
variable_output = true
# Snapshot is truncated to the caller's capacity (jm gh-138).
pass_capacity = true
# A bare ptr() snapshots the WHOLE window, not one sample. That default is
# instance state, not a literal, so it is a C expression (jm gh-1051) --
# which the stub then renders as `...` rather than inventing a number.
count_default = "self->handle->num_taps"

[[delay.methods]]
name = "push_ptr"
arg_type = "void"
return_type = "double _Complex"
variable_output = true
# The push lands regardless; only the snapshot truncates (jm gh-138).
pass_capacity = true
params = [{name = "x", type = "double _Complex"}]

[[delay.methods]]
name = "write"
arg_type = "double _Complex"
return_type = "void"

[[delay.properties]]
name = "num_taps"
type = "size_t"
field = true

[[delay.properties]]
name = "capacity"
type = "size_t"
field = true
