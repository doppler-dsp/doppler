include = ["objects/*.toml", "modules/*.toml"]

[project]
jm_version = "0.116.0"
name = "doppler"
version = "0.79.0"
build = "cmake"
# c_prefix (jm#1591, #1545): every C symbol jm derives carries dp_, so two
# installed jm libraries that share a component name (fir, fft, agc) link
# and include together. Names we spelled ourselves (fn =, create_fn, our
# macros) and every Python name are untouched.
c_prefix = "dp"
# layout (jm#2425, 0.114.0): every per-object file lives under a directory
# named for its object, mirroring native/inc/doppler/<obj>/ --
# native/tests/<obj>/test_<obj>_core.c, native/benchmarks/<obj>/... -- so
# finding an object's test is the same lookup as finding its header.
layout = "mirrored"
# c_style / c_format_command (gh-265, gh-745): jm formats the C it generates
# with the project's OWN pinned clang-format, so its render and the committed
# bytes agree instead of differing by style forever.
#
# jm emits K&R 4-space; doppler is GNU 2-space. Without this, every `jm apply`
# was followed by a manual clang-format pass that made the fragments differ
# from a full render permanently -- which is most of what UNRECONCILED has
# been counting. The argv form routes through uv so the binary is the one in
# uv.lock, not whatever is on PATH: gh-745 was filed from this repo on 21.1.8
# locally against 22.1.8 in CI, identical input giving different output and a
# `status --check` that flipped red across machines.
#
# jm appends `-i --style=file --fallback-style=LLVM`, so the committed
# .clang-format decides the layout -- there is no second style definition.
c_style = "clang-format"
c_format_command = ["uv", "run", "--group", "dev", "clang-format"]
# py_format_command (gh-746): jm runs the project's OWN pinned ruff over the
# generated .pyi stubs + re-export __init__.py shims, so generated Python comes
# out in doppler's exact ruff style (quotes/spacing/blank-lines) instead of an
# island of jm's own layout. Pinned through uv.lock (the same ruff `make lint`
# uses), so the bytes are stable local<->CI. gh-744 owns the 79-col WIDTH; this
# is style only — and 0.44.0's docstring-closing-delimiter precondition fix
# means ruff no longer collapses a summary back over 79.
py_format_command = ["uv", "run", "--group", "dev", "ruff", "format"]
# NOT adopting [project] c_style = "clang-format" (gh-265): jm 0.30.1's
# _cfmt.py walks and reformats ALL of native/inc/** + native/src/** with
# no exclusion, including the sacred native/inc/** headers that doppler's
# OWN pre-commit config deliberately excludes from clang-format (jm's
# decl-injection detection is whitespace-sensitive, so reformatting a
# header confuses a LATER `jm apply` into re-patching it — an endless
# churn loop, reproduced directly on this repo: reformatting touched 148
# files project-wide, and a second `jm apply` re-"patched" impls that had
# not actually changed in the manifest). Revisit if jm adds a native/inc
# exclusion/scope option to c_style.
perf = "true"
pytest = "true"
pytest_benchmark = "true"
schema = "9"
# jm gh-1752 (0.109.0): keys doppler's OWN generator reads off the composer's
# source.fields / segment.fields rows -- scripts/gen_wfm_defaults.py builds
# wfmgen's CLI table and JSON schema from them. jm reads none of them; naming
# them here stops jm warning on each, while any other unknown key (a misspelt
# jm key) still warns. A new key the generator starts reading goes here too.
composer_field_keys = [
  "cli",
  "exclusive",
  "field_reps",
  "help_section",
  "json",
  "json_omit",
  "json_range",
  "json_required",
  "json_schema",
  "json_type",
  "json_when",
  "metavar",
  "surface",
  "unit_interval",
]
c_deps = [
    "hbdecim", "resamp", "wfmcompose", "ccsds_tm", "conv", "rs",
]
# dsss.pyi came OFF this list in jm 0.28.3 (gh-428): its ten hand-maintained
# has_params-single-array-param members (despreader.steps/bits,
# burst_despreader.steps/bits, burst_demod.demod, + each *_max_out()) are now
# individually marked `# jm:hand` in the stub itself, and `jm apply`'s
# member-level merge preserves exactly those spans byte-for-byte while
# regenerating everything else — so new manifest-derived API (docstrings,
# properties) flows into the file again instead of silently rotting behind
# the old whole-file skip. Verified on the 0.28.3 pin bump: 10/10 marked
# members survived; unmarked content picked up real accumulated doc updates.
# The same migration is a good follow-up for the remaining files below —
# not yet done, they still use the coarser whole-file skip.
#
# measure.pyi's analyze() methods are jm-generated (single=true, gh-244) but
# spectrum_dbfs() is hand-maintained: jm's stub aggregator didn't reconcile
# out=/spectrum_dbfs_max_out() for this has_params-single-array-param method
# even after the sacred fragments freshly regenerated with the new binding —
# the same gap analyzer.pyi/delay.pyi hit below.
# analyzer.pyi is hand-maintained for the same has_params-single-array-param
# stub-lag (a separate, pre-existing jm gap from the has_params predicate
# fixed in gh-219's follow-up — the .c binding is correct, only the .pyi
# stub lagged).
# delay.pyi is hand-maintained for ptr()/push_ptr(): jm's stub generator drops
# the implicit "count"/out= params for this has_params=False shape (the .c
# binding gets them correctly; the .pyi generator doesn't) — a separate,
# analogous jm gap. spectral.pyi is hand-maintained for FFT/FFT2D's execute*
# methods and PSD's band_power() for the same reason (plus FFT's execute_ci16/
# execute_ci8, which are hand-written and never had a stub at all).
# resample.pyi came OFF this list with the RateConverter flavor migration:
# its fragment was entirely hand-written (ctor dispatch between
# dp_RateConverter_create and _create_matched, a `stages` getset, `bank_shape`,
# the growth/ping-pong logic) and is now fully manifest-generated — the
# dispatch is a `[[RateConverter.views]]` flavor (gh-504), `stages` and
# `bank_shape` are container properties over count/value accessors (gh-543),
# and the buffer machinery is jm's own. Restore the remaining hand-fixes
# after every `jm apply` until fixed upstream.
#
# source.pyi (NCO/LO.steps_ctrl) and accumulator.pyi (AccTrace.value) came
# OFF this list on the 0.30.1 pin bump: both were here for the same
# has_params-single-array-param stub-lag as analyzer.pyi/delay.pyi above,
# and both now regenerate byte-identical to the prior hand-maintained
# content (verified directly: dropped from status_allow, ran a full
# `jm apply`, diffed — zero unwanted change, NCO's newly-added
# steps_u32_ctrl picked up its stub correctly for free). wfm.pyi does NOT
# come off despite being exempted for the same original reason
# (PN.generate()) — a full regen silently drops Gold's entire class
# docstring (the CCSDS Code #365 worked example, the "preferred pair"
# three-valued autocorrelation description) in favour of generic
# boilerplate, a different and still-live gap (the sacred header's own
# doxygen for Gold apparently never carried this detail — jm has nothing
# richer to pull from). Re-test wfm.pyi the same way after any future pin
# bump; don't assume the fix generalizes without re-diffing.
#
# util_core.h's square_clip came OFF this list in jm 0.28.11 (gh-468):
# jm's decl-injector previously had no case for a non-static, header-only,
# self-defining module function (square_clip was made non-static to fix a
# GCC -Wstatic-in-inline warning; jm then injected a redundant, malformed
# forward declaration for it). The gh-133 check now treats `static` as
# optional before inline/JM_FORCEINLINE, so the existing definition alone
# satisfies the manifest again.
# jm 0.51.0 (gh-823 Ask B) added a THIRD constructor-drift axis -- optionality --
# and made the whole kwargs-drift class fail `jm status --check` rather than
# qualify the "OK" line. It found three in doppler, and all three are FIXED.
# CarrierAcquisition's published constructor could not be called as documented
# (see the 0.42.0 CHANGELOG). Resampler's undeclared `bank=` became an optional
# array init-param with a jm-generated fragment (c179bc663, doppler#635). And
# `_SynthEngine`'s positional ORDER drift ended when its fragment was adopted
# (doppler#1886): the binding now takes the manifest's order, as the owner
# ruled, so the entry that exempted it is gone.
#
# NB `status_allow` matches PATHS, not findings, so each entry also accepts that
# file's stale/missing classification -- it is broader than the reason it was
# added for (just-makeit#823). Re-check it on every pin bump; jm lists an
# allowed kwargs finding under KWARGS with a `~`, so they stay visible.
#
# native/tests/jm_test.h is allowed MISSING, deliberately and permanently.
# jm 0.58 ships it as a create-only shared assertion harness (CHECK,
# REQUIRE, ALMOST_EQ) because one downstream had accumulated 90 copies of
# CHECK in 6 incompatible variants -- that downstream was THIS repo, and it
# had already fixed the problem its own way. `native/tests/dp_test.h` is that
# fix: DP_CHECK / DP_REQUIRE / dp_nearf, with 90 test files on it and
# `make tests-ssot` enforcing it as the single definition. Vendoring
# jm_test.h beside it would put two peer assertion harnesses in one
# directory, which is the duplication this repo forbids -- and tests-ssot
# says so itself, failing on jm_test.h's CHECK, REQUIRE and the two retired
# ALMOST_EQ spellings. So the file is not adopted, and this entry is what
# tells the drift gate that its absence is a decision.
#
# Consequence worth knowing: a test scaffolded by jm 0.58 or later will
# `#include "jm_test.h"` and not compile here until it is converted to
# DP_CHECK / DP_REQUIRE. tests-ssot fails it on the way past, so the
# conversion is prompted rather than discovered. Tracked as #730.
# CMakePresets.json is taken over (jm 0.85.0, gh-1376): its base preset adds
# BUILD_PYTHON=ON. jm's preset assumes jm's top-level CMake, which defaults
# it ON; doppler's hand-owned one defaults it OFF (a bare `cmake -B` is the C
# library), so the render as shipped gives an IDE a build with no Python
# extensions. The file is create-only either way -- jm never rewrites it --
# so this entry records the ownership rather than changing what apply does.
#
status_allow = [
    "zensical.toml",
    "CMakePresets.json",
    "native/tests/jm_test.h",
    # The three deliberate UNWIRED cores (jm gh-984). Each is scoped to its
    # COMPONENT, never to `CMakeLists.txt` itself: naming the file would
    # exempt EVERY core from the wiring check and re-open the hole that hid
    # 38 unlinkable symbols across 6 components (gh-747).
    #
    # Verified rather than assumed — `nm` over each core's objects against
    # `libdoppler.a` before adding it here: wfm_compose / wfm_sink_stub /
    # wfmgen export NOTHING out-of-line, so no C consumer can be missing
    # anything. wfmcompose's own CMakeLists states the policy: its cores are
    # app/binding-only, and `timing_core` is "the one general-purpose
    # primitive worth shipping" — which it wires into both libraries itself,
    # guarded.
    #
    # `stream_core_obj` and `wfm_sink_core` were here too, for a reason that
    # was jm's rather than ours: their symbols ship in `libdoppler_stream`,
    # the OPTIONAL second library, and jm read only
    # `doppler_lib`/`doppler_lib_static`. **jm 0.60.2 (gh-991) reads
    # `add_library(NAME SHARED|STATIC $<TARGET_OBJECTS:X>)` too**, so both are
    # now correctly seen as shipped and their exemptions are DELETED — a
    # suppression kept past its cause is one that hides the next real finding.
    "CMakeLists.txt:wfm_compose_core",
    "CMakeLists.txt:wfm_sink_stub_core",
    "CMakeLists.txt:wfmgen_core",
]

# Benchmark only the 64k block (jm-gh-390). doppler dropped the small-block
# (_1k) bench suite library-wide in #234 — 1k blocks are dominated by call
# overhead and only add noise to any comparison. Without this, every
# newly scaffolded object reintroduced a `test_bench_steps_1k`, which had to be
# hand-trimmed after each `jm apply`. Declaring it here stops the reintroduction.
[project.bench]
block_sizes = [65536]

# ── BLUE extended-header keyword codec (gh-554) ──────────────────────────────
# ONE variant-codec table drives BOTH directions of the keyword binding:
# Writer.add_keyword packs a Python value into a discriminant-tagged buffer, and
# Reader.keywords decodes each entry back — so the two cannot drift, and neither
# needs a hand-written fragment. Codes/widths mirror wfm_keywords.c's Table-26
# set (Midas BLUE 1.1 §3.3.1); `T` is the deprecated 32-bit-int alias of `L`.
[codec.blue_keyword]
discriminant = "char"
scalar_collapse = true
entries = [
  { code = "A", ctype = "char", bytes = true },  # -> str
  { code = "B", ctype = "int8_t" },               # -> int
  { code = "I", ctype = "int16_t" },              # -> int
  { code = "L", ctype = "int32_t" },              # -> int
  { code = "T", ctype = "int32_t" },              # -> int (deprecated alias of L)
  { code = "X", ctype = "int64_t" },              # -> int
  { code = "F", ctype = "float" },                # -> float
  { code = "D", ctype = "double" },               # -> float
]

# ── Waveform enum single-source-of-truth (gh-285, gh-760) ───────────────────
# One string↔int table per synth enum; list order IS the C enum value
# (append-only — never reorder).
#
# TWO consumers, and it took gh-760 to make the second one true. jm renders
# the [[enum]] blocks into the binding's own lookup tables (`_enum_*` in
# wfm_compose_ext.c). The C side reads them through ONE hand-written header,
# native/inc/doppler/wfm/wfm_names.h, whose tables `make lint-wfm-enum-tables` holds
# to the blocks below.
#
# This comment used to claim the collapse was already done "across wfmgen.c /
# wfm_json.c / wfmcompose_py.c / compose.py". Measured, that was true of the
# Python face only: wfmgen.c still declared twelve of its own tables and
# wfm_json.c seven, one pair of them in OPPOSITE orders. Saying so was what
# let it stand for a year — hence the gate, which cannot.
# Design: docs/design/waveform-enum-ssot.md
[[enum]]
name = "wfm_type"
values = ["tone", "noise", "pn", "bpsk", "qpsk", "chirp", "bits", "symbols", "dsss"]

[[enum]]
# rc_pulse_t (RateConverter_core.h), bound by name: the C enum carries
# `SSOT: enum=rc_pulse` and scripts/check_wfm_enum_tables.py holds its names
# to these.
name = "rc_pulse"
values = ["iandd", "rrc", "none"]
enumerators = ["RC_PULSE_IANDD", "RC_PULSE_RRC", "RC_PULSE_NONE"]

# PSD's window, by name (psd_core.h, `SSOT: enum=psd_window`). The Spectrogram
# takes the same index, because PSD's kernel (dp_psd_kernel_init) is the one
# owner of it; HANN is 0, so a zeroed configuration is Hann. Bound by name (gh-1450), so the
# binding writes DP_PSD_WINDOW_* and the compiler checks every name.
[[enum]]
name = "psd_window"
values = ["hann", "kaiser", "blackman-harris", "rect"]
enumerators = [
  "DP_PSD_WINDOW_HANN", "DP_PSD_WINDOW_KAISER",
  "DP_PSD_WINDOW_BLACKMAN_HARRIS", "DP_PSD_WINDOW_RECT",
]

# carrier_acq's window: a VIEW over psd_window with the three windows it
# offers (its threshold's KAPPA was fit at Hann, carrier_acq_core.c), no rect,
# which its C create refuses (#2185). Every name is a psd_window enumerator,
# so it has no C enum of its own.
[[enum]]
name = "carrier_acq_window"
values = ["hann", "kaiser", "blackman-harris"]
enumerators = [
  "DP_PSD_WINDOW_HANN", "DP_PSD_WINDOW_KAISER",
  "DP_PSD_WINDOW_BLACKMAN_HARRIS",
]

# The Spectrogram's row units (spectrogram_core.h). POWER is 0, so a zeroed
# configuration selects power and dB is only ever asked for (#1968).
[[enum]]
name = "spectrogram_mode"
values = ["power", "db"]
enumerators = ["DP_SPECTROGRAM_POWER", "DP_SPECTROGRAM_DB"]

# AccTrace's reduction, and so PSD's averaging mode (acc_trace_core.h).
[[enum]]
name = "acc_trace_mode"
values = ["mean", "exp", "maxhold", "minhold"]
enumerators = [
  "ACC_TRACE_MEAN", "ACC_TRACE_EXP", "ACC_TRACE_MAXHOLD", "ACC_TRACE_MINHOLD",
]

[[enum]]
name = "crc"
values = ["none", "crc16"]

[[enum]]
name = "gap_noise"
values = ["auto", "off"]

[[enum]]
name = "snr_mode"
values = ["auto", "fs", "ebno", "esno"]

[[enum]]
name = "wfm_lfsr"
values = ["galois", "fibonacci"]

# The stage kinds doppler itself names. Order IS wfm_stage_kind_t
# (native/inc/doppler/wfm/wfm_frame.h): crc16 = 0 through interleave = 4.
#
# This list is deliberately NOT the whole enum. A stage's kind is an open
# uint32_t, and WFM_STAGE_USER (0x1000) is the sentinel a caller allocates
# from -- a boundary, not a name. So the scene JSON writes a NAME for a kind
# this list holds and the raw INTEGER for anything else, which is the only
# encoding that can round-trip a kind doppler has never heard of.
[[enum]]
name = "stage_kind"
values = ["crc16", "rs", "randomise", "conv", "interleave"]

# How long a source's Doppler channel lives (gh-942). Order IS
# wfm_doppler_lifetime_t (native/inc/doppler/wfm/wfm_compose.h): per_instance = 0 so
# an undeclared lifetime is the repeated-trial shape, persist = 1.
[[enum]]
name = "doppler_lifetime"
values = ["per_instance", "persist"]

# The enum below names a table that no binding renders — the C side is its
# only consumer. It is declared here anyway because doppler#760 made this
# file the SSOT for the C tables too (native/inc/doppler/wfm/wfm_names.h, gated by
# scripts/check_wfm_enum_tables.py), and an enum the gate cannot reach here
# would be an enum with no declaration at all.

# How much of a source's seed advances per repeat. Order IS
# wfm_seed_advance_t (native/inc/doppler/wfm/wfm_compose.h): none = 0, then the two
# cumulative levels.
[[enum]]
name = "seed_advance"
values = ["none", "noise", "all"]

# Where a frame field's bits come from. Order IS wfm_seq_kind_t
# (native/inc/doppler/wfm/wfm_frame.h): literal = 0, the three generated kinds,
# then data (a payload drawn from the frame's data source, #1619).
# The C enum stays the SSOT — this names its indices for the Python face.
[[enum]]
name = "wfm_seq_kind"
values = ["literal", "pn", "gold", "dotted", "data"]

# What a frame stage does to the fields it covers. Order IS wfm_stage_kind_t
# (native/inc/doppler/wfm/wfm_frame.h); the C enum stays the SSOT and this names its
# indices for the Python face.
[[enum]]
name = "wfm_stage_kind"
values = ["crc16", "rs", "randomise", "conv"]

[[enum]]
name = "bitmod"
values = ["none", "bpsk", "qpsk"]

[[enum]]
name = "wfm_pulse"
values = ["rect", "rrc"]

[[enum]]
name = "ftype"
values = ["raw", "csv", "blue", "sigmf"]

# Wire sample type: five element encodings in each of BLUE's two modes.
# The five complex names come first and their indices are load-bearing --
# STYPE_FMT[], KIND[] and the reader's `hint % 5` all index by this order, so
# APPEND, never reorder. The real five drop Q: `f32` writes one float per
# sample where `cf32` writes two (doppler#1032).
[[enum]]
name = "stype"
values = [
  "cf32", "cf64", "ci32", "ci16", "ci8",
  "f32",  "f64",  "i32",  "i16",  "i8",
]

# The Reader's sample_type HINT: the ten wire types plus "auto". Not `stype`
# with a name added, because "auto" is -1 (WFM_READER_STYPE_AUTO) -- a plain
# value list numbers by position, which would make it 0 and slide every other
# name up by one. `enumerators` binds each name to its C constant instead
# (gh-1450), so the compiler checks the table. The property `sample_type`
# still decodes through `stype`: an open reader always resolved to one of the
# ten, never "auto".
[[enum]]
name = "reader_stype"
values = ["auto", "cf32", "cf64", "ci32", "ci16", "ci8", "f32", "f64", "i32", "i16", "i8"]
enumerators = [
  "WFM_READER_STYPE_AUTO", "WFM_READER_STYPE_CF32", "WFM_READER_STYPE_CF64", "WFM_READER_STYPE_CI32", "WFM_READER_STYPE_CI16", "WFM_READER_STYPE_CI8", "WFM_READER_STYPE_F32", "WFM_READER_STYPE_F64", "WFM_READER_STYPE_I32", "WFM_READER_STYPE_I16", "WFM_READER_STYPE_I8",
]

[[enum]]
name = "endian"
values = ["le", "be"]

# BLUE `format` mode designator (HCB byte 52): components per sample.
[[enum]]
name = "sample_mode"
values = ["complex", "scalar"]

# Where Reader.fc was read from. Order IS wfm_fc_source_t
# (wfm_reader_core.h): "none" is index 0, then one entry per tag in the
# reader's FC_TAGS search order, then the SigMF JSON key.
[[enum]]
name = "fc_source"
values = ["none", "FREQ", "RF_FREQ", "CENTER_FREQ", "F_C", "core:frequency"]

# Where `fs` came from. Same shape and same reason as fc_source: index 0 is
# "none", and the rest name the metadata that carried the rate. Order matches
# wfm_fs_source_t (wfm_reader_core.h).
[[enum]]
name = "fs_source"
values = ["none", "xdelta", "core:sample_rate"]

# Where the capture's start time came from. "none" is the COMMON answer, not
# an edge case: doppler's own BLUE writer leaves the timecode field zero, so
# every capture this library writes lands here. Order matches
# wfm_t0_source_t (wfm_reader_core.h).
[[enum]]
name = "t0_source"
values = ["none", "timecode", "sigmf"]

# How a following read ended (docs/design/end-of-capture.md). "none" is index
# 0 and is the state while the capture is still live; the rest name the three
# ways a wait can stop. Order matches wfm_follow_end_t (wfm_reader_core.h).
[[enum]]
name = "follow_end"
values = ["none", "eof", "timeout", "interrupted"]

[[enum]]
name = "interp_method"
values = ["floor", "nearest", "linear"]

# The AsyncDsssReceiver's lifecycle states (async_dsss_receiver_core.h,
# ASYNC_DSSS_RX_*), bound by name so the compiler checks every one. Read
# through the receiver's `lifecycle` property as a string.
[[enum]]
name = "async_dsss_rx_state"
values = ["searching", "refining", "tracking", "idle", "lost"]
enumerators = [
  "ASYNC_DSSS_RX_SEARCHING", "ASYNC_DSSS_RX_REFINING",
  "ASYNC_DSSS_RX_TRACKING", "ASYNC_DSSS_RX_IDLE", "ASYNC_DSSS_RX_LOST",
]
