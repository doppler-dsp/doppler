[pn]
arg_type = "void"
return_type = "uint8_t"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "PN"
serializable = "true"
# poly = 0 means "the maximal-length polynomial for this register" (#191). That
# resolution is made by the constructor, not the binding: dp_pn_create() takes
# `poly` verbatim (0 is a register with no feedback, pinned in test_pn_core.c),
# and dp_pn_create_mls() is `poly ? poly : pn_mls_poly (length)` in front of it,
# so a Rust or C caller gets PN(length=7) the same as Python does.
create_fn = "dp_pn_create_mls"
fragment = "generated"

[[pn.init_params]]
name = "poly"
type = "uint64_t"
# 0 selects the MLS primitive polynomial for `length` (#191), matching the
# Synth(pn_poly=0) convention. The old 96/1/7 defaults predated that fix and
# never matched shipped behaviour.
default = "0"

[[pn.init_params]]
name = "seed"
type = "uint64_t"
default = "0"

[[pn.init_params]]
name = "length"
type = "uint32_t"
default = "0"

[[pn.init_params]]
name = "lfsr"
type = "string_enum:galois,fibonacci"
default = "galois"

[[pn.methods]]
name = "generate"
arg_type = "void"
return_type = "uint8_t"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting max_out
# truncates the emission instead of overrunning `out`.
pass_capacity = true
