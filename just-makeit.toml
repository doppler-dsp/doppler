[module.wfm_compose.source]
object = "wfm_synth"
struct = "wfm_source_t"
type_name = "Synth"
# Fields that accept a (lo, hi) pair drawn uniformly each repeat (composer
# epoch) — not just a scalar. The struct carries a <name>_hi companion + a
# `ranged` bitmask (wfm_compose.h); jm emits float-or-tuple parse/getset/.pyi.
ranged = [
    { name = "freq", flag = "WFM_RANGE_FREQ" },
    { name = "snr", flag = "WFM_RANGE_SNR" },
    { name = "level", flag = "WFM_RANGE_LEVEL" },
    { name = "f_end", flag = "WFM_RANGE_FEND" },
]

[[module.wfm_compose.source.fields]]
name = "type"
type = "int"
enum = "wfm_type"
default = "tone"
doc = "Waveform type."

[[module.wfm_compose.source.fields]]
name = "freq"
type = "double"
default = "0.0"
aliases = ["f_start"]
doc = "Carrier/offset frequency in Hz (normalised cycles/sample when fs=1); for chirp it is the start frequency."

[[module.wfm_compose.source.fields]]
name = "snr"
type = "double"
default = "100.0"
doc = "Signal-to-noise ratio in dB, interpreted per snr_mode; >=100 is treated as clean (no AWGN)."

[[module.wfm_compose.source.fields]]
name = "snr_mode"
type = "int"
enum = "snr_mode"
default = "auto"
doc = "How snr is interpreted: auto picks fs for tone/pn/chirp/bits and Es/No for bpsk/qpsk."

[[module.wfm_compose.source.fields]]
name = "seed"
type = "uint32_t"
default = "0"
doc = "PRNG/LFSR seed for the noise and PN streams."

[[module.wfm_compose.source.fields]]
name = "sps"
type = "int"
default = "1"
doc = "Samples per symbol (PSK) or per chip (PN); the oversampling factor."

[[module.wfm_compose.source.fields]]
name = "pn_length"
type = "int"
default = "15"
doc = "PN LFSR register length; the sequence period is 2^pn_length - 1."

[[module.wfm_compose.source.fields]]
name = "pn_poly"
type = "uint64_t"
default = "0"
doc = "PN generator polynomial; 0 auto-selects a maximal-length (MLS) polynomial for pn_length."

[[module.wfm_compose.source.fields]]
name = "lfsr"
type = "int"
enum = "wfm_lfsr"
default = "galois"
doc = "PN LFSR realization (galois or fibonacci); same period, different chip order."

[[module.wfm_compose.source.fields]]
name = "level"
type = "double"
default = "0.0"
doc = "Source power in dBFS (<=0; 0 = unit power). Applies only when summed in a Segment/Composer (gain 10^(level/20)); ignored by standalone Synth.steps()."

[[module.wfm_compose.source.fields]]
name = "background"
type = "int"
default = "0"
doc = "Mark this source as part of the static background field (0/1). Plan.prepare() folds a contiguous leading run of background sources into ONE pre-summed cache entry instead of caching each separately, so a scene of many fixed emitters costs one buffer rather than hundreds. The composite is overridable as a unit: it takes a single slot in gains/phases/enable and counts as one in n_sources(), so scaling it trims the whole field while its members keep their relative levels. Background sources must come first in the segment (a non-prefix ordering is rejected by prepare, since the fold would no longer reproduce compose bit-for-bit). Ignored by compose() and by standalone Synth.steps()."

[[module.wfm_compose.source.fields]]
name = "f_end"
type = "double"
default = "0.0"
doc = "Chirp end frequency in Hz; ignored by non-chirp types."

[[module.wfm_compose.source.fields]]
name = "bits"
type = "uint8_t*"
bytes = true
aliases = ["pattern", "payload"]
coerce = "bit_pattern"
doc = "For type=bits: the 0/1 pattern, oversampled by sps and cycled to fill the request. For type=dsss (as `payload`): the payload bits of the burst frame."

[[module.wfm_compose.source.fields]]
name = "modulation"
type = "int"
enum = "bitmod"
default = "bpsk"
doc = "For type=bits: symbol mapping of the pattern (none=0/1 amplitude, bpsk, qpsk)."

[[module.wfm_compose.source.fields]]
name = "pulse"
type = "int"
enum = "wfm_pulse"
default = "rect"
doc = "Pulse shape for the symbol stream (pn/bpsk/qpsk/bits): rect sample-and-hold or rrc matched filter."

[[module.wfm_compose.source.fields]]
name = "rrc_beta"
type = "double"
default = "0.35"
doc = "RRC roll-off factor in (0, 1] when pulse=rrc."

[[module.wfm_compose.source.fields]]
name = "rrc_span"
type = "int"
default = "8"
doc = "RRC filter span in symbols when pulse=rrc (taps = 2*span*sps + 1)."

[[module.wfm_compose.source.fields]]
name = "symbols"
type = "float _Complex*"
complex = true
doc = "For type=symbols: a complex64 constellation stream — each element is the output point itself, oversampled by sps, cycled, and RRC-shaped with pulse=rrc. Generalises any modulation (pi/4-QPSK, QAM, ...)."

[[module.wfm_compose.source.fields]]
name = "acq_code"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
doc = "The acquisition/preamble code (0/1), repeated acq_reps times at the head of the frame — the coherent pull-in target BurstDespreader.set_acq/BurstDemod.set_preamble lock to. For type=dsss it is unmodulated chips ahead of the spread frame; for type=bits it is the head of the bit pattern. Setting it (or sync) is what makes a source FRAMED."

[[module.wfm_compose.source.fields]]
name = "acq_reps"
type = "size_t"
default = "1"
doc = "Preamble repetitions (periods of acq_code before the sync word)."

[[module.wfm_compose.source.fields]]
name = "data_code"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
doc = "For type=dsss: the payload spreading code (0/1 chips) — a second code, distinct from acq_code; every frame bit (sync | payload | crc) is XOR-spread across its full length, so len(data_code) is the spreading factor."

[[module.wfm_compose.source.fields]]
name = "sync"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
doc = "The frame-sync word bits (e.g. Barker-13) between the preamble and the payload — what BurstDemod.set_sync correlates to resolve frame position and BPSK polarity, and what a BER alignment detects against. Optional; setting it (or acq_code) is what makes a source FRAMED."

[[module.wfm_compose.source.fields]]
name = "crc"
type = "int"
enum = "crc"
default = "crc16"
doc = "The frame trailer — crc16 appends a CRC-16-CCITT over the payload bits (what BurstDemod validates as frame_valid, and what makes a truth-free frame error rate possible); none omits it. Applies only to a FRAMED source: it defaults to crc16, so it alone never frames an otherwise plain pattern."

[[module.wfm_compose.source.fields]]
name = "symbol_rate"
type = "double"
default = "0.0"
doc = "For type=dsss: > 0 selects CONTINUOUS asynchronous mode — the spreading code repeats endlessly and data rides on it at this symbol rate (Hz), independent of the code-epoch rate (chips/symbol = fs/sps/symbol_rate, non-integer). No preamble/sync/CRC frame; data comes from the payload when supplied, else a seeded PN a receiver regenerates. Absent/0 = burst."

[[module.wfm_compose.source.fields]]
name = "dsss_code_only"
type = "int"
default = "0"
doc = "Continuous dsss data source: 1 = code-only (the pure spreading code, no data modulation); 0 = data-modulated (the payload when supplied, else the seeded PN). Ignored for burst dsss and non-dsss types."

[module.wfm_compose.source.generates]
generator = "wfm_synth"
bridge_fn = "wfm_source_to_synth"

[module.wfm_compose.segment]
type_name = "Segment"
struct = "wfm_segment_t"
sources = "multi"
flat_sources = true
# Per-repeat (lo, hi) uniform draws (see source.ranged) — e.g. off_samples as
# arrival jitter that shifts the next burst's code phase.
ranged = [
    { name = "num_samples", flag = "WFM_RANGE_NUM_SAMPLES" },
    { name = "off_samples", flag = "WFM_RANGE_OFF_SAMPLES" },
    { name = "delay_samples", flag = "WFM_RANGE_DELAY_SAMPLES" },
]

[[module.wfm_compose.segment.fields]]
name = "fs"
type = "double"
default = "1.0"
doc = "Sample rate in Hz — one per segment (all sources share it)."

[[module.wfm_compose.segment.fields]]
name = "num_samples"
type = "size_t"
default = "1024"
doc = "Segment on-time in samples (the active span)."

[[module.wfm_compose.segment.fields]]
name = "off_samples"
type = "size_t"
default = "0"
doc = "Trailing off-time gap in samples (zeros) appended after the segment."

[[module.wfm_compose.segment.fields]]
name = "repeats"
type = "size_t"
default = "1"
doc = "Play the segment this many times back-to-back (each instance = delay + on-time + trailing gap) before advancing. Ranged fields re-draw and the AWGN is fresh per instance; the signal (codes, payload, PN phase) stays fixed."

[[module.wfm_compose.segment.fields]]
name = "delay_samples"
type = "size_t"
default = "0"
doc = "Leading gap before the on-time (samples) — the burst arrives after this delay. Ranged like off_samples and re-drawn per repeats instance, so a (lo, hi) delay is per-burst arrival jitter. Use off_samples for inter-burst spacing, delay_samples for arrival jitter."

[[module.wfm_compose.segment.fields]]
name = "gap_noise"
type = "int"
enum = "gap_noise"
default = "auto"
doc = "Gap policy for this segment's delay and trailing gap. auto (default): gaps carry the segment's noise floor — the sources' AWGN keeps running while the signal stops (clean scenes still get exact-zero gaps). off: gaps are hard zeros."

[module.wfm_compose.timeline]
type_name = "Timeline"
loop = ["once", "repeat", "continuous"]

[module.wfm_compose.oo]
factories = ["tone", "noise", "pn", "bpsk", "qpsk", "chirp", "bits"]
emit = "ctypes"
discriminant = "type"
composer_type_name = "Composer"

[module.wfm_compose.composer]
stream = true
to_dict = true

[module.wfm_compose.composer.realtime]
clock_create = "dp_sample_clock_create"
pace = "dp_sample_clock_pace"
destroy = "dp_sample_clock_destroy"
header = "timing/timing_core.h"

[module.wfm_compose.json]
enabled = true
to_json_fn = "wfm_spec_to_json"
# The trailing literals are spliced after (segs, n, repeat, continuous), so the
# order here IS the C signature's. `self->state` is in scope in jm's generated
# to_json, which is what lets the composer stay the SSOT for seed_advance --
# without it the Python face emitted a spec that replayed a different waveform
# (doppler#978). headroom is a writer gain, not composer state, so it is still
# the literal 0.0: a Python Composer has none.
to_json_trailing = ["wfm_compose_seed_advance (self->state)", "0.0"]

[[module.wfm_compose.serializers]]
name = "to_sigmf"
fn = "wfm_sigmf_meta_json"
returns = "str"
header = "wfm_writer/wfm_writer_core.h"

[[module.wfm_compose.serializers.params]]
name = "sample_type"
type = "int"
enum = "stype"
default = "cf32"

[[module.wfm_compose.serializers.params]]
name = "endian"
type = "int"
enum = "endian"
default = "le"

# Left OPTIONAL where Writer and write_blue_header require it, because this
# is the one caller that does not need to be asked: a Composer already HOLDS
# a rate per segment, and this very document uses it — the annotation edges
# are ±fs/(2*sps) from `s->fs`. So `wfm_sigmf_meta_json` now DERIVES an
# unstated rate from the segments (when they agree), and requiring the
# argument would only make the caller restate what the scene already knows,
# while still permitting a stated rate that contradicts the edges beside it.
# An explicit fs overrides, for rendering the scene at a resampled rate.
[[module.wfm_compose.serializers.params]]
name = "fs"
type = "double"
default = "0.0"

[[module.wfm_compose.serializers.params]]
name = "fc"
type = "double"
default = "0.0"

# Capture start, UNIX seconds → `captures[0]."core:datetime"` (extended ISO
# 8601). Unset by default, and omitted from the document when unset.
[[module.wfm_compose.serializers.params]]
name = "t0"
type = "double"
default = "0.0"
