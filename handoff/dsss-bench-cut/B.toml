# Set B: labels for the rows marked KEEP in B-notes.md ("KEEP / CUT").
# CUT rows get no draft. py:async_dsss_pool::test_push_epoch is CUT, so its
# existing entry (benchmarks/labels.toml:335-339) goes with the row.
# Evidence for every parameter: B-notes.md, per row.

# -- AsyncDsssPool: the thread-count sweep's two ends ------------------------

["c:async_dsss_pool::push[12 slots, serial]"]
name = "Async DSSS pool, 12 receivers, one tracking, one thread"
unit = "sample"
definition = "One push of 2,046 samples (one period of a 1,023-chip code at 5 Mcps, 2 samples per chip) through the whole population on one thread: the searcher over ±6 kHz (three Doppler tiles) at a block-coherent depth of 16 code periods (the capture's code-only window is 31 periods, 20 symbols in every 270), false-alarm target 1e-2 and a 4-peak list, then all twelve cell receivers, one of them holding the capture's single noise-free emitter at +1,500 Hz after an untimed half-second warm-up and eleven idle; throughput counts input samples."
samples = 1

["c:async_dsss_pool::push[12 slots, all cores]"]
name = "Async DSSS pool, 12 receivers, one tracking, all cores"
unit = "sample"
definition = "The one-thread row's push, the same 2,046 samples, searcher (±6 kHz, three Doppler tiles, depth 16 code periods, false-alarm target 1e-2, a 4-peak list) and twelve cell receivers (one holding the +1,500 Hz emitter, eleven idle), with the searcher's three tiles and the twelve receivers fanned across every online core of the benchmark machine; throughput counts input samples."
samples = 1

# -- AsyncDsssReceiver: cell mode, the waveform sweep's two ends -------------

["c:async_dsss_receiver::steps[cell]"]
name = "Async DSSS cell receiver tracking, 7-chip test code"
unit = "sample"
definition = "One receiver in cell mode, the mode the pool runs (no acquisition or refinement of its own: seeded at the true code phase and zero Doppler, its code loop held and corrected once every 100 code periods), re-fed the same 22,472-sample second half of a clean, zero-Doppler capture every round: a 7-chip test code at 1 Mcps, 4 samples per chip, 35,714 BPSK symbols per second, so exactly four code periods a symbol; the carrier loop, the held code loop, the resampler and the PSK demodulator, and throughput counts input samples."
samples = 1

["c:async_dsss_receiver::steps[cell,op5M]"]
name = "Async DSSS cell receiver tracking, 1,023 chips at 5 Mcps"
unit = "sample"
definition = "One receiver in cell mode, the mode the pool runs (no acquisition or refinement of its own: seeded at the true code phase and zero Doppler, its code loop held and corrected once every 154 code periods, the operating point's searcher depth), re-fed the same 745,917-sample second half of a clean, zero-Doppler capture every round: a synthetic 1,023-chip code at 5 Mcps, 2 samples per chip, 2,700 BPSK symbols per second, the code restarting at every symbol; the carrier loop, the held code loop, the resampler and the PSK demodulator, and throughput counts input samples."
samples = 1

# -- DsssBurstReceiver: no burst and one burst per block, plus construction --

["c:dsss_burst_receiver::push_idle"]
name = "DSSS burst receiver listening, 31-chip preamble"
unit = "sample"
definition = "One push of an 8,192-sample block of complex noise with no burst into a fresh receiver (built untimed): the preamble search alone, for a 31-chip m-sequence repeated 4 times at 1 Mcps and 4 samples per chip (a 124-point code transform), design C/N0 55 dB-Hz, false-alarm target 1e-3 and no Doppler search; throughput counts input samples."
samples = 1

["c:dsss_burst_receiver::push_burst"]
name = "DSSS burst receiver, one burst per 8,192 samples"
unit = "sample"
definition = "The same 8,192-sample noise block carrying one complete 2,448-sample burst (the 4 repeats of the 31-chip preamble, then a 61-bit frame of 13-bit sync word, 32 data bits and CRC-16 spread by an 8-chip code, at a per-sample SNR of about 17 dB), pushed into a fresh receiver (built untimed): the search plus one detection's refinement and demodulation, which must pass its CRC; throughput counts input samples."
samples = 1

["py:dsss_burst_receiver::test_bench_construct"]
name = "DSSS burst receiver construction, from Python"
unit = "call"
definition = "Building one receiver through the Python binding for a 255-chip m-sequence preamble repeated 5 times and a 31-chip data code at 1 Mcps and 2 samples per chip, design C/N0 60 dB-Hz, which sizes its search on that burst: paid once per receiver, so it reads as time per call."
domain = "call"
count = 1

# -- DsssReceiver -----------------------------------------------------------

["c:dsss_receiver::track"]
name = "DSSS receiver tracking, 7-chip test code"
unit = "sample"
definition = "One receiver, locked untimed on a 7-chip test signal (1 Mcps, 4 samples per chip, 35,714 alternating BPSK symbols per second, so exactly four code periods a symbol, zero Doppler, C/N0 90 dB-Hz), fed the next contiguous 65,536-sample block each round: carrier loop, code loop (4 partial correlations per period), resampler to 8 samples per symbol and PSK demodulator; throughput counts input samples."
samples = 1

["py:dsss_receiver::test_bench_steps_search"]
name = "DSSS receiver searching, Gold-1023 at 3 Mcps, from Python"
unit = "sample"
definition = "One receiver, reset untimed before each round, fed one 65,536-sample block of noise through the Python binding and asserted never to lock: the acquisition search alone, for a 1,023-chip Gold code at 3 Mcps and 2 samples per chip (a 2,046-point code transform per period), over ±100 Hz at design C/N0 55 dB-Hz and false-alarm target 1e-3; throughput counts input samples."
samples = 1

# -- Wide-Doppler method trade (bench_widedoppler.py): two methods, the grid
#    sweep's two ends. A roll row covers ALL its grid's Doppler windows from
#    one epoch; a tile row covers ONE window, so the bank over the same span
#    is that many tiles.

["py:widedoppler::test_bench_2d_roll[gps_16x2046-16-2046-79]"]
name = "Wide-Doppler search by 2-D roll, 79 bins of 1 kHz, from Python"
unit = "sample"
definition = "One 2,046-sample epoch searched over 79 coarse Doppler bins (±39 kHz in 1 kHz windows, a GPS-like grid) by the roll method, composed in Python: one forward 2,046-point FFT, then for each bin a NumPy product with a pre-rolled code spectrum and an inverse FFT, 80 FFT calls in all; throughput counts the epoch's 2,046 input samples, and that one epoch covers all 79 bins."
samples = 1

["py:widedoppler::test_bench_2d_roll[burst_5x4094-5-4094-49]"]
name = "Wide-Doppler search by 2-D roll, 49 bins of 2.44 kHz, from Python"
unit = "sample"
definition = "One 4,094-sample epoch searched over 49 coarse Doppler bins (±60 kHz in 2.44 kHz windows, a long burst acquisition code) by the roll method, composed in Python: one forward 4,094-point FFT, then for each bin a NumPy product with a pre-rolled code spectrum and an inverse FFT, 50 FFT calls in all; throughput counts the epoch's 4,094 input samples, and that one epoch covers all 49 bins."
samples = 1

["py:widedoppler::test_bench_column_tile[gps_16x2046-16-2046-79]"]
name = "Wide-Doppler bank tile, 16 by 2,046, 1 of 79 windows, from Python"
unit = "sample"
definition = "One channel of the mixer-bank method: a Corr2D correlation of 16 epochs of 2,046 samples against a full 16-row random reference (the general 2-D path: forward 2-D FFT, product, inverse 2-D FFT), giving 16 fine Doppler bins inside a single 1 kHz window; throughput counts its 32,736 input samples, and covering the 79-window roll row's span takes 79 of these."
samples = 1

["py:widedoppler::test_bench_column_tile[burst_5x4094-5-4094-49]"]
name = "Wide-Doppler bank tile, 5 by 4,094, 1 of 49 windows, from Python"
unit = "sample"
definition = "One channel of the mixer-bank method: a Corr2D correlation of 5 epochs of 4,094 samples against a full 5-row random reference (the general 2-D path: forward 2-D FFT, product, inverse 2-D FFT), giving 5 fine Doppler bins inside a single 2.44 kHz window; throughput counts its 20,470 input samples, and covering the 49-window roll row's span takes 49 of these."
samples = 1
