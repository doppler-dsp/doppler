[module.wfm_compose]
# The Composer publishes its state as a capsule (jm gh-2346), so a Writer
# method can take the scene: Writer.annotate(scene) (doppler#2564).
capsule = "doppler.wfm.composer"
kind         = "composer"
backing      = "dp_wfm_compose"
capsule_name = "doppler.wfm.compose_state"
package      = "wfm"
header       = "doppler/wfm/wfm_compose.h"
composes     = ["wfm_synth"]
sample_type  = true
# doppler#1696: a refused scene raises its reason (just-makeit gh-1755/1758).
# The create takes a trailing `const char **why`, filled from
# dp_wfm_scene_error() -- the one validator every face asks -- so
# `Composer([...])` raises ValueError(<the reason>), not "<create> failed".
create_fn  = "dp_wfm_compose_create_why"
create_why = true
# link=true cores (jm appends _core): wfm_compose (composer + wfm_json + resolve),
# wfm_dsp (DSSS/RRC taps), and the synth chain wfm_synth/lo/awgn/pn/fir/resamp
# (resamp backs the polyphase RRC pulse shaper). The
# vendored cJSON OBJECT lib (wfm_cjson_core) + libm go in extra_link_libs. This mirrors
# native/src/wfmcompose/CMakeLists.txt's test_wfm_compose link line.
# wfm_keywords_core: the writer core's BLUE extended-header codec.
extra_link_libs = ["wfm_draw_core", "wfm_cjson_core", "wfm_keywords_core"]

# The interrupt primitive, DECLARED rather than spliced -- see
# [module.sample_clock].
[[module.wfm_compose.depends_on]]
name = "dp_interrupt_guard"
link = true

# Clock Doppler on a source (gh-942). DECLARED rather than added to
# extra_link_libs: it is a real component with its own core, and the #225
# migration made `depends_on link=true` the way a composing module names one.
[[module.wfm_compose.depends_on]]
name = "doppler_channel"
link = true

# The source type wraps wfm_source_t field-for-field (struct order); enum fields
# cross as validated strings via the SSOT, `bits` as an owned bytes buffer.
[[module.wfm_compose.depends_on]]
name = "wfm_compose"
link = true

[[module.wfm_compose.depends_on]]
name = "wfm_dsp"
link = true

[[module.wfm_compose.depends_on]]
name = "wfm_frame"
link = true
# cvt: a Field in hex expands through dp_hex_to_bin inside wfm_frame.c, and an
# OBJECT library does not carry its dependencies' objects to its consumers.
[[module.wfm_compose.depends_on]]
name = "cvt"
link = true

# ccsds_tm (+ conv/rs, which it configures): wfm_synth_bridge.c assembles a
# framed source through dp_wfm_frame_assemble, and the coding stages a source may
# select are CCSDS's picks. wfm_frame.c cannot call them -- ccsds_tm depends
# on it -- so they arrive as a kernel table and every consumer must carry the
# objects.
[[module.wfm_compose.depends_on]]
name = "ccsds_tm"
link = true
[[module.wfm_compose.depends_on]]
name = "conv"
link = true
[[module.wfm_compose.depends_on]]
name = "rs"
link = true

[[module.wfm_compose.depends_on]]
name = "gold"
link = true

[[module.wfm_compose.depends_on]]
name = "wfm_synth"
link = true

[[module.wfm_compose.depends_on]]
name = "lo"
link = true

[[module.wfm_compose.depends_on]]
name = "awgn"
link = true

[[module.wfm_compose.depends_on]]
name = "pn"
link = true

[[module.wfm_compose.depends_on]]
name = "fir"
link = true

[[module.wfm_compose.depends_on]]
name = "resamp"
link = true

[[module.wfm_compose.depends_on]]
name = "timing"
link = true

[[module.wfm_compose.depends_on]]
name = "wfm_writer"
link = true
[module.wfm_compose.source]
object = "wfm_synth"
struct = "wfm_source_t"
type_name = "Synth"
# Fields that accept a (lo, hi) pair drawn uniformly each repeat (composer
# epoch) — not just a scalar. The struct carries a <name>_hi companion + a
# `ranged` bitmask (wfm_compose.h); jm emits float-or-tuple parse/getset/.pyi.
ranged = [
    { name = "freq", flag = "WFM_RANGE_FREQ" },
    { name = "snr", flag = "WFM_RANGE_SNR" },
    { name = "level", flag = "WFM_RANGE_LEVEL" },
    { name = "f_end", flag = "WFM_RANGE_FEND" },
    { name = "doppler", flag = "WFM_RANGE_DOPPLER" },
    { name = "doppler_rate", flag = "WFM_RANGE_DOPPLER_RATE" },
]

[[module.wfm_compose.source.fields]]
name = "type"
json = "type"
json_required = true
cli = "--type"
metavar = "TYPE"
help_section = "TYPE"
type = "int"
enum = "wfm_type"
default = "tone"
doc = "Waveform type. tone: complex sinusoid. noise: AWGN. pn: PN sequence (LFSR). bpsk/qpsk: PN-driven modulation. chirp: linear-FM sweep. bits: a caller's bit pattern, with selectable modulation. symbols: a caller's complex constellation stream. dsss: spread spectrum -- a two-code burst (repeated preamble + data-code-spread frame) by default, or a continuous asynchronous stream when symbol_rate is set."

[[module.wfm_compose.source.fields]]
name = "freq"
json = "freq"
cli = "--freq"
metavar = "HZ"
help_section = "SIGNAL"
type = "double"
default = "0.0"
aliases = ["f_start"]
doc = "Carrier or offset frequency in Hz; for chirp, the sweep start. With fs = 1 it is in normalised cycles per sample."

[[module.wfm_compose.source.fields]]
name = "snr"
json = "snr"
cli = "--snr"
metavar = "DB"
help_section = "NOISE"
type = "double"
default = "100.0"
doc = "Signal-to-noise ratio in dB, interpreted per snr_mode. 100 or more is clean: no AWGN is added."

[[module.wfm_compose.source.fields]]
name = "snr_mode"
json = "snr_mode"
cli = "--snr-mode"
metavar = "MODE"
help_section = "NOISE"
type = "int"
enum = "snr_mode"
default = "auto"
doc = "How snr is interpreted. auto: Es/N0 for bpsk/qpsk/dsss, and relative to full scale for tone/noise/pn/chirp/bits/symbols -- bits included, because a bits frame has no symbol rate the engine can infer. fs: dB relative to full scale. ebno: Eb/N0, per bit. esno: Es/N0, per symbol; for a dsss burst the outer data symbol of len(data_code) chips x sps samples, for a continuous dsss stream the fs/symbol_rate samples the async symbol spans."

[[module.wfm_compose.source.fields]]
name = "seed"
json = "seed"
cli = "--seed"
metavar = "N"
help_section = "SIGNAL"
type = "uint32_t"
default = "0"
doc = "PRNG and LFSR seed for the noise and PN streams. Deterministic: vary it for run-to-run change. For a PN-sourced type it starts the pn_length-bit register, masked: a seed whose low pn_length bits are zero starts the register at 1, as seed 0 does."

[[module.wfm_compose.source.fields]]
name = "sps"
json_schema = { minimum = 0 }
json = "sps"
cli = "--sps"
metavar = "N"
help_section = "SIGNAL"
type = "int"
default = "1"
doc = "Samples per symbol (PSK) or per chip (PN): the oversampling factor. Unused by noise, which records it as 0."

[[module.wfm_compose.source.fields]]
name = "pn_length"
json_schema = { minimum = 0 }
json = "pn_length"
cli = "--pn-length"
metavar = "N"
help_section = "PN"
type = "int"
default = "15"
doc = "PN LFSR register length in bits, 2 to 64 for the PN-bearing types; the sequence period is 2^pn_length - 1. Unused by noise, which records it as 0."

[[module.wfm_compose.source.fields]]
name = "pn_poly"
json = "pn_poly"
cli = "--pn-poly"
metavar = "N"
help_section = "PN"
type = "uint64_t"
default = "0"
doc = "PN generator polynomial, in the Galois bit-vector convention; 0 selects a maximal-length (MLS) polynomial for pn_length. It must fit the pn_length-bit register: a bit at or above it is refused, not masked. A polynomial above 2^53 does not survive a JSON number, so a scene file needs 0 (auto) for such a register."

[[module.wfm_compose.source.fields]]
name = "lfsr"
json = "lfsr"
cli = "--lfsr"
metavar = "TYPE"
help_section = "PN"
type = "int"
enum = "wfm_lfsr"
default = "galois"
doc = "PN LFSR realisation. Both give the same period; fibonacci's chips are galois's in reverse order."

[[module.wfm_compose.source.fields]]
name = "level"
json_schema = { maximum = 0.0 }
json_range = "level_range"
json = "level"
json_omit = "default"
cli = "--level"
metavar = "DB"
help_section = "AMPLITUDE"
type = "double"
default = "0.0"
doc = "Source power in dBFS (<= 0; 0 is unit power). Applies when summed in a Segment or Composer, as a gain of 10^(level/20); a standalone Synth.steps() ignores it."

[[module.wfm_compose.source.fields]]
name = "background"
json = "background"
json_omit = "default"
json_type = "bool"
type = "int"
default = "0"
doc = "Mark this source as part of the static background field (0/1). Plan.prepare() folds a contiguous leading run of background sources into ONE pre-summed cache entry instead of caching each separately, so a scene of many fixed emitters costs one buffer rather than hundreds. The composite is overridable as a unit: it takes a single slot in gains/phases/enable and counts as one in n_sources(), so scaling it trims the whole field while its members keep their relative levels. Background sources must come first in the segment (a non-prefix ordering is rejected by prepare, since the fold would no longer reproduce compose bit-for-bit). Ignored by compose() and by standalone Synth.steps()."

[[module.wfm_compose.source.fields]]
name = "f_end"
json = "f_end"
json_when = { type = "chirp" }
cli = "--f-end"
metavar = "HZ"
help_section = "SIGNAL"
type = "double"
default = "0.0"
doc = "Chirp end frequency in Hz; ignored by other types."

[[module.wfm_compose.source.fields]]
name = "span"
json = "span"
json_when = { type = "chirp" }
json_omit = "default"
type = "size_t"
default = "0"
doc = "Chirp sweep length in samples: the frequency ramps from freq to f_end over this many samples, then holds at f_end. 0 means the enclosing Segment's num_samples. A standalone chirp (f_end != freq) must declare it, so step(), steps(N) and any chunking of reads produce the same waveform; generating one without it raises. Ignored by non-chirp types."

# Clock Doppler (gh-942) — per SOURCE, because it is a property of one
# emitter's motion and two transmitters in a `sum` segment are on different
# geometries.
[[module.wfm_compose.source.fields]]
name = "doppler"
json = "doppler"
json_omit = "default"
cli = "--doppler"
metavar = "PPM"
help_section = "DOPPLER"
type = "double"
default = "0.0"
doc = "Clock Doppler in ppm: the received time base is rescaled by 1 + doppler*1e-6, so the symbol and chip rates move with the carrier and a timing loop sees the error a carrier-only `freq` offset hides. Accepts a (lo, hi) tuple drawn uniformly per repeat, like freq/snr. Zero doppler AND zero doppler_rate means no channel is built at all, so a source that does not ask for Doppler renders exactly as it always did."

[[module.wfm_compose.source.fields]]
name = "doppler_rate"
json = "doppler_rate"
json_omit = "default"
cli = "--doppler-rate"
metavar = "PPM_S"
help_section = "DOPPLER"
type = "double"
default = "0.0"
doc = "Linear ramp on `doppler`, in ppm per second of elapsed stream time. The channel runs through a segment's gaps as well as its on-time -- an emitter does not stop moving because its burst ended -- so this is per second, not per second of on-time. Accepts a (lo, hi) tuple drawn uniformly per repeat."

[[module.wfm_compose.source.fields]]
name = "carrier_hz"
json = "carrier_hz"
json_omit = "default"
cli = "--carrier-hz"
metavar = "HZ"
help_section = "DOPPLER"
type = "double"
default = "0.0"
doc = "RF carrier in Hz that the ppm figures are referred to. It gives the coherent carrier rotation that accompanies the time-base warp; 0 warps the clock alone, with no carrier rotation -- a legitimate scene, not an unset field. Independent of doppler/doppler_rate."

[[module.wfm_compose.source.fields]]
name = "doppler_lifetime"
json = "doppler_lifetime"
json_omit = "default"
cli = "--doppler-lifetime"
metavar = "L"
help_section = "DOPPLER"
type = "int"
enum = "doppler_lifetime"
default = "per_instance"
doc = "How long this source's Doppler channel lives. per_instance: the channel dies with each `repeats` instance, so the geometry restarts -- the repeated-trial shape, which composes with a ranged doppler re-drawn per instance. persist: one continuous pass carries across the segment's gaps and repeat instances, keyed by (segment, source) position -- the only lifetime under which doppler_rate accumulates across a multi-burst scene. compose(), stream() and Plan.prepare() all honour both."

[[module.wfm_compose.source.fields]]
name = "modulation"
json = "modulation"
json_when = { type = "bits" }
cli = "--modulation"
metavar = "M"
help_section = "BITS"
type = "int"
enum = "bitmod"
default = "bpsk"
doc = "Symbol mapping of a bits pattern. none: the pattern shaped and output as-is (NRZ). bpsk: +/-1 symbols. qpsk: Gray-coded symbols from pairs of bits."

[[module.wfm_compose.source.fields]]
name = "pulse"
json = "pulse"
json_omit = "default"
cli = "--pulse"
metavar = "SHAPE"
help_section = "PULSE"
type = "int"
enum = "wfm_pulse"
default = "rect"
doc = "Pulse shape per symbol or chip, for pn/bpsk/qpsk/bits/symbols/dsss. rect: rectangular, no ISI filtering. rrc: root-raised cosine; see rrc_beta and rrc_span."

[[module.wfm_compose.source.fields]]
name = "rrc_beta"
json = "rrc_beta"
json_when = { pulse = "rrc" }
cli = "--rrc-beta"
metavar = "R"
help_section = "PULSE"
unit_interval = true
type = "double"
default = "0.35"
doc = "RRC roll-off factor, in (0, 1], when pulse=rrc."

[[module.wfm_compose.source.fields]]
name = "rrc_span"
json_schema = { minimum = 1 }
json = "rrc_span"
json_when = { pulse = "rrc" }
cli = "--rrc-span"
metavar = "N"
help_section = "PULSE"
type = "int"
default = "8"
doc = "RRC filter support in symbols when pulse=rrc, ONE-SIDED: the filter has 2*rrc_span*sps + 1 taps, unit energy (sum of h^2 = 1)."

[[module.wfm_compose.source.fields]]
name = "symbols"
cli = "--symbols-file"
metavar = "F"
help_section = "SYMBOLS"
type = "float _Complex*"
complex = true
doc = "For type=symbols: a complex constellation stream. Each element is the output point itself, oversampled by sps, cycled, and RRC-shaped with pulse=rrc, which generalises any modulation (pi/4-QPSK, QAM, ...)."

[[module.wfm_compose.source.fields]]
name = "acq_code"
json = "acq_code"
cli = "--acq-code"
metavar = "FIELD"
help_section = "DSSS_BURST"
field_reps = "acq_reps"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
# An object takes bits: a str is refused, naming field_bits() (owner,
# 2026-09-30). The coercion stays because without it jm refuses arrays.
coerce_str_fn = "dp_wfm_source_bits_refuse_text"
# gh-1184: the source carries a `wfm_seq_t`, so the owned array lives at
# `.bits`/`.len` inside it rather than at the default `acq_code`/`n_acq_code`.
c_ptr = "acq_code.bits"
c_len = "acq_code.len"
doc = "The preamble code, sent acq_reps times at the head of the frame (a Field's *REPS on the command line and in a scene) -- the coherent pull-in target BurstDespreader.set_acq and BurstDemod.set_preamble lock to. For type=dsss it is unmodulated chips ahead of the spread frame; for type=bits it is the head of the bit pattern. Setting it is what makes a source FRAMED."

[[module.wfm_compose.source.fields]]
name = "acq_reps"
type = "size_t"
default = "1"
doc = "Preamble repetitions: periods of acq_code before the sync word. On the command line and in a scene it is acq_code's *REPS."

[[module.wfm_compose.source.fields]]
name = "data_code"
json = "data_code"
cli = "--data-code"
metavar = "FIELD"
help_section = "DSSS_BURST"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
# An object takes bits: a str is refused, naming field_bits() (owner,
# 2026-09-30). The coercion stays because without it jm refuses arrays.
coerce_str_fn = "dp_wfm_source_bits_refuse_text"
# gh-1184: the source carries a `wfm_seq_t`, so the owned array lives at
# `.bits`/`.len` inside it rather than at the default `data_code`/`n_data_code`.
c_ptr = "data_code.bits"
c_len = "data_code.len"
doc = "For type=dsss: the payload spreading code, a second code distinct from acq_code. Every frame bit (sync, payload, crc) is XOR-spread across its full length, so len(data_code) is the spreading factor."

# RETIRED, not live (#1617): tombstones that exist only to be REFUSED by
# name, like `bits` below. A frame is a description (`frame=`); the common
# frame's sync word and CRC are fields and a stage OF that description, so a
# source no longer carries them. No cli and no json -- the CLI keeps --sync
# and --crc as wfmgen's own flags (they build the description before the
# source sees it) and a scene keeps its own RETIRED table -- so neither is a
# surface row. Python's sync= and crc= land here: ANY str is refused by the
# coercion hook (so crc="none" is refused too, not mistaken for the default),
# and a non-empty array by dp_wfm_source_error(), each with a sentence naming
# frame=.
[[module.wfm_compose.source.fields]]
name = "sync"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
coerce_str_fn = "dp_wfm_source_sync_refuse_text"
c_ptr = "retired_sync.bits"
c_len = "retired_sync.len"
doc = "RETIRED (doppler#1617): nothing reads it but the refusal. The frame-sync word is a field of the frame DESCRIPTION, so sync= is refused naming frame=; the CLI's --sync builds that description for you, and a scene refuses the \"sync\" key."

[[module.wfm_compose.source.fields]]
name = "crc"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
coerce_str_fn = "dp_wfm_source_crc_refuse_text"
c_ptr = "retired_crc.bits"
c_len = "retired_crc.len"
doc = "RETIRED (doppler#1617): nothing reads it but the refusal. A CRC is a stage of the frame DESCRIPTION, so crc= is refused naming frame=, whatever its value (crc=\"none\" included); the CLI's --crc builds that description for you, and a scene refuses the \"crc\" key."

[[module.wfm_compose.source.fields]]
name = "symbol_rate"
json_schema = { exclusiveMinimum = 0 }
json = "symbol_rate"
json_when = { type = "dsss" }
json_omit = "default"
cli = "--symbol-rate"
metavar = "HZ"
help_section = "DSSS_CONT"
type = "double"
default = "0.0"
doc = "For type=dsss: > 0 selects CONTINUOUS asynchronous mode. The spreading code repeats endlessly and data rides on it at this symbol rate (Hz), independent of the code-epoch rate (chips/symbol = fs/sps/symbol_rate, non-integer). No preamble/sync/CRC frame; data comes from the payload when supplied, else a seeded PN a receiver regenerates. Absent/0 = burst."

[[module.wfm_compose.source.fields]]
name = "dsss_code_only"
# #1619 F6a: code-only DSSS has its own flag. `--data` is the Field grammar
# and nothing else, and `none` is not a source (plan §6), so the old
# `--data none` and the scene's "data":"none" are refused naming this.
json = "code_only"
cli = "--code-only"
help_section = "DSSS_CONT"
json_type = "bool"
json_omit = "default"
type = "int"
default = "0"
doc = "Continuous dsss data source: 1 = code-only (the pure spreading code, no data modulation); 0 = data-modulated (the payload when supplied, else the seeded PN). Ignored for burst dsss and non-dsss types."

# just-makeit#1711: an owned-pointer field. The source holds its own COPY of
# the description (copy_fn), so neither a FrameDesc nor the composer need
# outlive the other. An object takes a description, never text: parse_fn
# refuses every str with one reason (parse_why, just-makeit#1735). The
# composer's JSON is delegated to wfm_json.c, which reads and writes
# "frame" itself, so the refusal never reaches a record. frame= is an
# input: jm still renders a getter (format_fn, the description's JSON)
# until just-makeit#1753 allows a write-only field (doppler#1694); read it
# from the record instead.
[[module.wfm_compose.source.fields]]
name = "frame"
object = "frame.FrameDesc"
# A surface row whose value each face reads with its own code: --frame FILE
# (wfmgen), the scene's "frame" object (wfm_json.c), the owned pointer
# (Python). The row is what help, the schema and the payload exclusion
# derive from.
surface = "bespoke"
cli = "--frame"
metavar = "FILE"
help_section = "CODED"
json = "frame"
copy_fn = "dp_wfm_frame_copy"
free_fn = "dp_wfm_frame_free"
parse_fn = "dp_wfm_frame_refuse_text"
parse_why = true
format_fn = "dp_wfm_frame_to_json"
doc = "A frame DESCRIPTION, the whole frame: fields in wire order, and stages that each name the span they cover (crc16, rs, randomise, interleave, conv, or a kind of your own). It is the only way a source says anything but the common frame: a coding stage, a field of the caller's own bits at a position of their choosing, a stage covering a span they name. `wfmgen --frame FILE`, a scene's `frame` key and Python's `frame=` (a FrameDesc or a Frame) all land here. When it is set it IS the frame, and an unspread acq_code beside it is refused. NULL means the common frame, `[preamble x reps | data]`, which `dp_wfm_frame_fixed()` builds from acq_code and the data source; a sync word or a CRC is a field or a stage of a description, never a flat field. A C caller's description is borrowed, exactly as `wfm_seq_t` is borrowed elsewhere here, so it must outlive the source. The composer and a Python source hold their own copy (`dp_wfm_frame_copy()`), so a later change to the FrameDesc does not reach them. On the Python face `frame=` is an input: read it back from the composer's JSON (its getter is jm's, pending removal: doppler#1694). KERNELS stay in C by design. A description names a stage's KIND; the code that runs it is a `wfm_frame_ops_t` entry, and a caller adding a genuinely new transform (convolutional interleaving, say) writes that kernel in C and hands it to `dp_wfm_frame_assemble` directly."

# #1619 F6a: a frame's payload drawn from a data source (wfm/wfm_data.h).
# ONE exclusion declares data against data_from_file; that row is
# SURFACE-ONLY (its `row` below), because a path has no jm field type and
# Python deliberately has no file face (payload-data-source.md section 4.9),
# so it is declared here, beside the field it excludes, rather than as a jm
# field that would grow a Python kwarg. jm does not read inside `exclusive`,
# so the row costs no jm diagnostic.
#
# RETIRED, not live (#1718): a tombstone that exists only to be REFUSED by
# name. No cli and no json -- the CLI and a scene keep their own RETIRED
# tables -- so it is no surface row; Python's bits= / payload= / pattern=
# land here and dp_wfm_source_error() refuses them with one sentence,
# dp_wfm_why_retired_bits, which create_why carries to Python.
[[module.wfm_compose.source.fields]]
name = "bits"
type = "uint8_t*"
bytes = true
aliases = ["pattern", "payload"]
coerce = "bit_pattern"
coerce_str_fn = "dp_wfm_source_bits_refuse_text"
c_ptr = "retired_bits.bits"
c_len = "retired_bits.len"
doc = "RETIRED (doppler#1718): nothing reads it but the refusal. A payload is drawn from a data source, so bits=, and its aliases payload= and pattern=, are refused naming data=; the CLI and a scene refuse --bits and \"payload\" the same way."

[[module.wfm_compose.source.fields]]
name = "data"
json = "data"
cli = "--data"
metavar = "FIELD"
help_section = "BITS"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
coerce_str_fn = "dp_wfm_source_bits_refuse_text"
exclusive = [
  { with = "data_from_file", why = "a payload has one data source", row = { member = "data_from_file", cli = "--data-from-file", json = "data_from_file", metavar = "PATH", help_section = "BITS" } },
]
c_ptr = "data.bits"
c_len = "data.len"
doc = "A frame's payload drawn from a data source: a Field on the command line and in a scene, a bit array in Python. The source is split into data_len-bit frames, one chunk per frame, and its last chunk is padded from fill. For type=bits, bpsk/qpsk/pn framed, a dsss burst (one burst per frame), and continuous dsss (one bit per data symbol, no frame); not with data_from_file."

[[module.wfm_compose.source.fields]]
name = "data_len"
json = "data_len"
cli = "--data-len"
metavar = "BITS"
help_section = "BITS"
json_omit = "default"
type = "size_t"
default = "0"
doc = "Bits of the data source per frame: the data:LEN field of the common frame (preamble x reps, sync, data:LEN, crc). 0 takes a finite source whole, as one frame. A carried frame names its own data field, and this is then 0 or that field's LEN. Continuous dsss has no frame, and refuses it."

[[module.wfm_compose.source.fields]]
name = "fill"
json = "fill"
cli = "--fill"
metavar = "FIELD"
help_section = "BITS"
type = "uint8_t*"
bytes = true
coerce = "bit_pattern"
coerce_str_fn = "dp_wfm_source_bits_refuse_text"
c_ptr = "fill.bits"
c_len = "fill.len"
doc = "The bits that pad a data source's last frame when it does not divide into data_len-bit frames, tiled from their first bit; stdin on a framed source always needs them. Without them such a source is refused before the first sample. A Field on the command line and in a scene, a bit array in Python. Continuous dsss has no frame to pad, and refuses it."

# The per-frame code-only window (doppler#1294): the C synth's
# dp_wfm_synth_set_dsss_window, as two source fields so that every face
# reaches it -- two scalars, as the setter takes two, and as the CLI and a
# scene spell it. Appended after `fill`, not beside `dsss_code_only`, so that
# every source field keeps its position; the segment's own fields, which
# follow the source's (Synth's fs, Segment's fs and num_samples), move two
# places, as they did when `fill` was appended.
[[module.wfm_compose.source.fields]]
name = "code_only_symbols"
json = "code_only_symbols"
json_when = { type = "dsss" }
json_omit = "default"
cli = "--code-only-symbols"
metavar = "N"
help_section = "DSSS_CONT"
type = "size_t"
default = "0"
doc = "Continuous dsss: pure-code symbols opening each frame of frame_symbols symbols. The data pauses through them and runs on across frames, so a searcher can integrate coherently over the window; once a payload ends, no window is sent. At most frame_symbols, and fewer when a data source is set; 0 with frame_symbols 0 = no window."

[[module.wfm_compose.source.fields]]
name = "frame_symbols"
json = "frame_symbols"
json_when = { type = "dsss" }
json_omit = "default"
cli = "--frame-symbols"
metavar = "N"
help_section = "DSSS_CONT"
type = "size_t"
default = "0"
doc = "Continuous dsss: the frame, in symbols, that code_only_symbols opens; give it with code_only_symbols, or both 0 for no window. The frame runs on the stream's own symbol clock, so its edges land at any chip phase."

[module.wfm_compose.source.generates]
generator = "wfm_synth"
bridge_fn = "dp_wfm_source_to_synth"
# gh-1307: a refused Synth raises dp_wfm_source_error()'s sentence.
bridge_error_fn = "dp_wfm_source_to_synth_error"
# The operator, on the public type too (just-makeit#2259 part 2).
methods = ["prod"]

[module.wfm_compose.segment]
type_name = "Segment"
struct = "wfm_segment_t"
sources = "multi"
flat_sources = true
# Per-repeat (lo, hi) uniform draws (see source.ranged) — e.g. off_samples as
# arrival jitter that shifts the next burst's code phase.
ranged = [
    { name = "num_samples", flag = "WFM_RANGE_NUM_SAMPLES" },
    { name = "off_samples", flag = "WFM_RANGE_OFF_SAMPLES" },
    { name = "delay_samples", flag = "WFM_RANGE_DELAY_SAMPLES" },
]

[[module.wfm_compose.segment.fields]]
name = "fs"
json_schema = { exclusiveMinimum = 0.0 }
json = "fs"
cli = "--fs"
metavar = "HZ"
help_section = "SIGNAL"
type = "double"
default = "1.0"
doc = "Sample rate in Hz, one per segment and shared by all its sources. At the default 1.0 every frequency is normalised (cycles per sample); state it whenever a scene is in real Hz."

[[module.wfm_compose.segment.fields]]
name = "num_samples"
json = "num_samples"
cli = "--count"
metavar = "N"
help_section = "SIGNAL"
type = "size_t"
default = "0"
doc = "Segment on-time in samples, before the trailing gap: 0 derives it from the sources, or 1024 when they set none. A finite data source sets its frames, a lone dsss burst one burst, and a stream runs to its end. A count beside a finite data source or a lone dsss burst is refused, since they set the length; give repeats for more."

[[module.wfm_compose.segment.fields]]
name = "off_samples"
json = "off_samples"
cli = "--off"
metavar = "N"
help_section = "SIGNAL"
type = "size_t"
default = "0"
doc = "Trailing gap after the on-time, in samples. It carries the noise floor or hard zeros, per gap_noise."

[[module.wfm_compose.segment.fields]]
name = "repeats"
json_schema = { minimum = 1 }
json = "repeats"
json_omit = "default"
cli = "--repeats"
metavar = "N"
help_section = "SIGNAL"
type = "size_t"
default = "1"
doc = "Play the segment this many times back-to-back (each instance = delay + on-time + trailing gap) before advancing. Ranged fields re-draw and the AWGN is fresh per instance; the signal (codes, payload, PN phase) stays fixed. 0 and 1 both mean one instance."

[[module.wfm_compose.segment.fields]]
name = "delay_samples"
json = "delay_samples"
json_omit = "default"
cli = "--delay"
metavar = "N"
help_section = "SIGNAL"
type = "size_t"
default = "0"
doc = "Leading gap before the on-time, in samples: the burst arrives after this delay, and the gap carries the noise floor like off_samples. Ranged like off_samples and re-drawn per repeats instance, so a (lo, hi) delay is per-burst arrival jitter. Use off_samples for inter-burst spacing, delay_samples for arrival jitter."

[[module.wfm_compose.segment.fields]]
name = "gap_noise"
json = "gap_noise"
json_omit = "default"
cli = "--gap-noise"
metavar = "M"
help_section = "SIGNAL"
type = "int"
enum = "gap_noise"
default = "auto"
doc = "Gap policy for this segment's delay and trailing gap. auto: gaps carry the segment's noise floor -- the sources' AWGN keeps running while the signal stops (clean scenes still get exact-zero gaps). off: gaps are hard zeros."

[module.wfm_compose.timeline]
type_name = "Timeline"
loop = ["once", "repeat", "continuous"]

[module.wfm_compose.oo]
factories = ["tone", "noise", "pn", "bpsk", "qpsk", "chirp", "bits"]
emit = "ctypes"
discriminant = "type"
composer_type_name = "Composer"

[module.wfm_compose.composer]
stream = true
to_dict = true

[module.wfm_compose.composer.realtime]
clock_create = "dp_sample_clock_create"
pace = "dp_sample_clock_pace"
destroy = "dp_sample_clock_destroy"
header = "doppler/timing/timing_core.h"

[module.wfm_compose.json]
enabled = true
# doppler#1614: both readers take a trailing `const char **why`, so a refused
# scene (a retired key, a frame that cannot assemble) raises the C's sentence
# naming it instead of "<fn> failed" (just-makeit#1706).
from_json_fn = "dp_wfm_compose_from_json_why"
from_json_why = true
from_file_fn = "dp_wfm_compose_from_file_why"
from_file_why = true
to_json_fn = "dp_wfm_spec_to_json"
# The trailing literals are spliced after (segs, n, repeat, continuous), so the
# order here IS the C signature's. `self->state` is in scope in jm's generated
# to_json, which is what lets the composer stay the SSOT for seed_advance --
# without it the Python face emitted a spec that replayed a different waveform
# (doppler#978). headroom is a writer gain, not composer state, so it is still
# the literal 0.0: a Python Composer has none.
to_json_trailing = ["dp_wfm_compose_seed_advance (self->state)", "0.0"]

# The drawn per-instance values, as JSON. Declared as a serializer because
# that is jm's shape for "call a C function with this composer's segments and
# hand back a string" -- the same mechanism to_sigmf uses, so the two read the
# same rows through dp_wfm_compose_draws() and cannot disagree (doppler#1112).
[[module.wfm_compose.serializers]]
# Private on purpose: the public way to read a scene's draws is
# doppler.wfm.draws(), which parses these rows into records. Naming it with a
# leading underscore keeps one public surface rather than two, and keeps a
# method jm cannot yet give a docstring out of the public API meter.
name = "_draws_json"
fn = "dp_wfm_draws_json"
returns = "str"
header = "doppler/wfm/wfm_compose.h"

[[module.wfm_compose.serializers]]
name = "to_sigmf"
fn = "dp_wfm_sigmf_meta_json"
returns = "str"
header = "doppler/wfm_writer/wfm_writer_core.h"

[[module.wfm_compose.serializers.params]]
name = "sample_type"
type = "int"
enum = "stype"
default = "cf32"

[[module.wfm_compose.serializers.params]]
name = "endian"
type = "int"
enum = "endian"
default = "le"

# Left OPTIONAL where Writer and write_blue_header require it, because this
# is the one caller that does not need to be asked: a Composer already HOLDS
# a rate per segment, and this very document uses it — the annotation edges
# are ±fs/(2*sps) from `s->fs`. So `dp_wfm_sigmf_meta_json` now DERIVES an
# unstated rate from the segments (when they agree), and requiring the
# argument would only make the caller restate what the scene already knows,
# while still permitting a stated rate that contradicts the edges beside it.
# An explicit fs overrides, for rendering the scene at a resampled rate.
[[module.wfm_compose.serializers.params]]
name = "fs"
type = "double"
default = "0.0"

[[module.wfm_compose.serializers.params]]
name = "fc"
type = "double"
default = "0.0"

# Capture start, UNIX seconds → `captures[0]."core:datetime"` (extended ISO
# 8601). Unset by default, and omitted from the document when unset.
[[module.wfm_compose.serializers.params]]
name = "t0"
type = "double"
default = "0.0"
