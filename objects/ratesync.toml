[ratesync]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "RateSync"
# link=true is NOT transitive (see docs/dev, the #225 mechanic): it puts
# <name>_core on this module's link line and nothing else, so a composed
# object has to name every core its own dependency drags in. RateConverter is
# a cascade of five.
depends_on = [
  { name = "RateConverter", link = true },
  { name = "resamp", link = true },
  { name = "hbdecim", link = true },
  { name = "cic", link = true },
  { name = "fir", link = true },
  { name = "resample", link = true },
  { name = "loop_filter", link = true },
  { name = "lockdet", link = true },
  { name = "symsync", link = true },
  { name = "dp_tlm", link = true },
]
serializable = "true"
# A NULL create here means a parameter was out of range, not that the machine
# ran out of memory (gh-482). Say so.
create_error = "ValueError"
create_error_message = "RateSync: invalid parameter (need sps >= m, 0 <= beta <= 1, span >= 1, m even in [2, 8], num_phases a power of two >= 2, bn >= 0, zeta > 0)"

[[ratesync.init_params]]
name = "sps"
type = "double"
default = "4.0"
doc = "Nominal samples per symbol. Any double >= `m` -- 17.33389 is as valid as 4, because the terminal stage's accumulator is a double and the loop only has to steer the strobe. That is the real-world case whenever the ADC clock is free-running against the symbol clock."

[[ratesync.init_params]]
name = "pulse"
type = "string_enum:iandd,rrc"
default = "rrc"
doc = "Matched-filter pulse shape: \"rrc\" (root-raised cosine, roll-off `beta`) or \"iandd\" (unit rectangle one symbol wide -- the matched filter for a rectangular symbol, and exactly what an integrate-and-dump computes). The rectangle needs far fewer taps, so an NRZ link's matched filter is cheaper."

[[ratesync.init_params]]
name = "beta"
type = "double"
default = "0.35"

[[ratesync.init_params]]
name = "span"
type = "size_t"
default = "8"

[[ratesync.init_params]]
name = "m"
type = "size_t"
default = "2"
doc = "Terminal outputs per symbol: even, 2 <= m <= 8. Gardner needs a transition gate half a symbol from the on-time strobe, which is why m must be even and at least 2. The oversampled stream is a by-product of the same dot products, not an extra cost. Use m >= 4 with pulse=\"iandd\": the rectangle is one symbol wide, so at m=2 its matched filter is a 2-tap sum and the eye statistic barely opens (measured lock_stat -0.34 at m=2 against +0.95 at m=4 on the same NRZ stream). The RRC spans many symbols and is unaffected."

[[ratesync.init_params]]
name = "num_phases"
type = "size_t"
default = "1024"
doc = "Matched-filter arms; a power of two. Sets the fractional-timing resolution to 1/num_phases of an output period."

[[ratesync.init_params]]
name = "bn"
type = "double"
default = "0.01"

[[ratesync.init_params]]
name = "zeta"
type = "double"
default = "0.707"

[[ratesync.init_params]]
name = "ted"
type = "string_enum:gardner,dttl"
default = "gardner"
doc = "Timing-error detector: \"gardner\" (blind, works for any constellation) or \"dttl\" (decision-directed sign-sign Data Transition Tracking Loop; lower self-noise near lock but degrades faster at low SNR. BPSK/QPSK only -- invalid for 8PSK/QAM)."

[[ratesync.methods]]
name = "steps"
doc = "Recover symbols from an oversampled cf32 baseband block. The owned RateConverter's terminal stage IS the matched filter, and the polyphase arm its accumulator selects IS the fractional timing delay, so one dot product does the rate conversion, the matched filtering and the interpolation. Every m-th output is an on-time strobe and the output m/2 back is the transition gate; a Gardner or DTTL detector drives a PI loop that steers the terminal stage's control port. State carries across calls, so contiguous blocks give the same symbols as one large block."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

# Telemetry attach (mirrors objects/symsync.toml): registers "<prefix>.e" /
# "<prefix>.ctrl" / "<prefix>.rate" / "<prefix>.lock" / "<prefix>.locked",
# emitted once per recovered symbol.
[[ratesync.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", header = "dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[ratesync.methods]]
name = "configure"
doc = "Recompute the loop gains for a new (bn, zeta); preserve the timing estimate."
arg_type = "void"
return_type = "void"
params = [{ name = "bn", type = "double" }, { name = "zeta", type = "double" }]

[[ratesync.methods]]
name = "configure_lock_raw"
doc = "Direct control of the lock detector's geometry: an explicit non-coherent block size (avgs), a split declare/drop threshold pair on lock_stat (level hysteresis), and both verify counts (time hysteresis) independently. Re-tuning clears the in-flight block sum and drops the lock so the next decision uses only looks gathered under the new config. The (pfa, pd) sizing entry point symsync exposes is deliberately not mirrored here: its constants were calibrated against symsync's own geometry by Monte Carlo, and re-exposing the formula for a different front end without repeating that validation would assert a calibration nobody measured."
arg_type = "void"
return_type = "void"
params = [
  { name = "avgs", type = "size_t" },
  { name = "up_thresh", type = "double" },
  { name = "down_thresh", type = "double" },
  { name = "n_up", type = "uint32_t" },
  { name = "n_down", type = "uint32_t" },
]

[[ratesync.methods]]
name = "reset"
doc = "Re-seed the timing loop, the cascade's filter memories, the strobe ring and the prime countdown."
arg_type = "void"
return_type = "void"

[[ratesync.properties]]
name = "bn"
type = "double"
writable = true

[[ratesync.properties]]
name = "timing_error"
type = "double"

[[ratesync.properties]]
name = "rate"
type = "double"
doc = "Smoothed tracked samples per symbol. Departs from the nominal `sps` by exactly the sample-clock offset being tracked, so it is the estimator a rate-disciplining caller reads."

[[ratesync.properties]]
name = "ctrl"
type = "double"
doc = "Current per-input rate deviation steering the terminal stage's accumulator."

[[ratesync.properties]]
name = "lock_stat"
type = "double"
doc = "Last block-averaged lock statistic: mean(2*(|on-time|^2-|mid|^2)/(|on-time|^2+|mid|^2)) over the configured avgs looks. This, not an error-vector magnitude, is the honest lock indicator -- a single cycle slip during acquisition drags a windowed EVM by 20 dB while the eye stays wide open at +0.75."

[[ratesync.properties]]
name = "locked"
type = "bool"
doc = "Current timing-lock decision: True after the verify count of consecutive above-threshold decisions, False again after the drop count of consecutive below-threshold ones."

[[ratesync.properties]]
name = "clipped"
type = "bool"
doc = "True if the cascade's CIC stage has clipped its input since the last reset(). A CIC bounds its input to +-1.0 and clips silently past that, which no timing metric reveals -- an overdriven front end degrades EVM by 25 dB with a perfectly healthy lock. Always False when the plan contains no CIC stage."
