[[correlator.views.properties]]
name = "max_peaks"
type = "size_t"
field = true
doc = "The peak list's capacity per dwell (1 = the classic gated maximum); set with set_max_peaks()."

[[correlator.views.properties]]
name = "carrier_freq_hz"
type = "double"
doc = "RF carrier the Doppler is physically coupled to, Hz (0.0 = uncoupled); set with set_carrier_freq_hz()."
expr = "(self->handle->search->carrier_freq_hz)"

[[correlator.views.properties]]
name = "code_bins"
type = "size_t"
doc = "One code period in samples, sample_rate * sf / chip_rate: the length of every forward transform and of a raw epoch."
expr = "(self->handle->search->code_bins)"

[[correlator.views.properties]]
name = "lag_bins"
type = "size_t"
doc = "Code-phase columns of the surface. Equal to code_bins unless code_bins is not 7-smooth; then the correlation is read on the next power of two, an exact interpolation that keeps the inverse transforms fast. Column c is a lag of c * code_bins / lag_bins samples; surface_chip_phase() gives each column in chips."
expr = "(self->handle->search->lag_bins)"

[[correlator.views.properties]]
name = "doppler_bins"
type = "size_t"
expr = "(self->handle->search->window_bins * self->handle->search->coherent_bins)"
doc = "Native Doppler bins this engine searches: the window-tile count times the block-coherent depth inside each tile (`coherent_bins`), one uniform grid of `doppler_res_hz` over the tiled span in FFT-bin order -- what a hit's `doppler_bin` indexes."

[[correlator.views.properties]]
name = "coherent_bins"
type = "size_t"
doc = "The block-coherent depth D inside every window tile (docs/design/acq-surface.md §4): epochs per block and Doppler rows per tile. 1 without a code-only window."
expr = "(self->handle->search->coherent_bins)"

[[correlator.views.properties]]
name = "sf"
type = "size_t"
doc = "Chips per PN segment, inferred from len(code)."
expr = "(self->handle->search->sf)"

[[correlator.views.properties]]
name = "n_noncoh"
type = "size_t"
doc = "Non-coherent looks per detection (1 = pure coherent)."
expr = "(self->handle->search->n_noncoh)"

[[correlator.views.properties]]
name = "ring_cap"
type = "size_t"
field = true
doc = "Input ring capacity in complex samples."

[[correlator.views.properties]]
name = "noise_lo"
type = "size_t"
field = true
doc = "First CFAR reference bin (inclusive)."

[[correlator.views.properties]]
name = "noise_hi"
type = "size_t"
field = true
doc = "Last CFAR reference bin (inclusive)."

[[correlator.views.properties]]
name = "threshold"
type = "float"
field = true
doc = "CFAR gate on the test statistic (coherent path)."

[[correlator.views.properties]]
name = "eta"
type = "float"
doc = "Raw per-cell Rayleigh amplitude threshold."
expr = "(self->handle->search->eta)"

[[correlator.views.properties]]
name = "eta_nc"
type = "float"
doc = "Non-coherent CFAR threshold (order-N_nc Marcum)."
expr = "(self->handle->search->eta_nc)"

[[correlator.views.properties]]
name = "pfa_cell"
type = "double"
doc = "Šidák per-cell false-alarm probability over the searched cells."
expr = "(self->handle->search->pfa_cell)"

[[correlator.views.properties]]
name = "pd_predicted"
type = "double"
doc = "Predicted Pd at cn0_dbhz and the chosen grid: the average Pd over the straddle priors (slow-time scalloping, intra-segment rotation, code-phase sample offset - quadrature over uniform priors), matching what the Monte-Carlo characterization measures rather than the on-grid best case."
expr = "(self->handle->search->pd_predicted)"

[[correlator.views.properties]]
name = "straddle_loss"
type = "double"
doc = "Mean amplitude derating of the correlation peak from grid straddle (slow-time Doppler scalloping x intra-segment rotation x code-phase sample offset, each averaged over a uniform prior) - a diagnostic summary; 20*log10(straddle_loss) is the loss in dB. Sizing and pd_predicted average Pd itself over the priors (Pd at this mean amplitude would overstate the mean Pd)."
expr = "(self->handle->search->straddle_loss)"

[[correlator.views.properties]]
name = "fs"
type = "double"
doc = "Sample rate (Hz) the engine searches at: chip_rate * code_bins / sf."
expr = "(self->handle->search->fs)"

[[correlator.views.properties]]
name = "chip_rate"
type = "double"
doc = "Chip rate (Hz)."
expr = "(self->handle->search->chip_rate)"

[[correlator.views.properties]]
name = "cn0_dbhz"
type = "double"
doc = "Carrier-to-noise density used to size the search (dB-Hz)."
expr = "(self->handle->search->cn0_dbhz)"

[[correlator.views.properties]]
name = "doppler_span_hz"
type = "double"
doc = "Native unambiguous Doppler half-range = +/- chip_rate/(2*sf) Hz."
expr = "(self->handle->search->doppler_span_hz)"

[[correlator.views.properties]]
name = "doppler_res_hz"
type = "double"
doc = "Doppler bin width = chip_rate/(sf*doppler_bins) Hz."
expr = "(self->handle->search->doppler_res_hz)"

[[correlator.views.properties]]
name = "pd"
type = "double"
doc = "Target detection probability."
expr = "(self->handle->search->pd)"

[[correlator.views.properties]]
name = "underpowered"
type = "bool"
doc = "True when pd_predicted < pd -- the search cannot meet the target pd at this cn0_dbhz and geometry. The engine still builds a best-effort grid rather than failing; because C cannot raise a Python warning from a successful create, construction also emits a UserWarning in this case."
expr = "(self->handle->search->underpowered)"

[[correlator.views.properties]]
name = "symbol_rate"
type = "double"
doc = "Continuous data-symbol rate (Hz) this engine was built with -- diagnostic only, doesn't feed sizing (this engine never coherently combines regardless)."
expr = "(self->handle->search->symbol_rate)"

[[correlator.views.properties]]
name = "epochs_per_symbol"
type = "double"
doc = "(chip_rate/sf)/symbol_rate -- code epochs per data symbol; 0 when symbol_rate is 0."
expr = "(self->handle->search->epochs_per_symbol)"

[[correlator.views.properties]]
name = "threads"
type = "int"
doc = "Workers the searcher fans its tiles across, the calling thread included (docs/design/acq-surface.md §13); 1 = serial. Set with set_threads(); a continuous engine with more than one tile starts at the machine's online core count."
expr = "(self->handle->search->threads)"

[[correlator.views.properties]]
name = "keep_surface"
type = "int"
writable = true
doc = "1 keeps every decided dwell's surface for `surface()` (normalised into the gate's units at each decision); 0 (the default) costs nothing. `set_surface_sink()` in C sets it."
expr = "(self->handle->search->keep_surface)"

[[correlator.views.properties]]
name = "surface_rows"
type = "size_t"
expr = "(self->handle->search->n_surf / self->handle->search->lag_bins)"
doc = "Rows of the surface `surface()` returns: the Doppler axis in surface units (tiles x interpolated slow-time rows); its columns are `lag_bins`."

[[correlator.views.properties]]
name = "surface_at"
type = "size_t"
doc = "`samples_consumed` of the dwell whose surface `surface()` returns (0 until one has been captured)."
expr = "(self->handle->search->surface_at)"

[[correlator.views.properties]]
name = "n_peaks"
type = "size_t"
field = true
doc = "Picks in the last decided dwell, held twins included."

[[correlator.views.properties]]
name = "n_held"
type = "size_t"
doc = "Picks of the last decided dwell held as same-code-phase twins rather than listed (docs/design/async-dsss-receiver.md §7.1)."
expr = "(self->handle->search->n_held)"

[[correlator.views.properties]]
name = "peak_conc"
type = "float"
doc = "Concentration of the last dwell's strongest peak: the power of its main lobe (its row and one either side, the exclusion zone's width) over the total power of its code-phase column across every Doppler row and tile. Near 1 for a clean single emitter, even one straddling two tiles; about 0.5 when a data transition splits it into twins two or more tiles away; lower when a coherent block straddles data (docs/design/async-dsss-receiver.md §2.4)."
expr = "(self->handle->search->peak_conc)"
