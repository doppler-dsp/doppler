>>> import numpy as np
>>> ref = np.zeros(4, dtype=np.complex64); ref[0] = 1.0
>>> det = CorrDetector(ref=ref, noise_lo=1)
>>> det.push(np.ones(2, dtype=np.complex64))
[]
>>> det.reset()
>>> len(det.push(np.ones(4, dtype=np.complex64)))
1
>>> det.count, det.last_corr is None
(0, False)
>>> det.reset()
>>> det.count, det.last_corr is None
(0, True)
'''

