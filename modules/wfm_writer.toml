[module.wfm_writer]
objects = ["wfm_writer"]
package = "wfm"

# BLUE type-1000 HCB header writer, retiring the last hand binding (was
# compose.py's write_blue_header + its 3rd copy of the stype/endian tables).
# gh-353 path/enum args + gh-363 check_return — jm built these for exactly this
# "path + string-enum header writer" shape; enum:stype/endian resolve against
# the [[enum]] SSOT, and the int status raises on a failed write. Lives here,
# not on the base wfm module, because wfm_writer_core (with its keyword/cJSON
# deps) is already linked on this module.
[[module.wfm_writer.functions]]
name = "write_blue_header"
doc = "Write a standalone BLUE type-1000 HCB header (the detached .hdr): 512 bytes carrying the BLUE magic, byte order, data_size (total x bytes-per-sample), the type-1000 tag and xdelta = 1/fs. Pair it with a detached .det body of raw interleaved I/Q. Raises on a failed write."
return_type = "int"
check_return = true
[[module.wfm_writer.functions.params]]
name = "path"
type = "path"
# REQUIRED, exactly as on Writer, and for the stronger version of the same
# reason: xdelta = 1/fs is most of what a BLUE header IS. A detached pair
# written with a forgotten fs is a real capture on disk carrying no rate
# anywhere, and nobody was ever asked for one. Omitting the key removed the
# FABRICATION (no more invented 1 MHz); it did not make anyone answer, and
# silence stayed indistinguishable from "unknown".
#
# fs is second, mirroring Writer(path, fs, ...) — one rule across every entry
# point that writes a rate. jm generates this function's call positionally, so
# the position also fixes the injected prototype and the hand-written shim in
# write_blue_header.c; the FILE-based kernel (dp_wfm_blue_write_hcb) is untouched,
# and the shim has no other caller.
#
# What makes it mandatory is having NO `default`, and nothing else. A module
# FUNCTION does not auto-order its params the way an object's init_params do
# (jm errors unless the undefaulted ones come first), and `required` is an
# init_param key that jm does not read here at all — it sat on this param
# doing nothing until jm 0.50.0's gh-816 check said so out loud.
# Pass fs=0.0 to state "not known" — that still writes xdelta 0.
[[module.wfm_writer.functions.params]]
name = "fs"
type = "double"
[[module.wfm_writer.functions.params]]
name = "sample_type"
type = "int"
enum = "stype"
default = "cf32"
[[module.wfm_writer.functions.params]]
name = "endian"
type = "int"
enum = "endian"
default = "le"
[[module.wfm_writer.functions.params]]
name = "fc"
type = "double"
default = "0.0"
[[module.wfm_writer.functions.params]]
name = "data_start"
type = "double"
default = "0.0"
[[module.wfm_writer.functions.params]]
name = "total"
type = "size_t"
default = "0"
[[module.wfm_writer.functions.params]]
name = "detached"
type = "int"
default = "1"
# Capture start, UNIX seconds → the header's J1950 timecode. Unset by
# default; see objects/wfm_writer.toml's t0 for why this one is optional
# where fs is not.
[[module.wfm_writer.functions.params]]
name = "t0"
type = "double"
default = "0.0"
