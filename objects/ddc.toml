[ddc]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "DDC"
serializable = "true"
# A NULL create means a parameter was out of range, not that the machine ran
# out of memory (gh-482).
create_error = "ValueError"
create_error_message = "DDC: invalid parameter (need rate > 0, 0 <= beta <= 1, span >= 1, pulse_sps > 0, num_phases a power of two >= 2)"
depends_on = [{ name = "lo", link = true }, { name = "RateConverter", link = true }, { name = "resamp", link = true }, { name = "hbdecim", link = true }, { name = "hbdecim_r2c", link = true }, { name = "cic", link = true }, { name = "fir", link = true }, { name = "resample", link = true }]

[[ddc.init_params]]
name = "norm_freq"
type = "double"
default = "0.0"

[[ddc.init_params]]
name = "rate"
type = "double"
default = "0.25"

# The matched FLAVOR (gh-504): same ddc_state_t, same methods, one different
# constructor. A pulse on the cascade's terminal stage makes the chain mix,
# decimate and matched-filter in the same dot products, and makes that stage's
# polyphase arm the fractional timing delay `rate_ctrl` steers -- so the two
# control ports become a carrier port and a timing port. Droop compensation is
# unconditional here (six taps per arm, worth 28 dB).
[[ddc.views]]
class_name = "MatchedDDC"
create_fn = "ddc_create_matched"
init_params = [
  { name = "norm_freq", type = "double", default = "0.0" },
  { name = "rate", type = "double", default = "0.25" },
  { name = "pulse", type = "string_enum:iandd,rrc", default = "rrc" },
  { name = "beta", type = "double", default = "0.35" },
  { name = "span", type = "size_t", default = "8" },
  { name = "pulse_sps", type = "double", default = "2.0" },
  { name = "num_phases", type = "size_t", default = "1024" },
]
warnings = [
  { after = "__init__", condition = "narrow_pulse", category = "UserWarning", message = "pulse=\"iandd\" with pulse_sps < 4: the rectangle is one symbol wide, so its matched filter is a 2-3 tap sum here and barely opens the eye (measured on the timing loop this feeds: lock statistic -0.34 at 2 samples/symbol against +0.95 at 4). Use pulse_sps >= 4, or pulse=\"rrc\"." },
]

[[ddc.methods]]
name = "execute"
doc = "Mix input block with LO, then rate-convert."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{name = "x", type = "float _Complex[]"}]

[[ddc.methods]]
name = "execute_ctrl"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [
  { name = "x", type = "float _Complex[]" },
  { name = "rate_ctrl", type = "double" },
  { name = "freq_ctrl", type = "double" },
]

[[ddc.methods]]
name = "execute_ctrl_push"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
params = [
  { name = "x", type = "float _Complex" },
  { name = "rate_ctrl", type = "double" },
  { name = "freq_ctrl", type = "double" },
]

[[ddc.methods]]
name = "reset"
doc = "Zero LO phase and filter history."
arg_type = "void"
return_type = "void"

[[ddc.properties]]
name = "norm_freq"
type = "double"
writable = true

[[ddc.properties]]
name = "rate"
type = "double"

[[ddc.properties]]
name = "clipped"
type = "bool"

# Declared so the flag the matched flavor's UserWarning fires on is also
# readable (and so jm knows the hand-added struct field exists). Always False
# on the plain flavor and for pulse="rrc".
[[ddc.properties]]
name = "narrow_pulse"
type = "bool"
