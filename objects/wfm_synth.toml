[wfm_synth]
arg_type = "void"
return_type = "float _Complex"
mutable = "true"
class_name = "_SynthEngine"
depends_on = [{ name = "lo", link = true }, { name = "awgn", link = true }, "pn", { name = "fir", link = true }, { name = "resamp", link = true }, "wfm_dsp", { name = "wfm_frame", link = true }, { name = "cvt", link = true }, { name = "gold", link = true }]
impl = """
float _Complex sym;
if (state->shaper) {
    /* Polyphase RRC pulse shaping (power-of-two sps). The single shaping
     * kernel dp_wfm_synth_steps() also drives, one output at a time, so step()
     * and the block path agree bit-for-bit (the resampler is block-boundary
     * invariant). Covers every shaped type — the symbol source is dispatched
     * inside wfm_synth_next_symbol(). */
    float _Complex s1[1];
    wfm_synth_shape(state, &sym, 1, s1);
} else if (state->wtype == WFM_SYNTH_BITS || state->wtype == WFM_SYNTH_DSSS) {
    /* User bit pattern, oversampled sps and cycled to fill the request. The
     * symbol latch mirrors the PN path but sources bits from bits[bit_idx]
     * instead of the LFSR; bit_mod picks the mapping. A dsss burst is the
     * same machinery over the chip pattern set_dsss_chips() installed. */
    if (state->sym_pos == 0) {
        if (state->chips_per_symbol > 0.0) { /* continuous DSSS: lazy chip */
            state->cur_re = wfm_synth_cont_dsss_chip(state);
            state->cur_im = 0.0f;
        } else if (state->bits && state->n_bits) {
            /* ONE bits->symbol map for every order, shared with
             * wfm_synth_next_symbol() and dp_wfm_synth_steps(). Inlining it
             * here is what let the QPSK copy drift into a different label
             * assignment than mpsk_constellation() -- see
             * wfm_synth_bit_symbol(). */
            float _Complex bs = wfm_synth_bit_symbol(state);
            state->cur_re     = crealf(bs);
            state->cur_im     = cimagf(bs);
        }
    }
    if (state->fir) {
        /* RRC pulse shaping: the same matched-FIR impulse train as the
         * PN/PSK path, sourced from the bit latch instead of the LFSR. The
         * FIR carries its delay line across calls, so this is chunk-invariant
         * — step() and the block path agree bit-for-bit. */
        float _Complex imp = (state->sym_pos == 0)
                                ? (state->cur_re + state->cur_im * I)
                                : (0.0f + 0.0f * I);
        dp_fir_execute(state->fir, &imp, 1, &sym);
    } else {
        sym = state->cur_re + state->cur_im * I; /* rect sample-and-hold */
    }
    if (++state->sym_pos >= state->nsps)
        state->sym_pos = 0;
} else if (state->wtype == WFM_SYNTH_SYMBOLS) {
    /* User complex-symbol stream: the symbol IS the constellation point (no
     * bit->symbol mapping), oversampled sps and cycled. Generalises every
     * modulation — pi/4-QPSK, QAM, custom — into "compute symbols, pass them".
     * Shares the bits path's latch + FIR/rect machinery; only the source of
     * cur_re/cur_im differs (symbols[sym_read_idx] instead of a bit map). */
    if (state->sym_pos == 0 && state->symbols && state->n_symbols) {
        state->cur_re = crealf (state->symbols[state->sym_read_idx]);
        state->cur_im = cimagf (state->symbols[state->sym_read_idx]);
        state->sym_read_idx
            = (state->sym_read_idx + 1) % state->n_symbols;
    }
    if (state->fir) {
        float _Complex imp = (state->sym_pos == 0)
                                ? (state->cur_re + state->cur_im * I)
                                : (0.0f + 0.0f * I);
        dp_fir_execute(state->fir, &imp, 1, &sym);
    } else {
        sym = state->cur_re + state->cur_im * I; /* rect sample-and-hold */
    }
    if (++state->sym_pos >= state->nsps)
        state->sym_pos = 0;
} else if (state->wtype >= WFM_SYNTH_PN && state->wtype <= WFM_SYNTH_QPSK) {
    if (state->sym_pos == 0) {
        if (state->wtype == WFM_SYNTH_QPSK) {
            uint8_t b0 = pn_step(state->pn);
            uint8_t b1 = pn_step(state->pn);
            const float s = 0.70710678118654752f;
            state->cur_re = b0 ? -s : s;
            state->cur_im = b1 ? -s : s;
        } else { /* pn or bpsk: +-1 */
            uint8_t b = pn_step(state->pn);
            state->cur_re = b ? -1.0f : 1.0f;
            state->cur_im = 0.0f;
        }
    }
    if (state->fir) {
        /* RRC pulse shaping: feed the symbol-rate impulse train (the held
         * symbol at a boundary, zero between) through the matched FIR. The
         * FIR carries its delay line across calls, so this is chunk-invariant
         * — step() and the block path agree bit-for-bit. */
        float _Complex imp = (state->sym_pos == 0)
                                ? (state->cur_re + state->cur_im * I)
                                : (0.0f + 0.0f * I);
        dp_fir_execute(state->fir, &imp, 1, &sym);
    } else {
        sym = state->cur_re + state->cur_im * I; /* rect sample-and-hold */
    }
    if (++state->sym_pos >= state->nsps)
        state->sym_pos = 0;
} else {
    sym = state->cur_re + state->cur_im * I;
}
float _Complex carrier = 1.0f + 0.0f * I;
if (state->lo) {
    dp_lo_steps(state->lo, 1, &carrier, 1);
} else if (state->wtype == WFM_SYNTH_CHIRP) {
    /* Sweeping carrier: f(n) = f0 + k*n (normalised cycles/sample), held at
     * f_end once the span is reached. Phase accumulates in cycles, wrapped to
     * [0,1) each step so the double keeps precision over a long sweep. The
     * fused sym*carrier + noise below is the *same* expression the tone path
     * (and dp_wfm_synth_steps) uses, so step()/steps() stay byte-identical. */
    double nf = (state->chirp_span && state->chirp_n >= state->chirp_span)
                    ? (double)state->chirp_span
                    : (double)state->chirp_n;
    double w   = state->chirp_f0 + state->chirp_k * nf;
    carrier    = cexpf((float)(6.283185307179586 * state->chirp_ph) * I);
    state->chirp_ph += w;
    state->chirp_ph -= floor(state->chirp_ph);
    state->chirp_n++;
}
float _Complex noise = 0.0f + 0.0f * I;
if (state->awgn)
    dp_awgn_generate(state->awgn, 1, &noise, 1);
return sym * carrier + noise;
"""
create_impl = """
obj->wtype = type;
obj->nsps = (sps < 1) ? 1 : sps;
obj->sym_pos = 0;
obj->cur_re = (type == WFM_SYNTH_TONE || type == WFM_SYNTH_CHIRP) ? 1.0f : 0.0f;
obj->cur_im = 0.0f;
obj->fir = NULL; /* RRC pulse-shaping FIR, attached via set_rrc() */

/* Chirp: store the normalised start/end frequencies (freq is the start, i.e.
 * the instantaneous frequency at t=0). The per-sample slope chirp_k locks when
 * dp_wfm_synth_set_chirp_span() is called (the composer passes the declared span
 * or the segment length); until then a chirp holds its start frequency. */
obj->chirp_f0 = (fs != 0.0) ? freq / fs : 0.0;
obj->chirp_fend = (fs != 0.0) ? f_end / fs : 0.0;
obj->chirp_k = 0.0;
obj->chirp_ph = 0.0;
obj->chirp_n = 0;
obj->chirp_span = 0;

/* LO carrier for everything but pure noise (freq is Hz → cycles/sample).
 * Chirp synthesises its own swept carrier, so it never builds a static LO. */
if (type != WFM_SYNTH_NOISE && type != WFM_SYNTH_CHIRP && freq != 0.0) {
    obj->lo = dp_lo_create(fs != 0.0 ? freq / fs : 0.0);
    if (!obj->lo) {
        free(obj);
        return NULL;
    }
}

/* Bit-pattern state — the array itself is attached after create() via
 * dp_wfm_synth_set_bits() (the pattern is variable-length, not a ctor scalar). */
obj->bits = NULL;
obj->n_bits = 0;
obj->bit_idx = 0;
/* Complex-symbol state — array attached after create() via set_symbols(). */
obj->symbols = NULL;
obj->n_symbols = 0;
obj->sym_read_idx = 0;
obj->bit_mod = 1; /* default bpsk; overridden by set_bits */

/* PN chip/data source for pn/bpsk/qpsk; poly 0 → MLS poly for the length */
if (type >= WFM_SYNTH_PN && type <= WFM_SYNTH_QPSK) {
    uint64_t poly = pn_poly ? pn_poly : wfm_synth_mls_poly((uint32_t)pn_length);
    if (poly == 0) { /* no MLS table entry for this length */
        if (obj->lo)
            dp_lo_destroy(obj->lo);
        free(obj);
        return NULL;
    }
    obj->pn = dp_pn_create(poly, seed ? seed : 1u, (uint32_t)pn_length, lfsr);
    if (!obj->pn) {
        if (obj->lo)
            dp_lo_destroy(obj->lo);
        free(obj);
        return NULL;
    }
}

/* AWGN at the resolved SNR. snr_mode: 0 auto, 1 fs, 2 ebno, 3 esno.
 * Noise only when requested: type=noise always; else only when
 * snr < WFM_SYNTH_SNR_CLEAN (a clean waveform skips AWGN entirely). */
int want_noise = (type == WFM_SYNTH_NOISE) || (snr < WFM_SYNTH_SNR_CLEAN);
if (type == WFM_SYNTH_NOISE) {
    obj->awgn = dp_awgn_create((uint64_t)seed, (float)(1.0 / 1.4142135623730951));
} else if (snr < WFM_SYNTH_SNR_CLEAN) {
    int mode = snr_mode;
    if (mode == 0)
        /* *psk → esno; tone/pn/chirp/bits → fs. DSSS stays fs HERE and is
           pre-referred by the composer instead: its Es spans one DATA symbol,
           and the codes that set the spreading factor attach after create(),
           so this is the best that can be said at this point. */
        mode = (type == WFM_SYNTH_BPSK || type == WFM_SYNTH_QPSK) ? 3 : 1;
    /* The conversion itself is wfm_synth_snr_over_fs() — shared with the
       composer's per-segment noise floor and with the Plan stimulus engine, so
       a bundled noisy source and a resolved one cannot place different noise
       for the same requested SNR. Only the auto mapping above and the span
       below are ours; both legitimately differ per caller. */
    double snr_fs = wfm_synth_snr_over_fs(mode, wfm_synth_bps(type),
                                          (double)obj->nsps, snr);
    float amp = sqrtf(1.0f / (2.0f * powf(10.0f, (float)snr_fs / 10.0f)));
    obj->awgn = dp_awgn_create((uint64_t)seed, amp);
}
if (want_noise && !obj->awgn) {
    if (obj->pn)
        dp_pn_destroy(obj->pn);
    if (obj->lo)
        dp_lo_destroy(obj->lo);
    free(obj);
    return NULL;
}
"""
reset_impl = """
state->sym_pos = 0;
state->cur_re = (state->wtype == WFM_SYNTH_TONE
                || state->wtype == WFM_SYNTH_CHIRP)
                   ? 1.0f
                   : 0.0f;
state->cur_im = 0.0f;
state->bit_idx = 0;    /* rewind the bit pattern to its start */
state->sym_read_idx = 0; /* rewind the complex-symbol stream */
state->chirp_ph = 0.0; /* rewind the sweep; chirp_span/chirp_k stay locked */
state->chirp_n = 0;
if (state->lo)
    dp_lo_reset(state->lo);
if (state->awgn)
    dp_awgn_reset(state->awgn);
if (state->pn)
    dp_pn_reset(state->pn);
if (state->fir)
    dp_fir_reset(state->fir); /* clear the RRC delay line */
"""
destroy_impl = """
free(state->bits);
free(state->symbols);
if (state->lo)
    dp_lo_destroy(state->lo);
if (state->awgn)
    dp_awgn_destroy(state->awgn);
if (state->pn)
    dp_pn_destroy(state->pn);
if (state->fir)
    dp_fir_destroy(state->fir);
"""
serializable = "true"
fragment = "generated"

