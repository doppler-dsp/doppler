[module.detection]
doc = """
Detection primitives: a portable lock detector (LockDet) applying level and time hysteresis to any scalar lock metric.

Examples
--------
>>> from doppler.detection import LockDet
>>> d = LockDet(up_thresh=1.5, down_thresh=1.2, n_up=2, n_down=2)
>>> [d.step(2.0), d.step(2.0)]
[0, 1]

"""
# syncword joins lockdet here rather than in wfm: `det_threshold(pfa)`,
# `det_pd` and `det_dwell` are this module's existing shape -- a detector and
# the arithmetic for choosing its threshold -- and a sync-marker correlator
# is that same family. doppler#897 found the threshold of THIS detector had
# no arithmetic beside it at all, so `SyncFinder.pfa` / `.max_errors_for`
# land where a caller already looks for `det_threshold`.
#
# It stays free of any one standard: the object takes the marker, and CCSDS
# reaches it through `doppler.wfm.ccsds_asm_bits()` -- wfm already links
# ccsds_tm (frame's `depends_on`), and detection must not.
objects = ["lockdet", "syncword"]

