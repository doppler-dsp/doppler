[module.agc]
doc = """
Automatic gain control: a log-domain feedback AGC (AGC) that drives signal power toward a reference level.

It integrates the power error in dB, so convergence is exponential and
independent of the absolute input level. The loop is decimated: the detector
and integrator run once per `decim` samples with a first-order hold on the
gain between updates, so a long block costs O(n/decim) control work.

`settling_samples` answers how long it takes to settle. It runs the real
loop and counts rather than evaluating a fitted curve, so it cannot go
stale against the object; it allocates and iterates, so it is a design-time
call, never one inside a pipeline.

Examples
--------
>>> import numpy as np
>>> from doppler.agc import AGC
>>> y = AGC(ref_db=0.0, loop_bw=0.05).steps(0.1 * np.ones(200, np.complex64))
>>> bool(abs(y[-1]) > abs(y[0]))
True

A quiet input is the slow direction, and the one to budget for:

>>> from doppler.agc import settling_samples
>>> settling_samples(0.0025, 0.05, 40.0, 0.5)   # cold, 40 dB quiet
430
>>> settling_samples(0.0025, 0.05, -40.0, 0.5)  # 40 dB loud
175

"""
objects = ["agc"]

[[module.agc.functions]]
name = "settling_samples"
doc = "How many samples this loop needs to settle -- the design query a caller sizing a warm-up budget, a burst preamble or an acquisition guard has to answer. 1/(4*loop_bw) is the loop FILTER's time constant and not the object's: the detector sits inside the loop and measures in power, so a quiet input settles more slowly. Measured, the multiplier runs from about 0.8 on a loud start to nearly 5 on a quiet one with a slow detector. This runs the real loop against a constant input and counts, so there is no fitted curve to go stale. gain_err_db is POSITIVE for a quiet input, which is the slow direction and the one to budget for. Returns 0 rather than a plausible guess when the arguments are invalid. Design-time only: it allocates and iterates."
return_type = "size_t"

[[module.agc.functions.params]]
name = "loop_bw"
type = "double"

[[module.agc.functions.params]]
name = "alpha"
type = "double"

[[module.agc.functions.params]]
name = "gain_err_db"
type = "double"

[[module.agc.functions.params]]
