[mpsk_receiver]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "MpskReceiver"
# ddc (the matched front end) and ratesync (the shared timing loop) are the
# composed cores; everything after them is a core those two drag in, which the
# standalone C test/bench must also link because link=true is NOT transitive
# (the #225 mechanic -- RateConverter alone is a cascade of five). wfm_dsp_core
# (the canonical rrc kernel behind the matched bank) is a wfmcompose-internal
# OBJECT lib, not a jm component, so it rides extra_link_libs.
depends_on = [
    { name = "ber" }, # dp_sym_test.h delegates here
  { name = "ddc", link = true },
  # The real face's front end, and the halfband only it uses. One object now
  # owns both (docs/design/mpsk-refactor.md), so both ride this component's
  # link line rather than a second component's.
  { name = "ddcr", link = true },
  { name = "hbdecim_r2c", link = true },
  { name = "ratesync", link = true },
  { name = "RateConverter", link = true },
  { name = "resamp", link = true },
  { name = "hbdecim", link = true },
  { name = "cic", link = true },
  { name = "fir", link = true },
  { name = "resample", link = true },
  { name = "lo", link = true },
  { name = "nco", link = true },
  { name = "loop_filter", link = true },
  { name = "lockdet", link = true },
  { name = "dp_tlm", link = true },
  { name = "agc", link = true },
]
extra_link_libs = ["wfm_dsp_core"]
serializable = "true"
# A NULL create here means a parameter was out of range, not that the machine
# ran out of memory (gh-482). Say so.
#
# It states BOTH faces' `sps` bound because it is currently the message both
# of them raise: the MpskReceiverR view declares its own (gh-580 resolves it
# correctly through `C.view_create_error_message`), but `jm apply`'s view
# replay does not carry the key into the scratch tree the fragment is rendered
# from, so the parent's text reaches the generated binding. Filed upstream as
# just-makeit#1017; the view's declaration stays, and takes over the moment
# the replay carries it.
create_error = "ValueError"
create_error_message = "MpskReceiver: invalid parameter (need m in {2,4,8}, sps >= m_out -- sps > 2*m_out on the real-input MpskReceiverR, whose cascade runs behind a 2:1 halfband, m_out even in [2, 8], 0 <= rrc_beta <= 1, rrc_span >= 1, num_phases a power of two >= 2, bn >= 0, zeta > 0, 0 < bn_agc_ratio < 1)"

[[mpsk_receiver.init_params]]
name = "m"
type = "int"
default = "4"

[[mpsk_receiver.init_params]]
name = "sps"
type = "double"
default = "8.0"
doc = "Samples per symbol. Any double >= `m_out` -- 17.33389 is as valid as 8, because the front end plans its own cascade and the terminal stage's accumulator is a double. That is the real-world case whenever the ADC clock is free-running against the symbol clock."

[[mpsk_receiver.init_params]]
name = "m_out"
type = "size_t"
default = "0"
doc = "**0 (the default) derives it** -- see docs/design/mpsk.md §8.1; pass a value only to pin one. The rule is the largest even count in 2..8 the rate allows, so a caller cannot pair an `sps` and an `m_out` that will not work together. Terminal outputs per symbol: even, 2..8. The Gardner detector takes every m_out-th output as the on-time strobe and the one m_out/2 back as the transition gate, so the oversampled matched-filtered stream falls out for free. **The default is 8 because that is where the I&D matched filter reaches the coherent bound.** The rectangle is one symbol wide, so its matched filter is an m_out-tap sum spanning it, and a smaller m_out samples that same integral more coarsely. Measured on QPSK at the default sps=8 against the coherent bound EVM_dB = -(Es/N0)_dB: at 18 dB Es/N0, m_out=8 lands 0.41 dB off the bound where m_out=4 loses 3.11 dB; at 14 dB it is 0.25 dB against 1.71 dB -- the gap widens as noise stops hiding it. **Never pair 2 with pulse=\"iandd\"**: the matched filter degenerates to a two-tap sum, the eye barely opens (measured lock statistic -0.34 at 2 against +0.95 at 4 on the same NRZ stream) and acquisition itself fails about half the time (4/8 seeds locked at 14 dB Es/N0, against 8/8 at both 4 and 8). Replaces the old `n` (NDA arm dumps per symbol): the cascade's own outputs now feed the carrier discriminator, so there is no separate arm to size."

[[mpsk_receiver.init_params]]
name = "pulse"
type = "string_enum:iandd,rrc"
default = "iandd"

[[mpsk_receiver.init_params]]
name = "rrc_beta"
type = "double"
default = "0.35"

[[mpsk_receiver.init_params]]
name = "rrc_span"
type = "int"
default = "8"

[[mpsk_receiver.init_params]]
name = "bn_carrier"
type = "double"
default = "0.01"

[[mpsk_receiver.init_params]]
name = "zeta"
type = "double"
default = "0"
doc = "Damping factor for both loops. **0 (the default) derives it** as `1/sqrt(2)`, critically damped -- a constant, not a computation, and a parameter only because it was once thought to be one (docs/design/mpsk.md §8.1)."

[[mpsk_receiver.init_params]]
name = "bn_timing"
type = "double"
default = "0.01"

[[mpsk_receiver.init_params]]
name = "lock_thresh"
type = "double"
default = "0"
doc = "Declare threshold for the carrier lock indicator, on the carrier lock EMA. **0 (the default) derives it** as `sigma_H0 * eta(Pfa)` = 0.4999 at `Pfa = 5e-6`; the limited statistic reads ~1.0 at lock for every M, so no per-M correction is carried (docs/design/mpsk.md §8.1)."

[[mpsk_receiver.init_params]]
name = "init_norm_freq"
type = "double"
default = "0.0"

[[mpsk_receiver.init_params]]
name = "differential"
type = "int"
default = "0"

[[mpsk_receiver.init_params]]
name = "num_phases"
type = "size_t"
default = "0"
doc = "Matched-filter bank arms, a power of two; sets the fractional-timing resolution to 1/num_phases of an output period. **0 (the default) derives it** as 64, the measured saturation point -- against the 1024 that shipped, a 16x bank for no measurable gain (docs/design/mpsk.md §8.1). Matched-filter bank arms; a power of two. Sets the fractional-timing resolution to 1/num_phases of an output period. The bank is sized by the POST-decimation rate, so this costs the same at sps=8 and sps=256."

[[mpsk_receiver.init_params]]
name = "agc"
type = "int"
default = "1"
doc = "Level the front-end cascade so the timing detector's construct-time slope means what it says. The TED normalises by its OWN slope and nothing else, and that slope is computed for a UNIT-amplitude symbol stream -- amplitude enters the raw error as A^2 (Gardner) or A^1 (DTTL), so a 4x level error is a 16x loop-gain error. With this on, an AGC sits inside the cascade just before the matched filter and drives the average power to the level a unit-amplitude symbol stream would have there, derived from the matched filter's own pulse energy rather than configured. On by default because the alternative is a receiver whose loop gain depends on how loud the input happened to be. Set 0 to reproduce the un-levelled behaviour exactly, which is the handle for attributing any measurement that moves. This is the receiver's ONLY AGC -- the carrier discriminator normalises by its own |z|^M and needs none. Read the applied gain back with `agc_gain_db`."

[[mpsk_receiver.init_params]]
name = "bn_agc_ratio"
type = "double"
default = "0"
doc = "**0 (the default) derives it** -- see docs/design/mpsk.md §8.1; pass a value only to pin one. The one AGC's noise bandwidth as a fraction of the SLOWEST loop it feeds -- min(bn_carrier, bn_timing), not the carrier's alone, since the AGC feeds the timing loop directly. Must be in (0, 1) and construction refuses otherwise, because an AGC at or above the bandwidth of a loop it feeds corrects the excursions that loop is itself producing and the two integrate against each other; the signal LEVEL is a slow property of the channel, not a disturbance to reject at loop speed. Exposed rather than fixed because the right separation depends on how fast the channel's level moves against how fast its phase and timing do, which is a property of the link. The cold start is not the loop's job either way -- the AGC seeds its gain from a direct measurement -- so slow is cheap here."

# The Hz face (docs/design/mpsk.md §7). A VIEW, not a second type: same core,
# same state, same methods -- only the constructor differs, which is the axis
# that makes something a flavor here (a difference in METHOD SIGNATURE would
# make it a separate type, which is why the real-input twin is one and this is
# not). Nothing is removed from mpsk_receiver; every knob is still reachable
# through it.
#
# lock_thresh is excluded rather than defaulted: it gates nothing -- the
# carrier lock indicator steers no loop and no output -- so it is telemetry.
# It stays READABLE (`lock_thresh` reads back the derived 0.4999) and stops
# being settable, which is the honest shape for a number that does not
# control anything.
[[mpsk_receiver.views]]
class_name = "BpskReceiver"
create_fn = "mpsk_receiver_create_bpsk"
create_error = "ValueError"
create_error_message = "BpskReceiver: sample_rate_hz and symbol_rate_hz must both be > 0, |carrier_freq_hz| must be under sample_rate_hz/2, and sample_rate_hz/symbol_rate_hz must leave at least the derived m_out samples per symbol"
init_params = [
  { name = "sample_rate_hz", type = "double", required = true, doc = "ADC sample rate, Hz. One of the two facts a caller reading a capture actually holds -- `sps` is `sample_rate_hz / symbol_rate_hz`, a ratio this library computes for its own use in selecting a cascade, and asking for it would make the caller derive an internal quantity." },
  { name = "symbol_rate_hz", type = "double", required = true, doc = "Symbol rate, Hz. Must leave `sample_rate_hz / symbol_rate_hz` at or above the derived `m_out`; a rate that cannot be strobed is refused at construction rather than approximated." },
  { name = "carrier_freq_hz", type = "double", default = "0.0", doc = "Carrier centre, Hz. 0 is complex baseband. Stated in Hz like everything else here: `MpskReceiver`'s `init_norm_freq` is cycles per SAMPLE, which is a unit a caller can only produce by holding `sps` and `fs` together, and that coupling is what this face removes." },
  { name = "pulse", type = "string_enum:iandd,rrc", default = "iandd", doc = "Matched-filter shape. Same default as `MpskReceiver` deliberately: one default across both faces beats a face-specific guess at a link property." },
  { name = "rrc_beta", type = "double", default = "0.35", doc = "RRC roll-off in `[0, 1]`. RRC only." },
  { name = "rrc_span", type = "int", default = "8", doc = "RRC one-sided span in symbols. RRC only." },
  { name = "bn_carrier", type = "double", default = "0.01", doc = "Carrier loop noise bandwidth, normalised to the SYMBOL rate. A design axis, and the one the acquisition bound `bn_carrier / m` is stated against." },
  { name = "bn_timing", type = "double", default = "0.01", doc = "Symbol-timing loop noise bandwidth, normalised to the symbol rate. A design axis." },
  { name = "differential", type = "int", default = "0", doc = "bits(): differential (rotation-invariant) demap. Left optional and coherent by default, matching `MpskReceiver` -- it changes what the output bits MEAN and is not derivable from the signal, so it is a link property a caller states rather than one this object guesses." },
  { name = "agc", type = "int", default = "1", doc = "Front-end AGC. On by default: it levels the cascade so the timing detector's construct-time slope means what it says." },
]

[[mpsk_receiver.properties]]
name = "agc_gain_db"
type = "double"
doc = "Gain the front-end AGC is applying, in dB; 0.0 when `agc=0`. The diagnostic for a level problem: a receiver that will not lock with a healthy `lock` statistic, or one whose timing loop behaves differently at two input levels, is asking about this number. It settles at -10*log10(P_in / P_ref), where P_ref is the power a unit-amplitude symbol stream has where the AGC sits, so a reading far from 0 dB says the input is far from the level the cascade was built for -- which is fine, and is what the AGC is for, but is worth knowing. Distinct from the cascade's filter response, which stays unity; the two multiply."

# Telemetry attach (jm gh-432; mirrors objects/agc.toml): registers the
# receiver's "<prefix>.lock" probe and forwards to both embedded loops —
# "<prefix>.car.lock/.e/.freq/.locked" (carrier) and
# "<prefix>.sync.e/.freq/.rate/.lock/.locked" (timing) — ten probes per
# attach (the carrier AGC's gain probe went with the carrier AGC). None
# detaches everything; the int status binds -> None / ValueError.
[[mpsk_receiver.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", header = "dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[mpsk_receiver.methods]]
name = "steps"
doc = "Demodulate a cf32 block and return the recovered M-PSK symbols (one cf32 per recovered symbol period, ~ len(x)/sps outputs). Per sample the receiver pushes x through the matched DDC -- LO mix, decimating cascade, and a terminal polyphase stage whose bank IS the matched filter and whose selected arm IS the fractional symbol-timing delay -- then folds every output that stage produced into two loops: a Gardner symbol-timing loop steering the cascade's rate_ctrl port, and a carrier loop steering the LO's freq_ctrl port. The carrier discriminator runs on the on-time strobe only -- a non-strobe output straddles two symbols, so its M-th power is intersymbol interference rather than carrier phase -- and it is the non-data-aided M-th-power error throughout, needing no data and no symbol timing: there is one discriminator, running from the first symbol to the last. The loop locks to one of m phases (M-fold ambiguity); resolve it with bits(differential) or a sync word. Read norm_freq for the tracked carrier and lock for the carrier lock metric."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[mpsk_receiver.methods]]
name = "bits"
doc = "Demodulate a cf32 block and return hard Gray-coded bits (log2(m) bytes of 0/1 per recovered symbol, LSB-first). Coherent by default; if the receiver was created with differential=1, each symbol's bits come from the phase DIFFERENCE between consecutive symbols (rotation-invariant — resolves the m-fold carrier ambiguity at ~2x the symbol-error rate). Same per-sample carrier/timing recovery as steps()."
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[mpsk_receiver.methods]]
name = "reset"
doc = "Re-seed the carrier and symbol-timing loops to their create-time state; preserve configuration."
arg_type = "void"
return_type = "void"

[[mpsk_receiver.properties]]
name = "norm_freq"
type = "double"
writable = true

[[mpsk_receiver.properties]]
name = "lock"
type = "double"

[[mpsk_receiver.properties]]
name = "zeta"
type = "double"
doc = "Loop damping actually in use. Reads back the DERIVED `1/sqrt(2)` when the constructor was given 0, or whatever was pinned instead. Everything derived is reported (docs/design/mpsk.md §8.1), on the same argument as `RateConverter.stages`: without the readback, passing 0 is an instruction whose result nobody can see."

[[mpsk_receiver.properties]]
name = "num_phases"
type = "size_t"
doc = "Matched-filter bank arms actually in use. Reads back the DERIVED 64 -- the measured saturation point, against the 1024 that shipped -- when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "lock_thresh"
type = "double"
doc = "Handover declare threshold actually in use. Reads back the DERIVED `sigma_H0 * eta(Pfa)` = 0.4999 at `Pfa = 5e-6` when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "lock_drop_thresh"
type = "double"
doc = "Carrier DROP threshold actually in use -- 0.8x `lock_thresh`, the level hysteresis the declare/drop pair is stated with. Exposed for the same reason as the declare side: anything reading `lock` against its decision needs BOTH edges, and computing `0.8 *` at the call site is a second copy of a rule this object owns. Both carrier detectors are initialised from this pair, so one number describes them both."

[[mpsk_receiver.properties]]
name = "sync_lock_thresh"
type = "double"
doc = "Timing DECLARE threshold on the `sync.lock` statistic. Not the carrier's number and not derived the same way: symsync sizes its block length and threshold together from (rolloff, esno_min, pfa, pd), so this reads back that geometry's answer. A caller plotting `sync.lock` needs this rather than `lock_thresh`, which belongs to a different statistic on a different clock."

[[mpsk_receiver.properties]]
name = "sync_lock_drop_thresh"
type = "double"
doc = "Timing DROP threshold on `sync.lock`. Equal to `sync_lock_thresh` when the timing loop carries no level hysteresis (up = down = threshold, the symsync default), so the two reading the same is information, not a bug -- the timing decision's hysteresis is in its verify COUNTS rather than its levels."

[[mpsk_receiver.properties]]
name = "bn_agc_ratio"
type = "double"
doc = "AGC bandwidth as a fraction of the slowest loop it feeds, actually in use. Reads back the DERIVED 0.05 when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "locked"
type = "int"
doc = "Binary carrier-lock flag from the hysteretic (verify-counted) detector on `lock` -- de-chattered, unlike the raw metric. It declares after 8 consecutive symbols above `lock_thresh` and withdraws after 32 below `lock_drop_thresh`, so it answers 'is this receiver locked' rather than 'was the statistic above the line on this symbol'. **It is an INDICATOR and nothing else**: it steers no loop, gates no output, and the M-th-power NDA discriminator runs from the first strobe whether or not this has declared. So a caller uses it to size a measurement window, and a wrong reading costs them that window and costs the demodulator nothing. `lock_time` dates its first declaration."

[[mpsk_receiver.properties]]
name = "lock_time"
type = "int64_t"
doc = "Symbols from reset to the FIRST carrier-lock declaration, or -1 if the receiver has not locked yet -- the acquisition time as a number, rather than something a caller has to infer by polling `locked` in a loop. Dated by the same hysteretic detector `locked` reports, so the two cannot disagree. In SYMBOLS, not seconds: `bn_carrier` and `bn_timing` are both normalised to the symbol rate, so a settling budget quoted in symbols is comparable across every input rate, and a caller holding Rs divides once. Only the FIRST declaration is dated -- a drop and re-acquire does not restamp it, because the question this answers is 'how long did this receiver take to lock', not 'when did it last hold'. `reset()` clears it to -1."

[[mpsk_receiver.properties]]
name = "timing_rate"
type = "double"

[[mpsk_receiver.properties]]
name = "m"
type = "int"

[[mpsk_receiver.properties]]
name = "sps"
type = "double"

[[mpsk_receiver.properties]]
name = "m_out"
type = "size_t"

[[mpsk_receiver.properties]]
name = "clipped"
type = "int"
doc = "Has the cascade's CIC stage clipped its input since the last reset? A CIC bounds its input to |Re|, |Im| <= 1.0 and clips silently past that -- the output stays finite and plausible, merely distorted, at a cost of ~25 dB of EVM that no lock metric reveals. Always 0 for a plan with no CIC stage."

# The real-input face (docs/design/mpsk-refactor.md). A VIEW, like the
# continuous flavor above and for the same reason: one core, one state, one
# set of loops -- what differs is the CONSTRUCTOR (a matched DDCR instead of a
# matched DDC) and, uniquely on this view, the input dtype of the two block
# methods.
#
# That dtype is why this was a separate TYPE until jm 0.62.0. This project's
# axis is that a difference in constructor is a flavor and a difference in
# METHOD SIGNATURE is a separate type, and `steps`/`bits` take f32 here
# against cf32 on the parent -- so with a view sharing its parent's methods
# verbatim, one class could not have both. just-makeit#1012 removed that:
# a view method restating a parent's NAME may declare its own signature when
# it binds its own C symbol via `fn`. The symbol is the discriminator and not
# a convenience -- the parent's symbol carries the parent's prototype, so a
# different signature is only callable through a different one.
#
# Everything else is shared verbatim, including the four §8.1 read-backs
# (`zeta`, `num_phases`, `lock_thresh`, `bn_agc_ratio`) that the separate type
# had in C and never bound.
#
# The init_params below are the separate type's, carried across UNCHANGED --
# including the five it pins where the parent derives (m_out=8, zeta=0.707,
# lock_thresh=0.5, num_phases=1024, bn_agc_ratio=0.05). Three of those
# disagree with the derivation, so they are wrong rather than merely
# redundant; they are kept here so the collapse changes no behaviour, and
# fixing them is gh-829.
[[mpsk_receiver.views]]
class_name = "MpskReceiverR"
create_fn = "mpsk_receiver_create_real"
doc = "Create the M-PSK receiver behind an R2C halfband: a real IF in. The same object as MpskReceiver -- same loops, same demapper, same state -- reached through a matched DDCR instead of a matched DDC, so `steps()` and `bits()` take float32 and everything else is shared verbatim. A real-valued IF is the usual output of a single-ended ADC, so this is the face that takes a digitiser's samples directly. Three things follow from the halfband and nothing else differs: the LO runs at HALF the input rate (handled internally -- every frequency on this class stays in cycles/sample at the real input rate), `sps` must exceed `2 * m_out` strictly rather than merely reaching `m_out`, and `init_norm_freq` is the real IF CENTRE rather than a baseband residual."
create_error = "ValueError"
create_error_message = "MpskReceiverR: invalid parameter (need m in {2,4,8}, sps > 2*m_out, m_out even in [2, 8], 0 <= rrc_beta <= 1, rrc_span >= 1, num_phases a power of two >= 2, bn >= 0, zeta > 0, 0 < bn_agc_ratio < 1)"
init_params = [
  { name = "m", type = "int", default = "4" },
  { name = "sps", type = "double", default = "32.0", doc = "Samples per symbol. Any double **strictly greater than `2 * m_out`** (the cascade behind the R2C halfband runs at twice the overall rate, and Ddcr needs that below 0.5) -- 33.33389 is as valid as 32, because the front end plans its own cascade and the terminal stage's accumulator is a double. That is the real-world case whenever the ADC clock is free-running against the symbol clock. The default is 32 rather than the complex face's 8 purely to clear that bound: `m_out` derives to 8 here, so anything at or below 16 cannot construct." },
  { name = "m_out", type = "size_t", default = "0", doc = "**0 (the default) derives it** -- see docs/design/mpsk.md 8.1; pass a value only to pin one. Terminal outputs per symbol: even, 2..8. The Gardner detector takes every m_out-th output as the on-time strobe and the one m_out/2 back as the transition gate, so the oversampled matched-filtered stream falls out for free. **The default is 8 because that is where the I&D matched filter reaches the coherent bound.** The rectangle is one symbol wide, so its matched filter is an m_out-tap sum spanning it, and a smaller m_out samples that same integral more coarsely. Measured on the complex face at its default sps=8 against the coherent bound EVM_dB = -(Es/N0)_dB: at 18 dB Es/N0, m_out=8 lands 0.41 dB off the bound where m_out=4 loses 3.11 dB; at 14 dB it is 0.25 dB against 1.71 dB -- the gap widens as noise stops hiding it. Because `sps` must clear `2 * m_out` here, this default is also what puts the `sps` default at 32. **Never pair 2 with pulse=\"iandd\"**: the matched filter degenerates to a two-tap sum, the eye barely opens (measured lock statistic -0.34 at 2 against +0.95 at 4 on the same NRZ stream) and acquisition itself fails about half the time. Replaces the old `n` (NDA arm dumps per symbol): the cascade's own outputs now feed the carrier discriminator, so there is no separate arm to size." },
  { name = "pulse", type = "string_enum:iandd,rrc", default = "iandd" },
  { name = "rrc_beta", type = "double", default = "0.35" },
  { name = "rrc_span", type = "int", default = "8" },
  { name = "bn_carrier", type = "double", default = "0.01" },
    { name = "zeta", type = "double", default = "0" },
  { name = "bn_timing", type = "double", default = "0.01" },
    { name = "lock_thresh", type = "double", default = "0", doc = "Declare threshold for the carrier lock indicator, on the carrier lock EMA. **0 (the default) derives it** as `sigma_H0 * eta(Pfa)` = 0.4999 at Pfa = 5e-6; pass a value only to pin one. The metric is `Re((z/|z|)^M)` smoothed by an EMA, whose noise-only sd is 0.1132 for EVERY M, so 0.4999 is 4.42 noise sigmas; to pin your own, divide your Pfa's z-score into 0.1132 rather than picking by feel. The drop threshold sits at 0.8x for level hysteresis and both directions are verify-counted (8 symbols up / 32 down). Read it back with `lock_thresh`." },
  { name = "init_norm_freq", type = "double", default = "0.0", doc = "The real IF **centre**, cycles/sample at the real input rate -- an IF at 0.2*fs is 0.2, and the halved value the LO actually uses is this object's business, not yours. Unlike the complex face, this one does not acquire from a cold zero: a real IF must be tuned near, so this is the centre a tap buys pull-in *around* rather than from nothing." },
  { name = "differential", type = "int", default = "0" },
    { name = "num_phases", type = "size_t", default = "0", doc = "Matched-filter bank arms; a power of two. Sets the fractional-timing resolution to 1/num_phases of an output period. **0 (the default) derives it** as 64, the measured saturation point. The bank is sized by the POST-decimation rate, so this costs the same at sps=8 and sps=256." },
  { name = "agc", type = "int", default = "1", doc = "Level the front-end cascade so the timing detector's construct-time slope means what it says. The TED normalises by its OWN slope and nothing else, and that slope is computed for a UNIT-amplitude symbol stream -- amplitude enters the raw error as A^2 (Gardner) or A^1 (DTTL), so a 4x level error is a 16x loop-gain error. With this on, an AGC sits inside the cascade just before the matched filter and drives the average power to the level a unit-amplitude symbol stream would have there, derived from the matched filter's own pulse energy rather than configured. On by default because the alternative is a receiver whose loop gain depends on how loud the input happened to be. Set 0 to reproduce the un-levelled behaviour exactly, which is the handle for attributing any measurement that moves. This is the receiver's ONLY AGC -- the carrier discriminator normalises by its own |z|^M and needs none. Read the applied gain back with `agc_gain_db`. On this face the AGC sits behind the R2C halfband, so it levels the analytic signal at the intermediate rate rather than the real input." },
  { name = "bn_agc_ratio", type = "double", default = "0", doc = "**0 (the default) derives it** as 0.05. The one AGC's noise bandwidth as a fraction of the SLOWEST loop it feeds -- min(bn_carrier, bn_timing), not the carrier's alone, since the AGC feeds the timing loop directly. Must be in (0, 1) and construction refuses otherwise, because an AGC at or above the bandwidth of a loop it feeds corrects the excursions that loop is itself producing and the two integrate against each other; the signal LEVEL is a slow property of the channel, not a disturbance to reject at loop speed. Exposed rather than fixed because the right separation depends on how fast the channel's level moves against how fast its phase and timing do, which is a property of the link. The cold start is not the loop's job either way -- the AGC seeds its gain from a direct measurement -- so slow is cheap here." },
]

# The two signature overrides (just-makeit#1012). Same Python names as the
# parent's, their own C symbols, their own input dtype.
[[mpsk_receiver.views.methods]]
name = "steps"
fn = "mpsk_receiver_steps_real"
doc = "Demodulate a real f32 block and return the recovered M-PSK symbols (one cf32 per recovered symbol period, ~ len(x)/sps outputs). Per sample the receiver pushes x through the matched DDCR -- an R2C halfband that decimates 2:1, then LO mix, decimating cascade, and a terminal polyphase stage whose bank IS the matched filter and whose selected arm IS the fractional symbol-timing delay -- then folds every output that stage produced into two loops: a Gardner symbol-timing loop steering the cascade's rate_ctrl port, and a carrier loop steering the LO's freq_ctrl port. That fold is one shared implementation with the complex face; only the front end above it differs. The carrier discriminator runs on the on-time strobe only -- a non-strobe output straddles two symbols, so its M-th power is intersymbol interference rather than carrier phase -- and it is the non-data-aided M-th-power error throughout, needing no data and no symbol timing: there is one discriminator, running from the first symbol to the last. The loop locks to one of m phases (M-fold ambiguity); resolve it with bits(differential) or a sync word. Read norm_freq for the tracked carrier and lock for the carrier lock metric."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float[]" }]

[[mpsk_receiver.views.methods]]
name = "bits"
fn = "mpsk_receiver_bits_real"
doc = "Demodulate a real f32 block and return hard Gray-coded bits (log2(m) bytes of 0/1 per recovered symbol, LSB-first). Coherent by default; if the receiver was created with differential=1, each symbol's bits come from the phase DIFFERENCE between consecutive symbols (rotation-invariant — resolves the m-fold carrier ambiguity at ~2x the symbol-error rate). Same per-sample carrier/timing recovery as steps()."
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float[]" }]
