# frame — a frame's bit layout, describable from Python.
#
# The RECEIVE half of the frame story. `wfm_frame_t` (native/inc/wfm/wfm_frame.h)
# is what the generator builds a frame from and what `wfm_frame_crc_ok()` scores
# one against; until now only C could hold one, so `doppler.ber.FrameMeter` --
# which exists precisely to turn CRC outcomes into an exact FER interval -- had
# no way to be fed from Python. This object closes that: describe the frame,
# `bits()` it to compare against, `crc_ok(rx)` a capture, feed the result to
# FrameMeter.
#
# It is lifecycle and delegation ONLY. Every layout decision -- where the CRC
# sits, that it covers the payload alone, that a preamble repeats verbatim --
# stays in wfm_frame.c, which is the single implementation both ends already
# share. Re-deriving any of it here would recreate exactly the TX/RX drift the
# descriptor was introduced to stop.
#
# ## Why 30-odd constructor kwargs
#
# jm has no struct type in either direction, and `wfm_seq_t` carries a
# `const uint8_t *bits` besides, so the three sequences cannot nest. They are
# flattened with a name prefix instead -- `preamble_*`, `sync_*`, `payload_*` --
# over the same field set each. An object with array `init_params` and
# no_state/no_step is the jm shape that permits it (precedent: burst_demod).

[frame]
arg_type = "void"
return_type = "void"
mutable = "false"
no_state = "true"
no_step = "true"
no_reset = "true"
class_name = "Frame"
create_error = "ValueError"
create_error_message = "frame geometry is empty or a field is unbuildable (a literal with no array, or a generated field with no register width)"
# wfm_frame_core holds wfm_frame_bits/_layout/_crc_ok; pn/gold back the
# generated sequence kinds it calls into.
# ccsds_tm: `build()` runs the coded stages a description may name, and
# ccsds_tm has no binding of its own -- so this object is where a Python
# caller meets the outer code, the randomiser and the inner code. The
# dependency runs frame -> ccsds_tm -> wfm_frame, which is the direction
# ccsds_tm's own CMakeLists anticipated ("BOTH ends want it: wfmgen encodes,
# and frame/ber_meter will decode"). conv/rs come with it: an OBJECT library
# propagates usage requirements but not its objects, so every consumer must
# name them.
depends_on = [
    { name = "wfm_frame", link = true },
    { name = "ccsds_tm", link = true },
    { name = "conv", link = true },
    { name = "rs", link = true },
    { name = "pn", link = true },
    { name = "gold", link = true },
]

# ── preamble ────────────────────────────────────────────────────────────────
[[frame.init_params]]
name = "preamble_kind"
type = "enum:wfm_seq_kind"
default = "literal"

[[frame.init_params]]
name = "preamble"
type = "uint8_t[]"
doc = "Literal preamble bits, one per element. Pass an EMPTY array when the field is absent or generated -- `wfm_seq_t` already spells absence as a zero length, so this is that convention reaching Python rather than a placeholder. (An omittable array init-param is a jm gap; see the module docs.)"

[[frame.init_params]]
name = "preamble_nbits"
type = "size_t"
default = "0"
doc = "Output bits for a GENERATED preamble kind. A literal takes its length from the `preamble` array instead; `wfm_seq_t` names these apart (len vs reg_bits) for the same reason."

[[frame.init_params]]
name = "preamble_reps"
type = "size_t"
default = "0"

[[frame.init_params]]
name = "preamble_poly"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "preamble_seed"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "preamble_reg_bits"
type = "uint32_t"
default = "0"

[[frame.init_params]]
name = "preamble_lfsr"
type = "enum:wfm_lfsr"
default = "galois"

[[frame.init_params]]
name = "preamble_taps_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "preamble_seed_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "preamble_taps_b"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "preamble_seed_b"
type = "uint64_t"
default = "0"

# ── sync ────────────────────────────────────────────────────────────────────
[[frame.init_params]]
name = "sync_kind"
type = "enum:wfm_seq_kind"
default = "literal"

[[frame.init_params]]
name = "sync"
type = "uint8_t[]"
doc = "Literal sync word bits, one per element. Pass an EMPTY array when the field is absent or generated -- `wfm_seq_t` already spells absence as a zero length, so this is that convention reaching Python rather than a placeholder. (An omittable array init-param is a jm gap; see the module docs.)"

[[frame.init_params]]
name = "sync_nbits"
type = "size_t"
default = "0"

[[frame.init_params]]
name = "sync_poly"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_seed"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_reg_bits"
type = "uint32_t"
default = "0"

[[frame.init_params]]
name = "sync_lfsr"
type = "enum:wfm_lfsr"
default = "galois"

[[frame.init_params]]
name = "sync_taps_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_seed_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_taps_b"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_seed_b"
type = "uint64_t"
default = "0"

# ── payload ─────────────────────────────────────────────────────────────────
[[frame.init_params]]
name = "payload_kind"
type = "enum:wfm_seq_kind"
default = "literal"

[[frame.init_params]]
name = "payload"
type = "uint8_t[]"
doc = "Literal payload bits, one per element. Pass an EMPTY array when the field is absent or generated -- `wfm_seq_t` already spells absence as a zero length, so this is that convention reaching Python rather than a placeholder. (An omittable array init-param is a jm gap; see the module docs.)"

[[frame.init_params]]
name = "payload_nbits"
type = "size_t"
default = "0"

[[frame.init_params]]
name = "payload_poly"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_seed"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_reg_bits"
type = "uint32_t"
default = "0"

[[frame.init_params]]
name = "payload_lfsr"
type = "enum:wfm_lfsr"
default = "galois"

[[frame.init_params]]
name = "payload_taps_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_seed_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_taps_b"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_seed_b"
type = "uint64_t"
default = "0"

# ── the frame itself ────────────────────────────────────────────────────────
[[frame.init_params]]
name = "crc"
type = "enum:crc"
default = "none"

# ── methods ─────────────────────────────────────────────────────────────────
[[frame.methods]]
name = "bits"
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true

# ── the OTHER constructor: the same frame, DEFERRED ────────────────────────
#
# `Frame(...)` materialises at construction. `FrameDesc(...)` takes the SAME
# arguments and stops before materialising, so the four fields are a starting
# point a caller extends with `add_field` / `add_stage` before `build()`.
# Empty arrays for all three begin from nothing.
#
# A view rather than a second object, by the rule this repo already uses (see
# the `ddc` section of CLAUDE.md): a difference in CONSTRUCTOR is a flavor, a
# difference in METHOD SIGNATURE is a separate type. Every method is shared
# verbatim, so it is a flavor -- and the init_params are the parent's, which
# is what a view inheriting them is FOR.
#
# It is what makes CCSDS reachable from Python at all. `ccsds_tm` has no
# binding and is not getting one, so a caller meets the outer code, the
# randomiser and the inner code by DESCRIBING a CADU -- three fields and three
# covers -- rather than by a CCSDS entry point being added to this object.
[[frame.views]]
class_name = "FrameDesc"
create_fn = "frame_create_desc"

[[frame.methods]]
name = "layout"
arg_type = "void"
return_type = "wfm_frame_layout_t"
single = true
record_name = "FrameLayout"
record_doc = "Where each field lands, in bits from the start of the frame. The offsets a receiver needs to slice a capture -- computed once, by the same code the generator laid the frame out with."
record_module = "doppler.wfm"
result_fields = [
    { name = "preamble_off", type = "size_t" },
    { name = "preamble_bits", type = "size_t" },
    { name = "sync_off", type = "size_t" },
    { name = "sync_bits", type = "size_t" },
    { name = "payload_off", type = "size_t" },
    { name = "payload_bits", type = "size_t" },
    { name = "crc_off", type = "size_t" },
    { name = "crc_bits", type = "size_t" },
    { name = "total_bits", type = "size_t" },
]

[[frame.methods]]
name = "crc_ok"
arg_type = "void"
return_type = "int"
params = [{ name = "rx_bits", type = "uint8_t[]" }]
nogil = true

[[frame.methods]]
name = "add_field"
doc = "Append one field to a description (see `FrameDesc`). `kind` is a `wfm_seq_kind_t` index -- 0 literal, 1 pn, 2 gold, 3 dotted -- and `lfsr` a `wfm_lfsr` one (0 galois, 1 fibonacci); they are ints rather than the strings the constructor takes because a method parameter cannot yet be a string enum (jm gh-1021), and the C enum is the SSOT either way. Either the caller supplies the bits (`lit`, or a generated `kind`) or a stage derives them (`derived_by` non-zero) -- both are fields, because both are on the wire. Returns the new field's index, which is what `derived_by` and a stage's `first_field` are counted in. Refuses once the frame is built."
arg_type = "void"
return_type = "int"
params = [
    { name = "lit", type = "uint8_t[]" },
    { name = "kind", type = "int", default = "0" },
    { name = "gen_len", type = "size_t", default = "0" },
    { name = "reps", type = "size_t", default = "0" },
    { name = "poly", type = "uint64_t", default = "0" },
    { name = "seed", type = "uint64_t", default = "0" },
    { name = "reg_bits", type = "uint32_t", default = "0" },
    { name = "lfsr", type = "int", default = "0" },
    { name = "taps_a", type = "uint64_t", default = "0" },
    { name = "seed_a", type = "uint64_t", default = "0" },
    { name = "taps_b", type = "uint64_t", default = "0" },
    { name = "seed_b", type = "uint64_t", default = "0" },
    { name = "derived_by", type = "uint32_t", default = "0" },
    { name = "derived_bits", type = "size_t", default = "0" },
]

[[frame.methods]]
name = "add_stage"
doc = "Append one transform and -- the load-bearing part -- the span of fields it covers. `kind` is a `wfm_stage_kind_t` index: 0 crc16, 1 rs, 2 randomise, 3 conv (jm gh-1021 -- a method parameter cannot yet be a string enum). `n_fields = 0` means the stage does not run. A stage that inherited whatever ran before it is the representation that cannot express a CCSDS CADU, where the marker is covered by the inner code and by neither the outer code nor the randomiser."
arg_type = "void"
return_type = "int"
params = [
    { name = "kind", type = "int", default = "0" },
    { name = "first_field", type = "uint32_t", default = "0" },
    { name = "n_fields", type = "uint32_t", default = "0" },
    { name = "depth", type = "uint32_t", default = "0" },
    { name = "emit_num", type = "uint32_t", default = "0" },
    { name = "emit_den", type = "uint32_t", default = "0" },
]

[[frame.methods]]
name = "build"
doc = "Lay out and materialise a description. Where a description is checked: one that cannot produce its own bits is not a frame. Separate from the constructor only because the description arrives over several calls and there is no earlier moment at which it is complete. Raises if it is empty, unbuildable, names a stage no kernel here covers, or was already built."
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"

[[frame.methods]]
name = "check"
doc = "Undo the description's stages over a received frame and report what was found -- the receive mirror of `bits()`, reading the same description, so a transmitter and a receiver holding the same `Frame` cannot disagree about which stage covered what. This is the truth-free frame error rate on a CODED link: it needs no payload truth, so it works on a real capture, and an outer code is a strictly better detector than a CRC because it reports how much repair it took rather than one bit of right-or-wrong. `checked` is smaller than `stages` when the description names a stage the receiver does not reverse here -- the inner code is the case, being undone before frame synchronisation -- and such a stage is reported as not checked, never as passed."
arg_type = "void"
return_type = "frame_check_t"
single = true
record_name = "FrameCheck"
record_doc = "What checking one received frame found. `ok == units` is the verdict; `symbols` is what it cost, which is margin being spent and is visible before it is lost."
record_module = "doppler.wfm"
params = [{ name = "rx_bits", type = "uint8_t[]" }]
result_fields = [
    { name = "passed", type = "int", doc = "Every check good: 1 yes, 0 no. Also 0 when nothing was checked -- see `checked`. Named `passed` rather than `pass` because the obvious name is a Python keyword and `r.pass` will not parse." },
    { name = "stages", type = "uint32_t", doc = "Stages in the description." },
    { name = "checked", type = "uint32_t", doc = "How many were reversed here. 0 means the description carries no reversible stage, which is why `pass` is 0: carrying no check is not the same answer as passing one." },
    { name = "units", type = "uint32_t", doc = "Checks performed: one for a CRC, one per codeword for an interleaved outer code." },
    { name = "ok", type = "uint32_t", doc = "How many came out good -- clean or repaired." },
    { name = "corrected", type = "uint32_t", doc = "How many needed and received repair." },
    { name = "symbols", type = "uint32_t", doc = "Symbol errors repaired across the frame." },
]
nogil = true

[[frame.methods]]
name = "n_fields"
doc = "Fields in the description. A `Frame` built the four-field way reports 4 -- `wfm_frame_t` IS a configuration of the general description, so the indexed view below reads it too."
arg_type = "void"
return_type = "size_t"

[[frame.methods]]
name = "n_stages"
doc = "Stages in the description."
arg_type = "void"
return_type = "size_t"

[[frame.methods]]
name = "field_off"
doc = "Bit offset of field `i`, or 0 if there is no such field."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "field_bits"
doc = "Bits in field `i`, or 0 if there is no such field."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "stage_first"
doc = "First frame bit stage `i` covers; 0 for a stage that did not run."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.methods]]
name = "stage_bits"
doc = "Bits stage `i` covers; 0 for a stage that did not run -- which is how an optional stage is spelled, and why `first` is 0 there too."
arg_type = "void"
return_type = "size_t"
params = [{ name = "i", type = "size_t" }]

[[frame.properties]]
name = "nbits"
type = "size_t"
field = true
