[acq]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Acquisition"
serializable = "true"
# The continuous front door is a second constructor over the shared engine,
# not the default acq_create() (gh-509).
create_fn = "acq_create_continuous"
# C cannot raise a Python warning from a successful create, so the
# under-powered search is surfaced declaratively after construction (gh-481):
# the auto-config still built a best-effort grid (bounded by the internal
# non-coherent-look safety valve), it just cannot reach the requested pd.
warnings = [
  { after = "__init__", condition = "underpowered", category = "UserWarning", message = "Acquisition is under-powered: pd_predicted < pd at this cn0_dbhz. Raise cn0_dbhz or narrow doppler_uncertainty." },
]
# OBJECT-library object files do not propagate transitively through corr2d, so
# fft2d/fft must be linked explicitly (as the spectral module does) for the
# slow-time fft_create + corr2d FFTs. detection_core supplies det_threshold/
# det_pd for the auto-config. det_private.h / the detector2d header are
# header-only (statics + the enum) → no link line needed for them.
depends_on = [
    { name = "corr2d", link = true },
    { name = "fft2d", link = true },
    { name = "fft", link = true },
    { name = "detection", link = true },
    # dp_tlm_probe() is out of line (set_telemetry, a setup path); the emit
    # in the dwell path is the header inline.
    { name = "dp_tlm", link = true },
]
# dp_parallel.h's persistent pool is pthreads (the roll per thread, §2.3).
extra_link_libs = ["Threads::Threads"]

# ── Construction: physics in, grid out ───────────────────────────────────────
# The user states the waveform, front end, and operating point in real units;
# the engine derives the whole search grid (window count, threshold, looks).
# This class is the CONTINUOUS front door (see docs/design/async-dsss-receiver.md's
# Acquisition/BurstAcquisition split): always window-tiles, never
# coherently combines across epochs -- BurstAcquisition (objects/burst_acq.toml)
# is the other front door onto this SAME shared acq_state_t/acq_core.c engine.
# chip_rate / cn0_dbhz carry valid nonzero placeholder defaults so jm's auto-
# doctest builds a non-NULL object; acq_create_continuous still rejects an
# explicit 0.

[[acq.init_params]]
name = "code"
type = "uint8_t[]"

[[acq.init_params]]
name = "spc"
type = "size_t"
default = "4"

[[acq.init_params]]
name = "chip_rate"
type = "double"
default = "1000000.0"

# Continuous data-symbol rate (Hz) -- diagnostic only (exposed via
# epochs_per_symbol), doesn't feed sizing: this engine never coherently
# combines regardless of the data-modulation clock (task #67: coherent
# combining under continuous async data is a structural aliasing mislock,
# not a tunable SNR trade-off).
[[acq.init_params]]
name = "symbol_rate"
type = "double"
default = "1000.0"

[[acq.init_params]]
name = "cn0_dbhz"
type = "double"
default = "50.0"

[[acq.init_params]]
name = "doppler_uncertainty"
type = "double"
default = "0.0"

[[acq.init_params]]
name = "pfa"
type = "double"
default = "1e-3"

[[acq.init_params]]
name = "pd"
type = "double"
default = "0.9"

[[acq.init_params]]
name = "noise_mode"
type = "string_enum:mean,median,min,max"
default = "mean"

# The block-coherent depth (design §2.1/§2.3): D = min((code_only_epochs+1)/2,
# f_epoch/sqrt(2*doppler_rate)), at least 1. The defaults are D = 1 and the
# engine exactly as it ran without them.
[[acq.init_params]]
name = "code_only_epochs"
type = "size_t"
default = "1"
doc = "Whole code-only epochs a waveform's code-only window holds at any chip phase (floor(W_symbols * chips_per_symbol / sf) - 1; design §2.1) -- the engine allows a coherent depth to accommodate such waveforms. 1 = no window: a coherent depth of 1."

[[acq.init_params]]
name = "doppler_rate"
type = "double"
default = "0.0"
doc = "Doppler rate in Hz/s the coherent depth is bounded against (the drift over one block stays inside half a slow-time row); 0 leaves the window as the only bound."

[[acq.methods]]
name = "push"
arg_type = "float _Complex"
return_type = "acq_result_t"
nogil = true
max_results = 64
result_fields = [{name = "doppler_bin", type = "size_t"}, {name = "code_phase", type = "size_t"}, {name = "peak_mag", type = "float"}, {name = "noise_est", type = "float"}, {name = "test_stat", type = "float"}, {name = "cn0_dbhz_est", type = "float"}, {name = "samples_consumed", type = "uint64_t"}]

# Advanced escape hatch: pin the search grid directly, bypassing both
# auto-sizing searches (mirrors Dll's/Costas's configure_lock_raw()). Raises
# ValueError if doppler_bins is outside [1, reps] or n_noncoh outside
# [1, 256] (the internal non-coherent-look safety-valve ceiling). Resizes
# every grid-dependent buffer/plan and clears in-flight accumulation (ring
# contents, the non-coherent power accumulator) -- call between push() calls,
# never a substitute for one.
[[acq.methods]]
name = "configure_search_raw"
doc = "Pin the search grid directly, bypassing both auto-sizing searches -- the advanced escape hatch (mirrors Dll.configure_lock_raw/Costas.configure_lock). Resizes every buffer/plan that depends on the grid (the slow-time FFT, the code correlator, the reference, and every per-frame scratch buffer), re-derives the threshold ladder for the pinned grid from the same physics __init__ used, and clears in-flight accumulation (ring contents, the non-coherent power accumulator, dwell bookkeeping) -- call between push() calls, never a substitute for one. Raises ValueError if doppler_bins is outside [1, reps] or n_noncoh is outside [1, 256] (the internal non-coherent-look safety-valve ceiling)."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "doppler_bins", type = "size_t" },
  { name = "n_noncoh", type = "size_t" },
]

[[acq.methods]]
name = "set_max_peaks"
doc = "How many peaks a dwell may report -- the peak list's capacity (docs/design/async-dsss-receiver.md section 7.1). One (the default) is the classic gated maximum. More lists every peak above the same gate, strongest first, with an exclusion zone of one Doppler bin by one chip around each (one emitter's main lobe, so its own shoulders are not the next peak) and the two-epoch rule for a peak at an already-listed code phase (a data transition inside the epoch splits one emitter into twins at its own code phase on other tiles; such a peak is held for one dwell and listed only if it is still there, at the same tile, on the next). Each listed peak is one record from push(), all of a dwell's sharing samples_consumed and noise_est; a held twin takes one of the n slots that dwell but is not reported. The threshold does not change with n. Raises ValueError outside 1..64. Clears the held candidates."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "n", type = "size_t" },
]

[[acq.properties]]
name = "max_peaks"
type = "size_t"
field = true
doc = "The peak list's capacity per dwell (1 = the classic gated maximum); set with set_max_peaks()."

[[acq.methods]]
name = "set_carrier_freq_hz"
doc = "Couple the code clock to the carrier: the chip rate dilates by doppler_hz / carrier_freq_hz, and the engine accounts for it -- every window tile's epochs are shifted along the code axis by the drift the tile's own frequency implies before the slow-time transform (inside a coherent block of D epochs), and the hand-off advances the hit's code phase by the drift over half the dwell (design section 12.11, 12.12). Config, not running state: not in the state blob, so a resumed engine wants it set again. 0.0 (the default) = uncoupled, the engine as it ran without it. Raises ValueError for a negative or non-finite value."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "carrier_freq_hz", type = "double" },
]

[[acq.properties]]
name = "carrier_freq_hz"
type = "double"
field = true
doc = "RF carrier the Doppler is physically coupled to, Hz (0.0 = uncoupled); set with set_carrier_freq_hz()."

# ── Read-back grid the engine derived ────────────────────────────────────────

[[acq.properties]]
name = "code_bins"
type = "size_t"
field = true
doc = "Code-phase hypotheses searched (= sf*spc, one code period)."

# Unified property: whichever mechanism is active. Always window_bins for this
# (continuous) engine -- coherent_bins is pinned to 1 -- but written with the
# same shared formula BurstAcquisition's identical getter uses, for consistency.
[[acq.properties]]
name = "doppler_bins"
type = "size_t"
# Outer parens are load-bearing: jm renders `expr` as `(cast)<expr>`, so a
# bare ternary would bind the cast to the condition alone.
expr = "(self->handle->window_bins * self->handle->coherent_bins)"
doc = "Native Doppler bins this engine searches: the window-tile count times the block-coherent depth inside each tile (`coherent_bins`), one uniform grid of `doppler_res_hz` over the tiled span in FFT-bin order -- what a hit's `doppler_bin` indexes."

[[acq.properties]]
name = "coherent_bins"
type = "size_t"
field = true
doc = "The block-coherent depth D inside every window tile (design §2.3): epochs per block and Doppler rows per tile. 1 without a code-only window."

[[acq.properties]]
name = "sf"
type = "size_t"
field = true
doc = "Chips per PN segment, inferred from len(code)."

[[acq.properties]]
name = "spc"
type = "size_t"
field = true
doc = "Samples per chip (chip-rate oversample factor)."

[[acq.properties]]
name = "n_noncoh"
type = "size_t"
field = true
doc = "Non-coherent looks per detection (1 = pure coherent)."

[[acq.properties]]
name = "ring_cap"
type = "size_t"
field = true
doc = "Input ring capacity in complex samples."

[[acq.properties]]
name = "noise_lo"
type = "size_t"
field = true
doc = "First CFAR reference bin (inclusive)."

[[acq.properties]]
name = "noise_hi"
type = "size_t"
field = true
doc = "Last CFAR reference bin (inclusive)."

[[acq.properties]]
name = "threshold"
type = "float"
field = true
doc = "CFAR gate on the test statistic (coherent path)."

[[acq.properties]]
name = "eta"
type = "float"
field = true
doc = "Raw per-cell Rayleigh amplitude threshold."

[[acq.properties]]
name = "eta_nc"
type = "float"
field = true
doc = "Non-coherent CFAR threshold (order-N_nc Marcum)."

[[acq.properties]]
name = "pfa_cell"
type = "double"
field = true
doc = "Bonferroni per-cell false-alarm probability over the searched cells."

[[acq.properties]]
name = "pd_predicted"
type = "double"
field = true
doc = "Predicted Pd at cn0_dbhz and the chosen grid: the average Pd over the straddle priors (slow-time scalloping, intra-segment rotation, code-phase sample offset - quadrature over uniform priors), matching what the Monte-Carlo characterization measures rather than the on-grid best case."

[[acq.properties]]
name = "straddle_loss"
type = "double"
field = true
doc = "Mean amplitude derating of the correlation peak from grid straddle (slow-time Doppler scalloping x intra-segment rotation x code-phase sample offset, each averaged over a uniform prior) - a diagnostic summary; 20*log10(straddle_loss) is the loss in dB. Sizing and pd_predicted average Pd itself over the priors (Pd at this mean amplitude would overstate the mean Pd)."

[[acq.properties]]
name = "fs"
type = "double"
field = true
doc = "Sample rate (Hz) = chip_rate * spc."

[[acq.properties]]
name = "chip_rate"
type = "double"
field = true
doc = "Chip rate (Hz)."

[[acq.properties]]
name = "cn0_dbhz"
type = "double"
field = true
doc = "Carrier-to-noise density used to size the search (dB-Hz)."

[[acq.properties]]
name = "doppler_span_hz"
type = "double"
field = true
doc = "Native unambiguous Doppler half-range = +/- chip_rate/(2*sf) Hz."

[[acq.properties]]
name = "doppler_res_hz"
type = "double"
field = true
doc = "Doppler bin width = chip_rate/(sf*doppler_bins) Hz."

[[acq.properties]]
name = "pd"
type = "double"
field = true
doc = "Target detection probability."

[[acq.properties]]
name = "underpowered"
type = "bool"
field = true
doc = "True when pd_predicted < pd -- the search cannot meet the target pd at this cn0_dbhz and geometry. The engine still builds a best-effort grid rather than failing; because C cannot raise a Python warning from a successful create, construction also emits a UserWarning in this case."

[[acq.properties]]
name = "symbol_rate"
type = "double"
field = true
doc = "Continuous data-symbol rate (Hz) this engine was built with -- diagnostic only, doesn't feed sizing (this engine never coherently combines regardless)."

[[acq.properties]]
name = "epochs_per_symbol"
type = "double"
field = true
doc = "(chip_rate/sf)/symbol_rate -- code epochs per data symbol; 0 when symbol_rate is 0."

# ── Observability (design §2.4): telemetry probes and the surface tap ────────
# Attach-on-demand, like Dll/SymSync: detached, every probe site is one
# predicted-not-taken branch per dwell and the surface costs nothing.

[[acq.methods]]
name = "set_threads"
arg_type = "void"
return_type = "int"
status_return = true
params = [{ name = "n", type = "int" }]

[[acq.properties]]
name = "threads"
type = "int"
field = true
doc = "Workers the searcher fans its tiles across, the calling thread included (design §2.3); 1 = serial. Set with set_threads(); a continuous engine with more than one tile starts at the machine's online core count."

[[acq.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", header = "dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

# The last decided dwell's surface in the gate's own units (the per-cell
# test statistic), row-major `surface_rows` x `code_bins`, into a caller
# buffer; returns the cells written, 0 until a dwell has been decided.
# The explicit buffer is the rs_codec.generator shape, not the self-sizing
# `variable_output` one: the surface has exactly one size, so a `count`
# parameter would lie (just-makeit#1042). The first read arms the tap; the
# engine keeps the surface only while a reader is armed.
[[acq.methods]]
name = "surface"
arg_type = "void"
return_type = "size_t"
params = [{ name = "out", type = "float[]", out = true }]

# The surface's axes, for a plot: Doppler in Hz per row and code phase in
# chips per column, the same mappings a hit's DetectionEvent uses.
[[acq.methods]]
name = "surface_doppler_hz"
arg_type = "void"
return_type = "size_t"
params = [{ name = "out", type = "double[]", out = true }]

[[acq.methods]]
name = "surface_chip_phase"
arg_type = "void"
return_type = "size_t"
params = [{ name = "out", type = "double[]", out = true }]

# The complex intermediates behind the surface (design §12.21): what the
# engine already holds per cell before a magnitude is taken, exposed so a
# tracker can read them. Copies, like `surface`; the sizes are the
# engine's own, so no `count` parameter (just-makeit#1042).
#
# The last decided dwell's COMPLEX surface, row-major `surface_rows` x
# `code_bins` in the correlation's own units: the coherent sum's amplitude
# and carrier phase per cell. Coherent path only (`n_noncoh == 1`: a
# non-coherent dwell is a power sum and has no phase); 0 until a dwell has
# been decided.
[[acq.methods]]
name = "surface_complex"
arg_type = "void"
return_type = "size_t"
params = [{ name = "out", type = "float _Complex[]", out = true }]

# One cell's column of the last whole block: the `coherent_bins` per-epoch
# complex correlations at code-phase column `col` of tile `tile`, rolled to
# the tile's centre and shifted by its code-rate hypothesis, as gathered
# before the slow-time transform -- the despread stream at epoch rate.
# 0 at `coherent_bins == 1`, until a block is whole, or for a bad index.
[[acq.methods]]
name = "block_prompt"
arg_type = "void"
return_type = "size_t"
params = [
  { name = "tile", type = "size_t" },
  { name = "col", type = "size_t" },
  { name = "out", type = "float _Complex[]", out = true },
]

# The last whole block's raw samples as pushed, `coherent_bins` x
# `code_bins`: anything can be re-correlated on them at any phase, rate or
# symbol boundary. 0 at `coherent_bins == 1` or until a block is whole.
[[acq.methods]]
name = "block_raw"
arg_type = "void"
return_type = "size_t"
params = [{ name = "out", type = "float _Complex[]", out = true }]

[[acq.properties]]
name = "keep_surface"
type = "int"
field = true
writable = true
doc = "1 keeps every decided dwell's surface for `surface()` (normalised into the gate's units at each decision); 0 (the default) costs nothing. `set_surface_sink()` in C sets it."

[[acq.properties]]
name = "surface_rows"
type = "size_t"
expr = "(self->handle->n_surf / self->handle->code_bins)"
doc = "Rows of the surface `surface()` returns: the Doppler axis in surface units (tiles x interpolated slow-time rows); its columns are `code_bins`."

[[acq.properties]]
name = "surface_at"
type = "size_t"
field = true
doc = "`samples_consumed` of the dwell whose surface `surface()` returns (0 until one has been captured)."

[[acq.properties]]
name = "n_peaks"
type = "size_t"
field = true
doc = "Picks in the last decided dwell, held twins included."

[[acq.properties]]
name = "n_held"
type = "size_t"
field = true
doc = "Picks of the last decided dwell held as same-code-phase twins rather than listed (design §7.1)."

[[acq.properties]]
name = "peak_conc"
type = "float"
field = true
doc = "Concentration of the last dwell's strongest peak: the power of its main lobe (its row and one either side, the exclusion zone's width) over the total power of its code-phase column across every Doppler row and tile. Near 1 for a clean single emitter, even one straddling two tiles; about 0.5 when a data transition splits it into twins two or more tiles away; lower when a coherent block straddles data (design §2.4)."
