[correlator]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Corr2D"
# The constructors are the flavors' (docs/design/correlator.md section 4);
# Corr2D is the 2-D one, and Corr and DelayDoppler are views below.
create_fn = "dp_correlator_create_2d"
depends_on = ["fft2d_core"]
serializable = "true"
fragment = "generated"
# dp_parallel.h's persistent pool is pthreads: the per-row correlations and
# DelayDoppler's map fans each of its stages out over `nthreads` workers.
extra_link_libs = ["Threads::Threads"]
# A NULL create means a parameter was refused, not OOM (gh-482).
create_error = "ValueError"
create_error_message = "Corr2D: invalid parameter (need dwell >= 1, and ny_out and nx_out each 0 or at least the ref extent)"

# The delay-Doppler flavor (#2666): the same single-row correlator, fed the
# RAW stream -- `ny` code periods back to back -- with the slow-time FFT down
# each delay column done in C at dump time, by the library's one
# delay-Doppler map (docs/design/acq-surface.md §18). The constructor takes the 1-D
# code instead of a (ny, nx) reference with the code in row 0, and `ny_out`
# zero-pads the slow-time axis (band-limited Doppler interpolation). nx_out
# and col_out do not apply: the delay axis is native and the whole map is
# the point.
[[correlator.views]]
class_name = "DelayDoppler"
create_fn = "dp_correlator_create_delay_doppler"
init_params = [
  { name = "code", type = "float _Complex[]" },
  { name = "ny", type = "size_t", default = "1" },
  { name = "dwell", type = "size_t", default = "1" },
  { name = "nthreads", type = "int", default = "1" },
  { name = "ny_out", type = "size_t", default = "0" },
]
exclude_properties = ["nx_out", "col_out"]
create_error = "ValueError"
create_error_message = "DelayDoppler: invalid parameter (need a non-empty code, ny >= 1, dwell >= 1, and ny_out 0 or at least ny)"
properties = [
  { name = "doppler_step", type = "double", field = true },
]

# The 1-D flavor (#2752 step 3.2): Corr, which is Corr2D at one row
# (docs/design/correlator.md section 2.1). Its Python face is today's Corr
# until step 4: the 2-D members are excluded and `n` (which Corr2D does not
# expose) is added. `execute` is the shared one: its refusal names the frame
# length as `n`, which is true of every flavor (Corr's n, Corr2D's ny*nx),
# and its exact out= size is Corr's n_out, which a frame never exceeds.
[[correlator.views]]
class_name = "Corr"
create_fn = "dp_correlator_create_1d"
init_params = [
  { name = "ref", type = "float _Complex[]" },
  { name = "dwell", type = "size_t", default = "1" },
  { name = "nthreads", type = "int", default = "1" },
  { name = "n_out", type = "size_t", default = "0" },
]
exclude_properties = ["ny", "nx", "ny_out", "nx_out", "col_out"]
exclude_methods = [
  "execute_all", "execute_coherent", "execute_power_sum",
  "execute_power_max", "execute_peaks", "bank_power_max", "bank_detect",
]
create_error = "ValueError"
create_error_message = "Corr: invalid parameter (need dwell >= 1, and n_out 0 or at least len(ref))"

# Corr's own property docs (#2886 review), the text Corr shipped with on
# main. Its methods (execute, reset, execute_max_out) share the 2-D docs:
# jm merges a view method's `doc` with the parent header's sections instead
# of replacing them, and cannot override a built-in such as reset. That gap
# is just-makeit#2498; the changelog's Breaking entry announces the change.
[[correlator.views.properties]]
name = "n"
type = "size_t"
field = true
doc = "FFT / reference length (samples)."

[[correlator.views.properties]]
name = "n_out"
type = "size_t"
field = true
doc = "Output length (== n unless decoupled)."

[[correlator.views.properties]]
name = "dwell"
type = "size_t"
field = true
doc = "Integration depth; dump every dwell calls."

[[correlator.views.properties]]
name = "count"
type = "size_t"
field = true
doc = "Frames accumulated so far (0 … dwell-1)."


[[correlator.init_params]]
name = "ref"
# TWO-dimensional: the reference is a ny x nx surface, and the manifest had
# under-declared it as 1-D — which is what made jm derive a single `ref_len`
# against a C that takes `(ref, ny, nx)`, the mismatch 0.64.x's CTOR check
# surfaced.
type = "float _Complex[][]"
# gh-1097: the C names the two extents (ny, nx) rather than taking jm's
# derived `ref_dim0`/`ref_dim1`.
# jm already passed both — this names them instead of the derived
# `ref_dim0`/`ref_dim1`.
derived = ["ny", "nx"]

[[correlator.init_params]]
name = "dwell"
type = "size_t"
default = "1"

[[correlator.init_params]]
name = "nthreads"
type = "int"
default = "1"

# Decoupled inverse size (0 => native). A larger output zero-pads the
# cross-spectrum before the inverse → band-limited interpolation of the
# correlation surface onto a finer (ny_out, nx_out) grid. Trailing + default 0
# keeps Corr2D(ref, dwell, nthreads) backward-compatible.
[[correlator.init_params]]
name = "ny_out"
type = "size_t"
default = "0"

[[correlator.init_params]]
name = "nx_out"
type = "size_t"
default = "0"

# Known-column output: emit only this correlation lag (one value per row)
# instead of the whole map. A caller that already knows the lag -- refine
# knows the code phase modulo the epoch -- would otherwise hand-roll the
# lag-0 sum beside this kernel, which is how a second replica of the code
# gets built. Trailing + default -1 (the whole map) keeps
# Corr2D(ref, dwell, nthreads, ny_out, nx_out) backward-compatible.
[[correlator.init_params]]
name = "col_out"
type = "int"
default = "-1"

[[correlator.methods]]
name = "execute"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
# A dump is exactly n_out values, so max_out(state) is exact and an out= of
# that is enough; without this the binding also asked for as many elements as
# the input frame has (ny * nx), which a col_out object (n_out = ny) never
# needs (#2818).
exact_max_out = true
none_on_empty = true
# n_in must equal the frame length; the C kernel REFUSES any other
# with SIZE_MAX (nothing read, written or counted) and jm raises (#1925).
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "input length is not the frame length (n: Corr's n, or ny*nx); execute takes exactly one frame"

# Batches (#2683): H frames back to back in one call, every map or one
# reduction of them, on the C fold loop dp_correlator_execute_fold. One typed
# method per reduction, because the return shapes differ. Each refuses an
# empty batch, a length that is not a whole number of frames, or a short
# out= with SIZE_MAX, which jm raises as ValueError. The GIL is released
# across the kernel; the DelayDoppler view shares every method.
[[correlator.methods]]
name = "execute_all"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
out_cols = "state->n_out"
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_all: the input must be a whole, nonzero number of frames, and out= must hold every map"
nogil = true

[[correlator.methods]]
name = "execute_coherent"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
# One map whatever the batch: max_out(state) is the exact size, not a bound the
# input could exceed, so an out= of exactly that is enough (#2818). Without
# this the binding also asked for as many elements as the input has.
exact_max_out = true
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_coherent: the input must be a whole, nonzero number of frames, and out= must hold one map"
nogil = true

[[correlator.methods]]
name = "execute_power_sum"
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
# One map whatever the batch: max_out(state) is the exact size, not a bound the
# input could exceed, so an out= of exactly that is enough (#2818). Without
# this the binding also asked for as many elements as the input has.
exact_max_out = true
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_power_sum: the input must be a whole, nonzero number of frames, and out= must hold one map"
nogil = true

[[correlator.methods]]
name = "execute_power_max"
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_power_max: the input must be a whole, nonzero number of frames (at most 2**32), and out= must hold one map"
nogil = true

[[correlator.methods]]
name = "execute_peaks"
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t", "uint32_t", "float"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_peaks: the input must be a whole, nonzero number of frames, and out= must hold one record per frame"
nogil = true

[[correlator.methods]]
name = "bank_power_max"
arg_type = "void"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "bank_power_max: needs one frame, L >= 1, g_min <= g_max, rates a whole number of ny-long vectors, and out= holding one map"
nogil = true
params = [{name = "x", type = "float _Complex[]"}, {name = "L", type = "size_t"}, {name = "g_min", type = "int"}, {name = "g_max", type = "int"}, {name = "rates", type = "float _Complex[]"}]

[[correlator.methods]]
name = "bank_detect"
arg_type = "void"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["int32_t", "uint32_t", "uint32_t", "uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "bank_detect: needs one frame, L_d >= 1 dividing L_r, g_min <= g_max, rates a whole number of ny-long vectors, and out= holding one record per map cell"
nogil = true
params = [{name = "x", type = "float _Complex[]"}, {name = "L_d", type = "size_t"}, {name = "L_r", type = "size_t"}, {name = "g_min", type = "int"}, {name = "g_max", type = "int"}, {name = "t_candidate", type = "float"}, {name = "t_confirm", type = "float"}, {name = "rates", type = "float _Complex[]"}]

[[correlator.properties]]
name = "ny"
type = "size_t"
field = true

[[correlator.properties]]
name = "nx"
type = "size_t"
field = true

[[correlator.properties]]
name = "ny_out"
type = "size_t"
field = true

[[correlator.properties]]
name = "nx_out"
type = "size_t"
field = true

[[correlator.properties]]
name = "n_out"
type = "size_t"
field = true

[[correlator.properties]]
name = "col_out"
type = "int"
field = true

[[correlator.properties]]
name = "dwell"
type = "size_t"
field = true

[[correlator.properties]]
name = "count"
type = "size_t"
field = true
