# Collocated: module name == object name, the `ddc` shape. NOT `fec` -- that
# prefix was retired in doppler#828 (30 symbols, 31 files) in favour of
# ccsds_tm_ for the standard's picks and conv_/rs_ for the general codes, and
# a module by that name regenerates the retired prefix straight back into
# its own generated core and binding filenames.
# coding — the general channel codes, as one Python home.
#
# doppler#900. `conv` and `rs` are code FAMILIES that CCSDS configures; they
# are not CCSDS's, and their C components are deliberately separate for that
# reason. What they lacked was a Python home: `Viterbi` shipped in its own
# module (it is one algorithm over one family) and an encoder had nowhere to
# go that read correctly — `viterbi.ConvEncoder` names the decoder to reach
# the encoder, and `[module.conv]` would collide with the hand-owned c_dep
# CMakeLists that already lives at native/src/conv/.
#
# So: one module for the family, holding BOTH directions, with `rs` to
# follow. The umbrella is justified by the second caller rather than invented
# ahead of one.
#
# `Viterbi` moved here from `[module.viterbi]`, which is gone. A module named
# after the DECODING algorithm cannot hold the encoder without reading wrong,
# and jm's `reexports` names submodules of the same package rather than a
# sibling, so a re-export could not bridge them either. Free to move because
# `Viterbi` shipped in no tag — it is `[Unreleased]` as of 0.42.0.
#
# NOT `fec`: doppler#828 retired that identifier prefix across 30 symbols, and
# a module by that name regenerates it into its own generated filenames — the
# retired-names gate catches it, which is the gate working.
# CCSDS 131.0-B's picks, as a module BESIDE the general layer rather than
# inside it (doppler#1220). `ccsds_asm_bits` used to be a function on
# `[module.wfm]`, which meant a CCSDS translation unit compiled into the
# general `wfm_core` and a standard's name in `doppler.wfm.__all__` beside
# `PN` and `Gold` -- and from there into `doppler.detection`'s doctests,
# tests and benchmark. Every other module states in its own docstring that it
# is general (`coding`, below, says "rather than any standard's picks"), so
# there was no honest home for one standard's literal until this one.
#
# This is NOT a Python binding of `ccsds_tm`'s kernels, and must not become
# one: the outer code, the randomiser and the inner code are reached by
# DESCRIBING a CADU through `doppler.wfm.FrameDesc`, which is the general
# door and is the design working (docs/design/frame-description.md). What
# lives here is the standard's published DATA -- the marker today, and
# whatever else is a literal a mission copies out of the Blue Book.
#
# extra_link_libs rather than an object's `depends_on { link = true }`
# because the module has no objects: `ccsds_tm` is a hand-owned c_dep and
# this module is a function over it. conv/rs/wfm_frame come with it -- an
# OBJECT library propagates usage requirements but not its objects, so every
# consumer must name them.
[module.ccsds]
doc = """
CCSDS 131.0-B TM Synchronization and Channel Coding — the literals the standard picked, beside the general layer rather than inside it.

`asm_bits()` is the Attached Sync Marker as bits, which is what a receiver acquires on: pair it with `doppler.detection.SyncFinder` to find where a CADU starts in a bit stream. The standard's *transforms* are not here and are not coming here — describe a CADU with `doppler.wfm.FrameDesc` and the outer code, the randomiser and the inner code run through the general assembler.

So the rule for this module is narrow: a literal a mission copies out of the
Blue Book belongs here; a transform does not.

The marker is also the only thing in a CADU that can report a 180-degree
carrier ambiguity. It is not randomised (131.0-B 10.4: "The ASM was not
randomized and is not derandomized"), so it reads the same in every frame
and in exactly one polarity, while everything else in the frame can be
complemented and still pass: Reed-Solomon is linear and the all-ones vector
is itself a codeword, so a global flip lands on another codeword.
`SyncFinder`'s `inverted` is what sees it.

Examples
--------
>>> from doppler.ccsds import asm_bits
>>> b = asm_bits()
>>> int("".join(map(str, b.tolist())), 2) == 0x1ACFFC1D
True

It is what a receiver acquires on:

>>> import numpy as np
>>> from doppler.detection import SyncFinder
>>> stream = np.random.default_rng(1220).integers(0, 2, 500, dtype=np.uint8)
>>> stream[173 : 173 + b.size] = b
>>> f = SyncFinder(np.asarray(b))
>>> hit = f.find(stream, max_errors=f.max_errors_for(96, pfa=1e-3))
>>> (hit.found, hit.offset, hit.inverted)
(1, 173, 0)

"""
objects = []
extra_link_libs = ["ccsds_tm_core", "conv_core", "rs_core", "wfm_frame_core", "cvt_core", "pn_core", "gold_core"]

# The Attached Sync Marker as bits a Python receiver can search for.
#
# doppler#900 (2b). Without it the only Python path to the marker is to
# transcribe `0x1ACFFC1D` MSB-first by hand -- which is precisely the hazard
# `dp_ccsds_tm_asm_bits` exists to remove ("an MSB-first expansion written out
# twice is a transcription that can disagree with itself"), and which this
# tree's own `.pyi` doctests were doing in four places.
[[module.ccsds.functions]]
name = "asm_bits"
doc = "The CCSDS Attached Sync Marker, 0x1ACFFC1D, as 32 unpacked bits — `out[0]` is the first bit on the wire (the top of 0x1A). Pass it to `doppler.detection.SyncFinder` to acquire a CADU in a bit stream; it is NOT randomised, so it reads the same in every frame and in exactly one polarity, which is what makes it the thing that reports a 180-degree carrier ambiguity."
out_type = "uint8_t"
variable_output = true
out_size = "32"
