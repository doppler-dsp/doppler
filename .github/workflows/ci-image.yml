name: CI image

# VENDORED from canonical (HAS_CI_IMAGE) -- change it there, not here;
# standard-check fails on any difference. Every per-repo value comes from
# `make ci-image-config` (the Makefile), every pin decision from
# scripts/ci-image.py, so this file holds no second copy of either.
#
# Builds the CI toolchain image (docker/ci.Dockerfile), one per base in
# CI_IMAGE_BASES, natively on amd64 AND arm64 -- no emulation, so the smoke
# target really runs on both -- and repins .github/ci-images.env ONLY when a
# package fingerprint or the image's sources moved. A new apt snapshot alone
# is not a change, so a quiet week opens nothing.
#
# - schedule (weekly) or dispatch with refresh: pick new inputs (snapshot,
#   base digests, the just-bashit release), build, compare, repin through
#   CI_IMAGE_LANDING: a PR, or a pushed ci/repin-image branch where the org
#   forbids Actions from opening PRs.
# - a push to a non-default branch that touches the image's sources: build
#   from the PINNED inputs and commit the new pin onto that branch, so the
#   PR carries its own pin and `make ci-image-check` passes.
#
# With HAS_PACKAGER_IMAGE on, the packager image (docker/packager.Dockerfile,
# CI_PACKAGER_*) is built here too, in the same matrix, as its own family. It
# is off unless the Makefile turns it on, and every step that serves it is
# skipped otherwise: an adopter without it runs this workflow as before.
#
# A push or PR made with GITHUB_TOKEN starts no workflow, so a repin
# dispatches CI_IMAGE_CI_WORKFLOW on its branch.

on:
  schedule:
    # Monday 04:23 UTC, off the hour to avoid the scheduler's peak.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Pick new inputs (snapshot, base digests, installer) first
        type: boolean
        default: false
  push:
    # Not the default branch: a merged change already carried its pin, and
    # rebuilding it there would only re-resolve inputs nobody asked to move.
    branches-ignore: [main, master]
    paths:
      - docker/ci.Dockerfile
      - docker/packager.Dockerfile
      - docker/ci-extra.sh
      - bootstrap.toml
      - .github/workflows/ci-image.yml

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` under pipefail. GitHub's default shell is `bash -e {0}`, which
# takes a pipeline's status from its LAST command, so a failure left of a
# `|` -- `$(make -s ci-image-config | sed ...)`, `gh api ... | jq` -- is
# silently green. `shell: bash` is GitHub's alias for `bash -eo pipefail`.
# Adopters vendor this file verbatim, and doppler's ci-pipefail gate
# refused it without this (doppler#1819).
defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve the inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      repo: ${{ steps.cfg.outputs.repo }}
      groups: ${{ steps.cfg.outputs.groups }}
      smoke: ${{ steps.cfg.outputs.smoke }}
      landing: ${{ steps.cfg.outputs.landing }}
      ci_workflow: ${{ steps.cfg.outputs.ci_workflow }}
      tag: ${{ steps.cfg.outputs.tag }}
      owed: ${{ steps.owed.outputs.owed }}
      # The packager image (HAS_PACKAGER_IMAGE): set only when the adopter
      # turns it on, so an adopter without it sees these outputs empty.
      packager: ${{ steps.cfg.outputs.packager }}
      packager_matrix: ${{ steps.cfg.outputs.packager_matrix }}
      packager_repo: ${{ steps.cfg.outputs.packager_repo }}
      packager_groups: ${{ steps.cfg.outputs.packager_groups }}
    steps:
      - uses: actions/checkout@v7.0.1

      # A branch push builds only when the pin is OWED: when this tree's image
      # sources no longer match it. A release bump edits bootstrap.toml's
      # [project] version, which the source hash leaves out, so it owes
      # nothing and builds nothing; before this, every release branch built
      # every base on both arches to change a string no layer reads. The
      # weekly run and a dispatch always build: they exist to ask.
      - id: owed
        run: |
          # The packager's sources owe a rebuild too, when it is on. grep -q
          # fails when it is off, so an adopter without it is unchanged.
          if [ "${{ github.event_name }}" = push ] && make -s ci-image-check \
             && { ! make -s ci-image-config | grep -qx packager=1 \
                  || make -s packager-image-check; }; then
            echo "owed=false" >> "$GITHUB_OUTPUT"
          else
            echo "owed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - id: cfg
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make -s ci-image-config >> "$GITHUB_OUTPUT"
          bases=$(make -s ci-image-config | sed -n 's/^bases=//p')
          export CI_IMAGE_BASES="$bases"
          # Where a refresh reads each base's digest from (#139); empty is
          # Docker Hub, as before.
          CI_IMAGE_BASE_REGISTRY=$(make -s ci-image-config | sed -n 's/^base_registry=//p')
          CI_IMAGE_BASE_MIRROR=$(make -s ci-image-config | sed -n 's/^base_mirror=//p')
          export CI_IMAGE_BASE_REGISTRY CI_IMAGE_BASE_MIRROR
          # The packager is on only when the Makefile says so: then its per-arch
          # bases join the inputs, and its two arches join the matrix below.
          pk=$(make -s ci-image-config | sed -n 's/^packager=//p')
          if [ "$pk" = 1 ]; then
            export PACKAGER_IMAGE_ENABLED=1
            export PACKAGER_BASE_AMD64=$(make -s ci-image-config | sed -n 's/^packager_base_amd64=//p')
            export PACKAGER_BASE_ARM64=$(make -s ci-image-config | sed -n 's/^packager_base_arm64=//p')
          fi
          flag=; [ "$REFRESH" = true ] && flag=--refresh
          python3 scripts/ci-image.py inputs $flag > inputs.env
          cat inputs.env
          # base x arch, each on its native runner.
          matrix=$({
          for b in $bases; do
            for a in amd64:ubuntu-latest arm64:ubuntu-24.04-arm; do
              printf '{"base":"%s","key":"%s","arch":"%s","runs_on":"%s"}\n' \
                "$b" "$(python3 scripts/ci-image.py key "$b")" \
                "${a%%:*}" "${a#*:}"
            done
          done
          } | jq -sc '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # The packager has its own job and matrix, set only when it is on.
          if [ "$pk" = 1 ]; then
            pmatrix=$(for a in amd64:ubuntu-latest arm64:ubuntu-24.04-arm; do
              printf '{"arch":"%s","runs_on":"%s"}\n' "${a%%:*}" "${a#*:}"
            done | jq -sc '{include: .}')
            echo "packager_matrix=$pmatrix" >> "$GITHUB_OUTPUT"
          fi
          snap=$(sed -n 's/^CI_APT_SNAPSHOT=//p' inputs.env)
          echo "tag=${snap}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ci-image-inputs
          path: inputs.env
          if-no-files-found: error

  build:
    name: Build and smoke (${{ matrix.key }}, ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.owed == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: ci-image-inputs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke, push
        env:
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          # Not GROUPS: bash's GROUPS is a builtin array of the user's gids,
          # so `$GROUPS` would expand to a gid and install no group at all.
          IMAGE_GROUPS: ${{ needs.resolve.outputs.groups }}
          KEY: ${{ matrix.key }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          . ./inputs.env
          # The pinned base, fetched from the registry that answers a
          # manifest probe under retry (CI_IMAGE_BASE_REGISTRY, else its
          # mirror): this build pulls inside BuildKit's own container, where
          # nothing retries a rate limit (#139, doppler-dsp/doppler#1982).
          base_ref=$(make -s ci-image-base REF="$(eval echo "\$CI_BASE_$KEY")")
          img="$REPO:$KEY-$TAG-$ARCH"
          # --provenance/--sbom off: the index the publish job builds must
          # name exactly the platform images, so a pinned digest resolves to
          # a runnable image on either arch.
          docker buildx build --load --provenance=false --sbom=false \
            -f docker/ci.Dockerfile \
            --build-arg BASE="$base_ref" \
            --build-arg APT_SNAPSHOT="$CI_APT_SNAPSHOT" \
            --build-arg JB_VERSION="$CI_JB_VERSION" \
            --build-arg JB_SHA256="$CI_JB_SHA256" \
            --build-arg CI_IMAGE_GROUPS="$IMAGE_GROUPS" \
            -t "$img" .
          # The smoke runs BEFORE anything is pushed, natively, on this arch.
          make ci-image-smoke IMAGE="$img"
          docker push "$img"
          fp=$(docker run --rm "$img" cat /etc/ci-image-fingerprint)
          mkdir -p out
          echo "$ARCH=$fp" > "out/fp-$KEY-$ARCH"
          echo "$KEY $ARCH fingerprint $fp"

      - uses: actions/upload-artifact@v7
        with:
          name: ci-image-fp-${{ matrix.key }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # The packager, in its own job: a job that runs setup-buildx-action is one
  # the stock-pull gate reads as a container-driver build, so this one does
  # not. It builds on the classic builder, on the daemon, for this arch, from
  # the pin's CI_PACKAGER_BASE_<ARCH> (a manylinux_2_28 base), and pushes to its
  # own repository. It runs only when the packager is on.
  packager:
    name: Build and smoke (packager, ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.owed == 'true' && needs.resolve.outputs.packager == '1'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.resolve.outputs.packager_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: ci-image-inputs

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke, push (packager)
        env:
          REPO: ${{ needs.resolve.outputs.packager_repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PKG_GROUPS: ${{ needs.resolve.outputs.packager_groups }}
          KEY: packager
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          . ./inputs.env
          base_ref=$(eval echo "\$CI_PACKAGER_BASE_${ARCH^^}")
          img="$REPO:$KEY-$TAG-$ARCH"
          # The build is the Makefile's (packager-image-build, standard.mk):
          # this file holds no `docker build` of its own.
          make packager-image-build IMAGE="$img" BASE="$base_ref" \
            CI_JB_VERSION="$CI_JB_VERSION" CI_JB_SHA256="$CI_JB_SHA256" \
            PACKAGER_GROUPS="$PKG_GROUPS"
          # Smoked before anything is pushed, natively, on this arch.
          make packager-image-smoke IMAGE="$img"
          docker push "$img"
          fp=$(docker run --rm "$img" cat /etc/packager-image-fingerprint)
          mkdir -p out
          echo "$ARCH=$fp" > "out/fp-$KEY-$ARCH"
          echo "$KEY $ARCH fingerprint $fp"

      - uses: actions/upload-artifact@v7
        with:
          name: ci-image-fp-packager-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  publish:
    name: Repin if anything moved
    needs: [resolve, build, packager]
    # Not `success()` alone: a skipped dependency skips this job, and the
    # packager job is skipped whenever the packager is off. So this names the
    # results it needs -- the CI build's success, the packager's success or
    # skip -- and still never runs when nothing was owed or something failed.
    if: >-
      always() && !cancelled() && needs.resolve.outputs.owed == 'true' &&
      needs.build.result == 'success' &&
      (needs.packager.result == 'success' || needs.packager.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the arches and assemble the pin
        id: pin
        env:
          REPO: ${{ needs.resolve.outputs.repo }}
          TAG: ${{ needs.resolve.outputs.tag }}
          # The packager's keys are written and compared only when it is on.
          PACKAGER_IMAGE_ENABLED: ${{ needs.resolve.outputs.packager }}
          PREPO: ${{ needs.resolve.outputs.packager_repo }}
          PACKAGER_GROUPS: ${{ needs.resolve.outputs.packager_groups }}
        run: |
          set -euo pipefail
          CI_IMAGE_BASES=$(make -s ci-image-config | sed -n 's/^bases=//p')
          export CI_IMAGE_BASES
          {
            cat art/inputs.env
            for b in $CI_IMAGE_BASES; do
              k=$(python3 scripts/ci-image.py key "$b")
              docker buildx imagetools create -t "$REPO:$k-$TAG" \
                "$REPO:$k-$TAG-amd64" "$REPO:$k-$TAG-arm64"
              d=$(docker buildx imagetools inspect "$REPO:$k-$TAG" \
                    --format '{{json .Manifest}}' | jq -r .digest)
              echo "CI_IMAGE_$k=$REPO@$d"
              # One `arch=fp` word per file, one file per arch.
              mapfile -t fps < <(cat "art/fp-$k-"*)
              echo "CI_IMAGE_FINGERPRINT_$k=$(python3 scripts/ci-image.py \
                join-fingerprint "${fps[@]}")"
            done
            echo "CI_IMAGE_SOURCE_HASH=$(python3 scripts/ci-image.py source-hash)"
            if [ "$PACKAGER_IMAGE_ENABLED" = 1 ]; then
              # One multi-arch index over the two arches, as the CI image's.
              docker buildx imagetools create -t "$PREPO:packager-$TAG" \
                "$PREPO:packager-$TAG-amd64" "$PREPO:packager-$TAG-arm64"
              d=$(docker buildx imagetools inspect "$PREPO:packager-$TAG" \
                    --format '{{json .Manifest}}' | jq -r .digest)
              echo "CI_PACKAGER_IMAGE=$PREPO@$d"
              mapfile -t fps < <(cat "art/fp-packager-"*)
              echo "CI_PACKAGER_FINGERPRINT=$(python3 scripts/ci-image.py \
                join-fingerprint "${fps[@]}")"
              echo "CI_PACKAGER_SOURCE_HASH=$(python3 scripts/ci-image.py \
                packager-source-hash)"
            fi
          } | python3 scripts/ci-image.py write-pin --out new-pin.env
          python3 scripts/ci-image.py changed --new new-pin.env >> "$GITHUB_OUTPUT"
          cat new-pin.env
          cat new-pin.env >> "$GITHUB_STEP_SUMMARY"

      - name: Land the repin
        if: steps.pin.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          LANDING: ${{ needs.resolve.outputs.landing }}
          CI_WORKFLOW: ${{ needs.resolve.outputs.ci_workflow }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp new-pin.env .github/ci-images.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT" ]; then
            branch="ci/repin-image"
            git switch -C "$branch"
          else
            branch="$GITHUB_REF_NAME"
          fi
          git add .github/ci-images.env
          git commit -m "chore(ci): repin the CI toolchain image $TAG"
          git push -f origin "HEAD:$branch"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT" ]; then
            if [ "$LANDING" = pr ]; then
              gh pr view "$branch" >/dev/null 2>&1 \
                || gh pr create --base "$DEFAULT" --head "$branch" \
                     --title "chore(ci): repin the CI toolchain image" \
                     --body "Opened by ci-image.yml (run $GITHUB_RUN_ID): a package fingerprint or the image's sources moved. CI on this PR runs on the new image; merging adopts it."
            else
              echo "Repin pushed to $branch. Land it: gh pr create --head $branch --fill" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          gh workflow run "$CI_WORKFLOW" --ref "$branch"

      # LAST, and the reason a branch-landing run can end red with nothing
      # broken. With no PR, a pushed repin is visible only on a branch list,
      # and a green run notifies nobody: in doppler-dsp an unlanded repin sat
      # for an hour while it blocked work (doppler#1737). So on the default
      # branch, EVERY run -- not just the one that pushed -- fails while
      # ci/repin-image's pin differs from the default branch's, until a
      # human lands it. PR landing needs none of this: the open PR is the
      # signal, and only it waits.
      - name: An unlanded repin keeps this run red
        if: >-
          needs.resolve.outputs.landing == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # ls-remote, not a failed fetch: a fetch also fails on a network or
          # auth error, and reading that as "absent" would be the quiet green
          # this step exists to prevent. rc 2 = no such branch; 0 = present;
          # anything else is unknown, and unknown is red.
          rc=0
          git ls-remote --exit-code --heads origin ci/repin-image \
            >/dev/null || rc=$?
          case "$rc" in
            0) ;;
            2) echo "no ci/repin-image: nothing owed"; exit 0 ;;
            *) echo "::error::cannot tell whether ci/repin-image exists" \
                    "(git ls-remote exited $rc)"; exit 1 ;;
          esac
          git fetch -q origin "$DEFAULT" ci/repin-image
          if git diff --quiet "origin/$DEFAULT" origin/ci/repin-image \
               -- .github/ci-images.env; then
            echo "ci/repin-image matches $DEFAULT: nothing owed"; exit 0
          fi
          {
            echo "## A CI image repin is waiting to land"
            echo
            echo 'gh pr create --head ci/repin-image --fill'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ci/repin-image carries a pin $DEFAULT does not;" \
               "land it: gh pr create --head ci/repin-image --fill"
          exit 1
