[Resampler]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
serializable = "true"
depends_on = ["resamp"]
fragment = "generated"
# A NULL create means a parameter was out of range, not OOM (gh-482).
create_error = "ValueError"
create_error_message = "Resampler: invalid parameter (need rate finite and > 0; a bank of num_phases a power of two, num_taps >= 1)"

[[Resampler.init_params]]
name = "rate"
type = "double"
# 1.0, not 0.0: a rate must be finite and > 0 (dp_resamp_rate_ok), so a
# bare Resampler() is the unity-rate one, as RateConverter's is (#2640).
default = "1.0"

[[Resampler.init_params]]
name = "bank"
type = "float[][]"
doc = """\
Optional polyphase bank: a 2-D float32 array of shape (num_phases,
num_taps), num_phases a power of two. Omit for the built-in 4096x19
Kaiser bank."""
optional = true
create_fn = "dp_Resampler_create_custom"
derived = ["num_phases", "num_taps"]

[[Resampler.methods]]
name = "execute"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
params = [{name = "x", type = "float _Complex[]"}]
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true

[[Resampler.methods]]
name = "execute_ctrl"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
# The kernel returns the count, or a negative DP_ERR_* when `ctrl` is
# shorter than `x`: a count of 0 is a valid answer here.
count_type = "int64_t"
error_negative = true
error = "ValueError"
error_message = "ctrl must be at least as long as x"
params = [{name = "x", type = "float _Complex[]"}, {name = "ctrl", type = "double[]"}]
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true

[[Resampler.methods]]
name = "reset"
arg_type = "void"
return_type = "void"

[[Resampler.properties]]
name = "rate"
type = "double"
writable = true
# The C setter refuses and keeps the rate; jm raises on its non-zero
# return (doppler#2640).
error = "ValueError"
error_message = "Resampler: rate must be finite and > 0"

[[Resampler.properties]]
name = "ctrl_acc"
type = "double"

# execute_ctrl stops at a full out and leaves the rest of x unread; this says
# where to resume (doppler#2643).
[[Resampler.properties]]
name = "consumed"
type = "size_t"

[[Resampler.properties]]
name = "num_phases"
type = "size_t"

[[Resampler.properties]]
name = "num_taps"
type = "size_t"

[[Resampler.properties]]
name = "delay"
type = "double"

# gh-428 manual_stub: hand-written .pyi symbol (see status_allow rationale).
