name: CI

on:
  push:
    branches: [ main, develop ]
  # No base-branch filter: a stacked PR (base = another feature branch) must
  # get the same CI as one targeting main — an unfiltered pull_request event
  # runs on every PR, while the push trigger above keeps post-merge runs
  # scoped to the long-lived branches (no double-run for feature pushes).
  pull_request:

# A force-push to a PR (routine while a stacked branch rebases) supersedes
# the in-flight run — cancel it. Pushes to main/develop never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Native C build + CTest on Ubuntu and macOS
  # ------------------------------------------------------------------
  # Split from the macOS leg because `container:` is Linux-only and a
  # job-level container cannot be switched off for one matrix leg. The STEPS
  # are not split -- both jobs run .github/actions/build-test-suite -- and
  # neither are the check NAMES, which branch protection requires by string.
  build-and-test-linux:
    name: Build on ${{ matrix.os }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two images, not one, and that is the point: these legs exist to
        # test two glibcs (2.35 and 2.39). Pointing both at a single image
        # would leave the matrix naming two environments while testing one.
        # (The 2.28 FLOOR is a different question, answered by the glibc-228
        # job below and by manylinux_2_28 wheels at release.)
        include:
          - os: ubuntu-22.04
            image: ghcr.io/doppler-dsp/doppler-ci@sha256:87b852bde18e02108b83dbbd786906384d2fa475507a492f2ceea1b7ab5b6f55
          - os: ubuntu-24.04
            image: ghcr.io/doppler-dsp/doppler-ci@sha256:ba070a9b2ebc674f956026160ca806a3e7a572e4553a95cc67c6d4fe13bde6d4
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    # No provisioning step: the toolchain is the image.

    - uses: ./.github/actions/ccache
      with:
        key: build-${{ matrix.os }}

    - name: Build
      run: make build

    - name: Test
      run: make test

    # dp_isotime.h follows just-bashit's `iso-8601-basic` rather than defining
    # the format itself, so the reference has to be present for the agreement
    # to be checkable at all. Clone it and set ISOTIME_REQUIRE=1: without the
    # flag a missing checkout would SKIP, and a gate that skips in CI is a
    # gate that stopped gating without saying so.
    - name: Check ISO 8601 parity with just-bashit
      run: |
        # macOS ships BSD date, and BOTH sides of this comparison want GNU:
        # just-bashit's own helper picks `gdate` when it is there, and this
        # gate needs it to split an instant into the (seconds, nanoseconds)
        # pair the C API takes. Installing it keeps the check REQUIRED on
        # every platform doppler ships a wheel for, rather than quietly
        # Linux-only -- the C side formats through the platform libc's
        # gmtime_r, so parity on Linux does not prove parity on macOS.
        if [ "$RUNNER_OS" = "macOS" ]; then
            brew install coreutils
        fi
        git clone --depth 1 https://github.com/just-buildit/just-bashit.git \
            "$RUNNER_TEMP/just-bashit"
        make check-isotime-parity ISOTIME_REQUIRE=1 \
            JUST_BASHIT="$RUNNER_TEMP/just-bashit"

    - name: Example smoke tests
      run: make test-examples

    - name: Rust FFI tests
      run: make test-rust

    - name: Compiler-cache statistics
      # In the log on purpose: a cache that stops hitting has no symptom
      # other than builds slowly getting longer.
      run: make ccache-stats

    # Early portability signal: the release pipeline already objdumps every
    # wheel .so for leaked AVX (release.yml), but only on tags — too late to
    # catch a flag regression in review. The default `make build` here uses the
    # portable baseline (x86-64-v2, no AVX), identical to the manylinux wheel,
    # so any %ymm/%zmm outside a runtime-dispatched *avx512* function means
    # -march=native (or a stray wide-SIMD flag) leaked into the default build.
    # x86_64 Linux only: macOS is arm64 (NEON, no AVX) and Windows isn't shipped.
    - name: Verify portable SIMD + C++-free build
      # Wide SIMD outside a runtime-dispatched *avx512* function means a flag
      # leaked into the default build -- a wheel that SIGILLs on a user's CPU.
      # The C++ check keeps the library pure C: no libstdc++, no CXXABI, -lm
      # only. Both read ELF, hence Linux only; the link smoke below is not.
      run: make abi-check

    - name: Smoke-test static link (libdoppler.a -lm -lpthread)
      # The question a downstream actually asks, answered on every platform.
      run: make link-check

    - name: Verify installed headers declare only what the libraries define
      # `native/inc/` is installed wholesale, so a header there is a
      # PUBLISHED C API whether or not anything implements it. Two declared
      # an API that was never built (#801) and a third block survived a
      # rename; a downstream could read them, include them, and fail at
      # link time. Reads `nm`, so it needs the build above.
      run: make installed-headers-check

    - name: Smoke-test the three consumer faces (cc / CMake / pkg-config)
      # Installs the fresh build to a scratch prefix and builds the
      # core+stream consumer via all three documented faces, asserting
      # identical output. The docs' "Compile it — three ways" snippets
      # are --8<-- included from build-three-ways.sh itself, so this
      # proves exactly what readers copy. Same target a dev runs;
      # release-smoke.sh runs the same script against the published
      # tarball on every release (x86_64, aarch64, macOS).
      run: make consumer-faces-check

  # Windows is intentionally unsupported: signal-processing users on Windows
  # run under WSL2, a VM, or a container. Dropping it removed the flaky MSYS2
  # toolchain setup and the MinGW build/test matrix.
  #
  # macOS still provisions with brew, because there is no macOS container to
  # bake: `make install-deps` is the one dep command a developer also runs and
  # it auto-detects apt vs brew, so this stays exactly as it was.
  build-and-test-macos:
    name: Build on macos-latest
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      timeout-minutes: 25
      run: make install-deps-ci

    - name: Build
      run: make build

    - name: Test
      run: make test

    # dp_isotime.h follows just-bashit's `iso-8601-basic` rather than defining
    # the format itself, so the reference has to be present for the agreement
    # to be checkable at all. Clone it and set ISOTIME_REQUIRE=1: without the
    # flag a missing checkout would SKIP, and a gate that skips in CI is a
    # gate that stopped gating without saying so.
    - name: Check ISO 8601 parity with just-bashit
      run: |
        # macOS ships BSD date, and BOTH sides of this comparison want GNU:
        # just-bashit's own helper picks `gdate` when it is there, and this
        # gate needs it to split an instant into the (seconds, nanoseconds)
        # pair the C API takes. Installing it keeps the check REQUIRED on
        # every platform doppler ships a wheel for, rather than quietly
        # Linux-only -- the C side formats through the platform libc's
        # gmtime_r, so parity on Linux does not prove parity on macOS.
        if [ "$RUNNER_OS" = "macOS" ]; then
            brew install coreutils
        fi
        git clone --depth 1 https://github.com/just-buildit/just-bashit.git \
            "$RUNNER_TEMP/just-bashit"
        make check-isotime-parity ISOTIME_REQUIRE=1 \
            JUST_BASHIT="$RUNNER_TEMP/just-bashit"

    - name: Example smoke tests
      run: make test-examples

    - name: Rust FFI tests
      run: make test-rust

    - name: Smoke-test static link (libdoppler.a -lm -lpthread)
      # The question a downstream actually asks, answered on every platform.
      run: make link-check

    - name: Smoke-test the three consumer faces (cc / CMake / pkg-config)
      # Installs the fresh build to a scratch prefix and builds the
      # core+stream consumer via all three documented faces, asserting
      # identical output. The docs' "Compile it — three ways" snippets
      # are --8<-- included from build-three-ways.sh itself, so this
      # proves exactly what readers copy. Same target a dev runs;
      # release-smoke.sh runs the same script against the published
      # tarball on every release (x86_64, aarch64, macOS).
      run: make consumer-faces-check

  # ------------------------------------------------------------------
  # Python package build + pytest
  # ------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No provisioning step: the toolchain is the image. See
    # deploy/docker/Dockerfile.ci and .github/ci-images.env.
    container:
      image: ghcr.io/doppler-dsp/doppler-ci@sha256:ba070a9b2ebc674f956026160ca806a3e7a572e4553a95cc67c6d4fe13bde6d4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ccache
      with:
        key: python

    - name: Install uv + Python + package deps
      uses: ./.github/actions/setup-uv
      with:
        python-version: ${{ matrix.python-version }}
        sync: --group dev

    - name: Start NATS JetStream broker (for nats:// stream tests)
      # The stream suite's nats:// tests self-skip when 127.0.0.1:4222 is
      # unreachable; start a JetStream broker so they actually run in CI.
      # A service container can't pass the `-js` flag, so run it explicitly.
      # Started here, before any build/test step, because the "Doctest
      # generated stubs" step below now needs a live broker too (stream.pyi's
      # examples create real nats:// Publisher/Push/etc. handles).
      #
      # `make nats-up`, not a bare `bash scripts/...`: gates-check only sees
      # `make <target>`, so as a raw script call the step that decides whether
      # a whole transport is exercised was invisible to it.
      run: make nats-up

    - name: Build C library
      run: make build

    - name: Build Python C extensions
      run: make pyext

    - name: Compiler-cache statistics
      # In the log on purpose: a cache that stops hitting has no symptom
      # other than builds slowly getting longer.
      run: make ccache-stats

    - name: Doctest generated stubs
      # The .pyi docstrings are derived from each _core.h's Doxygen by jm.
      # Run their synthesized examples against the freshly built extensions so
      # a doc that no longer matches the API fails CI ("passing examples
      # everywhere"). Only the .pyi files are collected as doctest sources.
      run: make test-stubs

    - name: Doctest API reference pages
      # jm synthesizes .pyi docstrings for *objects* but not module-level free
      # functions (detection, spectral helpers, ...), so those modules' runnable
      # examples live in their curated docs/api/*.md page instead. Gate them the
      # same way: any `>>>` example on an API page must pass against the build.
      run: make test-api-docs

    - name: Doc fence gates (python + C + shell)
      # Fail-closed, and discovered rather than registered, so a NEW page is
      # gated on arrival: every ```python fence under docs/ is executed or
      # output-checked; every ```c fence is compiled and run against the freshly
      # built build/libdoppler.a; every documented CLI line is parsed against the
      # real argparse parser and the safe ones execute end-to-end under bash -e.
      # Backlogs: docs/.doc-snippet-ignore, docs/.c-doc-snippet-ignore. See
      # docs/dev/contributing/doc-examples.md.
      #
      # All three are version-independent, so they run once rather than on all
      # six interpreters. One target rather than three steps because they fail
      # as a group -- a broken page usually breaks more than one fence class,
      # and `make test-snippets` reports all three instead of stopping at the
      # first, which is a whole CI round trip per class.
      if: matrix.python-version == '3.12'
      run: make test-snippets

    - name: Test
      # The fence gates are version-independent and have their own step above
      # (3.12 only); `make test-python` excludes those markers by definition, so
      # local and CI select exactly the same tests.
      #
      # No PYTEST_ARGS here: this is every version except the one that keeps a
      # report, and coverage that is computed and discarded is just a slower
      # test run. The Python line coverage is uploaded from 3.12 (below), and
      # the number the patch gate actually reads comes from the `coverage` job,
      # which measures C ∪ Python ∪ Rust against one instrumented build.
      if: matrix.python-version != '3.12'
      run: make test-python

    - name: Test with coverage
      # 3.12 only -- the version whose coverage.xml is uploaded.
      if: matrix.python-version == '3.12'
      run: |
        make test-python PYTEST_ARGS="--cov \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml"

    - name: Python example smoke tests
      # BEFORE nats-down, deliberately. The examples gate runs the
      # broker-dependent examples -- the conditional `broker:` entries in
      # both skip registries, and the two-process pairs -- and every one of
      # them SELF-SKIPS when 127.0.0.1:4222 is unreachable. Stopping the
      # broker first therefore left this step green while exercising none of
      # them: the failure mode the whole self-skip idiom is supposed to
      # avoid, moved one step later.
      run: make test-examples-python

    - name: Stop NATS broker
      if: always()
      run: make nats-down

    - name: Validation reports are not stale
      # `results.md` is the deliverable -- committed on purpose, linked from
      # the validation log, and what a caller reads instead of running the
      # sweep. Nothing noticed a committed one drifting from the `validate.py`
      # that produced it: this target sat in GATES_DEPS with no CI home, and
      # no job runs `make gates` (#816).
      #
      # The first attempt at this step failed, and usefully: four reports came
      # back STALE here while all eleven were up to date locally. The reports
      # had never been reproducible off the machine that generated them,
      # because `--check` byte-compared MEASUREMENTS -- error counts move
      # between toolchains, and SER, loss and EVM move with them, all well
      # inside the measurement's own ~7% standard error. `--check` now gates
      # STRUCTURE (sections, prose, claim wording, verdicts, citations) and
      # leaves the numbers to each object's limits test, which asserts them
      # with per-quantity thresholds in the units they belong to (#820).
      #
      # Verified against the toolchain that broke it -- gcc 13.3 / glibc 2.39
      # in a container, against this box's 15.2 / 2.43 -- where all eleven now
      # pass. Version-independent, so once, like the fence gates; 23 s for all
      # eleven.
      if: matrix.python-version == '3.12'
      run: make validate-check

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: matrix.python-version == '3.12'
      with:
        name: coverage-report
        path: coverage.xml

  # ------------------------------------------------------------------
  # glibc 2.28 compatibility (Debian 10 / Buster)
  # Catches any accidental use of glibc symbols > 2.28 at build time.
  # ------------------------------------------------------------------
  glibc-228:
    name: glibc 2.28 (Debian 10)
    # No `container:` any more, and no provisioning inline. The Debian 10
    # environment this job needs is deploy/docker/Dockerfile.glibc228, and
    # `glibc-gate` drives it -- so the gate is one definition a dev box runs
    # too, instead of a hand-rolled apt/cmake bootstrap that only ever
    # executed here and could only be debugged by pushing.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Build on glibc 2.28 and verify no newer symbols
      # Builds this checkout inside the Debian 10 image, smoke-runs the C
      # examples against it, then asserts the symbol floor a released .so
      # must hold. Identical to `make glibc-gate` on a laptop.
      run: make glibc-gate

  # ------------------------------------------------------------------
  # Doxygen C API docs — zero warnings required
  # ------------------------------------------------------------------
  doxygen:
    name: Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # doxygen + graphviz come from the image's `docs` group, which is the
    # same bootstrap.toml group `make install-docs-deps` installs.
    container:
      image: ghcr.io/doppler-dsp/doppler-ci@sha256:ba070a9b2ebc674f956026160ca806a3e7a572e4553a95cc67c6d4fe13bde6d4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # gen-c-api-check needs the docs Python group (mkdoxy) as well as doxygen.
    # It lives in THIS job rather than in `docs` because doxygen is already
    # here at CI's pinned version -- running it in `docs` would fall back to
    # the container shim and rebuild a pinned doxygen image every run.
    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        sync: --group dev --group docs

    - name: Run doxygen (zero warnings)
      # `make doxygen-check`, never an inline doxygen invocation: the Makefile
      # is the single driver, so `make doxygen-check` locally is this job. When
      # this was inline, the only local target (`make doxygen`) merely printed
      # warnings and exited 0 — 88 accumulated over a long branch before the
      # job was ever looked at. The target pins DOXYGEN_VERSION to this
      # runner's doxygen and dockerises when a developer's differs, because
      # versions disagree about what counts as a warning. Bump
      # DOXYGEN_VERSION in the Makefile when this runner image changes.
      run: make doxygen-check

    - name: Committed docs/c-api matches the headers
      # The generated C API tree is committed, so it can go stale silently --
      # and had, by 22 pages. `make gen-c-api` locally is this step.
      run: make gen-c-api-check

  # ------------------------------------------------------------------
  # Specan demo frames staleness check
  # ------------------------------------------------------------------
  specan-demo:
    name: Specan demo frames
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check frames kept in sync with specan source
      run: |
        make specan-check \
          SPECAN_BASE="${{ github.event.pull_request.base.sha || 'HEAD^' }}"

  # ------------------------------------------------------------------
  # Documentation build (zensical)
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        sync: --group dev --group docs

    - name: Docs gate
      # Every gate the local `make docs-check` runs, in one step. The target
      # reports ALL failures in one pass -- which is exactly what the nine
      # `if: !cancelled()` steps this replaces were emulating, and it does it
      # in one place rather than in two that had already diverged: the Makefile
      # removes a stale `zensical.toml` (which shadows mkdocs.yml and silently
      # truncates the nav) and passes `--group docs`; neither inline copy did.
      run: make docs-check

  # ------------------------------------------------------------------
  # Docker images — build + smoke the three build-on-doppler shapes
  # (sdk / downstream-jm / stream-services). One shared builder compiles
  # doppler once; each target's smoke IS its gate (the SDK links a consumer
  # from scratch, downstream-jm runs iqtools' whole suite during its build,
  # stream-services proves the streaming binaries ship on PATH). Driven
  # through the Makefile, the single driver for every docker build here.
  # ------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Build + smoke the build-on-doppler images
      run: make docker-examples

  # ------------------------------------------------------------------
  # just-makeit manifest drift gate
  #
  # Asserts the generated glue (bindings, stubs, CMake, _core.h decls) on disk
  # still matches what `jm apply` would produce from just-makeit.toml +
  # objects/*.toml. This is what makes doppler a clean jm poster child: any
  # hand-edit to a glue file, or a manifest change left un-applied, fails CI.
  #
  # Uses jm's native gate (jm status --check, just-makeit#140). jm is pinned to
  # the version the tree was generated with; bump it in lock step with a
  # `jm apply` reconcile commit. No allowlist: ddc/ddcr's 5-arg
  # `*_execute(..., out, max_out)` is now declared `pass_capacity = true`
  # (just-makeit#138) so apply generates it exactly and there is zero drift.
  # ------------------------------------------------------------------
  # Lint + format gate for hand-written code and docs (ruff, clang-format v19,
  # mdformat, hygiene hooks). jm-generated glue (.pyi, *_ext.c aggregators,
  # native/inc headers, generated CMakeLists, re-export __init__.py, wavegen.py)
  # is excluded in .pre-commit-config.yaml and guarded instead by manifest-drift.
  pre-commit:
    name: pre-commit (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
      with:
        # `changelog-check` asks what THIS BRANCH changed, which needs a MERGE
        # BASE -- and a merge base needs history on both sides. The depth=1
        # baseline fetch below is enough for the tests-ssot ratchet, which
        # reads a tree at one commit, but it can never produce a common
        # ancestor. The gate fails closed rather than guessing, so without this
        # it would be red on every PR.
        fetch-depth: 0

    # NB there is no longer an explicit `git fetch --depth=1 origin main` step
    # here. It existed because a default checkout fetches only the PR ref, so
    # `origin/main` was absent and the tests-ssot ratchet failed closed on the
    # runner while passing on every developer's clone. `fetch-depth: 0` above
    # supersedes it -- actions/checkout fetches every branch, the full history
    # and the tags -- and keeping both was actively harmful, not merely
    # redundant: `--depth=1 --no-tags` RE-shallowed the repo after the deep
    # checkout, which left `git describe --tags` with nothing to find. Measured
    # on the first CI run of this gate, which reported "1 code commit(s) since
    # repo start" where a developer's clone says "113 since v0.42.0" -- the
    # repo-state half of changelog-check reduced to nonsense by its own setup.

    # uv, not bare setup-python: the hooks now DISPATCH into the Makefile
    # (`make -s lint-ruff`), which invokes `$(DEV_RUN) <tool>` so the version
    # comes from uv.lock. That is what makes this job and a developer's `make
    # lint` resolve the same tool -- the failure mode it replaces was a warm
    # local cache and a fresh runner holding different mdformat plugins and
    # disagreeing about the same file.
    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.12'
        sync: --group dev --no-install-project

    # `make lint` and nothing else: it runs the standard's three consistency
    # gates (standard drift, help completeness, no ghost targets) and then the
    # hooks, so CI enforces exactly what a developer runs.
    - name: Run make lint
      # The PR's base SHA, not `origin/main`: a `pull_request` checkout builds a
      # merge commit and has no local main, so the base the PR is actually
      # against is the honest comparison. On a `push` event there is no PR to
      # read it from, and `origin/main` is correct there -- HEAD is an ancestor
      # of it, so the branch half goes inert exactly as it should.
      # `issue-link-check` takes the same base by way of CHANGELOG_BASE (the
      # Makefile passes it through), so both per-branch gates measure against
      # the same commit rather than two subtly different ones.
      env:
        CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      run: make lint

  manifest-drift:
    name: jm manifest drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Check manifest drift
      # --refresh: ignore setup-uv's cached PyPI index so a just-published jm
      # pin resolves on the first run after a release (no stale-cache race).
      run: make drift-check

  # ------------------------------------------------------------------
  # All three sanitizers over the whole C suite. Together they are the gate for
  # the classes `make test` structurally cannot see: an access outside an
  # object and an allocation nothing releases (ASan/LSan), what the standard
  # leaves undefined (UBSan), and a data race (TSan). An overflowing write lands on whatever the compiler happened to
  # put next, so the program is wrong while every assertion stays green --
  # doppler#1024 is the instance, a test writing 93 bytes into a 64-byte stack
  # buffer and 29 bytes into its own caller's frame. `make test` was 152/152
  # on it. It surfaced only because the coverage job builds clang at -O0 and
  # that layout exposed it, which is a stack layout rather than a check.
  #
  # Its own job rather than a step on build-and-test-linux: it rebuilds the
  # tree with different flags, so bolting it onto a matrix leg would serialise
  # a second full build behind the first and double that leg's wall clock for
  # both images. Here it runs in parallel with everything else.
  #
  # One leg PER SANITIZER rather than three steps in one job, because the
  # three do not share the work they used to look like they shared: each
  # rebuilds the whole tree with its own flags, so the job's wall clock was
  # their SUM -- and this job was the long pole on every PR in the repo.
  #
  # Measured on two runs of the same suite (2026-08-28, `gh api
  # repos/doppler-dsp/doppler/actions/jobs/<id> --jq '.steps[]'`):
  #
  #   run          ASan    UBSan   TSan     job total
  #   98714275676  5m29s   5m54s   14m58s   27m02s
  #   98717845032  3m25s   3m30s    7m15s   15m08s
  #
  # TSan is about half the sequential total in both, so the matrix does NOT
  # buy 3x -- it buys roughly 1.8x, and the new pole is TSan alone. Anyone
  # shortening this job further should start there and not here.
  #
  # `fail-fast: false` because the point of running three is to learn what all
  # three say. The old shape reported strictly less: a failing ASan step
  # aborted the job before UBSan or TSan ever ran, so one finding hid the
  # others until it was fixed and the whole thing re-run.
  #
  # The ccache key follows the leg. The three builds have DIFFERENT flag sets,
  # so a shared key had them evicting each other's entries -- exactly what
  # .github/actions/ccache's own "distinct keys" note is about; it read `key:
  # asan` for all three.
  #
  # Renaming is safe here because `CI passed` is the repository's only
  # REQUIRED status check (protect-main); it needs `sanitizers`, and a matrix
  # job's result is a failure if any leg fails. No ruleset names these legs.
  # ------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.san.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        san:
          - { target: test-asan, label: "ASan + LSan (C suite)" }
          - { target: test-ubsan, label: "UBSan (C suite)" }
          - { target: test-tsan, label: "TSan (C suite)" }
    # The toolchain is the image, the sanitizer runtime included -- the same
    # reason the coverage job takes libclang-rt from here rather than naming
    # it in bootstrap.toml.
    container:
      image: ghcr.io/doppler-dsp/doppler-ci@sha256:ba070a9b2ebc674f956026160ca806a3e7a572e4553a95cc67c6d4fe13bde6d4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ccache
      with:
        key: ${{ matrix.san.target }}

    - name: Start NATS JetStream broker (the stream path is where threads are)
      # Without a broker the nats:// tests SKIP, and they are exactly the ones
      # that interrupt a stream from a second thread. A sanitizer job whose
      # denominator quietly excludes the threaded tests is the shape of a green
      # suite that checked less than it looks like it did.
      run: make nats-up

    # `make <target>`, never an inline cmake: the Makefile is the single
    # driver, so this step IS what a developer runs locally. Every target
    # refuses an empty test list rather than reporting a clean sanitizer run
    # over nothing -- absent output is not a pass.
    #
    # test-tsan is whole-suite since #1026. The old `-R 'race|parallel|thread'`
    # pattern selected 2 tests, one of them by accident on the "race" inside
    # "t-race", and missed three genuinely threaded ones.
    - name: ${{ matrix.san.label }}
      run: make ${{ matrix.san.target }}

    - name: Stop NATS broker
      if: always()
      run: make nats-down

    - name: Compiler-cache statistics
      run: make ccache-stats

  # ------------------------------------------------------------------
  # Code coverage (C tests ∪ Python ∪ Rust). clang source-based instrumentation
  # (-fprofile-instr-generate -fcoverage-mapping) on every first-party C object;
  # the CTest suite, pytest (against the instrumented .so), and the Rust FFI
  # tests (linking the instrumented libdoppler.so) each emit .profraw, merged
  # into one llvm-cov report attributed to the hand-written _core.c. Publishes
  # the HTML + lcov as an artifact, and GATES PRs via diff-cover: a PR's
  # added/changed C lines must be >= 90% covered (it's in ci-passed needs). Pure
  # .py/.rs diffs carry no C coverage data and aren't counted.
  # ------------------------------------------------------------------
  coverage:
    name: coverage (C + Python + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # clang, llvm-profdata/llvm-cov, cargo and the profile runtime all come
    # from the image -- including libclang-rt, which bootstrap.toml cannot
    # name because the package is per-release and that file is not.
    container:
      image: ghcr.io/doppler-dsp/doppler-ci@sha256:ba070a9b2ebc674f956026160ca806a3e7a572e4553a95cc67c6d4fe13bde6d4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7
      with:
        # Full history so the patch gate can diff against origin/main.
        fetch-depth: 0

    - uses: ./.github/actions/ccache
      with:
        key: coverage

    - name: Install uv + Python + package deps
      uses: ./.github/actions/setup-uv
      with:
        python-version: '3.13'
        sync: --group dev

    - name: Start NATS JetStream broker (covers the nats:// stream path)
      # The stream suite's nats:// tests self-skip when 127.0.0.1:4222 is
      # unreachable; start a JetStream broker so stream_nats.c is exercised.
      run: make nats-up

    - name: Coverage (clang source-based; C ∪ Python ∪ Rust)
      # `shell: bash` for the `-o pipefail` it carries. The default shell is
      # `bash -e`, where a pipeline's status is the LAST command's -- so `make
      # coverage | tee` reported tee's 0 and this step went green over a recipe
      # that had failed. It did: the install of the instrumented wfmgen died on
      # a missing directory, no report was ever written, and the failure only
      # surfaced one step later as `coverage-gate` opening a coverage.lcov that
      # did not exist. Same shape as the leading `-` this branch removed from
      # pytest, one layer out: the exit code was produced and then discarded.
      shell: bash
      run: make coverage | tee coverage.txt

    - name: Compiler-cache statistics
      # In the log on purpose: a cache that stops hitting has no symptom
      # other than builds slowly getting longer.
      run: make ccache-stats
    - name: Stop NATS broker
      if: always()
      run: make nats-down

    - name: Patch-coverage gate (changed C lines must be >= 90%)
      # diff-cover fails the job (→ blocks ci-passed) when a PR's added/changed
      # C lines aren't covered by the merged report. Pure .py/.rs diffs carry no
      # C coverage data and aren't counted. Pushes to main diff empty → pass.
      run: |
        git fetch --no-tags origin main
        make coverage-gate COV_BASE=origin/main

    - name: Coverage summary
      if: always()
      run: |
        echo '### Merged coverage (C ∪ Python ∪ Rust)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        grep -E '^TOTAL' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          build-cov/html
          build-cov/coverage.lcov

  # ------------------------------------------------------------------
  # Aggregator: a single "CI passed" check that is green only when every
  # required job above succeeded. The release workflow polls this check on the
  # tagged commit (verify-ci) instead of re-running the suite — the merge to
  # main already gated it, so the release only confirms + builds + publishes.
  # ------------------------------------------------------------------
  ci-passed:
    name: CI passed
    needs:
      - build-and-test-linux
      - build-and-test-macos
      - python
      - glibc-228
      - doxygen
      - specan-demo
      - docs
      - docker
      - pre-commit
      - manifest-drift
      - coverage
      - sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" || \
                "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI job did not succeed — CI not green"
            exit 1
          fi
          echo "All required CI jobs succeeded."
