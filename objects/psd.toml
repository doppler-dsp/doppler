# psd — averaging power-spectral-density estimator (Welch's method) and
# spectral measurement suite.
#
# Block-I/O object (opaque handle).  Composes FFT + the spectral window /
# magnitude_db / find_peaks_f32 free functions + AccTrace (the per-bin power
# averager).  Accumulate cf32 baseband frames, then read the averaged PSD
# (dB or dB/Hz) and derived measurements: band power, occupied bandwidth,
# peaks/SFDR, noise floor and SNR.  Output spectra are DC-centred (fftshift),
# matching find_peaks_f32's bin->frequency convention.

[psd]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "PSD"
depends_on = ["fft_core", "spectral_core", { name = "acc_trace", link = true }]
serializable = "true"
fragment = "generated"
create_fn = "dp_psd_create_hop"
create_error = "ValueError"
create_error_message = "PSD: invalid parameter (need n >= 2, pad >= 1 with n * pad within the largest FFT, finite fs > 0, bits <= 64, hop in 1..n (0 = n), a finite full_scale > 0 when bits = 0, a window whose taps sum to a finite nonzero value (not hann at n = 2, nor a NaN or overflowing kaiser beta), and in exp mode 0 < alpha <= 1)"

[[psd.init_params]]
name = "n"
type = "size_t"
default = "1024"

[[psd.init_params]]
name = "fs"
type = "double"
default = "1.0"

[[psd.init_params]]
name = "window"
type = "enum:psd_window"
default = "hann"

[[psd.init_params]]
name = "beta"
type = "float"
default = "0.0f"

[[psd.init_params]]
name = "pad"
type = "size_t"
default = "1"

[[psd.init_params]]
name = "full_scale"
type = "double"
default = "1.0"

[[psd.init_params]]
name = "bits"
type = "size_t"
default = "0"

[[psd.init_params]]
name = "mode"
type = "enum:acc_trace_mode"
default = "mean"

[[psd.init_params]]
name = "alpha"
type = "double"
default = "0.1"

[[psd.init_params]]
name = "hop"
type = "size_t"
default = "0"

[[psd.methods]]
name = "accumulate"
doc = "Window, FFT and fold every cf32 frame the stream completes into the average; a partial frame is carried to the next call."
arg_type = "void"
return_type = "void"
nogil = true
params = [{name = "x", type = "float _Complex[]"}]

[[psd.methods]]
name = "accumulate_real"
doc = "Window, zero-pad, FFT and fold the whole real frames of a block into the average, at hop = n. A trailing partial frame is dropped. It neither reads nor writes the carry of the complex accumulate, so mixing the two on one object mixes two streams."
arg_type = "void"
return_type = "void"
nogil = true
params = [{name = "x", type = "float[]"}]

[[psd.methods]]
name = "reset"
doc = "Discard the running average; counters return to zero."
arg_type = "void"
return_type = "void"

[[psd.methods]]
name = "psd_db"
doc = "Averaged power spectrum in dB (None before any accumulate)."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true
# Sized by the object alone, so no count (jm gh-2233): the kernel is
# (state, out, max_out) and Python's readout takes only out= (#2184).
no_count = true

[[psd.methods]]
name = "psd_dbhz"
doc = "Averaged power spectral density in dB/Hz (None before any accumulate)."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true
# Sized by the object alone, so no count (jm gh-2233): the kernel is
# (state, out, max_out) and Python's readout takes only out= (#2184).
no_count = true

[[psd.methods]]
name = "power_twosided"
doc = "Averaged linear power, DC-centred two-sided (length nfft); cg^2-normalised."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true
# Sized by the object alone, so no count (jm gh-2233): the kernel is
# (state, out, max_out) and Python's readout takes only out= (#2184).
no_count = true

[[psd.methods]]
name = "power_onesided"
doc = "Averaged linear power, one-sided fold (length nfft/2+1); cg^2-normalised."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true
# Sized by the object alone, so no count (jm gh-2233): the kernel is
# (state, out, max_out) and Python's readout takes only out= (#2184).
no_count = true

[[psd.methods]]
name = "band_power"
doc = "Integrated power per band in dB; bands = [lo0,hi0,lo1,hi1,...] Hz. None when there is nothing to report: before any accumulate, or no complete lo/hi pair."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
# The same empty shape as its four sibling readouts: when the kernel writes
# nothing (before any frame, or no complete band) they return None and this
# one returned an empty array (#1911 (g)).
none_on_empty = true
params = [{name = "bands", type = "double[]"}]

[[psd.methods]]
name = "total_band_power"
doc = "Total integrated power across all bands in dB."
arg_type = "void"
return_type = "double"
params = [{name = "bands", type = "double[]"}]

[[psd.methods]]
name = "occupied_bw"
doc = "Occupied bandwidth in Hz holding the given fraction of total power."
arg_type = "void"
return_type = "double"
params = [{name = "fraction", type = "double"}]

[[psd.methods]]
name = "noise_floor"
doc = "Median of the averaged dB trace (noise-floor estimate)."
arg_type = "void"
return_type = "double"

[[psd.methods]]
name = "snr"
doc = "Peak-in-band level minus noise floor, in dB."
arg_type = "void"
return_type = "double"
params = [{name = "lo_hz", type = "double"}, {name = "hi_hz", type = "double"}]

[[psd.methods]]
name = "sfdr"
doc = "Spurious-free dynamic range in dB from the top two peaks."
arg_type = "void"
return_type = "double"
params = [{name = "min_db", type = "float"}]

# n, nfft and full_scale live in the per-frame kernel (dp_psd_kernel_t), so
# they read through it; the docs are the ones the struct members carried.
[[psd.properties]]
name = "n"
type = "size_t"
expr = "self->handle->k.n"
doc = "Window / frame length (samples)."

[[psd.properties]]
name = "nfft"
type = "size_t"
expr = "self->handle->k.nfft"
doc = "Zero-padded transform length."

[[psd.properties]]
name = "fs"
type = "double"
field = true

[[psd.properties]]
name = "full_scale"
type = "double"
expr = "self->handle->k.full_scale"
doc = "Amplitude that reads 0 dBFS."

[[psd.properties]]
name = "bits"
type = "size_t"
field = true

[[psd.properties]]
name = "enbw"
type = "double"
field = true

[[psd.properties]]
name = "rbw"
type = "double"
expr = "self->handle->enbw * self->handle->fs / (double)self->handle->k.n"

[[psd.properties]]
name = "count"
type = "size_t"
expr = "(size_t)self->handle->avg->count"
doc = "Frames folded into the averaged trace so far."

[[psd.properties]]
name = "mode"
type = "int"
expr = "(int)self->handle->avg->mode"
doc = "Trace reduction mode, as the enum index: 0 mean, 1 exp, 2 maxhold, 3 minhold."
