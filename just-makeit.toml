link = true

[[module.wfm_compose.depends_on]]
name = "lo"
link = true

[[module.wfm_compose.depends_on]]
name = "awgn"
link = true

[[module.wfm_compose.depends_on]]
name = "pn"
link = true

[[module.wfm_compose.depends_on]]
name = "fir"
link = true

[[module.wfm_compose.depends_on]]
name = "resamp"
