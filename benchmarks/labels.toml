# The benchmarks page's label table (doppler#2372): one declaration per
# published row, keyed by the row's ID as `scripts/bench_report.py` builds it
# (`c:<component>::<row>`, `py:<module>::<test>`).
#
#   name        what a reader calls it, in plain words
#   unit        what ONE of the row's units is -- what the time is per. It
#               must match the unit the snapshot records (#2314), when it
#               records one.
#   definition  one sentence: what one round does, and what the unit counts
#   samples     input samples ONE unit consumes: the page reads the row in
#               samples per second (a bin or a sample is 1, an input pair 2,
#               a PSD frame its nfft). Must agree with the recorded unit.
#   domain      instead of samples, for input that is not samples: "sym",
#   count       "bit", "codeword" with how many of them one unit is (an RS
#               codeword read in coded bits: domain "bit", count 2040); or
#               domain "call" for setup and control, read as time per call
#   headline    true for the "At a glance" set, shown in this file's order
#
# `make lint` (bench-coverage-check) refuses a published row with no label
# here and no line in benchmarks/.labels-exempt, which only shrinks: label
# a row, then delete its exempt line.

["c:fft::execute_cf32[n=4096]"]
name = "FFT, complex float, 4,096 points"
unit = "bin"
definition = "Forward transforms of 4,096 complex float samples (cf32), out of place; throughput counts input samples, and one transform consumes 4,096."
samples = 1
headline = true

["c:psd::accumulate[nfft=1024]"]
name = "Power spectrum, 1,024 bins (Welch)"
unit = "sample"
definition = "Welch power-spectral-density accumulation (window, 1,024-point FFT, magnitude squared, average) over a 65,536-sample block; throughput counts input samples."
samples = 1
headline = true

["c:fir::execute[taps=15,real]"]
name = "FIR filter, 15 real taps"
unit = "sample"
definition = "A 15-tap real-coefficient FIR filter over complex input, 65,536 samples per round; throughput counts input samples."
samples = 1
headline = true

["c:ddc::execute[rate=0.50]"]
name = "Down-converter, decimate by 2"
unit = "in_sample"
definition = "Digital down-converter: mix to baseband, filter and decimate by 2; throughput counts input samples."
samples = 1
headline = true

["c:resamp::execute[rate=1.0001,block=20480]"]
name = "Arbitrary resampler, ratio 1.0001"
unit = "sample"
definition = "Polyphase resampler at a ratio of 1.0001, fed in blocks of 20,480 samples; throughput counts input samples."
samples = 1
headline = true

["c:costas::steps"]
name = "Costas carrier loop"
unit = "sample"
definition = "A Costas loop tracking a BPSK carrier: phase detector, loop filter and NCO, per input sample."
samples = 1
headline = true

["c:dll::steps"]
name = "Delay-locked loop (code tracking)"
unit = "sample"
definition = "An early-prompt-late delay-locked loop tracking a spreading code, per input sample."
samples = 1
headline = true

["c:symsync::steps"]
name = "Symbol timing recovery"
unit = "sample"
definition = "A Gardner-style symbol synchronizer with an interpolating resampler, per input sample."
samples = 1
headline = true

["c:mpsk_receiver::steps[sps=4,agc=0]"]
name = "M-PSK receiver, 4 samples per symbol"
unit = "sample"
definition = "The full M-PSK receive chain (timing, carrier, decisions) at 4 samples per symbol with the AGC off, per input sample."
samples = 1
headline = true

["c:acq::native_nc256"]
name = "DSSS acquisition, 256-chip code"
unit = "sample"
definition = "A full code-phase by Doppler search for a 256-chip spreading code; throughput counts searched input samples."
samples = 1
headline = true

["c:rs::decode[e=8]"]
name = "Reed-Solomon decode, 8 errors"
unit = "codeword"
definition = "CCSDS Reed-Solomon (255,223) decode, each codeword carrying 8 symbol errors; coded data, so it reads in bits per second: one codeword is 255 bytes, 2,040 bits."
domain = "bit"
count = 2040
headline = true

["py:i16_to_f32::test_bench_steps_64k"]
name = "int16 to float, from Python"
unit = "sample"
definition = "Converting a 65,536-sample int16 I/Q block to float through the Python binding, so the wheel's call overhead is included."
samples = 1
headline = true

# Read-outs and design-time calls. Each records a per-bin unit, but none
# runs at the sample rate -- a display reads a spectrum once per refresh,
# a window is built once and cached -- so per-sample throughput would
# flatter them by the size of the block. `domain = "call"` reads them as
# time per call, and `count` is how many recorded units one call is.

["c:acc_trace::value"]
name = "Trace read-out, 4,096 bins"
unit = "bin"
definition = "Reading a 4,096-bin averaged trace out of the accumulator, once per display refresh: a read-out, not a stream, so it reads as time per call."
domain = "call"
count = 4096

["c:psd::power_onesided[nfft=1024]"]
name = "Power spectrum read-out, 1,024 points"
unit = "call"
definition = "Reading the one-sided power spectrum (513 bins) out of a 1,024-point Welch estimate, once per display refresh: per call, because per sample would flatter it by every sample that went in."
domain = "call"
count = 1

["c:psd::power_onesided[nfft=4096]"]
name = "Power spectrum read-out, 4,096 points"
unit = "call"
definition = "Reading the one-sided power spectrum (2,049 bins) out of a 4,096-point Welch estimate, once per display refresh: per call, because per sample would flatter it by every sample that went in."
domain = "call"
count = 1

["c:psd::power_onesided[nfft=16384]"]
name = "Power spectrum read-out, 16,384 points"
unit = "call"
definition = "Reading the one-sided power spectrum (8,193 bins) out of a 16,384-point Welch estimate, once per display refresh: per call, because per sample would flatter it by every sample that went in."
domain = "call"
count = 1

["c:spectral::kaiser_window[4096]"]
name = "Kaiser window design, 4,096 points"
unit = "bin"
definition = "Building a 4,096-point Kaiser window (beta 8.6), which a caller does once and caches: the price of rebuilding it per frame, read as time per call."
domain = "call"
count = 4096

["c:spectral::hann_window[4096]"]
name = "Hann window design, 4,096 points"
unit = "bin"
definition = "Building a 4,096-point Hann window, which a caller does once and caches: the price of rebuilding it per frame, read as time per call."
domain = "call"
count = 4096

["c:spectral::blackman_harris_window[4096]"]
name = "Blackman-Harris window design, 4,096 points"
unit = "bin"
definition = "Building a 4,096-point Blackman-Harris window, which a caller does once and caches: the price of rebuilding it per frame, read as time per call."
domain = "call"
count = 4096

["c:spectral::kaiser_enbw[4096]"]
name = "Window noise bandwidth, 4,096 points"
unit = "bin"
definition = "The equivalent noise bandwidth of a 4,096-point window, a property computed once per window and cached, read as time per call."
domain = "call"
count = 4096

# Bit-stream rows from Python. Their input is bits, not samples, so they
# read in bits per second like their C twins; these record no rate of their
# own, so the label gives the count per call.

["py:syncword::test_bench_find_64k"]
name = "Sync-word search, 64k bits, from Python"
unit = "call"
definition = "Searching 65,536 random bits for the 32-bit CCSDS marker with up to 4 errors allowed, which is absent, so every offset is examined; the input is bits, read in bits per second like the C row."
domain = "bit"
count = 65536

