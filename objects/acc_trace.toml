# acc_trace — per-bin vector trace accumulator.
#
# Block-I/O object (opaque handle): folds a length-n power/magnitude frame into
# a running trace with one of four reduction modes (linear mean, exponential
# moving average, max-hold, min-hold).  Reusable for spectral averaging,
# waterfalls/spectrograms, and video-averaged displays.  Composed by Welch.

[acc_trace]
arg_type = "float"
return_type = "float"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "AccTrace"
serializable = "true"
fragment = "generated"
create_error = "ValueError"
create_error_message = "AccTrace: invalid parameter (need n >= 1, and in exp mode 0 < alpha <= 1)"

[[acc_trace.init_params]]
name = "n"
type = "size_t"
default = "1024"

[[acc_trace.init_params]]
name = "mode"
type = "string_enum:mean,exp,maxhold,minhold"
default = "mean"

[[acc_trace.init_params]]
name = "alpha"
type = "double"
default = "0.1"

[[acc_trace.methods]]
name = "accumulate"
doc = "Fold one length-n frame into the running trace."
arg_type = "void"
return_type = "void"
nogil = true
params = [{name = "p", type = "float[]"}]

[[acc_trace.methods]]
name = "reset"
doc = "Discard the running trace; the next accumulate re-seeds it."
arg_type = "void"
return_type = "void"

[[acc_trace.methods]]
name = "value"
doc = "Copy the current averaged trace (None before any accumulate)."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true

[[acc_trace.properties]]
name = "n"
type = "size_t"
field = true

[[acc_trace.properties]]
name = "alpha"
type = "double"
writable = true
# Not `field = true`: a field setter assigns whatever it is given, and in exp
# mode alpha must stay in (0, 1].  Without `field` jm calls
# dp_acc_trace_set_alpha, which applies create()'s rule (#1911 (c)).
expr = "self->handle->alpha"

[[acc_trace.properties]]
name = "count"
type = "size_t"
expr = "(size_t)self->handle->count"

[[acc_trace.properties]]
name = "mode"
type = "int"
expr = "(int)self->handle->mode"
