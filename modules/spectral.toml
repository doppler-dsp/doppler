[module.spectral]
doc = """
Spectral transforms: reusable FFT and FFT2D engines (fixed length, pocketfft plans cached at construction) plus Corr / Corr2D cross-correlators and PSD power-spectrum estimators.

Examples
--------
>>> import numpy as np
>>> from doppler.spectral import FFT
>>> f = FFT(n=1024)
>>> X = f.execute_cf32(np.ones(1024, np.complex64))
>>> bool(abs(X[0].real - 1024) < 1)
True

"""
objects = ["fft", "fft2d", "corr", "corr2d", "detector", "detector2d", "psd", "spectrogram"]
# psd_core composes acc_trace_core (the AccTrace averager); its OBJECT symbols
# are linked into the spectral .so via psd.toml's depends_on link=true (gh-225).

