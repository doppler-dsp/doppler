# ── acq: the continuous DSSS searcher (bench_acq_core.c) ────────────────────
# Every row: a 1,023-chip code at 2 samples per chip (an epoch is one code
# period, 2,046 samples), C/N0 37.31 dB-Hz, Pfa 1e-3, depth D = 1, one round
# = one push of exactly one non-coherent dwell. Cost is per epoch, so the
# epoch count does not move the per-sample rate; the frequency-window count
# and the thread count do. Kept: the floor (no Doppler search), the corners
# of the operating range (2 and 5 Mcps, at +/-5 and +/-50 kHz), and the two
# ends of the thread sweep at 5 Mcps, +/-50 kHz (1 and 8 threads).

# REDRAFT: the old definition says neither why 256 (its 90- and 176-epoch
# siblings differ only in the detection target) nor the chip rate that sets
# it apart from the 2 and 5 Mcps rows, and the bench's code is 1,023
# pseudo-random chips standing in for a Gold code (bench_acq_core.c:149-156),
# not a Gold code. Renamed into the family's "DSSS search" form; still a
# headline.
["c:acq::native_nc256"]
name = "DSSS search, 3.069 Mcps, no Doppler search, 256 epochs"
unit = "sample"
definition = "The continuous DSSS searcher at 3.069 Mcps (1,023-chip code, 2 samples per chip, 6.138 MSa/s) with no Doppler search (one frequency window), integrating 256 epochs of 2,046 samples non-coherently, the engine's ceiling and what its sizer gives for a 0.999 detection probability at 37.31 dB-Hz; one round is one 523,776-sample dwell ending in one detection test, and throughput counts searched input samples, so the epoch count sets the dwell, not the rate."
