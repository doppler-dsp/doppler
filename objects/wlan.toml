# wlan -- IEEE 802.11 non-HT OFDM (Clause 17) builders.
#
# The C component builds a PPDU's layout and constellation points from a PSDU
# (docs/design/wlan.md): the minimal MAC with its FCS, the scrambler, the BCC
# with puncturing, the interleaver, the mapper and the layout for the OFDM
# modulator. Its Python face is the rate (the two columns of Table 17-4 that
# do not change with the clocking), what follows from it, and the chain's
# stages over the standard's tables: the SIGNAL and Data bits, the mapper, the
# points, the MPDU and the PPDU. The rate is configuration, reached by no
# mutator: there is no
# running state, so no state blob.
[wlan]
arg_type = "void"
return_type = "void"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Wlan"
create_error = "ValueError"
create_fn = "dp_wlan_create_why"
# the sentence names the argument that failed (dp_wlan_params_why)
create_why = true
create_error_message = "constellation is not one of bpsk, qpsk, qam16, qam64, code_rate is not one of r12, r23, r34, r56, window is not 0 to 80 * oversample, or oversample is not 1 to 128"
depends_on = [
    { name = "ofdm", link = true },
    { name = "conv", link = true },
    { name = "mpsk", link = true },
    { name = "fft", link = true },
    { name = "pn", link = true },
]
fragment = "generated"

[[wlan.init_params]]
name = "constellation"
type = "string_enum:bpsk,qpsk,qam16,qam64"
default = "qam16"
doc = "The constellation: BPSK, QPSK, 16-QAM or 64-QAM, one to six bits per subcarrier."

[[wlan.init_params]]
name = "code_rate"
type = "string_enum:r12,r23,r34,r56"
default = "r12"
doc = "The BCC rate: `r12` is 1/2, `r23` is 2/3, `r34` is 3/4 and `r56` is 5/6."

[[wlan.init_params]]
name = "window"
type = "uint32_t"
# WLAN_WINDOW_STANDARD (UINT32_MAX): the standard's transition, resolved by
# dp_wlan_window_resolve. jm 0.133.1 names the constant: default_raw
# (just-makeit#2697).
default_raw = "WLAN_WINDOW_STANDARD"
doc = "The default is the standard's 100 ns transition, `2 * oversample` samples; 0 is no window. Otherwise the window length in samples at the OUTPUT rate, 0 to 80 times `oversample`: the cross-fade at each OFDM symbol boundary of the PPDUs `ppdu` renders. Above the `16 * oversample` guard interval the cross-fade reaches into the symbol body."

[[wlan.init_params]]
name = "oversample"
type = "uint32_t"
default = "1"
doc = "`M`, 1 to 128: the output rate over the 20 MHz clock. The PPDU is rendered by a transform `M` times longer, the same subcarriers, not resampled."

[[wlan.methods]]
name = "ppdu"
doc = "Render a PSDU to a whole PPDU (L-STF, L-LTF, SIGNAL, Data) at this rate, window and oversampling, as complex64 samples. Refuses with `ValueError` naming why."
arg_type = "uint8_t"
return_type = "float _Complex"
fn = "dp_wlan_ppdu_why"
# the capacity function the binding calls, by name (just-makeit#2680)
max_out_fn = "dp_wlan_ppdu_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "ppdu refused"
params = [{ name = "scrambler_state", type = "uint32_t" }]

[[wlan.methods]]
name = "signal_bits"
doc = "The SIGNAL field's 24 bits for a PSDU of `psdu_len` octets at this rate: RATE, a reserved 0, LENGTH least significant bit first, an even-parity bit and six zero tail bits (Figure 17-5). One bit per element. Refuses with `ValueError` naming why."
arg_type = "void"
return_type = "uint8_t"
fn = "dp_wlan_signal_bits_why"
max_out_fn = "dp_wlan_signal_bits_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "signal_bits refused"
params = [{ name = "psdu_len", type = "size_t" }]

[[wlan.methods]]
name = "data_bits"
doc = "The Data field's bits for a PSDU at this rate: SERVICE, the PSDU (each octet least significant bit first), tail and pad, scrambled from `scrambler_state` except the tail. One bit per element, `n_sym * n_dbps` of them. Refuses with `ValueError` naming why."
arg_type = "uint8_t"
return_type = "uint8_t"
fn = "dp_wlan_data_bits_why"
max_out_fn = "dp_wlan_data_bits_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "data_bits refused"
params = [{ name = "scrambler_state", type = "uint32_t" }]

[[wlan.methods]]
name = "map"
doc = "Map interleaved bits (one per element, a whole number of groups of `n_bpsc`) to this rate's constellation points: unit average power, with the standard's bit encodings. Refuses with `ValueError` naming why."
arg_type = "uint8_t"
return_type = "float _Complex"
fn = "dp_wlan_map_why"
max_out_fn = "dp_wlan_map_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "map refused"

[[wlan.methods]]
name = "points"
doc = "The constellation points a PSDU's layout takes, in layout order: the SIGNAL field's 48, then the Data field's `48 * n_sym`, as complex64. The input to `Ofdm`, and what `ppdu` modulates. Refuses with `ValueError` naming why."
arg_type = "uint8_t"
return_type = "float _Complex"
fn = "dp_wlan_points_why"
max_out_fn = "dp_wlan_points_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "points refused"
params = [{ name = "scrambler_state", type = "uint32_t" }]

[[wlan.methods]]
name = "mpdu"
doc = "A data frame's PSDU from its body and, optionally, its MAC header: the `header` octets, then the `body`, then the FCS (CRC-32/ISO-HDLC over everything before it, least significant octet first). Without a header, or with an empty one, the body is taken as an MPDU that lacks its FCS and the result is the body and its FCS. There is no spelling that returns the body unchanged: that is the body itself. 1 to 4095 octets in all. Refuses with `ValueError` naming why."
arg_type = "uint8_t"
return_type = "uint8_t"
fn = "dp_wlan_mpdu_why"
max_out_fn = "dp_wlan_mpdu_max_out"
variable_output = true
pass_capacity = true
count_type = "int64_t"
error_negative = true
why = true
error = "ValueError"
error_message = "mpdu refused"
params = [{ name = "header", type = "uint8_t[]", default = "[]" }]

[[wlan.methods]]
name = "n_sym"
doc = "The Data OFDM symbols a PSDU of `psdu_len` octets needs at this rate, `ceil((16 + 8*psdu_len + 6) / n_dbps)`. 0 for a length of 0 or above 4095."
arg_type = "void"
return_type = "size_t"
params = [{ name = "psdu_len", type = "size_t" }]

[[wlan.properties]]
name = "n_bpsc"
type = "uint32_t"
field = true
doc = "Bits per subcarrier: 1 for BPSK, 2, 4 or 6."

[[wlan.properties]]
name = "n_cbps"
type = "uint32_t"
field = true
doc = "Coded bits per OFDM symbol, 48 times `n_bpsc`."

[[wlan.properties]]
name = "n_dbps"
type = "uint32_t"
field = true
doc = "Data bits per OFDM symbol: `n_cbps` times the code rate."

[[wlan.properties]]
name = "rate_mbps"
type = "uint32_t"
field = true
doc = "The data rate at 20 MHz in Mb/s, as Table 17-6 prints it: 6, 9, 12, 18, 24, 36, 48 or 54, and 0 for the eight pairs the table does not list."

[[wlan.properties]]
name = "window"
type = "uint32_t"
field = true
doc = "The window length in samples at the output rate."

[[wlan.properties]]
name = "oversample"
type = "uint32_t"
field = true
doc = "`M`: the output rate over the 20 MHz clock."
