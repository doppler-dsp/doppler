[ratesync]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "RateSync"
# resamp is not otherwise on the track .so, so it carries link = true; the
# rest are already linked there by dll/symsync/mpsk_receiver, and a bare
# string links them onto this object's own test/bench without duplicating
# them on the .so (jm does not dedup the .so list).
depends_on = [
  { name = "resamp", link = true },
  "loop_filter",
  "lockdet",
  "telemetry",
]
serializable = "true"
perf = "true"
create_error = "ValueError"
create_error_message = "RateSync: need sps >= 1, beta in [0, 1], span >= 1, num_phases a power of two >= 2, bn >= 0 and zeta > 0"

[[ratesync.init_params]]
name = "sps"
type = "double"
default = "4.0"
doc = "Nominal samples per symbol -- any double >= 1, not just an integer. The matched filter runs on a fractional-rate accumulator, so 17.33389 is as valid as 4: set it to Fs/Fsym and let the loop steer the strobe."

[[ratesync.init_params]]
name = "pulse"
type = "string_enum:iandd,rrc"
default = "rrc"
doc = "Matched-filter pulse shape. The fusion (the polyphase bank IS the matched filter, its arm IS the fractional delay) is a property of the resampler, not of the root-raised cosine, so the rectangular/NRZ case is the same object with a different prototype: \"iandd\" is the unit rectangle over one symbol -- what an integrate-and-dump computes, and the right matched filter for rectangular chips or NRZ data -- and \"rrc\" is the root-raised cosine of roll-off `beta` and span `span`. Same vocabulary as MpskReceiver's `pulse`. The rectangle needs only ceil(1.5*sps)+1 taps per arm against the RRC's ceil((2*span+0.5)*sps)+1, so it is far cheaper."

[[ratesync.init_params]]
name = "beta"
type = "double"
default = "0.35"
doc = "RRC roll-off in [0, 1]. Ignored when pulse=\"iandd\"."

[[ratesync.init_params]]
name = "span"
type = "size_t"
default = "8"
doc = "One-sided RRC span in symbols. Ignored when pulse=\"iandd\", whose support is always exactly one symbol."

[[ratesync.init_params]]
name = "num_phases"
type = "size_t"
default = "1024"
doc = "Matched-filter arms; must be a power of two. Sets the fractional-timing resolution to 1/num_phases of a symbol, and the bank costs num_phases * ceil((2*span + 0.5)*sps) floats."

[[ratesync.init_params]]
name = "bn"
type = "double"
default = "0.005"
doc = "Loop noise bandwidth, normalised to the SYMBOL rate (the loop updates once per recovered symbol)."

[[ratesync.init_params]]
name = "zeta"
type = "double"
default = "0.707"

[[ratesync.init_params]]
name = "ted"
type = "string_enum:gardner,dttl"
default = "gardner"
doc = "Timing-error detector: \"gardner\" (blind, works for any constellation) or \"dttl\" (decision-directed sign-sign Data Transition Tracking Loop; lower self-noise near lock but degrades faster at low SNR. BPSK/QPSK only -- invalid for 8PSK/QAM)."

[[ratesync.methods]]
name = "steps"
doc = "Recover symbols from an oversampled cf32 baseband block. The polyphase bank IS the root-raised-cosine matched filter and the arm its accumulator selects IS the fractional timing delay, so one dot product per strobe does both jobs -- no separate matched FIR and Farrow interpolator. A second bank displaced half a symbol supplies the Gardner transition-gate sample, which pins the on-time/mid roles structurally instead of by an output parity. Emits one symbol per recovered symbol period."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[ratesync.methods]]
name = "set_telemetry"
doc = "Attach (or detach, with None) a Telemetry context and register this loop's five probes: \"<prefix>.e\" (normalised TED error), \"<prefix>.ctrl\" (the per-input control steering the strobe), \"<prefix>.rate\" (tracked samples per symbol), \"<prefix>.lock\" (last block-averaged lock statistic) and \"<prefix>.locked\" (0/1). Emitted once per recovered symbol, thinned by decim. Setup path: call before the producer thread starts; the context is borrowed and must outlive the attachment."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", header = "telemetry/telemetry.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[ratesync.methods]]
name = "configure"
doc = "Recompute the loop gains for a new (bn, zeta); preserves the integrator, and so the lock."
arg_type = "void"
return_type = "void"
params = [{ name = "bn", type = "double" }, { name = "zeta", type = "double" }]

[[ratesync.methods]]
name = "configure_lock_raw"
doc = "Set the lock detector's geometry directly: the non-coherent block size (avgs), a split declare/drop threshold pair on lock_stat (level hysteresis), and both verify counts (time hysteresis). Re-tuning clears the in-flight block sum and drops the lock so the next decision uses only looks gathered under the new config. The defaults are SymbolSync's validated operating point for the same eye-opening statistic (avgs=133, threshold=0.311, n_up=1, n_down=8); a (pfa, pd) sizing entry point is deliberately not offered until the same Monte Carlo is run against this object."
arg_type = "void"
return_type = "void"
params = [
  { name = "avgs", type = "size_t" },
  { name = "up_thresh", type = "double" },
  { name = "down_thresh", type = "double" },
  { name = "n_up", type = "uint32_t" },
  { name = "n_down", type = "uint32_t" },
]

[[ratesync.methods]]
name = "reset"
doc = "Re-seed both matched filters, the loop integrator and the lock detector to their post-create state."
arg_type = "void"
return_type = "void"

[[ratesync.properties]]
name = "bn"
type = "double"
writable = true

[[ratesync.properties]]
name = "timing_error"
type = "double"
doc = "Last normalised TED error -- the loop stress."

[[ratesync.properties]]
name = "rate"
type = "double"
doc = "Smoothed tracked samples per symbol. It departs from the nominal sps by exactly the sample-clock offset being tracked, so a caller disciplining a clock reads this."

[[ratesync.properties]]
name = "ctrl"
type = "double"
doc = "Current per-input rate deviation steering the strobe (added to the base rate of 1/sps by the resampler's control port)."

[[ratesync.properties]]
name = "lock_stat"
type = "double"
doc = "Last block-averaged lock statistic: mean(2*(|on-time|^2-|mid|^2)/(|on-time|^2+|mid|^2)) over the configured avgs looks; compare against the configured threshold (see configure_lock_raw)."

[[ratesync.properties]]
name = "locked"
type = "bool"
doc = "Current timing-lock decision: True after the verify count of consecutive above-threshold decisions, False again after the drop count of consecutive below-threshold ones."
