[module.cvt]
doc = """
Sample-format conversion: vectorized converters between float32 IQ and fixed-point integer formats (int8/16/32, offset-binary uint8 as RTL-SDR cu8 I/Q, unsigned Q15), plus a scaling ADC front end.

Examples
--------
>>> import numpy as np
>>> from doppler.cvt import F32ToI16, I16ToF32
>>> x = np.array([0.5, -0.25], np.float32)
>>> I16ToF32().steps(F32ToI16().steps(x)).round(3).tolist()
[0.5, -0.25]

"""
objects = ["f32_to_i8", "f32_to_i16", "f32_to_i32", "i8_to_f32", "u8_to_f32", "i16_to_f32", "i32_to_f32", "f32_to_i16u32", "f32_to_i16u64", "i16u32_to_f32", "i16u64_to_f32", "f32_to_uq15", "uq15_to_f32", "adc"]

[[module.cvt.functions]]
name = "int_to_bin"
doc = "Expand the low n_bits of an integer to unpacked bits, one per byte. The form a frame field literal usually wants: exact, and with no failure mode a typo can reach, unlike the string form. bitorder is DP_BITORDER_BIG (0, MSB of each byte first -- as written) or DP_BITORDER_LITTLE (1), numpy's `bitorder` convention for this operation, and NOT the BLUE writer's endian (le/be) which selects a file's BYTE order. Returns the bits written, or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "v"
type = "uint64_t"

[[module.cvt.functions.params]]
name = "n_bits"
type = "uint32_t"

[[module.cvt.functions.params]]
name = "out"
type = "uint8_t[]"
out = true

[[module.cvt.functions.params]]
name = "bitorder"
type = "int"

[[module.cvt.functions]]
name = "hex_to_bin"
doc = "Expand a hex string to unpacked bits, one per byte. For what int_to_bin cannot serve: a literal wider than 64 bits, or one arriving as TEXT from a CLI flag or a JSON record. An odd number of digits is accepted and yields a 4-bit tail. A bad digit is a REFUSAL, never a silently shortened field -- a marker that shortens syncs to nothing. Returns the bits written, or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "hex"
type = "const char *"

[[module.cvt.functions.params]]
name = "out"
type = "uint8_t[]"
out = true

[[module.cvt.functions.params]]
name = "bitorder"
type = "int"

[[module.cvt.functions]]
name = "bytes_to_bin"
doc = "Unpack octets to bits, one per byte: 8 bits an octet, MSB first under bitorder 0 (DP_BITORDER_BIG). The door for PACKED data -- a binary file, a byte stream, a network buffer -- into the unpacked bits every frame field takes. Returns the bits written (8 * the octet count), or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "octets"
type = "uint8_t[]"

[[module.cvt.functions.params]]
name = "out"
type = "uint8_t[]"
out = true

[[module.cvt.functions.params]]
name = "bitorder"
type = "int"

[[module.cvt.functions]]
name = "bin_to_int"
doc = "Read unpacked bits back into an integer -- the inverse of int_to_bin."
return_type = "uint64_t"

[[module.cvt.functions.params]]
name = "bits"
type = "uint8_t[]"

[[module.cvt.functions.params]]
name = "bitorder"
type = "int"

[[module.cvt.functions]]
name = "bin_to_hex"
doc = "Render unpacked bits back to hex digits -- the exact inverse of hex_to_bin. The digits come back as ASCII BYTES rather than a str: jm has no string out-parameter for a module function (just-buildit/just-makeit#1180), and uint8_t is the same type as the unsigned char a C caller would use. Decode with bytes(out).decode() in Python. n_bits must be a multiple of 4. Returns the digits written, not counting the NUL, or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "bits"
type = "uint8_t[]"

[[module.cvt.functions.params]]
name = "out"
type = "uint8_t[]"
out = true

[[module.cvt.functions.params]]
name = "bitorder"
type = "int"

[[module.cvt.functions]]
name = "bin_to_nrz"
doc = "Map unpacked bits to bipolar NRZ symbols: bit 0 -> +1.0, bit 1 -> -1.0. That is `1 - 2*b`, the convention already used across doppler (qpsk_map.c and the despreader/ber doctests), NOT the opposite sign -- a mapper that disagreed with the receiver's would decode every bit inverted while looking perfectly locked. Any non-zero byte reads as a set bit. Returns the symbols written, or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "bits"
type = "uint8_t[]"

[[module.cvt.functions.params]]
name = "out"
type = "float[]"
out = true

[[module.cvt.functions]]
name = "nrz_to_bin"
doc = "Hard-decide bipolar NRZ symbols back to unpacked bits -- the inverse of bin_to_nrz. Negative is a 1, zero and positive are a 0, matching `1 - 2*b`. Exactly zero is a 0 rather than a coin toss, so the mapping is total and a round trip is exact. Returns the bits written, or 0 on refusal."
return_type = "size_t"

[[module.cvt.functions.params]]
name = "nrz"
type = "float[]"

[[module.cvt.functions.params]]
name = "out"
type = "uint8_t[]"
out = true
