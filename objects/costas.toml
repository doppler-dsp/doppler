[costas]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Costas"
create_error = "ValueError"
create_error_message = "Costas: invalid parameter (need bn >= 0 and zeta > 0, both finite, whose loop gains come out finite, and bn_fll >= 0 and finite)"
serializable = "true"
depends_on = [
  { name = "lo", link = true },
  { name = "lockdet", link = true },
  { name = "loop_filter", link = true },
  { name = "state_filter", link = true },
  { name = "dp_tlm", link = true },
]
fragment = "generated"

[[costas.init_params]]
name = "bn"
type = "double"
default = "0.05"
doc = "Loop noise bandwidth, of the closed loop given a unit-slope detector (see LoopFilter). The detector's slope is 1 per radian at every signal level and falls below 1 as the SNR per symbol falls (about 0.6 at 0 dB for BPSK), so the delivered loop is narrower at low SNR."

[[costas.init_params]]
name = "zeta"
type = "double"
default = "0.707"

[[costas.init_params]]
name = "init_norm_freq"
type = "double"
default = "0.0"

[[costas.init_params]]
name = "tsamps"
type = "size_t"
default = "64"

[[costas.init_params]]
name = "bn_fll"
type = "double"
default = "0.0"

[[costas.methods]]
name = "steps"
doc = "De-rotate a cf32 block with the integer-NCO carrier, coherently integrate over each tsamps-sample symbol, run the decision-directed Costas discriminator, and emit one complex prompt symbol per symbol."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

# Telemetry attach (jm gh-432; mirrors objects/symsync.toml): registers
# the seven probes dp_costas_set_telemetry() lists -- "<prefix>.lock",
# ".e", ".freq", ".locked" (the verify-counted lockdet decision, 0/1),
# ".nco", ".freq_rate" (the norm_rate property) and ".order" (the order
# property) -- emitted once per dumped symbol. None detaches; the int status binds -> None with
# ValueError on failure.
[[costas.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", retain = true, header = "doppler/dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[costas.methods]]
name = "configure"
doc = "Recompute the loop gains for a new (bn, zeta); preserves the frequency/phase estimate. Raises ValueError, changing nothing, when (bn, zeta) is outside the loop filter's domain: bn >= 0 and zeta > 0, both finite, with finite gains."
arg_type = "void"
return_type = "int"
status_return = true
params = [{ name = "bn", type = "double" }, { name = "zeta", type = "double" }]

[[costas.methods]]
name = "configure_lock"
doc = "Re-tune the carrier lock detector: locked flips up after n_up consecutive dumped symbols with the lock-metric EMA above up_thresh, and drops after n_down consecutive symbols below down_thresh (level + time hysteresis; see detection.LockDet). The defaults (0.85/0.78, 8 up / 32 down) derive from the metric's no-carrier statistics: |Re P|/|P| averages 2/pi (~0.64) under H0 with an EMA-smoothed std of ~0.07, so the declare threshold sits ~3 sigma above the no-carrier mean. A live lock survives the re-tune; the in-flight verify run restarts."
arg_type = "void"
return_type = "void"
params = [
  { name = "up_thresh", type = "double" },
  { name = "down_thresh", type = "double" },
  { name = "n_up", type = "uint32_t" },
  { name = "n_down", type = "uint32_t" },
]

[[costas.methods]]
name = "set_order"
doc = "Select the active loop filter on a live loop: order 2 (the PI loop every Costas starts on) or order 3 (StateFilter, which also tracks the carrier's rate), at loop bandwidth bn. The frequency estimate carries across; a new order-3 rate starts at 0 (norm_rate seeds one). Raises ValueError, changing nothing, for an order other than 2 or 3, a bn outside the loop's domain (bn >= 0 and finite at either order, and at most 0.12 at order 3), or order 3 while bn_fll > 0."
error = "ValueError"
error_message = "Costas.set_order: order must be 2 or 3, bn >= 0 and finite (at most 0.12 at order 3), and bn_fll must be 0 for order 3"
arg_type = "void"
return_type = "int"
status_return = true
params = [{ name = "order", type = "int" }, { name = "bn", type = "double" }]

[[costas.methods]]
name = "reset"
doc = "Re-seed the loop to the create-time frequency/phase, keeping the configuration and the loop order; at order 3 the rate is zeroed."
arg_type = "void"
return_type = "void"

[[costas.properties]]
name = "bn"
type = "double"
writable = true
# The C setter refuses and keeps the value; jm raises on its
# non-zero return (just-makeit#2182, doppler#1987).
error = "ValueError"
error_message = "Costas: bn is outside the loop filter's domain (need bn >= 0, finite, whose loop gains come out finite)"

[[costas.properties]]
name = "norm_freq"
type = "double"
writable = true

[[costas.properties]]
name = "lock_metric"
type = "double"

[[costas.properties]]
name = "locked"
type = "bool"
doc = "Current carrier lock decision: True after the verify count of consecutive above-threshold symbols, False again after the drop count of consecutive below-threshold ones (see configure_lock)."

[[costas.properties]]
name = "last_error"
type = "double"

[[costas.properties]]
name = "bn_fll"
type = "double"
writable = true
# The C setter refuses and keeps the value (doppler#2646).
error = "ValueError"
error_message = "Costas: bn_fll must be >= 0 and finite (0 = pure PLL), and 0 at order 3"

[[costas.properties]]
name = "order"
type = "int"
doc = "The active loop filter's order: 2 (the PI loop) or 3 (StateFilter); set with set_order()."

[[costas.properties]]
name = "norm_rate"
type = "double"
writable = true
# The C setter refuses and keeps the value: order 2 holds no rate.
error = "ValueError"
doc = "The carrier's rate the third-order filter holds, in cycles per sample per sample (R / fs**2 for R Hz/s at sample rate fs); 0 at order 2. Writable at order 3 only: it seeds the rate, as norm_freq seeds the frequency."
error_message = "Costas: norm_rate is held only at order 3 (set_order(3, bn) first)"
