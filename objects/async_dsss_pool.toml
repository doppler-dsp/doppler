# async_dsss_pool — AsyncDsssPool: one object holds the population
# (docs/design/async-dsss-receiver.md §8.2, decided 2026-09-03).
#
# One searcher (Acquisition in continuous mode with the block coherence of
# §2.3 and a peak list), n_slots cell receivers created idle, the
# assigned table, and the event log borrowed by attachment. What a push()
# does, and in what order, is the header's
# (native/inc/doppler/async_dsss_pool/async_dsss_pool_core.h). The
# population's numbers default to the operating point of §6.1; the
# waveform's are the caller's.

[async_dsss_pool]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "AsyncDsssPool"
serializable = "true"
# A NULL create is an argument out of range, or a searcher a cell receiver
# cannot take (gh-482), not memory.
create_error = "ValueError"
create_error_message = "AsyncDsssPool: invalid parameter, or a searcher a cell receiver cannot take (need a code of at least 2 chips, a finite chip_rate > 0, a finite symbol_rate > 0 and <= chip_rate, spc >= 1, m in {2,4,8}, segments >= 1, sps >= 2, carrier_freq_hz 0 or finite and above chip_rate * spc / 2, lost_confirm_s >= 0, 0 < gain <= 1, n_slots >= 1, 1 <= max_peaks <= 64, max_emitter_on_time_secs >= 0, a symbol of at most 2^20 Dll partials, segments * chip_rate / (code_len * symbol_rate) <= 1048576; and a searcher with a finite cn0_dbhz, 0 < pfa < 1, 0 < pd < 1, a finite doppler_uncertainty >= 0, a finite doppler_rate >= 0, and a depth D > 1 -- code_only_epochs > 1 -- whose Doppler row is at most four times the carrier loop's pull-in bound, doppler_res_hz <= 2 * 0.04 * chip_rate / code_len)"
# dp_parallel.h's persistent pool is pthreads (the receivers across threads).
extra_link_libs = ["Threads::Threads"]
depends_on = [
    { name = "async_dsss_receiver", link = true },
    { name = "acq", link = true },
    { name = "dp_event_log", link = true },
    # The receiver's own composition -- jm's depends_on linking is not
    # recursively transitive (async_dsss_receiver.toml's comment applies).
    { name = "carrier_acq", link = true },
    { name = "dll", link = true },
    { name = "costas", link = true },
    { name = "RateConverter", link = true },
    { name = "mpsk_receiver", link = true },
    { name = "resamp", link = true },
    { name = "hbdecim", link = true },
    { name = "cic", link = true },
    { name = "resample", link = true },
    { name = "psd", link = true },
    { name = "detector", link = true },
    { name = "detection", link = true },
    { name = "corr2d", link = true },
    { name = "fft2d", link = true },
    { name = "fft", link = true },
    { name = "dp_tlm", link = true },
]
fragment = "generated"

# ── The pool's own numbers (§8.2) ────────────────────────────────────────
[[async_dsss_pool.init_params]]
name = "code"
type = "uint8_t[]"

[[async_dsss_pool.init_params]]
name = "chip_rate"
type = "double"
default = "1000000.0"

[[async_dsss_pool.init_params]]
name = "symbol_rate"
type = "double"
default = "1000.0"

[[async_dsss_pool.init_params]]
name = "spc"
type = "size_t"
default = "2"

[[async_dsss_pool.init_params]]
name = "m"
type = "int"
default = "2"

[[async_dsss_pool.init_params]]
name = "cn0_dbhz"
type = "double"
default = "55.0"

[[async_dsss_pool.init_params]]
name = "pfa"
type = "double"
default = "1e-3"

[[async_dsss_pool.init_params]]
name = "pd"
type = "double"
default = "0.9"

# The searcher's: the span, the window's whole code-only epochs (the block
# depth of §2.3), the rate bound, and the peak list's capacity (§7.1).
[[async_dsss_pool.init_params]]
name = "doppler_uncertainty"
type = "double"
default = "100.0"

[[async_dsss_pool.init_params]]
name = "code_only_epochs"
type = "size_t"
default = "813"

[[async_dsss_pool.init_params]]
name = "doppler_rate"
type = "double"
default = "0.0"

[[async_dsss_pool.init_params]]
name = "max_peaks"
type = "size_t"
default = "16"

# The population: slots (§10's ten plus release headroom), the threads the
# receivers and the searcher's fan run across, the release rule's interval
# (§10) and the maximum on-air time of one emitter (§6.1, adjustable).
[[async_dsss_pool.init_params]]
name = "n_slots"
type = "size_t"
default = "12"

[[async_dsss_pool.init_params]]
name = "threads"
type = "int"
default = "1"

[[async_dsss_pool.init_params]]
name = "carrier_freq_hz"
type = "double"
default = "0.0"

[[async_dsss_pool.init_params]]
name = "lost_confirm_s"
type = "double"
default = "2.0"

[[async_dsss_pool.init_params]]
name = "max_emitter_on_time_secs"
type = "double"
default = "900.0"

# ── The receivers' own, passed through untouched ─────────────────────────
[[async_dsss_pool.init_params]]
name = "segments"
type = "size_t"
default = "4"

[[async_dsss_pool.init_params]]
name = "sps"
type = "size_t"
default = "8"

[[async_dsss_pool.init_params]]
name = "differential"
type = "int"
default = "0"

# The receivers' correction: its gain in chips per chip of the interval-mean
# discriminator after the pull-in, and the intervals at gain 1 before it
# (docs/design/async-dsss-receiver-measurements.md §12.24, §12.26).
[[async_dsss_pool.init_params]]
name = "gain"
type = "double"
default = "0.125"

[[async_dsss_pool.init_params]]
name = "pullin_intervals"
type = "size_t"
default = "4"

# ── Methods ──────────────────────────────────────────────────────────────
[[async_dsss_pool.methods]]
name = "push"
arg_type = "void"
return_type = "size_t"
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[async_dsss_pool.methods]]
name = "status"
arg_type = "void"
return_type = "async_dsss_pool_slot_t"
params = [{ name = "slot", type = "size_t" }]
result_fields = [
    { name = "slot", type = "size_t" },
    { name = "assigned", type = "int" },
    { name = "state", type = "int" },
    { name = "seed_sample", type = "uint64_t" },
    { name = "seed_chip_phase", type = "double" },
    { name = "seed_doppler_hz", type = "double" },
    { name = "seed_cn0_dbhz", type = "double" },
    { name = "doppler_hz", type = "double" },
    { name = "chip_phase", type = "double" },
    { name = "code_rate", type = "double" },
    { name = "cn0_dbhz_est", type = "double" },
    { name = "code_locked", type = "int" },
    { name = "locked", type = "int" },
    { name = "lock_metric", type = "double" },
    { name = "state_samples", type = "uint64_t" },
    { name = "both_down_samples", type = "uint64_t" },
    { name = "assigned_samples", type = "uint64_t" },
]
single = true
record_name = "PoolSlot"
record_doc = "AsyncDsssPool's slot record: whether the slot is assigned, the seed it was assigned from, the receiver's live status (state 1 refining, 2 tracking, 3 idle, 4 lost), and the samples since the assignment."
record_module = "doppler.dsss"

[[async_dsss_pool.methods]]
name = "symbols"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
params = [{ name = "slot", type = "size_t" }]

[[async_dsss_pool.methods]]
name = "set_event_log"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "log", type = "dp_event_log_t *", capsule = "doppler.telemetry.dp_event_log", retain = true, header = "doppler/dp_event_log/dp_event_log_core.h" },
]

# Telemetry across the searcher, every slot and the pool's counters: the
# docstring is the header's.
[[async_dsss_pool.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", retain = true, header = "doppler/dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

# ── Read-back ────────────────────────────────────────────────────────────
[[async_dsss_pool.properties]]
name = "n_slots"
type = "size_t"
field = true

[[async_dsss_pool.properties]]
name = "n_assigned"
type = "size_t"
field = true

[[async_dsss_pool.properties]]
name = "dropped"
type = "uint64_t"
field = true

[[async_dsss_pool.properties]]
name = "events"
type = "uint64_t"
field = true

[[async_dsss_pool.properties]]
name = "samples_consumed"
type = "uint64_t"
field = true

[[async_dsss_pool.properties]]
name = "doppler_res_hz"
type = "double"
expr = "(self->handle->acq->doppler_res_hz)"
doc = "The searcher's Doppler row, Hz -- the resolution a seed's Doppler is reported at."

[[async_dsss_pool.properties]]
name = "coherent_bins"
type = "size_t"
expr = "(self->handle->acq->coherent_bins)"
doc = "The searcher's block-coherent depth D, from code_only_epochs and doppler_rate (docs/design/async-dsss-receiver.md §2.3)."
