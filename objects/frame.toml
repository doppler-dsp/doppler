default = "galois"

[[frame.init_params]]
name = "sync_taps_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_seed_a"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "sync_taps_b"
