[fft2d]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "FFT2D"
depends_on = ["fft_core"]
fragment = "generated"

[[fft2d.init_params]]
name = "ny"
type = "size_t"
default = "64"

[[fft2d.init_params]]
name = "nx"
type = "size_t"
default = "64"

[[fft2d.init_params]]
name = "sign"
type = "int"
default = "-1"

[[fft2d.init_params]]
name = "nthreads"
type = "int"
default = "1"

[[fft2d.methods]]
name = "execute_cf64"
arg_type = "double _Complex"
return_type = "double _Complex"
variable_output = true
# The pocketfft plan is fixed-size, so a short buffer is served from
# scratch and truncated (jm gh-138) rather than overrunning `out`.
pass_capacity = true
# n_in must equal the frame length; the C kernel REFUSES any other
# with SIZE_MAX (nothing read, written or counted) and jm raises (#1925).
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "input length is not ny*nx; the plan takes exactly one frame"

[[fft2d.methods]]
name = "execute_cf32"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
# The pocketfft plan is fixed-size, so a short buffer is served from
