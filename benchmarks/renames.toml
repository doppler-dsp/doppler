# Benchmark row families renamed between releases (doppler#2900).
#
#   "<old family>" = "<new family>"
#
# A family is a row ID's part before `::` (`c:<component>`,
# `py:<module>`), as `scripts/bench_report.py` builds it. An entry says
# every row a release published under the old family is the row of the same
# name the new family measures now. It is the one declaration three readers
# share:
#
#   the benchmarks page   joins a row's history across the rename
#   the label gate        labels and exempts a row once, under its new ID
#   make bench-ab         pairs A's old row with B's new one
#
# `make lint` (bench-coverage-check) refuses an entry whose old family no
# release published or a bench still builds, whose new family no bench
# builds, or that makes two rows of one release one.

# #2752 step 3: the correlation objects became one C object, `correlator`,
# whose one bench writes every row (docs/design/correlator.md section 7.1).
"c:corr" = "c:correlator"         # step 3.2
"c:corr2d" = "c:correlator"       # step 3.2
"py:corr2d" = "py:correlator"     # step 3.2
"c:detector" = "c:correlator"     # step 3.3
"c:detector2d" = "c:correlator"   # step 3.3
"c:acq" = "c:correlator"          # step 3.4b
"c:burst_acq" = "c:correlator"    # step 4: burst_acq retired
