[mpsk_receiver]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "MpskReceiver"
# ddc (the matched front end) and ratesync (the shared timing loop) are the
# composed cores; everything after them is a core those two drag in, which the
# standalone C test/bench must also link because link=true is NOT transitive
# (the #225 mechanic -- RateConverter alone is a cascade of five). wfm_dsp_core
# (the canonical rrc kernel behind the matched bank) is a wfmcompose-internal
# OBJECT lib, not a jm component, so it rides extra_link_libs.
depends_on = [
    { name = "ber" }, # dp_sym_test.h delegates here
  { name = "ddc", link = true },
  { name = "ratesync", link = true },
  { name = "RateConverter", link = true },
  { name = "resamp", link = true },
  { name = "hbdecim", link = true },
  { name = "cic", link = true },
  { name = "fir", link = true },
  { name = "resample", link = true },
  { name = "lo", link = true },
  { name = "nco", link = true },
  { name = "loop_filter", link = true },
  { name = "lockdet", link = true },
  { name = "dp_tlm", link = true },
  { name = "agc", link = true },
]
extra_link_libs = ["wfm_dsp_core"]
serializable = "true"
# A NULL create here means a parameter was out of range, not that the machine
# ran out of memory (gh-482). Say so.
create_error = "ValueError"
create_error_message = "MpskReceiver: invalid parameter (need m in {2,4,8}, sps >= m_out, m_out even in [2, 8], 0 <= rrc_beta <= 1, rrc_span >= 1, num_phases a power of two >= 2, bn >= 0, zeta > 0, 0 < bn_agc_ratio < 1)"

[[mpsk_receiver.init_params]]
name = "m"
type = "int"
default = "4"

[[mpsk_receiver.init_params]]
name = "sps"
type = "double"
default = "8.0"
doc = "Samples per symbol. Any double >= `m_out` -- 17.33389 is as valid as 8, because the front end plans its own cascade and the terminal stage's accumulator is a double. That is the real-world case whenever the ADC clock is free-running against the symbol clock."

[[mpsk_receiver.init_params]]
name = "m_out"
type = "size_t"
default = "0"
doc = "**0 (the default) derives it** -- see docs/design/mpsk.md §8.1; pass a value only to pin one. The rule is the largest even count in 2..8 the rate allows, so a caller cannot pair an `sps` and an `m_out` that will not work together. Terminal outputs per symbol: even, 2..8. The Gardner detector takes every m_out-th output as the on-time strobe and the one m_out/2 back as the transition gate, so the oversampled matched-filtered stream falls out for free. **The default is 8 because that is where the I&D matched filter reaches the coherent bound.** The rectangle is one symbol wide, so its matched filter is an m_out-tap sum spanning it, and a smaller m_out samples that same integral more coarsely. Measured on QPSK at the default sps=8 against the coherent bound EVM_dB = -(Es/N0)_dB: at 18 dB Es/N0, m_out=8 lands 0.41 dB off the bound where m_out=4 loses 3.11 dB; at 14 dB it is 0.25 dB against 1.71 dB -- the gap widens as noise stops hiding it. **Never pair 2 with pulse=\"iandd\"**: the matched filter degenerates to a two-tap sum, the eye barely opens (measured lock statistic -0.34 at 2 against +0.95 at 4 on the same NRZ stream) and acquisition itself fails about half the time (4/8 seeds locked at 14 dB Es/N0, against 8/8 at both 4 and 8). Replaces the old `n` (NDA arm dumps per symbol): the cascade's own outputs now feed the carrier discriminator, so there is no separate arm to size."

[[mpsk_receiver.init_params]]
name = "pulse"
type = "string_enum:iandd,rrc"
default = "iandd"

[[mpsk_receiver.init_params]]
name = "rrc_beta"
type = "double"
default = "0.35"

[[mpsk_receiver.init_params]]
name = "rrc_span"
type = "int"
default = "8"

[[mpsk_receiver.init_params]]
name = "bn_carrier"
type = "double"
default = "0.01"

[[mpsk_receiver.init_params]]
name = "zeta"
type = "double"
default = "0"
doc = "Damping factor for both loops. **0 (the default) derives it** as `1/sqrt(2)`, critically damped -- a constant, not a computation, and a parameter only because it was once thought to be one (docs/design/mpsk.md §8.1)."

[[mpsk_receiver.init_params]]
name = "bn_timing"
type = "double"
default = "0.01"

[[mpsk_receiver.init_params]]
name = "acq_to_track"
type = "int"
default = "0"

[[mpsk_receiver.init_params]]
name = "lock_thresh"
type = "double"
default = "0"
doc = "Handover declare threshold on the carrier lock EMA. **0 (the default) derives it** as `sigma_H0 * eta(Pfa)` = 0.4999 at `Pfa = 5e-6`; the limited statistic reads ~1.0 at lock for every M, so no per-M correction is carried (docs/design/mpsk.md §8.1)."

[[mpsk_receiver.init_params]]
name = "init_norm_freq"
type = "double"
default = "0.0"

[[mpsk_receiver.init_params]]
name = "differential"
type = "int"
default = "0"

[[mpsk_receiver.init_params]]
name = "num_phases"
type = "size_t"
default = "0"
doc = "Matched-filter bank arms, a power of two; sets the fractional-timing resolution to 1/num_phases of an output period. **0 (the default) derives it** as 64, the measured saturation point -- against the 1024 that shipped, a 16x bank for no measurable gain (docs/design/mpsk.md §8.1). Matched-filter bank arms; a power of two. Sets the fractional-timing resolution to 1/num_phases of an output period. The bank is sized by the POST-decimation rate, so this costs the same at sps=8 and sps=256."

[[mpsk_receiver.init_params]]
name = "nda_tap"
type = "string_enum:strobe,mf_out,mf_in"
default = "strobe"
doc = "Where the NDA carrier discriminator reads, which sets its pull-in range and whether it needs symbol timing at all. An M-th-power detector updating at rate F can only see |df| < F/(2M), so the tap point IS the range. The names are the matched filter's two ports plus one well-known gate. `strobe` (default) reads the on-time MFR output at the symbol rate Rs: the cleanest input, the narrowest range (Rs/(2M)), and the only tap whose input quality depends on the timing loop -- it steers from its first strobe whether or not timing has declared, so when the carrier must acquire before timing does, that is a reason to pick another tap rather than something the receiver resolves for you. `mf_out` reads every MFR output at m_out*Rs -- m_out times the range and no timing dependence, paid for with the ISI the between-symbol outputs carry, which hurts most where the decision margin is smallest (8PSK). `mf_in` reads the MFR's input: post-MIX, post-DEC, post-AGC, still ahead of the matched filter -- already band-limited by DEC's own filters and already levelled by the AGC that sits on that exact node, which is why it needs no Costas arm filter of its own and why none is provided. Timing-independent. Its update rate is the cascade's `bank_sps`, a planner outcome rather than a construction constant, so its pull-in ceiling moves with your rate ratio. Fixed at construction: nothing switches underneath you. If you need more range than any tap gives, put a coarse frequency estimate in front and pass it as init_norm_freq."

[[mpsk_receiver.init_params]]
name = "agc"
type = "int"
default = "1"
doc = "Level the front-end cascade so the timing detector's construct-time slope means what it says. The TED normalises by its OWN slope and nothing else, and that slope is computed for a UNIT-amplitude symbol stream -- amplitude enters the raw error as A^2 (Gardner) or A^1 (DTTL), so a 4x level error is a 16x loop-gain error. With this on, an AGC sits inside the cascade just before the matched filter and drives the average power to the level a unit-amplitude symbol stream would have there, derived from the matched filter's own pulse energy rather than configured. On by default because the alternative is a receiver whose loop gain depends on how loud the input happened to be. Set 0 to reproduce the un-levelled behaviour exactly, which is the handle for attributing any measurement that moves. This is the receiver's ONLY AGC -- the carrier discriminator normalises by its own |z|^M and needs none. Read the applied gain back with `agc_gain_db`."

[[mpsk_receiver.init_params]]
name = "bn_agc_ratio"
type = "double"
default = "0"
doc = "**0 (the default) derives it** -- see docs/design/mpsk.md §8.1; pass a value only to pin one. The one AGC's noise bandwidth as a fraction of the SLOWEST loop it feeds -- min(bn_carrier, bn_timing), not the carrier's alone, since the AGC feeds the timing loop directly. Must be in (0, 1) and construction refuses otherwise, because an AGC at or above the bandwidth of a loop it feeds corrects the excursions that loop is itself producing and the two integrate against each other; the signal LEVEL is a slow property of the channel, not a disturbance to reject at loop speed. Exposed rather than fixed because the right separation depends on how fast the channel's level moves against how fast its phase and timing do, which is a property of the link. The cold start is not the loop's job either way -- the AGC seeds its gain from a direct measurement -- so slow is cheap here."

# The continuous flavor (docs/design/mpsk.md §2.1). A VIEW, not a second
# type: same core, same state, same methods -- only the constructor differs,
# which is the axis that makes something a flavor here (a difference in
# METHOD SIGNATURE would make it a separate type, which is why the real-input
# twin is one and this is not). Nothing is removed from mpsk_receiver; every
# knob is still reachable through it.
#
# What this view pins is the gating: acq_to_track=0 (no handover), and
# nda_tap=strobe, the only tap that acquires AND reports it at every point of
# the standard battery. "Nothing waits" is about the GATES, not the tap -- the
# discriminator steers from its first strobe whether or not timing has
# declared, so what strobe adds is a coupling and not a gate. This pinned
# mf_in when it shipped, for its timing independence; measured, the pre-MFR
# node carries excess noise bandwidth, and since an M-th-power lock signal is
# an SNR measure rather than a phase measure, the loop still acquired fully
# while the lock EMA settled at 0.20 against strobe's 0.79 -- never crossing
# its own threshold, so a working carrier loop was indistinguishable from a
# dead one to every detector downstream (doppler#791).
# agc=1 because the AGC is load-bearing, and the five derived parameters go
# as 0 (a request, not an omission).
#
# lock_thresh is excluded rather than defaulted: with no handover it gates
# nothing, so it is telemetry. It stays READABLE (`lock_thresh` reads back
# the derived 0.4999) and stops being settable, which is the honest shape for
# a number that no longer controls anything.
[[mpsk_receiver.views]]
class_name = "ContinuousMpskReceiver"
create_fn = "mpsk_receiver_create_continuous"
init_params = [
  { name = "m", type = "int", default = "2" },
  { name = "sps", type = "double", default = "8.0" },
  { name = "pulse", type = "string_enum:iandd,rrc", default = "iandd" },
  { name = "rrc_beta", type = "double", default = "0.35" },
  { name = "rrc_span", type = "int", default = "8" },
  { name = "bn_carrier", type = "double", default = "0.01" },
  { name = "bn_timing", type = "double", default = "0.01" },
  { name = "init_norm_freq", type = "double", default = "0.0" },
  { name = "differential", type = "int", default = "1" },
]

[[mpsk_receiver.properties]]
name = "agc_gain_db"
type = "double"
doc = "Gain the front-end AGC is applying, in dB; 0.0 when `agc=0`. The diagnostic for a level problem: a receiver that will not lock with a healthy `lock` statistic, or one whose timing loop behaves differently at two input levels, is asking about this number. It settles at -10*log10(P_in / P_ref), where P_ref is the power a unit-amplitude symbol stream has where the AGC sits, so a reading far from 0 dB says the input is far from the level the cascade was built for -- which is fine, and is what the AGC is for, but is worth knowing. Distinct from the cascade's filter response, which stays unity; the two multiply."

# Telemetry attach (jm gh-432; mirrors objects/agc.toml): registers the
# receiver's "<prefix>.lock" + "<prefix>.tracking" probes (the latter is
# the two-way handover lockdet decision, 0/1) and forwards to both embedded
# loops — "<prefix>.car.lock/.e/.freq/.locked" (carrier) and
# "<prefix>.sync.e/.freq/.rate/.lock/.locked" (timing) — eleven probes per
# attach (the carrier AGC's gain probe went with the carrier AGC). None detaches everything; the int status
# binds -> None / ValueError.
[[mpsk_receiver.methods]]
name = "set_telemetry"
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "tlm", type = "dp_tlm_t *", capsule = "doppler.telemetry.dp_tlm", header = "dp_tlm/dp_tlm_core.h" },
  { name = "prefix", type = "const char *" },
  { name = "decim", type = "uint32_t", default = "1" },
]

[[mpsk_receiver.methods]]
name = "steps"
doc = "Demodulate a cf32 block and return the recovered M-PSK symbols (one cf32 per recovered symbol period, ~ len(x)/sps outputs). Per sample the receiver pushes x through the matched DDC -- LO mix, decimating cascade, and a terminal polyphase stage whose bank IS the matched filter and whose selected arm IS the fractional symbol-timing delay -- then folds every output that stage produced into two loops: a Gardner symbol-timing loop steering the cascade's rate_ctrl port, and a carrier loop steering the LO's freq_ctrl port. The carrier discriminator runs on the on-time strobe only -- a non-strobe output straddles two symbols, so its M-th power is intersymbol interference rather than carrier phase -- and while acquiring it is the non-data-aided M-th-power error, needing no data and no symbol timing. With acq_to_track enabled a verify-counted two-way handover steps on the carrier lock metric each symbol: it switches to a lower-jitter decision-directed carrier loop after 8 consecutive above-lock_thresh symbols, and on a sustained lock loss (32 consecutive symbols below 0.8*lock_thresh) drops back to the NDA acquisition steer, the shared loop filter carrying the frequency estimate both ways. The loop locks to one of m phases (M-fold ambiguity); resolve it with bits(differential) or a sync word. Read norm_freq for the tracked carrier and lock for the carrier lock metric."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[mpsk_receiver.methods]]
name = "bits"
doc = "Demodulate a cf32 block and return hard Gray-coded bits (log2(m) bytes of 0/1 per recovered symbol, LSB-first). Coherent by default; if the receiver was created with differential=1, each symbol's bits come from the phase DIFFERENCE between consecutive symbols (rotation-invariant — resolves the m-fold carrier ambiguity at ~2x the symbol-error rate). Same per-sample carrier/timing recovery as steps()."
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]

[[mpsk_receiver.methods]]
name = "configure_lock"
doc = "Re-tune the acquisition<->tracking handover detector: hands the carrier to the decision-directed discriminator after n_up consecutive symbols with the carrier lock EMA above up_thresh, and falls back to NDA acquisition after n_down consecutive symbols below down_thresh (level + time hysteresis; see detection.LockDet). Previously only settable at construction (lock_thresh, with fixed 0.8x drop / 8-up / 32-down constants) -- this is the post-construction re-tune Dll and Costas both already have. A live handover survives the re-tune; the in-flight verify run restarts."
arg_type = "void"
return_type = "void"
params = [
  { name = "up_thresh", type = "double" },
  { name = "down_thresh", type = "double" },
  { name = "n_up", type = "uint32_t" },
  { name = "n_down", type = "uint32_t" },
]

[[mpsk_receiver.methods]]
name = "reset"
doc = "Re-seed the carrier and symbol-timing loops to their create-time state; preserve configuration."
arg_type = "void"
return_type = "void"

[[mpsk_receiver.properties]]
name = "norm_freq"
type = "double"
writable = true

[[mpsk_receiver.properties]]
name = "lock"
type = "double"

[[mpsk_receiver.properties]]
name = "zeta"
type = "double"
doc = "Loop damping actually in use. Reads back the DERIVED `1/sqrt(2)` when the constructor was given 0, or whatever was pinned instead. Everything derived is reported (docs/design/mpsk.md §8.1), on the same argument as `RateConverter.stages`: without the readback, passing 0 is an instruction whose result nobody can see."

[[mpsk_receiver.properties]]
name = "num_phases"
type = "size_t"
doc = "Matched-filter bank arms actually in use. Reads back the DERIVED 64 -- the measured saturation point, against the 1024 that shipped -- when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "lock_thresh"
type = "double"
doc = "Handover declare threshold actually in use. Reads back the DERIVED `sigma_H0 * eta(Pfa)` = 0.4999 at `Pfa = 5e-6` when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "bn_agc_ratio"
type = "double"
doc = "AGC bandwidth as a fraction of the slowest loop it feeds, actually in use. Reads back the DERIVED 0.05 when the constructor was given 0. See `zeta` for why every derived value is reported."

[[mpsk_receiver.properties]]
name = "lock_time"
type = "int64_t"
doc = "Symbols from reset to the FIRST carrier-lock declaration, or -1 if the receiver has not locked yet -- the acquisition time as a number, rather than something a caller has to infer by polling `locked` in a loop. Dated by the same hysteretic detector `locked` reports, so the two cannot disagree. In SYMBOLS, not seconds: `bn_carrier` and `bn_timing` are both normalised to the symbol rate, so a settling budget quoted in symbols is comparable across every input rate, and a caller holding Rs divides once. Only the FIRST declaration is dated -- a drop and re-acquire does not restamp it, because the question this answers is 'how long did this receiver take to lock', not 'when did it last hold'. `reset()` clears it to -1."

[[mpsk_receiver.properties]]
name = "timing_rate"
type = "double"

[[mpsk_receiver.properties]]
name = "tracking"
type = "int"

[[mpsk_receiver.properties]]
name = "m"
type = "int"

[[mpsk_receiver.properties]]
name = "sps"
type = "double"

[[mpsk_receiver.properties]]
name = "m_out"
type = "size_t"

[[mpsk_receiver.properties]]
name = "clipped"
type = "int"
doc = "Has the cascade's CIC stage clipped its input since the last reset? A CIC bounds its input to |Re|, |Im| <= 1.0 and clips silently past that -- the output stays finite and plausible, merely distorted, at a cost of ~25 dB of EVM that no lock metric reveals. Always 0 for a plan with no CIC stage."
