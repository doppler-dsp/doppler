[build-system]
requires = ["just-buildit", "numpy"]
build-backend = "just_buildit"

[project]
name = "iqtools"
version = "0.1.0"
description = "TODO: describe your project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

# ONE extra, not one per target. A starter should have a single setup command
# rather than a menu of them, and every name here is a wheel — so `make setup`
# needs no privileges and touches nothing outside this directory.
#
# NumPy is deliberately absent: it is already declared in `[build-system]
# requires` and `[project] dependencies` above, and naming it again here would
# be a third place to forget it.
[project.optional-dependencies]
dev = [
    # make test — the suite writes its fixtures with doppler's Python writer
    # and reads them back through this project's facade. The distribution is
    # `doppler-dsp`; plain `doppler` on PyPI is an unrelated SQL migration
    # tool, and installing that one costs a confusing five minutes.
    "pytest",
    "doppler-dsp",
    # make bench — pytest-benchmark is what the Python half needs; without it
    # `jm bench` reports "none found" and moves on. The benchmark RUNNER,
    # just-makeit, is deliberately not listed: its version is declared once in
    # just-makeit.toml, and `make setup` installs that one.
    "pytest-benchmark",
]

[tool.just-buildit]
command = "make just-build"

[tool.pytest.ini_options]
# `bench_*.py` as well as `test_*.py`, so pytest collects the benchmark files
# next to the tests. Without it `make bench` finds no Python benchmarks.
#
# It is global, so `make test` would collect them too and need the
# `benchmark` fixture that only the dev extra provides. That target passes
# --ignore-glob="*/benchmarks/*" for exactly this reason; see the Makefile.
python_files = ["test_*.py", "bench_*.py"]
testpaths = ["src"]
