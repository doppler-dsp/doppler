[pn]
arg_type = "void"
return_type = "uint8_t"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "PN"
serializable = "true"

[[pn.init_params]]
name = "poly"
type = "uint64_t"
# 0 selects the MLS primitive polynomial for `length` (#191), matching the
# Synth(pn_poly=0) convention. The old 96/1/7 defaults predated that fix and
# never matched shipped behaviour.
default = "0"

[[pn.init_params]]
name = "seed"
type = "uint64_t"
default = "0"

[[pn.init_params]]
name = "length"
type = "uint32_t"
default = "0"

[[pn.init_params]]
name = "lfsr"
type = "string_enum:galois,fibonacci"
default = "galois"

[[pn.methods]]
name = "generate"
arg_type = "void"
return_type = "uint8_t"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting max_out
# truncates the emission instead of overrunning `out`.
pass_capacity = true
