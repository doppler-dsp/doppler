# The f64 ring (buffer/buffer.h) as a jm component. The C does not change:
# `fn` binds the symbols DECLARE_DP_BUFFER / DECLARE_DP_BUFFER_VIEW already
# emit, `header_only` says there is no _core.c, and the state type is a typedef
# of dp_f64_t in native/inc/doppler/f64_buffer/f64_buffer_core.h -- which is also where every
# docstring below the class line comes from.
#
# Its two siblings differ only in the element. They are three files until
# just-makeit#1310 (a manifest template) can say that once.
[f64_buffer]
arg_type = "void"
return_type = "double _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
no_reset = "true"
opaque_state = "true"
header_only = "true"
class_name = "F64Buffer"
create_fn = "dp_f64_create"
# NULL from create() is a capacity of 0, one too large to map, or a mapping
# the OS refused -- the caller's to fix, not an allocation failure.
create_error = "ValueError"
create_error_message = "capacity must be at least 1, and small enough to map"

[[f64_buffer.depends_on]]
name = "dp_interrupt_guard"

[[f64_buffer.init_params]]
name = "capacity"
type = "size_t"
required = true

# `strict`: a ring exists to avoid copies, so a wrong dtype, rank or stride is
# REFUSED rather than cast, copied and flattened.
[[f64_buffer.methods]]
name = "write"
arg_type = "double _Complex[]"
return_type = "bool"
strict = true
fn = "dp_f64_write_view"

[[f64_buffer.methods]]
name = "write_some"
arg_type = "double _Complex[]"
return_type = "size_t"
strict = true
fn = "dp_f64_write_some_view"

# wait() BLOCKS, so `nogil` is correctness: with the GIL held a Python producer
# could never run and a threaded pair would hang. One status table, shared
# with peek(); dp_f64_wait_status() owns the precedence in C.
[[f64_buffer.methods]]
name = "wait"
arg_type = "void"
return_type = "double _Complex"
nogil = true
fn = "dp_f64_wait_view"
borrow = true
status_fn = "dp_f64_wait_status"

[[f64_buffer.methods.params]]
name = "n"
type = "size_t"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_TOO_LARGE"
error = "ValueError"
message = "wait({n}) can never be satisfied: the ring holds {capacity}"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_CLOSED"
error = "EOFError"
message = "end of stream: the producer closed the ring"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_INTERRUPTED"
error = "KeyboardInterrupt"
message = "interrupted"

# DP_WAIT_PENDING has no row, so peek() falls through to `none_on_empty`:
# None means NOT YET and nothing else.
[[f64_buffer.methods]]
name = "peek"
arg_type = "void"
return_type = "double _Complex"
fn = "dp_f64_peek_view"
none_on_empty = true
borrow = true
status_fn = "dp_f64_wait_status"

[[f64_buffer.methods.params]]
name = "n"
type = "size_t"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_TOO_LARGE"
error = "ValueError"
message = "peek({n}) can never be satisfied: the ring holds {capacity}"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_CLOSED"
error = "EOFError"
message = "end of stream: the producer closed the ring"

[[f64_buffer.methods.status_errors]]
status = "DP_WAIT_INTERRUPTED"
error = "KeyboardInterrupt"
message = "interrupted"

# The two releases. consume(n) defaults n to the outstanding borrow's count;
# reset() takes none and just invalidates it.
# The C release REFUSES n > available (DP_ERR_INVALID, nothing released);
# `status_return` turns that into the exception. Unbounded, it let two lines
# of Python push the tail past the head and crash the interpreter.
[[f64_buffer.methods]]
name = "consume"
arg_type = "void"
return_type = "int"
status_return = true
error = "ValueError"
error_message = "consume(n): n exceeds the samples available; nothing was released"
fn = "dp_f64_consume"
releases = ["wait", "peek"]

[[f64_buffer.methods.params]]
name = "n"
type = "size_t"

[[f64_buffer.methods]]
name = "close"
arg_type = "void"
return_type = "void"
fn = "dp_f64_close"

[[f64_buffer.methods]]
name = "reset"
arg_type = "void"
return_type = "void"
fn = "dp_f64_reset"
releases = ["wait", "peek"]

[[f64_buffer.properties]]
name = "capacity"
type = "size_t"

[[f64_buffer.properties]]
name = "available"
type = "size_t"

[[f64_buffer.properties]]
name = "space"
type = "size_t"

[[f64_buffer.properties]]
name = "dropped"
type = "size_t"

[[f64_buffer.properties]]
name = "closed"
type = "bool"
