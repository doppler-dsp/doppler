[[frame.init_params]]
name = "payload_nbits"
type = "size_t"
default = "0"

[[frame.init_params]]
name = "payload_poly"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_seed"
type = "uint64_t"
default = "0"

[[frame.init_params]]
name = "payload_reg_bits"
type = "uint32_t"
