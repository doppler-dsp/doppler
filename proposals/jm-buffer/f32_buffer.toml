[f32_buffer]
arg_type = "void"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
no_reset = "true"
opaque_state = "true"
header_only = "true"
class_name = "F32Buffer"
create_fn = "dp_f32_create"

[[f32_buffer.init_params]]
name = "n_samples"
type = "size_t"
default = "0"

[[f32_buffer.methods]]
name = "write"
arg_type = "float _Complex[]"
return_type = "bool"
fn = "dp_f32_write_view"

[[f32_buffer.methods]]
name = "wait"
arg_type = "void"
return_type = "float _Complex"
fn = "dp_f32_wait_view"
borrow = true

[[f32_buffer.methods.params]]
name = "n"
type = "size_t"

[[f32_buffer.methods]]
name = "consume"
arg_type = "void"
return_type = "void"
fn = "dp_f32_consume"

[[f32_buffer.methods.params]]
name = "n"
type = "size_t"

[[f32_buffer.methods]]
name = "close"
arg_type = "void"
return_type = "void"
fn = "dp_f32_close"

[[f32_buffer.properties]]
name = "capacity"
type = "size_t"
expr = "self->handle->capacity"

[[f32_buffer.properties]]
name = "available"
type = "size_t"
expr = "dp_f32_available(self->handle)"

[[f32_buffer.properties]]
name = "dropped"
type = "size_t"
expr = "self->handle->dropped"

[[f32_buffer.properties]]
name = "closed"
type = "bool"
expr = "dp_f32_closed(self->handle)"

# The destructor, named rather than derived.
#
# just-makeit#1323 made `create_fn` derive its counterpart, so
# `dp_f32_create` should imply `dp_f32_destroy` with nothing written here.
# Measured on v0.76.0: the derivation does not fire through `jm apply` (the
# resolver is correct in isolation; something upstream of it drops
# `create_fn`) -- just-makeit#1326. The EXPLICIT key does work, on all three
# teardown paths, so it is what retires the hand-written forwarder that used
# to live in the shim. Delete this table when #1326 lands.
[f32_buffer.destroy]
fn = "dp_f32_destroy"
