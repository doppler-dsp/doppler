name: Docs

on:
  push:
    branches: [main]
  # On a PR, only when the C API pipeline itself could break.
  #
  # This trigger used to be unfiltered, so that stacked PRs would build the
  # docs too. ci.yml's Docs job now does that on EVERY PR — it runs
  # `make docs-check`, which builds the site strictly and runs every docs gate,
  # and it is inside the required `CI passed` aggregator. So an unfiltered
  # trigger here just built the same site a second time on every PR, from a
  # second configuration (criterion 6 of the Makefile-standard plan,
  # doppler-dsp/doppler#555).
  #
  # What this job uniquely covers is the mkdoxy regeneration below, which
  # ci.yml does not run — and only these inputs can break it. Header *content*
  # is already gated on every PR by ci.yml's `doxygen` job (0 warnings at CI's
  # pinned version), so this is about the generation pipeline, not the docs it
  # generates.
  pull_request:
    paths:
      - 'native/inc/**'
      - 'Doxyfile'
      - 'mkdocs-capi.yml'
      - '.github/workflows/docs.yml'

# Only one deploy at a time; don't cancel in-progress deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Build — runs on every push and PR
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.12'
          sync: --group dev --group docs

      - name: Install doxygen
        # `make install-docs-deps`, not a raw apt-get: bootstrap.toml's `docs` group is
        # the single dependency list, shared with ci.yml's doxygen job. The
        # inline copy had already drifted from it (missing graphviz's companions
        # / the LaTeX set bootstrap.toml declares).
        timeout-minutes: 25
        run: make install-docs-deps-ci

      - name: Generate C API docs
        # `make gen-c-api`, not an inline copy. This step WAS a fourth
        # implementation of the generated-docs family, and it had already
        # diverged from the target in two ways that matter:
        #
        #   env:    `uv run mkdocs` here vs `uv run --group docs mkdocs` in the
        #           Makefile -- and a bare `uv run` re-syncs to the DEFAULT
        #           groups, which can drop the docs group it needs.
        #   stale:  `cp -r .../c-api/.` MERGED into the existing tree, while the
        #           target does `rm -rf docs/c-api` first and REPLACES it. So a
        #           deleted C symbol's page lived on forever in the deployed
        #           site while vanishing locally.
        #
        # Nobody decided that; it accumulated, which is the whole argument.
        run: make gen-c-api

      - name: Build site
        # `make docs`, not an inline `zensical build`: this was the THIRD
        # implementation of the strict build (with ci.yml's and the Makefile's),
        # and the only one of the three that removed a stale `zensical.toml`
        # first was the Makefile. One implementation now, in the place the
        # drift gate watches.
        run: make docs

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  # ------------------------------------------------------------------
  # Deploy — only on push to main
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
