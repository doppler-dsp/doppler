[loop_filter]
doc = """A second-order loop filter whose closed loop has noise bandwidth `bn`,
for a loop whose rest has unit gain.

The contract. The closed loop's noise bandwidth is `bn` cycles per
sample, a fixed function of `kp` and `ki`, provided the rest of the
loop has unit gain. The filter cannot see the rest of the loop, so each
of these is the caller's to deliver, and each is checkable:

1. The error detector's slope at lock is 1 per unit of the filter's
   error input, open loop and noise free. The filter takes the error in
   the unit the control is applied in, per update: the product of the
   detector's slope and the actuator's gain, in the units they are
   given, is 1. A detector that returns radians and an oscillator that
   takes cycles need the factor of 2*pi once, after the filter (as
   Costas converts the control to cycles per sample), never inside the
   loop gain and never twice.
2. The actuator applies the control with unit gain, once per update,
   `t` samples apart.
3. The loop is tracking, inside the detector's linear region.
4. The error reaches the filter and the control reaches the actuator
   within the same update: no extra delay (every update of delay widens
   the loop).

A loop gain K other than 1 (the detector's slope times the actuator's
gain) scales the natural frequency and the damping each by the square
root of K, so the noise bandwidth becomes (4*K*zeta^2 + 1) / (4*zeta^2
+ 1) times `bn`: 5/3 at K = 2 and 3 at K = 4 for zeta = 0.707, and 2/3
at K = 0.5. A detector whose slope is 2 is an instance:
doppler#3224. A detector whose slope is not 1, or rides on signal
level or SNR, is scaled to unit slope before the filter, by dividing by
its own slope; a slope that rides on level makes the bandwidth ride on
level.

Held by native/validation/loop_filter_noise_bw.c (the promise),
test_loop_filter_contract.py (the gain formula, and these sentences on
every face) and test_loop_detector_contract.py (the callers' side)."""
arg_type = "double"
return_type = "double"
mutable = "true"
no_state = "true"
no_step = "false"
class_name = "LoopFilter"
serializable = "true"
# gh-740: create() is the untrusted boundary -- a Python caller's arbitrary
# doubles arrive here. A NULL from create() means the domain was violated,
# not that malloc failed, so say so rather than raising MemoryError.
create_error = "ValueError"
create_error_message = "bn must be >= 0, zeta > 0 and t > 0, and all three finite, whose loop gains come out finite"
fragment = "generated"

[[loop_filter.init_params]]
name = "bn"
type = "double"
default = "0.01"

[[loop_filter.init_params]]
name = "zeta"
type = "double"
default = "0.707"

[[loop_filter.init_params]]
name = "t"
type = "double"
default = "1.0"

[[loop_filter.methods]]
name = "configure"
doc = "Recompute the loop gains for a new (bn, zeta, t); preserves the integrator. Raises ValueError, changing nothing, when (bn, zeta, t) is outside the loop's domain: bn >= 0, zeta > 0 and t > 0, all finite, whose loop gains come out finite."
arg_type = "void"
return_type = "int"
status_return = true
params = [{ name = "bn", type = "double" }, { name = "zeta", type = "double" }, { name = "t", type = "double" }]

[[loop_filter.methods]]
name = "reset"
doc = "Zero the integrator; keep the configured gains."
arg_type = "void"
return_type = "void"

[[loop_filter.properties]]
name = "kp"
type = "double"
field = true

[[loop_filter.properties]]
name = "ki"
type = "double"
field = true

[[loop_filter.properties]]
name = "integ"
type = "double"
writable = true
field = true

[[loop_filter.properties]]
name = "bn"
type = "double"
field = true

[[loop_filter.properties]]
name = "zeta"
type = "double"
field = true

[[loop_filter.properties]]
name = "t"
type = "double"
field = true
