# doppler streaming demo: a NATS broker, one transmitter, two receivers and a
# spectrum analyzer, all on an internal bridge network.
#
#   make docker-stream        # REQUIRED FIRST — see below
#   docker compose up
#
# The `make` step is not optional and not a convenience. The stream-services
# image compiles its three binaries in a glibc 2.28 toolchain (doppler's
# GLIBC_MAX floor) rather than on the modern builder, because they are the only
# artifacts here that RUN on a base other than the one that built them. That
# toolchain is a LOCAL image tag — deploy/docker/Dockerfile.glibc228, built by
# `make glibc-image`, which `make docker-stream` depends on — and nothing pulls
# it from a registry. Run `docker compose up` on a clean checkout and the build
# fails at `FROM doppler-glibc228:dev` with a pull error, which is the honest
# outcome: the floor is not something compose can satisfy on its own.
#
# Skipping it used to "work" and was the bug: binaries built on ubuntu:24.04
# (glibc 2.39) shipped onto debian:bookworm-slim (2.36), and every service died
# with `libm.so.6: version GLIBC_2.38 not found`.
services:
  # NATS broker — required by every stream service below. Not exposed to the
  # host: every service here reaches it over the internal doppler-net at
  # nats:4222. Add a `ports:` mapping only if you need host-side access too.
  nats:
    image: nats:2.10
    container_name: doppler-nats
    command: "-js"
    networks:
      - doppler-net
    restart: unless-stopped

  # Transmitter — generates and publishes signal samples.
  #
  # All four C services share one lean image: the stream-services target of
  # deploy/docker/Dockerfile.examples, which carries just the statically-linked
  # native/examples streaming binaries on PATH. The anchor below defines that build
  # once and the shared `image:` name means compose builds it a single time and
  # reuses it for every service.
  transmitter:
    build: &stream-build
      context: .
      dockerfile: deploy/docker/Dockerfile.examples
      target: stream-services
    image: doppler-stream-services:compose
    container_name: doppler-tx
    depends_on:
      - nats
    command: transmitter nats://nats:4222/iq cf64
    networks:
      - doppler-net
    stop_signal: SIGTERM
    restart: unless-stopped

  # Receiver — subscribes and prints signal stats
  receiver-1:
    build: *stream-build
    image: doppler-stream-services:compose
    container_name: doppler-rx-1
    depends_on:
      - transmitter
    command: receiver nats://nats:4222/iq
    networks:
      - doppler-net
    stop_signal: SIGTERM
    restart: unless-stopped

  # Second receiver (demonstrates PUB/SUB fan-out)
  receiver-2:
    build: *stream-build
    image: doppler-stream-services:compose
    container_name: doppler-rx-2
    depends_on:
      - transmitter
    command: receiver nats://nats:4222/iq
    networks:
      - doppler-net
    stop_signal: SIGTERM
    restart: unless-stopped

  # Spectrum analyzer — ASCII spectrum display
  spectrum-analyzer:
    build: *stream-build
    image: doppler-stream-services:compose
    container_name: doppler-spectrum
    depends_on:
      - transmitter
    command: spectrum_analyzer nats://nats:4222/iq 512
    networks:
      - doppler-net
    stop_signal: SIGTERM
    restart: unless-stopped

networks:
  doppler-net:
    driver: bridge
