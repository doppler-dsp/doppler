# ── ber — error-rate measurement (the one tool) ──────────────────────────────
# The settled window, the Pfa-gated alignment, inverse binomial sampling and
# the exact Gamma/chi-square interval, in C once. Python is the thin face.
[module.ber]
doc = """
Bit-error-rate measurement: a BerMeter that aligns a recovered bit stream to a reference and scores errors.

Examples
--------
>>> import numpy as np
>>> from doppler.ber import BerMeter
>>> truth = (np.arange(64) & 1).astype(np.uint8)
>>> m = BerMeter()
>>> _ = m.set_truth(truth)
>>> m.score((1.0 - 2.0 * truth).astype(np.complex64))
0

"""
objects = ["ber_meter", "frame_meter"]

[[module.ber.functions]]
name = "ber_theory_ser"
doc = "Coherent M-PSK symbol error rate at matched-filter Es/N0 (LINEAR, not dB). BPSK Q(sqrt(2 Es/N0)); QPSK 2Q(sqrt(Es/N0)); 8PSK 2Q(sqrt(2 Es/N0) sin(pi/8)). This is a COHERENT bound: a differentially-decoded rate is ~2x it, so pairing a differential measurement with this curve invents a factor of two of implementation loss. An M outside {2, 4, 8} returns NaN: there is no closed form for it here, and another M's rate would be a fabricated answer."
return_type = "double"

[[module.ber.functions.params]]
name = "m"
type = "int"

[[module.ber.functions.params]]
name = "esn0"
type = "double"

[[module.ber.functions]]
name = "ber_theory_ber"
doc = "Coherent GRAY-coded M-PSK bit error rate at Es/N0 (LINEAR). BPSK and Gray QPSK are exactly Q(sqrt(2 Eb/N0)); 8PSK uses SER/log2(M). An M outside {2, 4, 8} returns NaN."
return_type = "double"

[[module.ber.functions.params]]
name = "m"
type = "int"

[[module.ber.functions.params]]
name = "esn0"
type = "double"

[[module.ber.functions]]
name = "ber_esn0_db_for_ser"
doc = "Es/N0 (dB) at which the coherent bound equals `ser`. How an implementation loss is quoted honestly: convert the MEASURED rate to the Es/N0 theory would need to produce it, and subtract. A loss in dB is comparable across M and across operating points; a ratio of rates is not. Returns NAN when no Es/N0 from -10 to 40 dB produces the rate: ser <= 0, ser above the bound at -10 dB, or ser below the bound at 40 dB. Those are NOT clamped to -10 or 40 dB, so test with isnan() and write gates as !(loss <= limit), since a loss > limit comparison is false for NaN. An M outside {2, 4, 8} also returns NaN."
return_type = "double"

[[module.ber.functions.params]]
name = "m"
type = "int"

[[module.ber.functions.params]]
name = "ser"
type = "double"

[[module.ber.functions]]
name = "ber_evm_scatter_floor_db"
doc = "EVM (dB) of an M-PSK constellation at a UNIFORMLY RANDOM rotation -- the FLOOR of a self-referenced EVM, i.e. what a completely destroyed constellation reads: -1.4 dB at BPSK, -7.0 at QPSK, -12.9 at 8PSK. ANY fixed EVM threshold must be stated against this, never against 0 dB: 'scattered reads ~0 dB' is the BPSK limit only, and at 8PSK a stream with no carrier recovery reads the same -12.9 dB a healthy 13 dB link does, so a `< -12.0` assertion is satisfied by pure noise. The room between 'on the bound at the SER=1e-3 anchor' and 'completely broken' collapses as M grows (5.4 / 3.3 / 2.8 dB), so at high M the EVM cannot carry a verdict alone. Not to be confused with the NOISE floor -(Es/N0). M < 2 returns NaN."
return_type = "double"

[[module.ber.functions.params]]
name = "m"
type = "int"

[[module.ber.functions]]
name = "ber_evm_ideal_db"
return_type = "double"

[[module.ber.functions.params]]
name = "esn0_db"
type = "double"

[[module.ber.functions]]
name = "ber_settle_syms"
doc = "Symbols to discard before a steady-state measurement means anything: 2*(5/bn_timing + 5/bn_carrier). Three factors, and skipping any produces a confident wrong number -- 5/Bn per loop is the standard second-order settling time (in SYMBOLS, since both bn are symbol-rate normalised); the two budgets ADD because the loops are cascaded (the carrier discriminator reads the on-time strobe, so it cannot converge until timing has); and the sum DOUBLES for joint tracking. This is a FLOOR, not the answer: take the max of it and every lock indicator the receiver publishes. Pass a loop's bn as 0 if it is not running."
return_type = "size_t"

[[module.ber.functions.params]]
name = "bn_timing"
type = "double"

[[module.ber.functions.params]]
name = "bn_carrier"
type = "double"

[[module.ber.functions]]
name = "ber_lock_symbol"
doc = "First symbol from which a verify-counted lock flag is SUSTAINED, or -1 for 'never locked'. Sustained means `sustain` consecutive symbols high AND at least `min_frac` of everything after that point high too: the run rejects a single lucky decision, the fraction rejects a detector that declares early then flaps. Dating the lock by the FINAL contiguous run instead is right with no noise and badly wrong with it -- one late dip once moved a reported lock from 415 to 2286 and left no measurement window at all. The -1 is deliberate: it forces the caller to say 'never locked' rather than quietly measure a transient."
return_type = "int64_t"

[[module.ber.functions.params]]
name = "flags"
type = "uint8_t[]"

[[module.ber.functions.params]]
name = "sustain"
type = "size_t"
default = "200"

[[module.ber.functions.params]]
name = "min_frac"
type = "double"
default = "0.9"

[[module.ber.functions]]
name = "ber_evm_db"
doc = "Self-referenced EVM (dB) over an EXPLICIT window [lo, hi): each symbol against the stream's OWN hard decision, with the constellation rotation estimated from the data. References neither the transmitted symbols nor a lag, so it cannot be fooled by an alignment search. A locked matched-filter output reads near -(Es/N0) -- exactly ber_evm_ideal_db(esn0_db), the window being scaled to unit total power (an I/Q-plane quantity -- no factor of two; quoting one flatters the result by 3 dB). Read it against ber_evm_scatter_floor_db(m), NEVER against 0 dB. The window is explicit because BER and EVM must be measured on the SAME one: a convenience back-half default scores a different window than the error rate did, and the two eventually disagree in a way that reads as a receiver defect rather than the harness bug it is. Returns 0.0 for a window under 20 symbols. M < 2 returns NaN."
return_type = "double"

[[module.ber.functions.params]]
name = "rx"
type = "float _Complex[]"

[[module.ber.functions.params]]
name = "lo"
type = "size_t"
default = "0"

[[module.ber.functions.params]]
name = "hi"
type = "size_t"
default = "0"

[[module.ber.functions.params]]
name = "m"
type = "int"
default = "4"

[[module.ber.functions]]
name = "ber_settle_from"
doc = "Where a steady-state measurement may start: max(budget, timing lock, carrier lock). The analytic budget and the receiver's own indicators are both fallible in the SAME direction, so whichever settles last decides. There was a fourth term until doppler#877: a receiver that handed the carrier from an NDA discriminator to a decision-directed one settled last of all, contributing its instant PLUS the budget again (measured on 8PSK: handover at symbol 2525 against a 2000-symbol budget, and 5.95x the coherent bound if the window started at 2000 rather than 4525). No receiver in this library hands over any more, so the term went with the handover rather than remaining as an argument that could only be passed -1. Pass -1 for an indicator the receiver does not publish, which is what ber_lock_symbol() returns for 'never locked'. A -1 timing or carrier lock means there is NO valid steady-state window -- check that yourself before trusting the return."
return_type = "size_t"

[[module.ber.functions.params]]
name = "budget"
type = "size_t"

[[module.ber.functions.params]]
name = "timing_lock"
type = "int64_t"
default = "-1"

[[module.ber.functions.params]]
name = "carrier_lock"
type = "int64_t"
default = "-1"
