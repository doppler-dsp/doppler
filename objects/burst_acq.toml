[burst_acq]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "BurstAcquisition"
serializable = "true"
# A NULL create() is an ARGUMENT error, never an allocation one (doppler#1486)
# -- the same shape as objects/burst_capture.toml's. Before this, an infinite
# cn0_dbhz or a pfa of 1 surfaced as MemoryError.
create_error = "ValueError"
create_error_message = "BurstAcquisition: invalid parameter (need a non-empty preamble with finite, non-zero energy, reps >= 1, fs > 0, cn0_dbhz finite or NaN, doppler_uncertainty >= 0, doppler_rate >= 0, 0 < pfa < 1, 0 < pd < 1)"
# The under-powered UserWarning is declared (gh-481): its condition is a
# bool field of burst_acq_state_t, which mirrors the engine's at
# construction -- the same warning objects/acq.toml declares.
warnings = [
  { after = "__init__", condition = "underpowered", category = "UserWarning", message = "BurstAcquisition is under-powered: pd_burst < pd at this reps/cn0_dbhz. Raise reps or cn0_dbhz, or narrow doppler_uncertainty." },
]
# Composes acq's shared engine (acq_state_t/acq_core.c) -- this class is the
# BURST front door (see docs/design/async-dsss-receiver.md's Acquisition/
# BurstAcquisition split); today's existing pre-split Acquisition behavior,
# unchanged, including its wideband fallback for doppler_uncertainty beyond
# the native span (coherent depth structurally can't cover more than one
# native span, regardless of class). The hand-written burst_acq_core.h/.c
# (below) is a thin forwarder onto acq_create_burst()/acq_push()/etc -- the
# entire algorithm lives in acq_core.c exactly once.
depends_on = [
    { name = "acq", link = true },
    # cvt: bin_to_nrz(), which the C test and bench build PN preambles with.
    # Bare -- they need the symbol, the .so does not.
    { name = "cvt" },
]
# ── Construction: physics in, grid out ───────────────────────────────────────
# The preamble is its SAMPLES (doppler#1470): one period, repeated up to
# `reps` times, at `fs`. A PN code is one such preamble -- map its chips with
# doppler.cvt.bin_to_nrz and hold each `spc` samples, at fs = chip_rate*spc.
# The preamble's own correlation gives the delay straddle and the peak zone,
# which is the model a sampled, band-limited chain actually has.

[[burst_acq.init_params]]
name = "preamble"
type = "float _Complex[]"

[[burst_acq.init_params]]
name = "reps"
type = "size_t"
default = "1"

# 1 is normalized units: Doppler in cycles/sample, cn0_dbhz the per-sample
# SNR in dB.
[[burst_acq.init_params]]
name = "fs"
type = "double"
default = "1.0"

[[burst_acq.init_params]]
name = "cn0_dbhz"
type = "double"
# NaN = no design point (doppler#1484): any finite C/N0 is a real one.
default_raw = "ACQ_CN0_NONE"

[[burst_acq.init_params]]
name = "doppler_uncertainty"
type = "double"
default = "0.0"

[[burst_acq.init_params]]
name = "pfa"
type = "double"
default = "1e-3"

[[burst_acq.init_params]]
name = "pd"
type = "double"
default = "0.9"

[[burst_acq.init_params]]
name = "noise_mode"
type = "string_enum:mean,median,min,max"
default = "mean"

# Hz/s; caps the coherent depth at f_epoch/sqrt(2*rate) (doppler#1482).
# 0 = no bound. Appended last, so no positional call moves.
[[burst_acq.init_params]]
name = "doppler_rate"
type = "double"
default = "0.0"

[[burst_acq.methods]]
name = "push"
arg_type = "float _Complex"
return_type = "acq_result_t"
nogil = true
max_results = 64
result_fields = [{name = "doppler_bin", type = "size_t"}, {name = "code_phase", type = "size_t"}, {name = "peak_mag", type = "float"}, {name = "noise_est", type = "float"}, {name = "test_stat", type = "float"}, {name = "cn0_dbhz_est", type = "float"}, {name = "samples_consumed", type = "uint64_t"}]

# Advanced escape hatch: pin the search grid directly, bypassing both
# auto-sizing searches (mirrors Dll's/Costas's configure_lock_raw()). Raises
# ValueError if doppler_bins is outside [1, reps] or n_noncoh outside
# [1, 256] (the internal non-coherent-look safety-valve ceiling). Resizes
# every grid-dependent buffer/plan and clears in-flight accumulation (ring
# contents, the non-coherent power accumulator) -- call between push() calls,
# never a substitute for one.
[[burst_acq.methods]]
name = "configure_search_raw"
doc = "Pin the search grid directly, bypassing both auto-sizing searches -- the advanced escape hatch (mirrors Dll.configure_lock_raw/Costas.configure_lock). Resizes every buffer/plan that depends on the grid (the slow-time FFT, the code correlator, the reference, and every per-frame scratch buffer), re-derives the threshold ladder for the pinned grid from the same physics __init__ used, and clears in-flight accumulation (ring contents, the non-coherent power accumulator, dwell bookkeeping) -- call between push() calls, never a substitute for one. Raises ValueError if doppler_bins is outside [1, reps] or n_noncoh is outside [1, 256] (the internal non-coherent-look safety-valve ceiling)."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "doppler_bins", type = "size_t" },
  { name = "n_noncoh", type = "size_t" },
]

[[burst_acq.methods]]
name = "set_max_peaks"
doc = "How many peaks a dwell may report -- the peak list's capacity (docs/design/async-dsss-receiver.md section 7.1). One (the default) is the classic gated maximum. More lists every peak above the same gate, strongest first, with an exclusion zone of one Doppler bin by one chip around each (one emitter's main lobe, so its own shoulders are not the next peak) and the two-epoch rule for a peak at an already-listed code phase (a data transition inside the epoch splits one emitter into twins at its own code phase on other tiles; such a peak is held for one dwell and listed only if it is still there, at the same tile, on the next). Each listed peak is one record from push(), all of a dwell's sharing samples_consumed and noise_est; a held twin takes one of the n slots that dwell but is not reported. The threshold does not change with n. Raises ValueError outside 1..64. Clears the held candidates."
arg_type = "void"
return_type = "int"
status_return = true
params = [
  { name = "n", type = "size_t" },
]

[[burst_acq.properties]]
name = "max_peaks"
type = "size_t"
expr = "self->handle->engine->max_peaks"
doc = "The peak list's capacity per dwell (1 = the classic gated maximum); set with set_max_peaks()."

# ── Read-back grid the engine derived ────────────────────────────────────────

[[burst_acq.properties]]
name = "code_bins"
type = "size_t"
expr = "self->handle->engine->code_bins"
doc = "Delay hypotheses searched: one repetition of the preamble, in samples (len(preamble))."

[[burst_acq.properties]]
name = "doppler_bins"
type = "size_t"
expr = "((self->handle->engine->window_bins > 1) ? self->handle->engine->window_bins : self->handle->engine->coherent_bins)"
doc = "Coherent depth chosen: the slow-time FFT length in code reps (<= reps), unless doppler_uncertainty exceeds the native span, in which case this reports the wideband window-tile count instead (coherent depth forced to 1 -- see acq_core.h's file doc comment)."

[[burst_acq.properties]]
name = "reps"
type = "size_t"
expr = "self->handle->engine->reps"
doc = "Max coherent code repetitions (the coherence ceiling)."

[[burst_acq.properties]]
name = "n_noncoh"
type = "size_t"
expr = "self->handle->engine->n_noncoh"
doc = "Non-coherent looks per detection (1 = pure coherent)."

[[burst_acq.properties]]
name = "ring_cap"
type = "size_t"
expr = "self->handle->engine->ring_cap"
doc = "Input ring capacity in complex samples."

[[burst_acq.properties]]
name = "noise_lo"
type = "size_t"
expr = "self->handle->engine->noise_lo"
doc = "First CFAR reference bin (inclusive)."

[[burst_acq.properties]]
name = "noise_hi"
type = "size_t"
expr = "self->handle->engine->noise_hi"
doc = "Last CFAR reference bin (inclusive)."

[[burst_acq.properties]]
name = "threshold"
type = "float"
expr = "self->handle->engine->threshold"
doc = "CFAR gate on the test statistic (coherent path)."

[[burst_acq.properties]]
name = "eta"
type = "float"
expr = "self->handle->engine->eta"
doc = "Raw per-cell Rayleigh amplitude threshold."

[[burst_acq.properties]]
name = "eta_nc"
type = "float"
expr = "self->handle->engine->eta_nc"
doc = "Non-coherent CFAR threshold (order-N_nc Marcum)."

[[burst_acq.properties]]
name = "pfa_cell"
type = "double"
expr = "self->handle->engine->pfa_cell"
doc = "Bonferroni per-cell false-alarm probability over the searched cells."

[[burst_acq.properties]]
name = "pd_predicted"
type = "double"
expr = "self->handle->engine->pd_predicted"
doc = "Predicted Pd at cn0_dbhz and the chosen grid: the average Pd over the straddle priors (slow-time scalloping, intra-segment rotation, code-phase sample offset - quadrature over uniform priors), matching what the Monte-Carlo characterization measures rather than the on-grid best case."

[[burst_acq.properties]]
name = "pd_burst"
type = "double"
expr = "self->handle->engine->pd_burst"
doc = "Predicted Pd of one burst of `reps` repetitions at cn0_dbhz: the dwells are aligned to the stream, so the preamble lands at a uniform offset and spans about reps/doppler_bins of them, whole or partial, and the burst is detected when any one is. The number the sizer meets `pd` with and `underpowered` is set from; pd_predicted is one aligned dwell. NaN with no design cn0_dbhz or with n_noncoh > 1."

[[burst_acq.properties]]
name = "straddle_loss"
type = "double"
expr = "self->handle->engine->straddle_loss"
doc = "Mean amplitude derating of the correlation peak from grid straddle (slow-time Doppler scalloping x intra-segment rotation x code-phase sample offset, each averaged over a uniform prior) - a diagnostic summary; 20*log10(straddle_loss) is the loss in dB. Sizing and pd_predicted average Pd itself over the priors (Pd at this mean amplitude would overstate the mean Pd)."

[[burst_acq.properties]]
name = "fs"
type = "double"
expr = "self->handle->engine->fs"
doc = "Sample rate (Hz) the preamble was given at."

[[burst_acq.properties]]
name = "doppler_rate"
type = "double"
expr = "self->handle->engine->doppler_rate"
doc = "Doppler rate (Hz/s) the coherent depth is bounded against: coherent_bins <= f_epoch/sqrt(2*doppler_rate). 0 is no bound."

[[burst_acq.properties]]
name = "cn0_dbhz"
type = "double"
expr = "self->handle->engine->cn0_dbhz"
doc = "Carrier-to-noise density used to size the search (dB-Hz)."

[[burst_acq.properties]]
name = "doppler_span_hz"
type = "double"
expr = "self->handle->engine->doppler_span_hz"
doc = "Native unambiguous Doppler half-range = +/- fs/(2*len(preamble)) Hz."

[[burst_acq.properties]]
name = "doppler_res_hz"
type = "double"
expr = "self->handle->engine->doppler_res_hz"
doc = "Doppler bin width = fs/(len(preamble)*doppler_bins) Hz."

[[burst_acq.properties]]
name = "pd"
type = "double"
expr = "self->handle->engine->pd"
doc = "Target detection probability."

[[burst_acq.properties]]
name = "underpowered"
type = "bool"
expr = "self->handle->engine->underpowered"
doc = "True when pd_burst < pd -- the search cannot meet the target pd at this cn0_dbhz and geometry. The engine still builds a best-effort grid rather than failing; because C cannot raise a Python warning from a successful create, construction also emits a UserWarning in this case."
