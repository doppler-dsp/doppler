# burst_demod — feedforward BPSK DSSS frame demodulator.
#
# The whole post-acquisition payload chain, in C, with no tracking loops:
#   1. preamble estimate — segment-despread the unmodulated 5x500-style acq
#      preamble into partial correlations, feed ppe -> coarse (f0, chirp rate)
#   2. sample-rate dechirp by (f0, rate) — removes Doppler AND Doppler rate
#   3. despread the data section with the (short) data code -> soft BPSK symbols
#   4. frame sync — correlate the symbols against the known sync word; its
#      complex peak gives the frame offset AND the residual phase (derotated out)
#   5. slice frame_syms symbols to bits (and to LLRs) -- and stop: what
#      the bits MEAN needs a frame description, one layer up
#
# Seeded from acquisition via set_prior(coarse Doppler, preamble start). One
# `max_rate` knob spans near-static Doppler (0) to severe LEO chirp. One-shot
# per burst (no_state). Composes ppe (which composes fft + spectral).

[burst_demod]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "BurstDemod"
# wfm_frame is where a frame's layout lives, for BOTH ends of a link: the
# demodulator describes the frame it expects with the same builder the
# generator assembles from. ccsds_tm supplies the stage KERNELS (and the ASM
# bits) as a table -- wfm_frame.c cannot call them, since ccsds_tm depends on
# it -- so every consumer carries ccsds_tm and the two codes it configures.
depends_on = [
    { name = "ppe", link = true },
    { name = "fft", link = true },
    { name = "spectral", link = true },
    { name = "wfm_frame", link = true },
    { name = "ccsds_tm", link = true },
    { name = "conv", link = true },
    { name = "rs", link = true },
    { name = "pn", link = true },
    { name = "gold", link = true },
    { name = "mpsk", link = true },
]

[[burst_demod.init_params]]
name = "data_code"
type = "uint8_t[]"

[[burst_demod.init_params]]
name = "spc"
type = "size_t"
default = "4"

[[burst_demod.init_params]]
name = "chip_rate"
type = "double"
default = "1.0e6"

[[burst_demod.init_params]]
name = "carrier_hz"
type = "double"
default = "0.0"

[[burst_demod.init_params]]
name = "max_rate"
type = "double"
default = "0.0"

[[burst_demod.init_params]]
name = "frame_syms"
type = "size_t"
default = "0"

[[burst_demod.init_params]]
name = "est_segments"
type = "size_t"
default = "10"

[[burst_demod.methods]]
name = "set_preamble"
doc = "Set the (unmodulated) acquisition preamble code + repetition count used for the feedforward (f0, rate) estimate."
arg_type = "void"
return_type = "void"
params = [{ name = "acq_code", type = "uint8_t[]" }, { name = "reps", type = "size_t" }]

[[burst_demod.methods]]
name = "set_sync"
doc = "Set the known frame-sync word (0/1 BPSK symbols) used for frame alignment and phase/sign resolution. The ONLY thing this object is told about the frame's content, and for a physical-layer reason: without the sign the slicer would be a coin toss. Where the payload sits, which stages cover what and whether a check passed all need the frame's description and belong one layer up (doppler#1022)."
arg_type = "void"
return_type = "void"
params = [{ name = "sync", type = "uint8_t[]" }]

[[burst_demod.methods]]
name = "llrs"
doc = "The soft bits of the last demod() — one LLR per FRAME bit, in `mpsk_soft_demap`'s convention: positive means bit 0, so `L < 0` reproduces exactly the bits demod() returned. `Re(sym * derot)` IS the log-likelihood ratio up to a scale and used to be computed, sliced to one bit and freed; a hard decision costs roughly 2 dB of the coding gain a soft-input decoder exists to deliver. Spans the whole frame rather than the payload alone, because a code covers what its description says it covers. Scaled by `est_n0`, the burst's own noise estimate, so LLRs from different bursts are comparable — a Viterbi would not care, but combining across bursts does."
arg_type = "void"
return_type = "float"
variable_output = true
pass_capacity = true

[[burst_demod.methods]]
name = "symbols"
doc = "The DEROTATED complex symbols of the last demod() — the constellation `llrs()` is the real part of. Same span and normalisation: the whole frame, scaled to unit mean-|Re|, so `symbols.real` is `llrs()` up to `est_n0`. The quadrature is why this exists: after derotation the real axis carries the signal and the imaginary axis carries noise alone, so a residual phase error — which scales Re by `cos(phi)` without adding noise — is indistinguishable from a genuine amplitude or SNR loss in mean |LLR|, in LLR spread and in BER alike. Measured over 20000 BPSK symbols, a 30° phase error and an amplitude loss of `cos(30°)` agreed to three decimals in all three and differed only in Q/I energy, 0.386 against 0.077. That is a pointing problem against a link-budget one, on a burst this object already characterised well enough to know. It was built either way and freed unread (doppler#1087)."
arg_type = "void"
return_type = "float _Complex"
variable_output = true
pass_capacity = true

[[burst_demod.methods]]
name = "set_prior"
doc = "Seed from acquisition: coarse Doppler (cycles/sample at the input rate) and the preamble start sample."
arg_type = "void"
return_type = "void"
params = [{ name = "f0_coarse", type = "double" }, { name = "start", type = "size_t" }]

[[burst_demod.methods]]
name = "demod"
doc = "Demodulate a burst (preamble + frame); return the payload bits. Read-back properties report the estimates + CRC validity."
arg_type = "void"
return_type = "uint8_t"
variable_output = true
pass_capacity = true
nogil = true
params = [{ name = "x", type = "float _Complex[]" }]


[[burst_demod.properties]]
name = "frame_offset"
type = "size_t"
field = true

[[burst_demod.properties]]
name = "n_symbols"
type = "size_t"
field = true

[[burst_demod.properties]]
name = "est_freq_hz"
type = "double"
field = true

[[burst_demod.properties]]
name = "est_rate_hz"
type = "double"
field = true

[[burst_demod.properties]]
name = "est_snr_db"
type = "double"
field = true

[[burst_demod.properties]]
name = "frame_syms"
type = "size_t"
field = true

# The scale `llrs()` is divided by. Published so a caller can undo it, or
# compare bursts by it -- it was a struct field the read-back surface never
# carried, which made the LLR scaling documented but not checkable.
[[burst_demod.properties]]
name = "est_n0"
type = "double"
field = true
doc = "Noise power the LLRs are scaled by, referred to unit symbol amplitude — `2·var(Im)/mean|Re|²` over the derotated frame, floored at 1e-12 so a noiseless capture stays finite. `llrs()` is divided by this, so multiplying back recovers the raw projection, and two bursts are comparable only because both were scaled by their own estimate. Reading it beside `symbols()` is what turns the constellation into an absolute measurement rather than a picture."
