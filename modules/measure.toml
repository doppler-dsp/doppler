[module.measure]
doc = """
ADC and tone-quality metrics: ToneMeasure, NPRMeasure and IMDMeasure return named records — ENOB, SFDR, SINAD, THD and more — from a single-tone, noise-power-ratio, or two-tone intermodulation capture.

Examples
--------
>>> import numpy as np
>>> from doppler.measure import ToneMeasure
>>> tm = ToneMeasure(n=4096, fs=1.024e6)
>>> x = np.cos(2 * np.pi * 200 / 4096 * np.arange(4096)).astype(np.float32)
>>> bool(tm.analyze(x).enob > 10)
True

"""
objects = ["tonemeas", "nprmeas", "imdmeas"]
# measure objects compose fft_core + the spectral_core window / find_peaks free
# functions; tonemeas.toml's depends_on link=true (gh-225) links both OBJECT
# libs into the measure .so (one link=true owner suffices for the module target).

[[module.measure.functions]]
name = "measure_min_samples"
doc = "Samples for a target RBW (auto Kaiser from bits/dynamic_range_db; target_rbw<=0 -> span/1000)."
return_type = "size_t"

[[module.measure.functions.params]]
name = "fs"
type = "double"

[[module.measure.functions.params]]
name = "target_rbw"
type = "double"

[[module.measure.functions.params]]
name = "bits"
type = "size_t"

[[module.measure.functions.params]]
name = "dynamic_range_db"
type = "double"

[[module.measure.functions.params]]
name = "complex_input"
type = "int"

[[module.measure.functions]]
name = "measure_rec_nfft"
doc = "Recommended zero-padded transform length: next_pow_two(n * pad)."
return_type = "size_t"

[[module.measure.functions.params]]
name = "n"
type = "size_t"

[[module.measure.functions.params]]
name = "pad"
type = "size_t"

[[module.measure.functions]]
name = "measure_proc_gain"
doc = "FFT processing gain in dB: 10*log10(nfft / 2)."
return_type = "double"

[[module.measure.functions.params]]
name = "nfft"
type = "size_t"

[[module.measure.functions]]
name = "dp_coherent_freq"
doc = "Nearest leakage-free coherent test frequency (J cycles, J coprime N)."
return_type = "double"

[[module.measure.functions.params]]
name = "fs"
type = "double"

[[module.measure.functions.params]]
name = "f_target"
type = "double"

[[module.measure.functions.params]]
name = "N"
type = "size_t"
