# Auto-lint/format for hand-written code and docs.
#
# This file decides WHEN a check runs (which paths trigger it) and in what
# order. It does NOT decide how a tool is invoked or which version it is: the
# Makefile owns invocation, pyproject.toml's `dev` group owns versions, and
# uv.lock pins them. Python-tool hooks therefore call `make -s lint-<tool>`
# rather than repeating a command line that can drift from `make format`.
#
# clang-format and cmake-format stay on their upstream mirrors: they are not
# Python project dependencies, so pinning them in pyproject would be a lie.
#
# doppler is a just-makeit poster child: the .pyi stubs, per-module `*_ext.c`
# binding aggregators, `native/inc/**` headers (jm injects the public decls),
# and per-module `CMakeLists.txt` are GENERATED and their formatting is owned by
# just-makeit — enforced by the `jm status --check` manifest-drift gate. A
# formatter that rewrites those would fight the gate, so they are excluded here.
# Everything hand-owned — `_core.c`, `*_ext_<obj>.c` fragments, the app, tests,
# benchmarks, examples, c_deps, hand Python, and docs — is formatted normally.
#
# clang-format tracks the latest release (kept in lockstep with the dev-machine
# version via `pre-commit autoupdate`). jm-generated glue is excluded below, so
# the formatter only sees hand-owned C — its version need not match jm's, and the
# manifest-drift gate (which checks jm's own output) is unaffected.

# Shared exclusion of jm-generated C glue + vendored third-party.
exclude: '^vendor/|^docs/c-api/'

repos:
  # FIRST, and the ordering is load-bearing rather than a preference.
  #
  # mdformat NORMALISES a merge-conflict marker instead of refusing it, so any
  # check that runs after it is hunting for something the formatter has already
  # rewritten: `<<<<<<< HEAD` becomes `\<<\<<\<<< HEAD`, `>>>>>>> sha` becomes
  # seven nested blockquotes, and `=======` VANISHES — a line of `=` under text
  # is a setext H1, so the sentence above is silently promoted into the page's
  # table of contents and there is nothing left to grep for. Upstream hit
  # exactly this (just-makeit gh-974): a conflict rendered on their published
  # docs site for ten days, through every `make lint` and several releases.
  #
  # This REPLACES pre-commit-hooks' `check-merge-conflict`, which doppler ran
  # and which was worse than the ordering suggests. Its first statement is
  # `if not is_in_merge() and not args.assume_in_merge: return 0` — so outside
  # an active merge it returned success without opening a file, on every
  # ordinary `make lint` and every CI run, while printing "Passed". A conflict
  # that survived a rebase or was resolved badly and committed was invisible.
  # Two checks for one property, where the weaker one is louder, is worse than
  # one that always looks.
  - repo: local
    hooks:
      - id: conflict
        name: conflict markers (raw + mdformat-rewritten)
        entry: make -s lint-conflict
        language: system
        pass_filenames: false
        always_run: true

      # Names, not contents: a tracked path carrying shell punctuation is a
      # quoting slip somebody committed. always_run, because the file this
      # catches is by definition one no other hook's file filter matches.
      - id: tracked-paths
        name: tracked paths are names a person could type
        entry: make -s lint-tracked-paths
        language: system
        pass_filenames: false
        always_run: true

  # Python + markdown formatting DISPATCHES INWARD: the hook calls a Makefile
  # target rather than resolving the tool itself, so `make format`, the hook and
  # CI cannot run the tool differently. The version comes from pyproject's `dev`
  # group and is pinned by uv.lock — which is what closes the "same command,
  # different environment" class of drift that unpinned
  # `additional_dependencies` opened here. This file decides WHEN a check runs;
  # the Makefile decides HOW.
  #
  # Each runs over the whole tree (`pass_filenames: false`) because that is what
  # its make target does: a hook scoped to staged files could pass while `make
  # lint`, which checks everything, fails on the same commit. Scope lives in the
  # tools' own config — ruff's `extend-exclude` in pyproject, mdformat's
  # MD_EXCLUDE_RE in the Makefile — so it is stated once rather than mirrored
  # here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: make -s lint-ruff
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: make -s lint-ruff-format
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: mdformat
        name: mdformat
        entry: make -s lint-mdformat
        language: system
        pass_filenames: false
        types: [markdown]

      # The double->phase-word conversion has ONE home (nco_core.h). Fires on
      # any C change, since a private copy can appear in any module.
      - id: phase-conversion
        name: phase-conversion sites
        entry: make -s lint-phase-conversion
        language: system
        pass_filenames: false
        types_or: [c]

      # A trusted internal allocation goes through clib_common.h's
      # abort-on-OOM helpers. Fires on any C change: a bare malloc can
      # appear in any core, and the point is to catch the FIRST one.
      - id: alloc-helpers
        name: allocation helpers
        entry: make -s lint-alloc-helpers
        language: system
        pass_filenames: false
        types_or: [c]

      # A retired identifier stays retired. Fires on every text type the
      # scan covers, because the stragglers a rename leaves are as often in
      # a test's printed name or a design page as in code.
      - id: retired-names
        name: retired names
        entry: make -s lint-retired-names
        language: system
        pass_filenames: false

      # A CI step may not discard the exit code it just produced. Fires on
      # every file, because a workflow's shape is decided in YAML and the
      # step it guards can be added anywhere in .github/.
      - id: ci-pipefail
        name: CI pipelines run under pipefail
        entry: make -s lint-ci-pipefail
        language: system
        pass_filenames: false

      # The Rust crate is hand-written against the C ABI, so nothing else in
      # this repo compares the two. Cheap enough to run on every commit, and
      # the failure it catches (an element width that disagrees) is a heap
      # over-read from safe Rust rather than a build error.
      - id: rust-abi
        name: Rust extern "C" matches the C it names
        entry: make -s lint-rust-abi
        language: system
        pass_filenames: false

      # Stimulus and metrics come from the library (wfmgen, ber), not from a
      # private copy in a test or example. Fires on C and Python, since the
      # consuming layers span both.
      - id: stimulus-sources
        name: stimulus sources
        entry: make -s lint-stimulus-sources
        language: system
        pass_filenames: false
        types_or: [c, python]

      # Was `repo: https://github.com/pre-commit/mirrors-clang-format` with its
      # own `rev:`. That was a SECOND pin for one tool — the hook resolved
      # 22.1.8 while `make` and a bare shell resolved whatever the box had, and
      # jm gh-745 was filed from this repo on the consequence. The version now
      # lives in uv.lock like every other tool, and the file list and its
      # exclusions live in the Makefile so `make format` and the hook cannot
      # disagree about which C is ours.
      - id: clang-format
        name: clang-format
        entry: make -s lint-clang-format
        language: system
        pass_filenames: false
        types_or: [c]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # mkdocs.yml uses mkdocs-material's `!!python/name:` YAML tags; --unsafe
        # checks syntax only (the custom constructors aren't resolvable here).
        args: [--unsafe]
        # Helm chart templates are Go templates, not parseable as plain YAML.
        exclude: '^deploy/pipeline/templates/'
      - id: check-toml
      # check-merge-conflict is NOT here: it is inert outside an active merge
      # (`if not is_in_merge(): return 0`) and blind to mdformat's rewrites.
      # The `conflict` hook at the top of this file replaces it and always
      # looks. See scripts/conflict-check.sh.
      - id: end-of-file-fixer
        # generated glue is byte-owned by jm; don't let whitespace fixers drift it
        exclude: '\.pyi$|(^|/)native/inc/|_ext\.c$|(^|/)native/src/[^/]+/CMakeLists\.txt$'
      - id: trailing-whitespace
        exclude: '\.pyi$|(^|/)native/inc/|_ext\.c$|(^|/)native/src/[^/]+/CMakeLists\.txt$'

  - repo: local
    hooks:
      # THERE IS DELIBERATELY NO clang-tidy HOOK HERE. See gh-737.
      #
      # There was one, at `stages: [pre-push]`, and it ran NOWHERE. `make setup`
      # runs a plain `pre-commit install`, which writes `.git/hooks/pre-commit`
      # and nothing else unless the config declares `default_install_hook_types`
      # — and this file does not. CI's `make lint` runs pre-commit at the
      # default stage, so it never reached the hook either. Configured,
      # dispatching correctly to a real target, passing `hook-dispatch-check`,
      # and executing on no machine and in no pipeline: zero findings because
      # it never looked.
      #
      # Deleting it costs NOTHING, which is the whole argument — a gate that
      # runs nowhere has no coverage to lose. What it buys is that the tree
      # stops claiming a gate it does not have, so the absence is now visible
      # instead of being a dead entry that reads as protection.
      #
      # Re-adding it is not just pasting the block back. It needs an execution
      # home — `default_install_hook_types: [pre-commit, pre-push]`, or better a
      # CI job that builds and runs `make lint-clang-tidy` — and the backlog
      # cleared enough for it to pass. `make lint-clang-tidy` still exists and
      # is still the way to run it by hand; only the dead wiring is gone.

      # Generated-doc drift: the `## Related pages` blocks (docs/api/*.md),
      # README body (from docs/index.md), install scripts (from bootstrap.toml)
      # and the validation log are machine-generated by `make docs-relink`.
      # Editing a source without regenerating is the #1 way the Docs CI job
      # goes red — this catches it before the push reaches CI. If this trips:
      # run `make docs-relink`.
      #
      # DEFAULT STAGE, deliberately. It sat at `stages: [pre-push]` on the
      # rationale that the entry needs `uv run` and "the CI pre-commit job's
      # bare setup-python environment does not have" it. That stopped being
      # true when the job moved to ./.github/actions/setup-uv with
      # `sync: --group dev` — the same change that made every other hook here
      # dispatch into the Makefile. The stale rationale outlived its fact and
      # cost the hook its execution: `make setup` runs `pre-commit install`,
      # which installs the pre-commit hook type ONLY, so nothing ever created
      # .git/hooks/pre-push and this ran in no context at all (#737).
      #
      # NO `files:` filter, and that is a fix rather than a widening. It was
      # `^(docs/.*\.md|docs/index\.md|jb\.toml)$` — and `jb.toml` was renamed
      # to `bootstrap.toml` (jm 0.57.0, gh-936). So the filter named a path
      # that no longer exists while MISSING the real input to
      # gen_install_scripts.py, and it never covered gen_validation_log.py's
      # inputs at all: editing the file the generator reads would not have run
      # the generator's check. A filter that has to be kept in step with four
      # generators' input sets is a second source of truth for what they read.
      # The whole target is 0.67s, so there is nothing to buy by narrowing it.
      # Supersedes the older `docs-drift` hook, whose four generator --check
      # calls are a strict SUBSET of DOCS_CHECK_PRE_CMDS. Running both would
      # be two hooks disagreeing about what a docs invariant is; this is one,
      # and it iterates the same list docs-check does, so adding a check
      # there adds it here with no edit.
      #
      # 1.6s for all thirteen. That buys the two that caught doppler#858 --
      # check_api_docs and the docstring-coverage ratchet -- at commit time
      # rather than in CI, plus nav-index, doc/face parity, version strings
      # and the generator drift the old hook covered.
      #
      # always_run, like the hook it replaces: these read every docstring,
      # stub, manifest and page, so a `files:` filter would be a second
      # source of truth for thirteen scripts' input sets. That is the trade
      # the gen-c-api hook below makes the other way, and the reason is the
      # cost -- 1.6s can be unconditional, 19s cannot.
      - id: docs-invariants
        name: docs invariants (api coverage, docstring ratchet, parity, drift)
        entry: make -s docs-invariants
        language: system
        pass_filenames: false
        always_run: true

      # docs/c-api is mkdoxy output over the C sources, and it is COMMITTED.
      # Nothing regenerates it as a side effect of anything else, so "edited a
      # header, forgot the tree" is exactly how it goes stale -- twice in one
      # afternoon (doppler#854, #858), each caught by CI rather than here.
      #
      # Unlike docs-drift above, this one is NARROWED, because it is not free:
      # 19s against that hook's 0.4s, and on any box whose doxygen is not the
      # pinned 1.9.8 it shells out to a container. The filter is the Doxyfile's
      # own INPUT (`native/inc native/src`) and FILE_PATTERNS (`*.h *.c`), so
      # it fires exactly when the generator's declared inputs move and stays
      # out of the way of every commit that cannot affect it.
      #
      # That filter IS a second copy of the Doxyfile's input set, which
      # docs-drift's comment rightly warns about. It is accepted here because
      # the failure mode is benign and bounded: if INPUT widens and this does
      # not, the hook under-fires and CI's Doxygen job catches it -- today's
      # behaviour, not a worse one. The hook regenerates IN PLACE, so a
      # failure leaves the tree in the state the fix requires; re-stage and
      # commit again.
      - id: gen-c-api-drift
        name: docs/c-api regenerated (mkdoxy over native/**)
        entry: make -s gen-c-api-check
        language: system
        pass_filenames: false
        files: ^native/(inc|src)/.*\.[ch]$
