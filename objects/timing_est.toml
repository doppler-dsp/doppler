# timing_est — feedforward symbol-timing estimator.
#
# The acquisition half of symbol timing: a block of matched-filtered samples
# in, one estimate out, with no loop (docs/design/timing-estimator.md). Over
# the block it forms the Fourier coefficient of the stream's power at the
# symbol rate,
#
#     c = sum_n |x[n]|^2 exp(-j 2 pi n / sps)
#
# whose phase is where the eye center sits on the object's own symbol clock,
# and whose size against the block's power is the estimate's quality (Oerder
# and Meyr, 1988). Two consecutive blocks give the symbol rate's error from
# how far the estimate moved. `sps` is any real number of 3 or more; the
# symbol clock is a 32-bit phase word, the NCO's, and it is the only thing
# the object carries from one block to the next.
#
# It does not see the carrier's phase and holds with a frequency offset
# present, which is what lets it run before carrier recovery. It filters and
# decides nothing: the caller owns the matched filter.

[timing_est]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "SymbolTimingEstimator"
depends_on = [
  { name = "RateConverter", link = true },
  { name = "resamp", link = true },
  { name = "hbdecim", link = true },
  { name = "cic", link = true },
  { name = "fir", link = true },
  { name = "resample", link = true },
  { name = "nco", link = true },
]
serializable = "true"
fragment = "generated"
create_error = "ValueError"
create_error_message = "SymbolTimingEstimator: invalid parameter (need a finite sps above 2)"

[[timing_est.init_params]]
name = "sps"
type = "double"
default = "4.0"

# The matched flavor: the same estimator with a matched filter of its own,
# for samples nothing has filtered. A second constructor over the one core
# (dp_timing_est_create_matched): a matched RateConverter to 4 samples a
# symbol, its terminal stage at a fixed rate, then the same clock.
[[timing_est.views]]
class_name = "MatchedSymbolTimingEstimator"
create_fn = "dp_timing_est_create_matched"
create_error_message = "MatchedSymbolTimingEstimator: invalid parameter (need a finite sps of 4 or more, pulse iandd or rrc, 0 <= beta <= 1, span >= 1)"
init_params = [
  { name = "sps", type = "double", default = "8.0", doc = "Samples per symbol of the input, any real number of 4 or more." },
  { name = "pulse", type = "string_enum:iandd,rrc", default = "rrc", doc = "The pulse the matched filter is built for." },
  { name = "beta", type = "double", default = "0.35" },
  { name = "span", type = "size_t", default = "8" },
]

[[timing_est.methods]]
name = "estimate"
doc = "Estimate the symbol timing from one block of samples (matched-filtered for SymbolTimingEstimator, as they arrive for MatchedSymbolTimingEstimator); returns a TimingEstimate. The block is the whole call, so its length sets the estimate's variance; consecutive calls stay on one symbol clock, and from the second call on the result also carries the symbol rate's error."
arg_type = "float _Complex"
return_type = "dp_timing_estimate_t"
nogil = true
result_fields = [
    {name = "tau", type = "double"},
    {name = "rate", type = "double"},
    {name = "quality", type = "double"},
    {name = "power", type = "double"},
    {name = "symbols", type = "double"},
    {name = "has_rate", type = "int"},
    {name = "eye", type = "double"},
]
single = true
record_name = "TimingEstimate"
record_doc = "One feedforward symbol-timing estimate: the eye center's place on the estimator's symbol clock, the symbol rate's error against the previous block, and how strong the symbol-rate line was."
record_module = "doppler.estimation"

[[timing_est.methods]]
name = "reset"
arg_type = "void"
return_type = "void"

[[timing_est.properties]]
name = "sps"
type = "double"
field = true
doc = "Samples per symbol of the stream handed to estimate."
