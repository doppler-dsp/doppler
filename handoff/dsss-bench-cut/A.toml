# ── carrier_acq: coarse carrier acquisition ─────────────────────────────────
# The C row records 65,536 samples a round, but the detector stops reading
# at its 8-block give-up cap after 320; its input's bits change every
# sample, so its spectrum is flat and nothing fires. It is kept, per call,
# only as the C bench's one row until #1967/#2388 make that bench honest.
# The Python rows are the honest per-sample measurement, at a different
# configuration (4,096-sample blocks, 100x the C row's).

["c:carrier_acq::steps[pad=4,seq]"]
name = "Carrier search, zero-pad 4, sequential, gives up after 8 blocks"
unit = "sample"
definition = "One steps() call offered 65,536 samples at 4 MSa/s by a detector built for 1 Msym/s BPSK (40-sample blocks, Hann window, 4x zero-pad to a 256-point transform) in sequential mode with an 8-block cap: it folds and tests block after block, nothing fires (the input's bits change every sample, so its spectrum is flat) and it gives up at the cap, having read 320 of the 65,536 samples, so it reads as time per call."
domain = "call"
count = 65536

["py:carrier_acq::test_bench_steps_search[4]"]
name = "Carrier search, zero-pad 4, listening 16 blocks, from Python"
unit = "sample"
definition = "One steps() call through the Python binding on 65,536 samples of noise at 4 MSa/s, the detector built for 1 Msym/s BPSK in sequential mode with 4,096-sample blocks (Hann window, 4x zero-pad to a 16,384-point transform): nothing fires, so all 16 blocks are folded and tested, the sustained price of listening, and a carrier found on the first block costs one of those blocks; throughput counts input samples."
samples = 1

