# The ONE grouping the docs use: a domain is a Python module, with a task
# title. scripts/gen_domains.py reads this file and writes the domain pages,
# the A-Z index and the Domains nav; every guide, gallery and design page
# names its domain on its first line (`<!-- domain: <module> -->`), and
# scripts/check_user_docs.py holds all of it (make lint).
#
# One table, each module once, so there is no second list to drift:
#
#   title     the task, in words a reader looks for. It must contain the
#             module's name or one of its `synonyms` (a title that drifts from
#             its module is a finding, not a mapping).
#   area      one of api-taxonomy section 6's top-level areas (AREAS in
#             scripts/gen_domains.py), where the module maps to one cleanly.
#             A typo cannot create an area: the generator refuses it.
#   summary   one line for the Domains index.
#   synonyms  other words the title may use for the module.
#
# A class whose task is not its module's is NOT re-filed here. The generator
# lists such a class on both domain pages as a cross-link, and the boundary
# goes to an issue (#2830): move the class, or rename or split the module. When section 6's
# package tree is applied, the module names below are what change; this file
# is the one place.
#
# Order is display order.

[domain.source]
title = "Signal sources"
area = "sources"
summary = "Oscillators and noise: the NCO, the LO and AWGN."
synonyms = ["sources"]

