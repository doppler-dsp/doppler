# ── push: detections from a detector or a search (section 5) ────────────────
# One record for every flavor, dp_correlator_hit_t, as a NumPy structured
# array sized by push_max_out (a bound; the binding trims), so a push never
# loses input to a full list (#1992, just-makeit#2184). A map refuses it.
[[correlator.methods]]
name = "push"
fn = "dp_correlator_push"
arg_type = "float _Complex"
return_type = "dp_correlator_hit_t"
variable_output = true
record_dtype = "dp_correlator_hit_t"
pass_capacity = true
nogil = true
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "push: only a detector or a search pushes; a map does not detect (build one with detect=True, or framing='continuous' or 'burst')"
result_fields = [
  { name = "row", type = "size_t" },
  { name = "col", type = "size_t" },
  { name = "peak_mag", type = "float" },
  { name = "noise_est", type = "float" },
  { name = "test_stat", type = "float" },
  { name = "cn0_dbhz_est", type = "float" },
  { name = "samples_consumed", type = "uint64_t" },
  { name = "chip_phase", type = "double" },
  { name = "doppler_rate_hz_s", type = "double" },
  { name = "test_stat_peak", type = "float" },
]

# ── Properties every flavor or a few hold that need no getter ───────────────
[[correlator.properties]]
name = "flavor"
type = "int"
enum = "correlator_flavor"
expr = "dp_correlator_flavor (self->handle)"
doc = "Which flavor the knobs built: '1d', '2d' or 'delay_doppler' (maps), 'detector_1d' or 'detector_2d', 'continuous' or 'burst' (searches). Ask it before reading a member only some flavors serve."

# A detector's last correlation vector. dp_correlator_last_corr_status
# refuses the read off a detector (just-makeit#2543); on one, it reads None
# until the first dump.
[[correlator.properties]]
name = "last_corr"
type = "float _Complex[]"
buf_field = "det_out"
len_field = "n"
valid_field = "_last_corr_valid"
getter_status = true
error = "AttributeError"
error_message = "last_corr: only a detector (framing='none', detect=True) has it; Correlator.flavor says which this is"
doc = "A detector's correlation vector from the most recent push() that produced a result (None before that, and after reset() or set_state()); AttributeError on any flavor but a detector. A zero-copy view into a buffer the detector reuses every push(): copy it before the next push() to keep it."

# Writable: `error` names the setter's refusal and `getter_error` the
# read's (just-makeit#2543); both refuse off the continuous search.
[[correlator.properties]]
name = "keep_surface"
type = "int"
writable = true
getter_status = true
error = "AttributeError"
error_message = "keep_surface: only the continuous search (framing='continuous') keeps a surface"
getter_error = "AttributeError"
getter_error_message = "keep_surface: only the continuous search (framing='continuous') keeps a surface"
doc = "1 keeps every decided dwell's surface for surface() (normalized into the gate's units); 0 (the default) costs nothing. The continuous search only: elsewhere a read or a write raises AttributeError."

# Section 18's table: each property is a C getter that refuses off the
# flavors that serve it (getter_status), raising AttributeError.
[[correlator.properties]]
name = "ny"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "ny: only a map or a detector (framing='none') has it; Correlator.flavor says which this is"
doc = "Rows of the reference: 1 for a 1-D one; the delay-Doppler map's Doppler rows (doppler_rows)."

[[correlator.properties]]
name = "nx"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "nx: only a map or a detector (framing='none') has it; Correlator.flavor says which this is"
doc = "Samples a reference row: the correlation's native lag count."

[[correlator.properties]]
name = "ny_out"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "ny_out: only a map (framing='none', detect=False) has it; Correlator.flavor says which this is"
doc = "Rows a dump writes: ny unless padded (ny_out), which interpolates the Doppler or row axis."

[[correlator.properties]]
name = "nx_out"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "nx_out: only the 1-D or 2-D map (framing='none', detect=False, doppler_rows=0) has it; Correlator.flavor says which this is"
doc = "Lags a dump writes per row: nx unless padded (nx_out), which interpolates the lag axis. The one padding name at any row count."

[[correlator.properties]]
name = "col_out"
type = "int"
getter_status = true
error = "AttributeError"
error_message = "col_out: only the 1-D or 2-D map (framing='none', detect=False, doppler_rows=0) has it; Correlator.flavor says which this is"
doc = "The one lag a dump emits per row, or -1 for every lag."

[[correlator.properties]]
name = "doppler_step"
type = "double"
getter_status = true
error = "AttributeError"
error_message = "doppler_step: only the delay-Doppler map (doppler_rows > 0) has it; Correlator.flavor says which this is"
doc = "Doppler bin width of the delay-Doppler map, cycles per sample."

[[correlator.properties]]
name = "n"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "n: only the 1-D map or a detector (detect=True) has it; Correlator.flavor says which this is"
doc = "Frame length in samples: the reference's length, ny * nx."

[[correlator.properties]]
name = "dwell"
type = "size_t"
getter_status = true
error = "AttributeError"
error_message = "dwell: only a map or a detector (framing='none') has it; Correlator.flavor says which this is"
doc = "Integration depth: a dump every `dwell` frames."

[[correlator.properties]]
