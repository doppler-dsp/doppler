# =============================================================================
# doppler — mkdocs-material documentation configuration
# (migrated from Zensical; the C API docs are still pre-generated separately via
#  `mkdocs build -f mkdocs-capi.yml` into docs/c-api/ — see the Makefile.)
# =============================================================================
site_name: doppler
site_description: Practical, portable, performant digital signal processing
site_url: https://doppler-dsp.github.io/doppler/
repo_url: https://github.com/doppler-dsp/doppler
repo_name: doppler-dsp/doppler
copyright: Copyright &copy; 2026 doppler contributors — MIT License
docs_dir: docs
# docs/api.md is the stub just-makeit generates (a `::: doppler` directive);
# api/index.md is the real API page, and both map to api/index.html. zensical
# 0.0.74 refuses two owners of one page (0.0.45 let one silently win), so the
# stub is left out of the build, not deleted: the manifest-drift gate wants it
# (deleting it turns `make drift-check` red). Filed upstream as
# just-buildit/just-makeit#2471; drop this when jm stops scaffolding the stub.
exclude_docs: |
  /api.md
# Built, linked from the pages that cite them, and deliberately not in the
# nav: mkdoxy's per-file C API pages (reached from c-api/index.md) and the
# archived history. scripts/check_nav_reach.py holds every other page to
# the nav (#3000).
not_in_nav: |
  /c-api/*.md
  !/c-api/index.md
  **/archive/
site_dir: site

extra_css:
  - stylesheets/extra.css
  - stylesheets/benchmarks.css

# MathJax for the LaTeX in the design guides (rendered via pymdownx.arithmatex).
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/benchmarks.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # Dark mode first — preferred for a DSP / embedded dev audience.
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doppler-dsp/doppler

plugins:
  - search
  - glightbox
  # The nav is docs/.nav.yml and one .nav.yml per section (#3000).
  - awesome-nav
  # The Python reference is DISCOVERED, not listed (#3000): one page per
  # public module, at reference/doppler/<module>/, rendering that module's
  # __all__ through mkdocstrings; docs/.nav.yml places the section
  # (`Python API: reference`). A new module, class or function reaches
  # the reference by existing. Submodules are not public: a user-facing name
  # is re-exported from its package.
  - api-autonav:
      modules: [src/doppler]
      nav_section_title: "Python API"
      exclude_private: true
      on_implicit_namespace_package: skip
      exclude:
        - doppler.tests
        - doppler.examples
        - doppler.specan
        - 're:^doppler\.\w+\.'
      module_options:
        # Applies to the generated pages only (the key is a regex over the
        # module path). summary: each page opens with Classes / Functions /
        # Attributes tables -- the index. show_if_no_docstring: an
        # undocumented export still renders, so it still has its anchor.
        # backlinks: each entry lists the pages that link to it.
        doppler:
          summary: true
          show_if_no_docstring: true
          backlinks: tree
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            # jm-generated .pyi ctors expose the internal --state fields while
            # the header-derived docstring documents the public init_params
            # (e.g. Synth: signature wtype/nsps/… vs documented type/fs/…), so
            # griffe flags every documented param as "not in the signature".
            # The runtime ctor *does* accept those params (bridged in C); this
            # is a known jm init_params/state stub gap, not a real mismatch.
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            allow_inspection: false

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      # A `--8<--` of a file that is not there is a build error, not an empty
      # tab: the example-project pages include every file of their project.
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
