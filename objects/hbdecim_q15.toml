[hbdecim_q15]
arg_type = "int16_t"
return_type = "int16_t"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "HalfbandDecimatorQ15"
serializable = "true"

[[hbdecim_q15.init_params]]
name = "h"
type = "float[]"
# gh-900: the C takes the length as a NAMED scalar BEFORE the pointer
# (`dp_hbdecim_q15_create(size_t num_taps, const float *h)`), not as the trailing
# `h_len` jm emits by default.
derived = "num_taps"

[[hbdecim_q15.methods]]
name = "execute"
arg_type = "void"
return_type = "int16_t"
variable_output = true
# NO `pass_capacity` here, deliberately. The kernel already takes a 5th
# max_out arg, but its units are COMPLEX samples while the declared array is
# int16_t[] (interleaved I/Q, 2 elements per sample). Through jm 0.98.3 the
# `elements_per_sample = 2` key is accepted on this shape and never applied
# (just-makeit#1996), so jm would hand the kernel an element-count capacity,
# which compiles and then writes twice as far as intended. The hand-owned
# fragment does the /2 and *2 itself (resample_ext_hbdecim_q15.c). The fix
# is merged on jm main (just-makeit#2000) but unreleased: adopt this object
# once a release carries it, declaring `elements_per_sample = 2` on `x`.
params = [{name = "x", type = "int16_t[]"}]

[[hbdecim_q15.methods]]
name = "reset"
arg_type = "void"
return_type = "void"

[[hbdecim_q15.properties]]
name = "num_taps"
type = "size_t"

[[hbdecim_q15.properties]]
name = "rate"
type = "double"
