[corr]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Corr"
depends_on = ["fft_core"]
serializable = "true"
fragment = "generated"

[[corr.init_params]]
name = "ref"
type = "float _Complex[]"

[[corr.init_params]]
name = "dwell"
type = "size_t"
default = "1"

[[corr.init_params]]
name = "nthreads"
type = "int"
default = "1"

# Decoupled inverse size (0 => native). A larger output zero-pads the
# cross-spectrum before the inverse → band-limited interpolation of the
# correlation onto a finer length-n_out grid. Trailing + default 0 keeps
# Corr(ref, dwell, nthreads) backward-compatible.
[[corr.init_params]]
name = "n_out"
type = "size_t"
default = "0"

[[corr.methods]]
name = "execute"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true
# n_in must equal the frame length; the C kernel REFUSES any other
# with SIZE_MAX (nothing read, written or counted) and jm raises (#1925).
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "input length is not the frame length (Corr.n); execute takes exactly one frame"

[[corr.properties]]
name = "n"
type = "size_t"
field = true

[[corr.properties]]
name = "n_out"
type = "size_t"
field = true

[[corr.properties]]
name = "dwell"
type = "size_t"
field = true

[[corr.properties]]
name = "count"
type = "size_t"
field = true
