[correlator]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
# One class for the seven flavors (#2752 step 4, docs/design/
# correlator-python.md): the knobs are its arguments, and the one C
# dispatcher, dp_correlator_create, picks the flavor from them and calls its
# constructor. A C caller names a flavor and calls that constructor itself.
class_name = "Correlator"
create_fn = "dp_correlator_create"
# The dispatcher's trailing `const char **why` names the refused knob, and
# the binding raises create_error with that sentence (just-makeit#2552).
create_why = true
# The search flavors (#2752 3.4b) bring acq's links: detection_core sizes the
# gate (det_threshold, det_pd), dp_tlm_core is the probe registration
# set_telemetry makes, and cvt the NRZ mapper the C test's PN preambles are
# built with (bare: the test needs it, the .so does not).
depends_on = [
    # Linked onto doppler.correlation's .so: in doppler.spectral the FFT
    # objects were module siblings and came in with the module.
    { name = "fft2d", link = true },
    { name = "fft", link = true },
    { name = "detection", link = true },
    { name = "dp_tlm", link = true },
    { name = "cvt" },
]
serializable = "true"
# A search flavor's set_state can rebuild the delay-Doppler map for a blob
# at another carrier (#2831), so it can fail to allocate. No other flavor
# returns DP_ERR_MEMORY from set_state.
set_state_status_errors = [
  { status = "DP_ERR_MEMORY", error = "MemoryError", message = "set_state: the blob's carrier needs the delay-Doppler map rebuilt, and the rebuild could not allocate; the engine is unchanged" },
]
fragment = "generated"
# dp_parallel.h's persistent pool is pthreads: the per-row correlations and
# the delay-Doppler map fan each of their stages out over `nthreads` workers.
extra_link_libs = ["Threads::Threads"]
# A NULL create means a knob was refused (or memory ran out), never only OOM
# (gh-482). The dispatcher's `why` names the knob; this message is for a
# NULL with no sentence, which only an allocation failure leaves.
create_error = "ValueError"
create_error_message = "Correlator: refused, or out of memory (docs/design/correlator-python.md section 17: a value the flavor would not honor is refused)"
# One warning for both searches, on `underpowered`, whose meaning is each
# search's own (section 18).
warnings = [
  { after = "__init__", condition = "self->handle->search && self->handle->search->underpowered", category = "UserWarning", message = "Correlator: the search cannot meet pd at this cn0_dbhz and geometry (pd_predicted < pd, or pd_burst < pd for a burst). It still builds a best-effort grid. Raise cn0_dbhz, narrow doppler_uncertainty, lower pd, or give a burst more repetitions." },
]

# ── The knobs (section 3; defaults as section 17 rules them) ────────────────
# Positional order is the C dispatcher's. The reference is 1-D or 2-D
# (just-makeit#2537): a 1-D array arrives as one row, and one row is the
# 1-D flavor.
[[correlator.init_params]]
name = "ref"
type = "float _Complex[][]"
rank = [1, 2]
derived = ["ny", "nx"]

[[correlator.init_params]]
name = "framing"
# The choice index is the C enum's value: NONE 0, CONTINUOUS 1, BURST 2.
type = "string_enum:none,continuous,burst"
c_type = "dp_correlator_framing_t"
default = "none"
doc = "'none' for maps or detections from whole frames; 'continuous' or 'burst' for a search over a stream."

[[correlator.init_params]]
name = "doppler_rows"
type = "size_t"
default = "0"
doc = "Doppler rows of a delay-Doppler map: the code periods one frame holds. 0 for no map."

[[correlator.init_params]]
name = "detect"
type = "int"
default = "0"
doc = "1 for detections from push() (framing='none'); a search always detects."

[[correlator.init_params]]
name = "dwell"
type = "size_t"
default = "1"

[[correlator.init_params]]
name = "ny_out"
type = "size_t"
default = "0"

[[correlator.init_params]]
name = "nx_out"
type = "size_t"
default = "0"

[[correlator.init_params]]
name = "col_out"
type = "int"
default = "-1"

[[correlator.init_params]]
name = "threshold"
type = "float"
default = "0.0f"

[[correlator.init_params]]
name = "noise_lo"
type = "size_t"
default = "0"

# No `default`: the SIZE_MAX sentinel in `default_raw`, which the C clamps to
# the last bin. An expression such as "ny*nx-1" is valid in none of C, the
# .pyi and an app's flags.
[[correlator.init_params]]
name = "noise_hi"
type = "size_t"
default_raw = "(unsigned long long)-1ULL"

[[correlator.init_params]]
name = "noise_mode"
type = "string_enum:mean,median,min,max"
default = "mean"
doc = "How the noise bins are aggregated into the floor the test statistic divides by (a detector), or the CFAR reference's statistic (a search)."

[[correlator.init_params]]
name = "sample_rate"
type = "double"
default = "0.0"
doc = "Samples a second; a search needs it (0 is not given). 1.0 for normalized units."

[[correlator.init_params]]
name = "chip_rate"
type = "double"
default = "0.0"
doc = "Chips a second; the continuous search needs it (0 is not given)."

[[correlator.init_params]]
name = "symbol_rate"
type = "double"
default = "0.0"
doc = "Data symbols a second, for the continuous search's diagnostic; 0 is no known data clock."

[[correlator.init_params]]
name = "reps"
type = "size_t"
default = "1"
doc = "Preamble repetitions a burst holds (the burst search)."

# NaN = no design point (doppler#1484): any finite C/N0 is a real one.
[[correlator.init_params]]
name = "cn0_dbhz"
type = "double"
default_raw = "DP_CORRELATOR_CN0_NONE"

[[correlator.init_params]]
name = "doppler_uncertainty"
type = "double"
default = "0.0"

[[correlator.init_params]]
name = "pfa"
type = "double"
default = "1e-3"

[[correlator.init_params]]
name = "pd"
type = "double"
default = "0.9"

[[correlator.init_params]]
name = "doppler_rate"
type = "double"
default = "0.0"

[[correlator.init_params]]
name = "rate_hypotheses"
type = "size_t"
default = "1"

[[correlator.init_params]]
name = "code_only_epochs"
type = "size_t"
default = "1"

[[correlator.init_params]]
name = "nthreads"
type = "int"
default = "1"

[[correlator.methods]]
name = "execute"
why = true
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
# A dump is exactly n_out values, so max_out(state) is exact and an out= of
# that is enough; without this the binding also asked for as many elements as
# the input frame has (ny * nx), which a col_out object (n_out = ny) never
# needs (#2818).
exact_max_out = true
none_on_empty = true
# n_in must equal the frame length; the C kernel REFUSES any other
# with SIZE_MAX (nothing read, written or counted) and jm raises (#1925).
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute: only a map (framing='none', detect=False) executes; Correlator.flavor says which this is"

# Batches (#2683): H frames back to back in one call, every map or one
# reduction of them, on the C fold loop dp_correlator_execute_fold. One typed
# method per reduction, because the return shapes differ. Each refuses an
# empty batch, a length that is not a whole number of frames, or a short
# out= with SIZE_MAX, which jm raises as ValueError. The GIL is released
# across the kernel; every map flavor serves them (section 18).
[[correlator.methods]]
name = "execute_all"
why = true
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
# n_out is 0 on a search (its constructor never sets it): one column then,
# so the binding sizes nothing and the C refuses with the declared error
# (section 18) rather than the binding failing first on a zero shape.
out_cols = "(state->n_out ? state->n_out : 1)"
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_all: only a map (framing='none', detect=False) runs a batch; Correlator.flavor says which this is"
nogil = true

[[correlator.methods]]
name = "execute_coherent"
why = true
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
pass_capacity = true
# One map whatever the batch: max_out(state) is the exact size, not a bound the
# input could exceed, so an out= of exactly that is enough (#2818). Without
# this the binding also asked for as many elements as the input has.
exact_max_out = true
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_coherent: only a map (framing='none', detect=False) runs a batch; Correlator.flavor says which this is"
nogil = true

[[correlator.methods]]
name = "execute_power_sum"
why = true
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
# One map whatever the batch: max_out(state) is the exact size, not a bound the
# input could exceed, so an out= of exactly that is enough (#2818). Without
# this the binding also asked for as many elements as the input has.
exact_max_out = true
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_power_sum: only a map (framing='none', detect=False) runs a batch; Correlator.flavor says which this is"
nogil = true

[[correlator.methods]]
name = "execute_power_max"
why = true
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_power_max: only a map (framing='none', detect=False) runs a batch; Correlator.flavor says which this is"
nogil = true

[[correlator.methods]]
name = "execute_peaks"
why = true
arg_type = "float _Complex"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t", "uint32_t", "float"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "execute_peaks: only a map (framing='none', detect=False) runs a batch; Correlator.flavor says which this is"
nogil = true

[[correlator.methods]]
name = "bank_power_max"
why = true
status_out = true
status_errors = [
  { status = "DP_ERR_MEMORY", error = "MemoryError", message = "bank_power_max: out of memory" },
]
arg_type = "void"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "bank_power_max: only a map (framing='none', detect=False) has a bank; Correlator.flavor says which this is"
nogil = true
params = [{name = "x", type = "float _Complex[]"}, {name = "L", type = "size_t"}, {name = "g_min", type = "int"}, {name = "g_max", type = "int"}, {name = "rates", type = "float _Complex[]"}]

[[correlator.methods]]
name = "bank_detect"
why = true
status_out = true
status_errors = [
  { status = "DP_ERR_MEMORY", error = "MemoryError", message = "bank_detect: out of memory" },
]
arg_type = "void"
return_type = "float"
variable_output = true
pass_capacity = true
multi_output = ["int32_t", "uint32_t", "uint32_t", "uint32_t"]
error_sentinel = "SIZE_MAX"
error = "ValueError"
error_message = "bank_detect: only a map (framing='none', detect=False) has a bank; Correlator.flavor says which this is"
nogil = true
params = [{name = "x", type = "float _Complex[]"}, {name = "L_d", type = "size_t"}, {name = "L_r", type = "size_t"}, {name = "g_min", type = "int"}, {name = "g_max", type = "int"}, {name = "t_candidate", type = "float"}, {name = "t_confirm", type = "float"}, {name = "rates", type = "float _Complex[]"}]

[[correlator.methods]]
name = "configure_search_raw"
why = true
fn = "dp_correlator_configure_search_raw"
arg_type = "void"
return_type = "int"
status_return = true
status_errors = [
  { status = "DP_ERR_UNSUPPORTED", error = "ValueError", message = "configure_search_raw: only a search (framing='continuous' or 'burst') has a grid to pin; Correlator.flavor says which this is" },
  { status = "DP_ERR_INVALID", error = "ValueError", message = "configure_search_raw: doppler_bins must lie in 1..reps and n_noncoh in 1..DP_CORRELATOR_N_NONCOH_SAFETY_CEILING, and non-coherent looks need rate_hypotheses 1" },
  { status = "DP_ERR_MEMORY", error = "MemoryError", message = "configure_search_raw: rebuilding the grid could not allocate; the engine keeps its prior grid" },
]
