# tonemeas — single-capture ADC / converter spectral measurement suite.
#
# Block-I/O object (opaque handle).  Owns window selection + zero-padding + FFT
# so it controls precision: every component's power is integrated over its
# window MAIN LOBE (IEEE Std 1241), and the noise/distortion sums exclude the
# leakage bins around DC, the fundamental and each harmonic.  One time-domain
# capture in, the full single-tone metric bag out (SNR, SINAD, THD, THD+N,
# SFDR, ENOB, NPR-elsewhere, worst-spur) plus accuracy/resolution metadata.
#
# Composes fft_core + the spectral_core window / find_peaks free functions.

[tonemeas]
arg_type = "float"
return_type = "float"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "ToneMeasure"
depends_on = [{ name = "fft", link = true }, { name = "spectral", link = true }, { name = "psd", link = true }, { name = "acc_trace", link = true }]

[[tonemeas.init_params]]
name = "n"
type = "size_t"
default = "8192"

[[tonemeas.init_params]]
name = "fs"
type = "double"
default = "1.0"

[[tonemeas.init_params]]
name = "n_harmonics"
type = "size_t"
default = "8"

[[tonemeas.init_params]]
name = "full_scale"
type = "double"
default = "1.0"

[[tonemeas.init_params]]
name = "bits"
type = "size_t"
default = "0"

[[tonemeas.init_params]]
name = "dynamic_range_db"
type = "double"
default = "0.0"

[[tonemeas.init_params]]
name = "dc_guard"
type = "size_t"
default = "0"

[[tonemeas.methods]]
name = "analyze"
doc = "Analyze a real time-domain capture; returns a ToneMetrics result."
arg_type = "float"
return_type = "tone_meas_t"
nogil = true
result_fields = [
    {name = "snr", type = "double", doc = "Signal-to-noise ratio, 10log10(P_fund / P_noise) [dB]."},
    {name = "sinad", type = "double", doc = "Signal-to-noise-and-distortion, 10log10(P_fund / (P_noise + P_harm)) [dB]."},
    {name = "thd", type = "double", doc = "Total harmonic distortion, 10log10(P_harm / P_fund) [dBc]."},
    {name = "thd_pct", type = "double", doc = "Total harmonic distortion, 100*sqrt(P_harm / P_fund) [%]."},
    {name = "thd_n", type = "double", doc = "THD+N, 10log10((P_noise+P_harm)/P_fund) = -SINAD [dB]."},
    {name = "sfdr_dbc", type = "double", doc = "Spurious-free dynamic range: fundamental - worst spur [dBc]."},
    {name = "sfdr_dbfs", type = "double", doc = "Spurious-free dynamic range: full scale - worst spur [dBFS]."},
    {name = "enob", type = "double", doc = "Effective number of bits, (SINAD - 1.76)/6.02."},
    {name = "enob_fs", type = "double", doc = "Full-scale-corrected ENOB."},
    {name = "noise_floor_dbfs", type = "double", doc = "Mean per-bin noise power [dBFS]."},
    {name = "fund_freq", type = "double", doc = "Fundamental frequency [Hz]."},
    {name = "fund_dbfs", type = "double", doc = "Fundamental level [dBFS]."},
    {name = "worst_spur_freq", type = "double", doc = "Worst spur frequency [Hz]."},
    {name = "worst_spur_dbc", type = "double", doc = "Worst spur level relative to the fundamental [dBc]."},
    {name = "worst_spur_is_harm", type = "int", doc = "1 if the worst spur is a harmonic, else 0."},
    {name = "rbw_hz", type = "double", doc = "Resolution bandwidth = enbw*fs/n [Hz]."},
    {name = "enbw_hz", type = "double", doc = "Equivalent noise bandwidth [Hz] (= rbw_hz)."},
    {name = "bin_hz", type = "double", doc = "FFT bin spacing = fs/nfft [Hz]."},
    {name = "lobe_bins", type = "size_t", doc = "Window main-lobe half-width L [bins]."},
    {name = "n_noise_bins", type = "size_t", doc = "Number of bins counted as noise."},
    {name = "proc_gain_db", type = "double", doc = "FFT processing gain = 10log10(nfft/2) [dB]."},
    {name = "amp_uncert_db", type = "double", doc = "Amplitude-read uncertainty bound [dB]."},
    {name = "floor_uncert_db", type = "double", doc = "Noise-floor standard error [dB]."},
]
single = true
record_name = "ToneMetrics"
record_doc = "Single-tone ADC/converter dynamic metrics (SNR, SINAD, THD, SFDR, ENOB) plus the analysis-grid accuracy fields."
record_module = "doppler.measure"

[[tonemeas.methods]]
name = "analyze_complex"
doc = "Analyze a complex baseband capture (two-sided spectrum)."
arg_type = "float _Complex"
return_type = "tone_meas_t"
nogil = true
result_fields = [
    {name = "snr", type = "double", doc = "Signal-to-noise ratio, 10log10(P_fund / P_noise) [dB]."},
    {name = "sinad", type = "double", doc = "Signal-to-noise-and-distortion, 10log10(P_fund / (P_noise + P_harm)) [dB]."},
    {name = "thd", type = "double", doc = "Total harmonic distortion, 10log10(P_harm / P_fund) [dBc]."},
    {name = "thd_pct", type = "double", doc = "Total harmonic distortion, 100*sqrt(P_harm / P_fund) [%]."},
    {name = "thd_n", type = "double", doc = "THD+N, 10log10((P_noise+P_harm)/P_fund) = -SINAD [dB]."},
    {name = "sfdr_dbc", type = "double", doc = "Spurious-free dynamic range: fundamental - worst spur [dBc]."},
    {name = "sfdr_dbfs", type = "double", doc = "Spurious-free dynamic range: full scale - worst spur [dBFS]."},
    {name = "enob", type = "double", doc = "Effective number of bits, (SINAD - 1.76)/6.02."},
    {name = "enob_fs", type = "double", doc = "Full-scale-corrected ENOB."},
    {name = "noise_floor_dbfs", type = "double", doc = "Mean per-bin noise power [dBFS]."},
    {name = "fund_freq", type = "double", doc = "Fundamental frequency [Hz]."},
    {name = "fund_dbfs", type = "double", doc = "Fundamental level [dBFS]."},
    {name = "worst_spur_freq", type = "double", doc = "Worst spur frequency [Hz]."},
    {name = "worst_spur_dbc", type = "double", doc = "Worst spur level relative to the fundamental [dBc]."},
    {name = "worst_spur_is_harm", type = "int", doc = "1 if the worst spur is a harmonic, else 0."},
    {name = "rbw_hz", type = "double", doc = "Resolution bandwidth = enbw*fs/n [Hz]."},
    {name = "enbw_hz", type = "double", doc = "Equivalent noise bandwidth [Hz] (= rbw_hz)."},
    {name = "bin_hz", type = "double", doc = "FFT bin spacing = fs/nfft [Hz]."},
    {name = "lobe_bins", type = "size_t", doc = "Window main-lobe half-width L [bins]."},
    {name = "n_noise_bins", type = "size_t", doc = "Number of bins counted as noise."},
    {name = "proc_gain_db", type = "double", doc = "FFT processing gain = 10log10(nfft/2) [dB]."},
    {name = "amp_uncert_db", type = "double", doc = "Amplitude-read uncertainty bound [dB]."},
    {name = "floor_uncert_db", type = "double", doc = "Noise-floor standard error [dB]."},
]
single = true
record_name = "ToneMetrics"
record_doc = "Single-tone ADC/converter dynamic metrics (SNR, SINAD, THD, SFDR, ENOB) plus the analysis-grid accuracy fields."
record_module = "doppler.measure"

[[tonemeas.methods]]
name = "time_stats"
doc = "Time-domain stats: RMS, peak, crest/PAPR, DC offset, FS utilisation."
arg_type = "float"
return_type = "time_stats_t"
result_fields = [
    {name = "rms", type = "double", doc = "Root-mean-square amplitude (DC included)."},
    {name = "peak", type = "double", doc = "Peak deviation, max|x - DC|."},
    {name = "crest_db", type = "double", doc = "Crest factor, 20log10(peak_ac / rms_ac) [dB]."},
    {name = "papr_db", type = "double", doc = "Peak-to-average power ratio (= crest) [dB]."},
    {name = "dc_offset", type = "double", doc = "DC offset, mean(x)."},
    {name = "fs_util_pct", type = "double", doc = "Full-scale utilization, 100 * max|x| / full_scale [%]."},
]
single = true
record_name = "TimeStats"
record_doc = "AC-coupled time-domain capture statistics (crest factor / PAPR)."
record_module = "doppler.measure"

[[tonemeas.methods]]
name = "spectrum_dbfs"
doc = "DC-centred dBFS magnitude spectrum of a capture (length nfft, for plots)."
arg_type = "void"
return_type = "float"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
params = [{name = "x", type = "float[]"}]

[[tonemeas.properties]]
name = "n"
type = "size_t"
field = true

[[tonemeas.properties]]
name = "nfft"
type = "size_t"
field = true

[[tonemeas.properties]]
name = "fs"
type = "double"
field = true

[[tonemeas.properties]]
name = "enbw"
type = "double"
field = true

[[tonemeas.properties]]
name = "lobe_bins"
type = "size_t"
field = true

[[tonemeas.properties]]
name = "spur_guard_bins"
type = "size_t"
field = true

[[tonemeas.properties]]
name = "beta"
type = "double"
field = true

[[tonemeas.properties]]
name = "rbw"
type = "double"
expr = "self->handle->enbw * self->handle->fs / (double)self->handle->n"

[[tonemeas.properties]]
name = "bin_hz"
type = "double"
expr = "self->handle->fs / (double)self->handle->nfft"

[[tonemeas.properties]]
name = "proc_gain_db"
type = "double"
expr = "10.0 * log10((double)self->handle->nfft / 2.0)"
