[hbdecim_q15]
arg_type = "int16_t"
return_type = "int16_t"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "HalfbandDecimatorQ15"
serializable = "true"
fragment = "generated"

[[hbdecim_q15.init_params]]
name = "h"
type = "float[]"
# gh-900: the C takes the length as a NAMED scalar BEFORE the pointer
# (`dp_hbdecim_q15_create(size_t num_taps, const float *h)`), not as the trailing
# `h_len` jm emits by default.
derived = "num_taps"

[[hbdecim_q15.methods]]
name = "execute"
arg_type = "void"
return_type = "int16_t"
variable_output = true
# The kernel's 5th arg, max_out, counts COMPLEX samples while the declared
# array is int16_t[] (interleaved I/Q, 2 elements per sample): `elements_per_sample
# = 2` on `x` makes jm hand it samples, not elements (just-makeit#1996, 0.99.0).
pass_capacity = true
params = [{name = "x", type = "int16_t[]", elements_per_sample = 2}]

[[hbdecim_q15.methods]]
name = "reset"
arg_type = "void"
return_type = "void"

[[hbdecim_q15.properties]]
name = "num_taps"
type = "size_t"

[[hbdecim_q15.properties]]
name = "rate"
type = "double"
