[project]
name    = "iqtools"
version = "0.1.0"

[tools.install-deps]
source = "just-bashit:install-deps"
groups = ["dev"]

[tools.just-makeit]
source = "just-bashit:just-makeit"
config = "just-makeit.toml"

# Build dependencies — populated by just-makeit new.
# Add [runtime.*] sections for your project's own system libraries.
#
# Every target this project has needs only a C toolchain and the wheels in
# pyproject.toml's `dev` extra, so `make setup` covers the lot with no
# privileges. These entries are what a CI image installs.

[dev.apt]
packages = [
    "build-essential",
    "cmake",
    "pkg-config",
    "python3-dev",
    "python3-numpy",
]

[dev.pacman]
packages = [
    "base-devel",
    "cmake",
    "pkgconf",
    "python",
    "python-numpy",
]

[dev.brew]
packages = [
    "cmake",
    "pkg-config",
]

[dev.dnf]
packages = [
    "gcc",
    "gcc-c++",
    "make",
    "cmake",
    "pkgconf-pkg-config",
    "python3-devel",
    "python3-numpy",
]

[dev.zypper]
packages = [
    "gcc",
    "gcc-c++",
    "make",
    "cmake",
    "pkg-config",
    "python3-devel",
    "python3-numpy",
]

[dev.msys2]
packages = [
    "mingw-w64-ucrt-x86_64-gcc",
    "mingw-w64-ucrt-x86_64-cmake",
    "mingw-w64-ucrt-x86_64-python",
    "mingw-w64-ucrt-x86_64-python-numpy",
    "make",
    "pkg-config",
]
