# wfm_reader — the input-side Reader (raw / CSV / BLUE-1000 / SigMF).
#
# A file-backed object: no step(), a hand-written state struct, and a streaming
# read(). Migrated from kind="handle" once jm could express what the handle
# already did — a path ctor arg (gh-515), a meaningful create() failure
# (gh-514), enum-valued properties (gh-519) and a package placement (gh-523).
[wfm_reader]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "true"
no_state = "true"
no_step = "true"
class_name = "Reader"
create_error = "ValueError"
create_error_message = "cannot open capture: no such file, unrecognised file type, or an unsupported BLUE format mode (only S and C are supported)"

# read_follow() consults the interrupt flag, so the reader links the primitive
# the same way dp_interrupt_guard and [module.timing] do -- it is a root-level
# object library, not a <name>_core target.
#
# NB this is a THIRD static copy of the flag in a third `.so` (doppler#976).
# Correct for the C face, where one archive means one copy; from Python a stop
# raised in doppler.interrupt still will not reach a wait in doppler.wfm until
# the state is shared. That is the shared-atomic work, not this.

# The CORE's own dependencies. gh-254 makes link=true additive for a collocated
# module-object, so these land on the object's core/test/bench AND the .so.
# The Python face installs dp_interrupted as the follow read's stop
# predicate, so this .so needs the primitive's definitions -- and, because
# dp_interrupt_guard is `process_global`, the capsule rendezvous that makes
# its flag the SAME flag doppler.interrupt sets (doppler#976). Declared
# rather than spliced, because jm generates that rendezvous only into modules
# whose link line it wrote.
[[wfm_reader.depends_on]]
name = "dp_interrupt_guard"
link = true

[[wfm_reader.depends_on]]
name = "wfm_cjson"
link = true

[[wfm_reader.depends_on]]
name = "wfm_keywords"
link = true

# The reader's C test round-trips through the writer (it writes the captures it
# then reads back), and jm has no test-only dependency: `depends_on` lands on
# the .so as well. A few KB of writer objects in the reader module is the cost
# of keeping the round-trip test honest.
[[wfm_reader.depends_on]]
name = "wfm_writer"
link = true

[[wfm_reader.depends_on]]
name = "wfm_draw"
link = true


# gh-515: `path` crosses as a borrowed const char * (PyUnicode_FSConverter), so
# str and os.PathLike both work; wfm_reader_create copies it during the call.
[[wfm_reader.init_params]]
name = "path"
type = "path"

[[wfm_reader.init_params]]
name = "sample_type"
type = "string_enum:cf32,cf64,ci32,ci16,ci8"
default = "cf32"

[[wfm_reader.init_params]]
name = "endian"
type = "string_enum:le,be"
default = "le"

# arg_type="void" + variable_output is the generator shape: read(n) -> ndarray.
# (`out_type` is a jm *function* feature; on a method it renders `-> complex`.)
[[wfm_reader.methods]]
name = "read"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true

# read_follow(n) -- docs/design/end-of-capture.md section 4. The following
# read: whole samples only, resumable past EOF, and a wait that ends on the
# capture's marker rather than on the file going quiet.
#
# WHY THE RETURN IS A COUNT AND NOT A STATUS CODE. The design sketched an
# int-returning sibling handing back DP_ERR_EOF / _TIMEOUT / _INTERRUPTED. A
# variable_output method HAS no way to raise: `error` needs `status_return` or
# `error_negative`, and the C return is already the size_t count the binding
# sizes the result with. That is a known shape, not a discovery -- doppler#938
# hit it on execute_profile, and skills://just-makeit records it with the
# workarounds (a hand check in the sacred fragment is drift the next apply
# discards). The ring's three-way mapping -- EOFError, PyErr_CheckSignals(),
# KeyboardInterrupt (buffer_ext.c:140-146) -- is hand-written for that reason. It did not need to be: with the
# waits unbounded (the default), a zero-length return can ONLY mean the capture
# ended, because the call does not come back for "not yet". So the loop is the
# one every reader doctest already uses -- `while len(b := r.read_follow(4096))`
# -- and the ending is a property for the callers who opted into a bound and so
# have two ways to get an empty result. The C face keeps the vocabulary:
# `ending` IS DP_OK / DP_ERR_EOF / DP_ERR_TIMEOUT / DP_ERR_INTERRUPTED.
#
# nogil is a CORRECTNESS requirement here, not the throughput tweak it is
# elsewhere: the spool topology has a Python writer thread, and a follow read
# holding the GIL across an unbounded wait stops the thread producing the data
# it is waiting for. See section 5 of the design.
[[wfm_reader.methods]]
name = "read_follow"
arg_type = "void"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
nogil = true
# NO `params`, and that is forced rather than chosen. Declaring params gives
# `read_follow_max_out(state)` -- no count -- and jm's binding calls it to size
# the output buffer BEFORE the kernel runs. A blocking read then has nowhere to
# write: nothing has arrived yet, so the bound is 0 and the array is empty
# before the wait even starts. That sizing hook fits a NON-blocking drain
# (Telemetry.read, jm gh-1091); it does not fit this.
#
# So read_follow takes jm's synthesised generator shape, exactly like read():
# `count` is the caller's ask, `read_follow_max_out(state, n)` returns it, the
# buffer is sized before the kernel blocks, and `out=` comes back for free --
# which matters in a spool loop that would otherwise allocate per block.
# The budgets move to writable properties below: they are policy for a stream,
# set once, not an argument for every block.
doc = """Read whatever whole samples have arrived in a capture that is still being written, blocking until at least one does. Unlike `read()`, a short or empty result does not mean end-of-file: the reader waits. **0 means wait forever** for both budgets, which is the default and the right answer for a stream with no end -- any finite budget fires during an ordinary quiet patch. An empty result therefore means the capture ENDED; read `ending` for which way. `timeout_ms` bounds the wait for data; `grace_ms` bounds how long to keep waiting for the writer's marker after a stop has been requested, and expiring it may cost you the tail. Never consumes a partial sample, so a writer flushing mid-sample cannot desynchronise the stream."""

# The two budgets, as configuration rather than per-call arguments. 0 means
# wait forever, which is the default and the answer for a stream with no end.
[[wfm_reader.properties]]
name = "follow_timeout_ms"
type = "uint32_t"
writable = true
doc = """How long `read_follow()` waits for samples to arrive, in milliseconds; **0 (the default) waits forever**, which is the right answer for a stream with no end -- any finite budget fires during an ordinary quiet patch and reports an ending that has not happened. Set it only if the caller has its own reason to give up. A bounded wait that expires leaves `ending` at `"timeout"`."""

[[wfm_reader.properties]]
name = "follow_grace_ms"
type = "uint32_t"
writable = true
doc = """How long `read_follow()` keeps waiting for the writer's end-of-capture marker after a stop has been requested, in milliseconds; **0 (the default) waits forever**. The writer needs a moment to flush and patch its header, and expiring this budget before it does costs you the tail -- so the default trades an unlikely hang against a certain loss. A bounded grace that expires leaves `ending` at `"interrupted"`."""

[[wfm_reader.properties]]
name = "ending"
type = "int"
enum = "follow_end"
doc = """Why the last `read_follow()` came back empty -- `"none"` while the capture is still live, `"eof"` once the writer closed and said so, `"timeout"` if a bounded `timeout_ms` expired, `"interrupted"` if a stop was requested and a bounded `grace_ms` expired before the writer's marker arrived. With the default unbounded budgets only `"none"` and `"eof"` are reachable, which is why an empty result needs no check in the common case. The values are doppler's own return codes (`DP_OK`, `DP_ERR_EOF`, `DP_ERR_TIMEOUT`, `DP_ERR_INTERRUPTED`), so a C caller reads the same vocabulary every other transport uses."""

# Computed properties (no `field`): jm declares wfm_reader_get_<prop>() for the
# core to implement and calls it from the binding, so the state struct stays
# private to wfm_reader_core.c. gh-519 makes the enum decode work either way, so
# file_type/sample_type/mode/endian still return their strings.
[[wfm_reader.properties]]
name = "file_type"
type = "int"
enum = "ftype"
doc = """Which file type the capture turned out to be -- `"raw"`, `"csv"`, `"blue"` or `"sigmf"`. Detected from the file's CONTENT, not its name, so a CSV called `capture.dat` reports `"csv"` and a BLUE file called `capture.csv` reports `"blue"`. `"raw"` is also the fallback for a file nothing else recognised, so it means "headerless interleaved I/Q at the sample_type you passed" rather than a positive identification."""

[[wfm_reader.properties]]
name = "sample_type"
type = "int"
enum = "stype"
doc = """The wire sample type the samples are being decoded FROM -- `"cf32"`, `"cf64"`, `"ci32"`, `"ci16"` or `"ci8"`. For BLUE and SigMF this was read from the file's metadata and is authoritative; for raw and CSV it is simply the hint passed to the constructor, echoed back. `read()` returns `complex64` at unit scale regardless."""

[[wfm_reader.properties]]
name = "mode"
type = "int"
enum = "sample_mode"
doc = """Components per wire sample: `"complex"` for interleaved I/Q, `"scalar"` for a real capture. Only BLUE carries this (its `format` field's mode designator, `C` or `S`); every other file type is complex. A scalar capture still reads back as `complex64` -- the imaginary part is exactly 0, so a real signal lands on the real axis."""

[[wfm_reader.properties]]
name = "endian"
type = "int"
enum = "endian"
doc = """Byte order of the samples on the wire, `"le"` or `"be"`. Read from the metadata for BLUE (the HCB's `head_rep`) and SigMF (the `_be`/`_le` datatype suffix); for raw it is the constructor hint echoed back. CSV is text and ignores it."""

[[wfm_reader.properties]]
name = "fs"
type = "double"
doc = """Sample rate in Hz, or 0.0 when the file type does not carry one. BLUE derives it from the header's `xdelta` (fs = 1/xdelta); SigMF reads `core:sample_rate`. Raw and CSV have nowhere to record a rate, so they always report 0.0 -- whatever rate the capture was taken at has to travel with it by other means."""

[[wfm_reader.properties]]
name = "fc"
type = "double"
doc = """Centre frequency in Hz, or 0.0 when nothing in the capture declares one. **0.0 is ambiguous on its own** -- a genuine baseband capture and a capture whose frequency could not be found report the same number -- so read `fc_source` alongside it: `"none"` there is what distinguishes them. SigMF takes it from `captures[0]["core:frequency"]`; BLUE from a `FREQ` keyword (see `fc_source` for the tags tried), in either the ASCII HCB keyword area or the typed extended header. Raw and CSV carry no metadata at all."""

# Where `fs` came from. Declared for the same reason as fc_source: a caller
# about to build a timeline on this rate wants to know whether the capture
# declared it or the library gave up.
[[wfm_reader.properties]]
name = "fs_source"
type = "int"
enum = "fs_source"
doc = """Which metadata `fs` was read from -- `"xdelta"` for BLUE (the type-1000 adjunct, as 1/xdelta), `"core:sample_rate"` for SigMF, or `"none"` when nothing carried a rate. Raw and CSV always report `"none"`: they have nowhere to record one, so whatever rate the capture was taken at has to travel with it by other means."""

# The capture's own start time, and where it came from. This is the `t0` of
# `t = t0 + n/fs` -- the epoch belonging to the DATA, which is what makes a
# replayed recording's timeline land where the samples were taken rather than
# where they are being played back. Feed it to SampleClock.track().
[[wfm_reader.properties]]
name = "t0"
type = "double"
doc = """Capture start time in seconds since the UNIX epoch, or 0.0 when the capture does not declare one. **0.0 does not mean 1970** -- read `t0_source` alongside it, exactly as with `fc`/`fc_source`. This is the `t0` of `t = t0 + n/fs`: hand it to a `SampleClock` via `track()` and a replayed capture's timeline lands where the samples were taken, not where they are being replayed. BLUE carries it as a J1950 `timecode` in the header, converted here to the UNIX epoch."""

[[wfm_reader.properties]]
name = "t0_source"
type = "int"
enum = "t0_source"
doc = """Where `t0` was read from -- `"timecode"` for a BLUE header that declares one, or `"none"`. **`"none"` is the common answer and the one that matters**: a zero BLUE timecode means the field was never set, not 1950-01-01, and doppler's own writer leaves it zero -- so a caller that skips this check dates every doppler-written capture to 1950. SigMF's `core:datetime` is an ISO 8601 string this reader does not parse yet, so a SigMF capture also reports `"none"` rather than a guess."""

[[wfm_reader.properties]]
name = "num_samples"
type = "size_t"
doc = """Total samples in the capture, or 0 when the file type cannot say. BLUE takes it from the header's `data_size`; raw and SigMF divide the file length by the sample stride. A CSV has to be counted, so the first read of this property scans the file once (the scan is exact -- it parses rows the same way `read` does -- and leaves the read position alone); every later read is free."""

# Where `fc` came from. Declared as its own property rather than folded into
# fc's docstring because 0.0 is a legitimate centre frequency: without this,
# a baseband capture and a capture whose FREQ keyword we failed to parse are
# the same answer. gh-519 decodes the int to the tag's own name.
[[wfm_reader.properties]]
name = "fc_source"
type = "int"
enum = "fc_source"
doc = """Which piece of metadata `fc` was read from -- the keyword's own tag (`"FREQ"`, `"RF_FREQ"`, `"CENTER_FREQ"`, `"F_C"`), `"core:frequency"` for SigMF, or `"none"` when nothing carried it. Check this before trusting `fc == 0.0`: `"none"` means not found, anything else means the capture really does say 0 Hz. BLUE type-1000 has no header field for centre frequency, so an RF capture conveys it as a keyword; `FREQ` in the HCB keyword area is the X-Midas convention and is tried first."""

[[wfm_reader.properties]]
name = "trailing_bytes"
type = "size_t"
doc = """Payload bytes left over after the last whole sample; 0 for a capture whose declared sample type and mode match its content, and always 0 for CSV. Non-zero means either the `sample_type`/`endian` hint is wrong for a headerless file type or the capture is truncated -- the reader cannot tell which, and stops at the last complete sample either way. This is the only signal available for a raw file: a wrong hint does not fail, it returns plausible garbage at the wrong stride."""

# `.keywords` — the BLUE extended header as a {tag: value} dict (gh-543). jm
# generates the dict loop, refcounting and every error path; the per-keyword
# VALUE is data-dependent (its Python type comes from the keyword's own type
# code in the file -- str for A, int/float for a scalar numeric, list for a
# multi-element one), so value_type="object" routes it to a hand-written
# wfm_reader_keyword_value() in wfm_reader_ext_extra.c that returns the PyObject
# itself. count_fn/key_fn default from the object+property name. Making it
# declarative also lands `keywords` in the .pyi, which a fragment method never
# reached.
# The BLUE extended header as a {tag: value} dict (gh-554). The variant codec
# [codec.blue_keyword] decodes each entry to its Python type; jm generates the
# whole getter (loop + per-code decode + scalar_collapse), so the hand-written
# wfm_reader_keyword_value / wfm_reader_ext_extra.c is gone. entry_fn is the
# existing cursor returning a wfm_keyword_t* (type/count/elem_size/value).
[[wfm_reader.properties]]
name = "keywords"
type = "dict"
codec = "blue_keyword"
count_fn = "wfm_reader_num_keywords"
key_fn = "wfm_reader_keyword_tag"
entry_fn = "wfm_reader_keyword"
entry_type = "wfm_keyword_t"
doc = """The BLUE extended header as a {tag: value} dict, in file order; empty when the capture carries no extended header. Values follow the keyword type: a str for A, an int/float for a single-element numeric keyword, a list for a multi-element one. For a detached capture these come from the HEADER file."""

# The 512-byte header control block, decoded field-by-field. Same codec and
# same cursor shape as `keywords` above: the C side carries each HCB field as a
# wfm_keyword_t, so the header and the keywords share one tag/value marshaller
# rather than growing a second one that could disagree with it.
[[wfm_reader.properties]]
name = "header"
type = "dict"
codec = "blue_keyword"
count_fn = "wfm_reader_num_header_fields"
key_fn = "wfm_reader_header_tag"
entry_fn = "wfm_reader_header_field"
entry_type = "wfm_keyword_t"
doc = """The BLUE header control block as a {field: value} dict, under the names the format itself uses -- `version`, `head_rep`, `data_rep`, `detached`, `protected`, `pipe`, `ext_start`, `ext_size`, `data_start`, `data_size`, `type`, `format`, `flagmask`, `timecode`, `inlet`, `outlets`, `outmask`, `pipeloc`, `pipesize`, `in_byte`, `out_byte`, `outbytes`, `keylength`, and the type-1000 adjunct `xstart`, `xdelta`, `xunits`. Empty for a non-BLUE file type. Nothing is renamed or omitted, so what you see is what the file holds; the decoded keywords are in `keywords`."""

# close() is the name this type has always released its file under, and every
# caller and doc example uses it. gh-544 names the destructor; `destroy()` (jm's
# default) stays as an alias. Void -- a reader's close cannot fail.
[wfm_reader.destroy]
name = "close"
aliases = ["destroy"]
