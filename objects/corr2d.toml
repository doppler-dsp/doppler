[corr2d]
arg_type = "float _Complex"
return_type = "float _Complex"
mutable = "false"
no_state = "true"
no_step = "true"
class_name = "Corr2D"
depends_on = ["fft2d_core"]
serializable = "true"

[[corr2d.init_params]]
name = "ref"
# TWO-dimensional: the reference is a ny x nx surface, and the manifest had
# under-declared it as 1-D — which is what made jm derive a single `ref_len`
# against a C that takes `(ref, ny, nx)`, the mismatch 0.64.x's CTOR check
# surfaced.
type = "float _Complex[][]"
# gh-1097: the C names the two extents (ny, nx) rather than taking jm's
# derived `ref_dim0`/`ref_dim1`.
# jm already passed both — this names them instead of the derived
# `ref_dim0`/`ref_dim1`.
derived = ["ny", "nx"]

[[corr2d.init_params]]
name = "dwell"
type = "size_t"
default = "1"

[[corr2d.init_params]]
name = "nthreads"
type = "int"
default = "1"

# Decoupled inverse size (0 => native). A larger output zero-pads the
# cross-spectrum before the inverse → band-limited interpolation of the
# correlation surface onto a finer (ny_out, nx_out) grid. Trailing + default 0
# keeps Corr2D(ref, dwell, nthreads) backward-compatible.
[[corr2d.init_params]]
name = "ny_out"
type = "size_t"
default = "0"

[[corr2d.init_params]]
name = "nx_out"
type = "size_t"
default = "0"

[[corr2d.methods]]
name = "execute"
arg_type = "float _Complex"
return_type = "float _Complex"
variable_output = true
# Kernel is told its write limit (jm gh-138): an under-reporting
# max_out truncates the emission instead of overrunning `out`.
pass_capacity = true
none_on_empty = true

[[corr2d.properties]]
name = "ny"
type = "size_t"
field = true

[[corr2d.properties]]
name = "nx"
type = "size_t"
field = true

[[corr2d.properties]]
name = "ny_out"
type = "size_t"
field = true

[[corr2d.properties]]
name = "nx_out"
type = "size_t"
field = true

[[corr2d.properties]]
name = "n_out"
type = "size_t"
field = true

[[corr2d.properties]]
name = "dwell"
type = "size_t"
field = true

[[corr2d.properties]]
name = "count"
type = "size_t"
field = true
