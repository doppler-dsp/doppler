[module.snr]
doc = """
Signal-to-noise estimation: data-aided and moment-based (M2M4) SNR / Es-N0 estimators for a recovered symbol stream.

Examples
--------
>>> import numpy as np
>>> from doppler.snr import snr_m2m4_db
>>> rng = np.random.default_rng(0)
>>> sym = (2 * rng.integers(0, 2, 20000) - 1).astype(np.complex64)
>>> sym += 0.1 * (rng.standard_normal(20000)
...              + 1j * rng.standard_normal(20000)).astype(np.complex64)
>>> bool(15 < snr_m2m4_db(sym) < 25)
True

"""
objects = []

[[module.snr.functions]]
name = "snr_data_aided_db"
doc = "Data-aided Es/N0 (dB): strip the known sign, Es/N0 = a^2 / mean(|z-a|^2)."
return_type = "double"

[[module.snr.functions.params]]
name = "soft"
type = "float _Complex[]"

[[module.snr.functions.params]]
name = "sign_bits"
type = "uint8_t[]"

[[module.snr.functions]]
name = "snr_m2m4_db"
doc = "Non-data-aided moment-based (M2M4) Es/N0 (dB) for a constant-modulus signal in AWGN."
return_type = "double"

[[module.snr.functions.params]]
name = "x"
type = "float _Complex[]"

[[module.snr.functions]]
name = "snr_data_aided_db_series"
doc = "Sliding-window data-aided Es/N0 (dB) vs index, for visualizing drift."
out_type = "double"
variable_output = true
out_size = "soft_len"

[[module.snr.functions.params]]
name = "soft"
type = "float _Complex[]"

[[module.snr.functions.params]]
name = "sign_bits"
type = "uint8_t[]"

[[module.snr.functions.params]]
name = "window"
type = "size_t"

[[module.snr.functions]]
name = "snr_m2m4_db_series"
doc = "Sliding-window blind (M2M4) Es/N0 (dB) vs index, for visualizing drift."
out_type = "double"
variable_output = true
out_size = "x_len"

[[module.snr.functions.params]]
name = "x"
type = "float _Complex[]"

[[module.snr.functions.params]]
name = "window"
type = "size_t"
