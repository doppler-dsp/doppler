include = ["objects/*.toml", "modules/*.toml"]

[project]
jm_version = "0.119.0"
name = "doppler"
version = "0.80.0"
build = "cmake"
# c_prefix (jm#1591, #1545): every C symbol jm derives carries dp_, so two
# installed jm libraries that share a component name (fir, fft, agc) link
# and include together. Names we spelled ourselves (fn =, create_fn, our
# macros) and every Python name are untouched.
c_prefix = "dp"
# layout (jm#2425, 0.114.0): every per-object file lives under a directory
# named for its object, mirroring native/inc/doppler/<obj>/ --
# native/tests/<obj>/test_<obj>_core.c, native/benchmarks/<obj>/... -- so
# finding an object's test is the same lookup as finding its header.
layout = "mirrored"
# jm formats what it generates with the repo's OWN pinned tools, run through
# uv so the binary is the one in uv.lock (gh-265, gh-745, gh-746): its render
# and the committed bytes agree, locally and in CI. jm appends
# `-i --style=file`, so the committed .clang-format is the one C style.
c_style = "clang-format"
c_format_command = ["uv", "run", "--group", "dev", "clang-format"]
py_format_command = ["uv", "run", "--group", "dev", "ruff", "format"]
perf = "true"
pytest = "true"
pytest_benchmark = "true"
schema = "9"
# jm gh-1752 (0.109.0): keys doppler's OWN generator reads off the composer's
# source.fields / segment.fields rows -- scripts/gen_wfm_defaults.py builds
# wfmgen's CLI table and JSON schema from them. jm reads none of them; naming
# them here stops jm warning on each, while any other unknown key (a misspelt
# jm key) still warns. A new key the generator starts reading goes here too.
composer_field_keys = [
  "cli",
  "exclusive",
  "field_reps",
  "help_section",
  "json",
  "json_omit",
  "json_range",
  "json_required",
  "json_schema",
  "json_type",
  "json_when",
  "metavar",
  "surface",
  "unit_interval",
]
c_deps = [
    "hbdecim", "resamp", "wfmcompose", "ccsds_tm", "conv", "rs",
]
# `status_allow` matches PATHS, not findings, so an entry also accepts that
# file's stale/missing classification -- broader than the reason it was
# added for (just-makeit#823). Re-check every entry on each pin bump; jm
# lists an allowed kwargs finding under KWARGS with a `~`, so they stay
# visible. Each entry below says why it is there.
status_allow = [
    # Allowed MISSING. jm creates it, but it shadows mkdocs.yml and truncates
    # the nav, so `DOCS_PREPARE` deletes it before every docs build.
    "zensical.toml",
    # Create-only and hand-owned: jm's base preset assumes jm's top-level
    # CMake, which defaults BUILD_PYTHON=ON; doppler's defaults it OFF (a bare
    # `cmake -B` is the C library). jm never rewrites it (gh-1376).
    "CMakePresets.json",
    # Allowed MISSING, permanently. native/tests/dp_test.h is doppler's one
    # assertion harness (`make tests-ssot` holds it), and vendoring jm 0.58's
    # jm_test.h beside it would be a second. A test jm scaffolds includes
    # jm_test.h and must be converted to DP_CHECK / DP_REQUIRE (#730).
    "native/tests/jm_test.h",
    # The three deliberate UNWIRED cores (jm gh-984). Each is scoped to its
    # COMPONENT, never to `CMakeLists.txt` itself: naming the file would
    # exempt EVERY core from the wiring check and re-open the hole that hid
    # 38 unlinkable symbols across 6 components (gh-747). Verified with `nm`
    # against libdoppler.a: these export NOTHING out-of-line, so no C
    # consumer can be missing anything (wfmcompose's cores are
    # app/binding-only; its CMakeLists states the policy).
    "CMakeLists.txt:wfm_compose_core",
    "CMakeLists.txt:wfm_sink_stub_core",
    "CMakeLists.txt:wfmgen_core",
]

# Benchmark only the 64k block (jm-gh-390). doppler dropped the small-block
# (_1k) bench suite library-wide in #234 — 1k blocks are dominated by call
# overhead and only add noise to any comparison. Without this, every
# newly scaffolded object reintroduced a `test_bench_steps_1k`, which had to be
# hand-trimmed after each `jm apply`. Declaring it here stops the reintroduction.
[project.bench]
block_sizes = [65536]

# ── BLUE extended-header keyword codec (gh-554) ──────────────────────────────
# ONE variant-codec table drives BOTH directions of the keyword binding:
# Writer.add_keyword packs a Python value into a discriminant-tagged buffer, and
# Reader.keywords decodes each entry back — so the two cannot drift, and neither
# needs a hand-written fragment. Codes/widths mirror wfm_keywords.c's Table-26
# set (Midas BLUE 1.1 §3.3.1); `T` is the deprecated 32-bit-int alias of `L`.
[codec.blue_keyword]
discriminant = "char"
scalar_collapse = true
entries = [
  { code = "A", ctype = "char", bytes = true },  # -> str
  { code = "B", ctype = "int8_t" },               # -> int
  { code = "I", ctype = "int16_t" },              # -> int
  { code = "L", ctype = "int32_t" },              # -> int
  { code = "T", ctype = "int32_t" },              # -> int (deprecated alias of L)
  { code = "X", ctype = "int64_t" },              # -> int
  { code = "F", ctype = "float" },                # -> float
  { code = "D", ctype = "double" },               # -> float
]

# ── Waveform enum single-source-of-truth (gh-285, gh-760) ───────────────────
# One string↔int table per synth enum; list order IS the C enum value
# (append-only — never reorder).
#
# TWO consumers, and it took gh-760 to make the second one true. jm renders
# the [[enum]] blocks into the binding's own lookup tables (`_enum_*` in
# wfm_compose_ext.c). The C side reads them through ONE hand-written header,
# native/inc/doppler/wfm/wfm_names.h, whose tables `make lint-wfm-enum-tables` holds
# to the blocks below.
# Design: docs/design/waveform-enum-ssot.md
[[enum]]
name = "wfm_type"
values = ["tone", "noise", "pn", "bpsk", "qpsk", "chirp", "bits", "symbols", "dsss"]

[[enum]]
# rc_pulse_t (RateConverter_core.h), bound by name: the C enum carries
# `SSOT: enum=rc_pulse` and scripts/check_wfm_enum_tables.py holds its names
# to these.
name = "rc_pulse"
values = ["iandd", "rrc", "none"]
enumerators = ["RC_PULSE_IANDD", "RC_PULSE_RRC", "RC_PULSE_NONE"]

# PSD's window, by name (psd_core.h, `SSOT: enum=psd_window`). The Spectrogram
# takes the same index, because PSD's kernel (dp_psd_kernel_init) is the one
# owner of it; HANN is 0, so a zeroed configuration is Hann. Bound by name (gh-1450), so the
# binding writes DP_PSD_WINDOW_* and the compiler checks every name.
[[enum]]
name = "psd_window"
values = ["hann", "kaiser", "blackman-harris", "rect"]
enumerators = [
  "DP_PSD_WINDOW_HANN", "DP_PSD_WINDOW_KAISER",
  "DP_PSD_WINDOW_BLACKMAN_HARRIS", "DP_PSD_WINDOW_RECT",
]

# carrier_acq's window: a VIEW over psd_window with the three windows it
# offers (its threshold's KAPPA was fit at Hann, carrier_acq_core.c), no rect,
# which its C create refuses (#2185). Every name is a psd_window enumerator,
# so it has no C enum of its own.
[[enum]]
name = "carrier_acq_window"
values = ["hann", "kaiser", "blackman-harris"]
enumerators = [
  "DP_PSD_WINDOW_HANN", "DP_PSD_WINDOW_KAISER",
  "DP_PSD_WINDOW_BLACKMAN_HARRIS",
]

# The Spectrogram's row units (spectrogram_core.h). POWER is 0, so a zeroed
# configuration selects power and dB is only ever asked for (#1968).
[[enum]]
name = "spectrogram_mode"
values = ["power", "db"]
enumerators = ["DP_SPECTROGRAM_POWER", "DP_SPECTROGRAM_DB"]

# AccTrace's reduction, and so PSD's averaging mode (acc_trace_core.h).
[[enum]]
name = "acc_trace_mode"
values = ["mean", "exp", "maxhold", "minhold"]
enumerators = [
  "ACC_TRACE_MEAN", "ACC_TRACE_EXP", "ACC_TRACE_MAXHOLD", "ACC_TRACE_MINHOLD",
]

[[enum]]
name = "crc"
values = ["none", "crc16"]

[[enum]]
name = "gap_noise"
values = ["auto", "off"]

[[enum]]
name = "snr_mode"
values = ["auto", "fs", "ebno", "esno"]

[[enum]]
name = "wfm_lfsr"
values = ["galois", "fibonacci"]

# The stage kinds doppler itself names. Order IS wfm_stage_kind_t
# (native/inc/doppler/wfm/wfm_frame.h): crc16 = 0 through interleave = 4.
#
# This list is deliberately NOT the whole enum. A stage's kind is an open
# uint32_t, and WFM_STAGE_USER (0x1000) is the sentinel a caller allocates
# from -- a boundary, not a name. So the scene JSON writes a NAME for a kind
# this list holds and the raw INTEGER for anything else, which is the only
# encoding that can round-trip a kind doppler has never heard of.
[[enum]]
name = "stage_kind"
values = ["crc16", "rs", "randomise", "conv", "interleave"]

# How long a source's Doppler channel lives (gh-942). Order IS
# wfm_doppler_lifetime_t (native/inc/doppler/wfm/wfm_compose.h): per_instance = 0 so
# an undeclared lifetime is the repeated-trial shape, persist = 1.
[[enum]]
name = "doppler_lifetime"
values = ["per_instance", "persist"]

# The enum below names a table that no binding renders — the C side is its
# only consumer. It is declared here anyway because doppler#760 made this
# file the SSOT for the C tables too (native/inc/doppler/wfm/wfm_names.h, gated by
# scripts/check_wfm_enum_tables.py), and an enum the gate cannot reach here
# would be an enum with no declaration at all.

# How much of a source's seed advances per repeat. Order IS
# wfm_seed_advance_t (native/inc/doppler/wfm/wfm_compose.h): none = 0, then the two
# cumulative levels.
[[enum]]
name = "seed_advance"
values = ["none", "noise", "all"]

# Where a frame field's bits come from. Order IS wfm_seq_kind_t
# (native/inc/doppler/wfm/wfm_frame.h): literal = 0, the three generated kinds,
# then data (a payload drawn from the frame's data source, #1619).
# The C enum stays the SSOT — this names its indices for the Python face.
[[enum]]
name = "wfm_seq_kind"
values = ["literal", "pn", "gold", "dotted", "data"]

# What a frame stage does to the fields it covers. Order IS wfm_stage_kind_t
# (native/inc/doppler/wfm/wfm_frame.h); the C enum stays the SSOT and this names its
# indices for the Python face.
[[enum]]
name = "wfm_stage_kind"
values = ["crc16", "rs", "randomise", "conv"]

[[enum]]
name = "bitmod"
values = ["none", "bpsk", "qpsk"]

[[enum]]
name = "wfm_pulse"
values = ["rect", "rrc"]

[[enum]]
name = "ftype"
values = ["raw", "csv", "blue", "sigmf"]

# Wire sample type: five element encodings in each of BLUE's two modes.
# The five complex names come first and their indices are load-bearing --
# STYPE_FMT[], KIND[] and the reader's `hint % 5` all index by this order, so
# APPEND, never reorder. The real five drop Q: `f32` writes one float per
# sample where `cf32` writes two (doppler#1032).
[[enum]]
name = "stype"
values = [
  "cf32", "cf64", "ci32", "ci16", "ci8",
  "f32",  "f64",  "i32",  "i16",  "i8",
]

# The Reader's sample_type HINT: the ten wire types plus "auto". Not `stype`
# with a name added, because "auto" is -1 (WFM_READER_STYPE_AUTO) -- a plain
# value list numbers by position, which would make it 0 and slide every other
# name up by one. `enumerators` binds each name to its C constant instead
# (gh-1450), so the compiler checks the table. The property `sample_type`
# still decodes through `stype`: an open reader always resolved to one of the
# ten, never "auto".
[[enum]]
name = "reader_stype"
values = ["auto", "cf32", "cf64", "ci32", "ci16", "ci8", "f32", "f64", "i32", "i16", "i8"]
enumerators = [
  "WFM_READER_STYPE_AUTO", "WFM_READER_STYPE_CF32", "WFM_READER_STYPE_CF64", "WFM_READER_STYPE_CI32", "WFM_READER_STYPE_CI16", "WFM_READER_STYPE_CI8", "WFM_READER_STYPE_F32", "WFM_READER_STYPE_F64", "WFM_READER_STYPE_I32", "WFM_READER_STYPE_I16", "WFM_READER_STYPE_I8",
]

[[enum]]
name = "endian"
values = ["le", "be"]

# BLUE `format` mode designator (HCB byte 52): components per sample.
[[enum]]
name = "sample_mode"
values = ["complex", "scalar"]

# Where Reader.fc was read from. Order IS wfm_fc_source_t
# (wfm_reader_core.h): "none" is index 0, then one entry per tag in the
# reader's FC_TAGS search order, then the SigMF JSON key.
[[enum]]
name = "fc_source"
values = ["none", "FREQ", "RF_FREQ", "CENTER_FREQ", "F_C", "core:frequency"]

# Where `fs` came from. Same shape and same reason as fc_source: index 0 is
# "none", and the rest name the metadata that carried the rate. Order matches
# wfm_fs_source_t (wfm_reader_core.h).
[[enum]]
name = "fs_source"
values = ["none", "xdelta", "core:sample_rate"]

# Where the capture's start time came from. "none" is the COMMON answer, not
# an edge case: doppler's own BLUE writer leaves the timecode field zero, so
# every capture this library writes lands here. Order matches
# wfm_t0_source_t (wfm_reader_core.h).
[[enum]]
name = "t0_source"
values = ["none", "timecode", "sigmf"]

# How a following read ended (docs/design/end-of-capture.md). "none" is index
# 0 and is the state while the capture is still live; the rest name the three
# ways a wait can stop. Order matches wfm_follow_end_t (wfm_reader_core.h).
[[enum]]
name = "follow_end"
values = ["none", "eof", "timeout", "interrupted"]

[[enum]]
name = "interp_method"
values = ["floor", "nearest", "linear"]

# The AsyncDsssReceiver's lifecycle states (async_dsss_receiver_core.h,
# ASYNC_DSSS_RX_*), bound by name so the compiler checks every one. Read
# through the receiver's `lifecycle` property as a string.
[[enum]]
name = "async_dsss_rx_state"
values = ["searching", "refining", "tracking", "idle", "lost"]
enumerators = [
  "ASYNC_DSSS_RX_SEARCHING", "ASYNC_DSSS_RX_REFINING",
  "ASYNC_DSSS_RX_TRACKING", "ASYNC_DSSS_RX_IDLE", "ASYNC_DSSS_RX_LOST",
]
