[module.acquire]
doc = """
Acquisition: the searches that find a signal before anything tracks it. Acquisition is the code-phase x Doppler engine; BurstAcquisition and BurstCapture find a burst of any repeated complex preamble (a PN code, Zadoff-Chu, a chirp or a QPSK sequence), and PersistentBurstCapture keeps the capture's history in a file. CarrierAcquisition is a coarse frequency/phase search that seeds a carrier tracking loop. bin_to_signed is the Doppler-bin fold convention the searches and their hand-offs share.

Examples
--------
>>> import numpy as np
>>> from doppler.acquire import CarrierAcquisition
>>> ca = CarrierAcquisition(sample_rate_hz=8000.0, symbol_rate_hz=1000.0,
...                          resolution_hz=5.0)
>>> ca.ready()
False

"""
objects = ["carrier_acq", "acq", "burst_acq", "burst_capture"]

[[module.acquire.functions]]
name = "bin_to_signed"
return_type = "int"
doc = "Map an FFT bin index to its SIGNED frequency index -- numpy.fft.fftfreq(n) * n, exactly: 0 = DC, ascending positive to (n-1)/2, then wrapping negative, so an even grid's Nyquist bin is -n/2. Multiply by doppler_res_hz for Hz. Call this rather than writing the fold out: the search and its hand-off must agree on the convention, and a consumer seeded on the wrong side of it is off by the full search span -- a failure that once surfaced here as a receiver reporting tracking while decoding noise. A thin wrapper over dp_fftfreq_index() in clib_common.h, so C callers inline the same code."

[[module.acquire.functions.params]]
name = "bin"
type = "size_t"

[[module.acquire.functions.params]]
name = "n_bins"
type = "size_t"
